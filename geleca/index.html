<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>🟩 GELECA — sacrifique-se para subir</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">

  <!-- ===================== MENU / SELEÇÃO DE FASES ===================== -->
  <section id="screen-menu" class="screen active">
    <div class="menu-inner">
      <div class="menu-head">
        <div class="logo-blob" id="logo-blob"><span class="eye"></span><span class="eye"></span></div>
        <h1 class="title">GELECA</h1>
        <p class="subtitle">sacrifique-se para subir</p>
      </div>
      <div class="world-card">
        <div class="world-top">
          <span class="world-name"><span class="world-dot"></span>MUNDO 1 · Vale Verdejante</span>
          <span class="world-pct" id="world-pct">0%</span>
        </div>
        <div class="world-bar"><i id="world-bar"></i></div>
        <div id="menu-stats" class="menu-stats"></div>
      </div>
      <div id="level-grid" class="level-grid"></div>
      <p class="menu-hint">Cada pulo custa massa. Empilhe pedaços, reabsorva, escale paredes.</p>
    </div>
  </section>

  <!-- ===================== JOGO ===================== -->
  <section id="screen-game" class="screen">
    <div id="hud">
      <button id="btn-menu" class="hud-btn" title="Menu">☰</button>
      <div class="hud-mid">
        <span id="level-name">Fase 1</span>
        <span id="mass-pips" class="pips"></span>
      </div>
      <button id="btn-mute" class="hud-btn" title="Som (M)">🔊</button>
      <button id="btn-reset" class="hud-btn" title="Reiniciar (R)">↺</button>
    </div>

    <div id="stage">
      <canvas id="game"></canvas>
      <div id="hint" class="hint-banner"></div>
      <!-- controles sobrepostos (mais área de jogo): joystick esq., ações dir. -->
      <div id="touch">
        <div id="stick" class="stick"><div id="knob" class="knob"></div></div>
        <div id="actions">
          <button id="btn-grab" class="act act-grab" aria-label="Reabsorver massa">
            <svg class="ic ic-grab" viewBox="0 0 40 40" aria-hidden="true">
              <!-- gotas de massa nas pontas (o que está sendo puxado) -->
              <g class="grab-bits">
                <circle cx="20" cy="3.5" r="1.9"/><circle cx="20" cy="36.5" r="1.9"/>
                <circle cx="3.5" cy="20" r="1.9"/><circle cx="36.5" cy="20" r="1.9"/>
              </g>
              <!-- 4 setas apontando pra DENTRO (absorver de todos os lados) -->
              <g class="grab-arrows" fill="none" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16.3 7 L20 10.7 L23.7 7"/>
                <path d="M16.3 33 L20 29.3 L23.7 33"/>
                <path d="M7 16.3 L10.7 20 L7 23.7"/>
                <path d="M33 16.3 L29.3 20 L33 23.7"/>
              </g>
              <!-- núcleo: a geleca que absorve -->
              <rect class="grab-core" x="14" y="15" width="12" height="11" rx="4.4"/>
              <circle class="grab-eye" cx="17.9" cy="20.4" r="1.55"/><circle class="grab-eye" cx="22.1" cy="20.4" r="1.55"/>
            </svg>
          </button>
          <button id="btn-jump" class="act act-jump" aria-label="Pular">
            <svg class="ic ic-jump" viewBox="0 0 48 48" aria-hidden="true">
              <!-- arco do pulo -->
              <path class="jump-arc" d="M9 33 Q24 5 39 33" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="0.5 5.5"/>
              <!-- seta pra cima -->
              <path class="jump-chevron" d="M16.5 15.5 L24 8 L31.5 15.5" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
              <!-- geleca pulando (esticada pra cima) -->
              <path class="jump-blob" d="M15.5 27 Q15.5 22 24 21.5 Q32.5 22 32.5 27 L32.5 34 Q32.5 40 24 40 Q15.5 40 15.5 34 Z"/>
              <ellipse class="jump-eye" cx="20.6" cy="30.5" rx="2.5" ry="2.7"/><ellipse class="jump-eye" cx="27.4" cy="30.5" rx="2.5" ry="2.7"/>
              <circle class="jump-pupil" cx="20.9" cy="29.8" r="1.15"/><circle class="jump-pupil" cx="27.7" cy="29.8" r="1.15"/>
            </svg>
          </button>
        </div>
      </div>
      <div id="overlay" class="overlay hidden"></div>
    </div>

    <div id="controls">
      <span><b>← →</b> mover</span><span><b>↑ / Espaço</b> pular</span>
      <span><b>E</b> reabsorver</span><span><b>R</b> reiniciar</span>
    </div>
  </section>

</div>
<script src="game.js"></script>
</body>
</html>
