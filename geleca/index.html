<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>🟩 GELECA — sacrifique-se para subir</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="wrap">
    <div id="hud">
      <div class="hud-left">
        <span id="level-name">Fase 1</span>
        <span id="mass-pips" class="pips"></span>
      </div>
      <div class="hud-right">
        <button id="btn-reset" title="Reiniciar fase (R)">↺ Reiniciar</button>
      </div>
    </div>

    <div id="stage">
      <canvas id="game"></canvas>
      <div id="hint" class="hint-banner"></div>
      <div id="overlay" class="overlay hidden"></div>
    </div>

    <div id="controls">
      <span><b>← →</b> mover</span>
      <span><b>↑ / Espaço</b> pular (gasta massa)</span>
      <span><b>E</b> reabsorver pedaço</span>
      <span><b>R</b> reiniciar</span>
    </div>

    <!-- Controles touch (mobile) — polegar esquerdo move, direito age -->
    <div id="touch">
      <div class="pad dpad">
        <button data-k="left" aria-label="Esquerda">◀</button>
        <button data-k="down" aria-label="Descer">▼</button>
        <button data-k="right" aria-label="Direita">▶</button>
      </div>
      <div class="pad actions">
        <button data-k="grab" class="act-grab" aria-label="Reabsorver">E</button>
        <button data-k="jump" class="act-jump" aria-label="Pular">PULAR ▲</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
