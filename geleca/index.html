<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>🟩 GELECA — sacrifique-se para subir</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">

  <!-- ===================== MENU / SELEÇÃO DE FASES ===================== -->
  <section id="screen-menu" class="screen active">
    <div class="menu-inner">
      <div class="logo-blob" id="logo-blob"></div>
      <h1 class="title">GELECA</h1>
      <p class="subtitle">sacrifique-se para subir</p>
      <div id="menu-stats" class="menu-stats"></div>
      <div id="level-grid" class="level-grid"></div>
      <p class="menu-hint">Cada pulo custa massa. Empilhe pedaços, reabsorva, escale paredes.</p>
    </div>
  </section>

  <!-- ===================== JOGO ===================== -->
  <section id="screen-game" class="screen">
    <div id="hud">
      <button id="btn-menu" class="hud-btn" title="Menu">☰</button>
      <div class="hud-mid">
        <span id="level-name">Fase 1</span>
        <span id="mass-pips" class="pips"></span>
      </div>
      <button id="btn-mute" class="hud-btn" title="Som (M)">🔊</button>
      <button id="btn-reset" class="hud-btn" title="Reiniciar (R)">↺</button>
    </div>

    <div id="stage">
      <canvas id="game"></canvas>
      <div id="hint" class="hint-banner"></div>
      <!-- controles sobrepostos (mais área de jogo): joystick esq., ações dir. -->
      <div id="touch">
        <div id="stick" class="stick"><div id="knob" class="knob"></div></div>
        <div id="actions">
          <button id="btn-grab" class="act act-grab" aria-label="Reabsorver">E</button>
          <button id="btn-jump" class="act act-jump" aria-label="Pular">▲</button>
        </div>
      </div>
      <div id="overlay" class="overlay hidden"></div>
    </div>

    <div id="controls">
      <span><b>← →</b> mover</span><span><b>↑ / Espaço</b> pular</span>
      <span><b>E</b> reabsorver</span><span><b>R</b> reiniciar</span>
    </div>
  </section>

</div>
<script src="game.js"></script>
</body>
</html>
