<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#2a1e30" />
  <title>Batalha de Brinquedos</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; }
    body {
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      /* quarto ao entardecer: parede quente em cima, sombra embaixo */
      background:
        radial-gradient(120% 90% at 72% 6%, #ffe2b8 0%, rgba(255,226,184,0) 52%),
        linear-gradient(180deg, #e8c9a0 0%, #c99b72 34%, #7a4f3a 78%, #472c22 100%);
      touch-action: none; user-select: none; -webkit-user-select: none;
    }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }
    /* vinheta + brilho suave por cima do 3D */
    #grade { position: fixed; inset: 0; pointer-events: none; z-index: 2;
      background:
        radial-gradient(130% 105% at 50% 42%, rgba(0,0,0,0) 58%, rgba(30,12,8,.38) 100%),
        radial-gradient(60% 40% at 62% 10%, rgba(255,236,190,.16) 0%, rgba(255,236,190,0) 60%);
    }
    #ui { position: fixed; inset: 0; z-index: 3; pointer-events: none; }
    #ui .hit { pointer-events: auto; }
  </style>
  <script type="module" crossorigin src="./assets/index-CX1i8Ufp.js"></script>
</head>
<body>
  <div id="app"></div>
  <div id="grade"></div>
  <div id="ui"></div>
</body>
</html>
