<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>A ADRANJA — Masmorra Mágica</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=MedievalSharp&family=VT323&display=swap" rel="stylesheet" />
<style>
:root{
  --gold:#e8c074; --gold-2:#b8862f; --gold-deep:#7a5418;
  --ember:#ff7a3c; --blood:#c8324a; --magic:#7d6cff; --magic-2:#b39bff;
  --nature:#5fd17a; --ice:#67d8ff; --shadow-c:#a14bff;
  --bg-0:#0a0710; --bg-1:#120a1e; --bg-2:#1c1230;
  --panel:rgba(28,16,46,.82); --panel-2:rgba(40,24,64,.9);
  --line:rgba(232,192,116,.32); --line-soft:rgba(232,192,116,.16);
  --text:#f3e9d8; --dim:#b6a48b; --rare:#67d8ff; --epic:#b07bff;
  --legend:#ffb347; --mythic:#ff5fa8;
  --ok:#5fd17a; --warn:#ffcf5b; --bad:#ff5d6c;
  --shadow:0 14px 50px rgba(0,0,0,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;min-height:100%;color:var(--text);
  font-family:'MedievalSharp',serif;
  background:
    radial-gradient(1200px 800px at 12% -8%, rgba(125,108,255,.20), transparent 60%),
    radial-gradient(1000px 700px at 110% 8%, rgba(255,122,60,.14), transparent 55%),
    radial-gradient(900px 1000px at 50% 120%, rgba(161,75,255,.18), transparent 60%),
    linear-gradient(165deg, var(--bg-0), var(--bg-1) 60%, var(--bg-2));
  background-attachment:fixed; overflow-x:hidden;
}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
  background-image:radial-gradient(rgba(255,255,255,.08) 1px, transparent 1px);
  background-size:42px 42px; animation:drift 60s linear infinite;}
@keyframes drift{to{background-position:420px 420px;}}
.app{max-width:780px;margin:0 auto;padding:10px 10px 28px;min-height:100vh;display:flex;flex-direction:column;}
h1,h2,h3,h4{margin:0;line-height:1.06;font-family:'Cinzel',serif;letter-spacing:.5px;}
.ff-pix{font-family:'VT323',monospace;}
.screen{display:none;flex:1;flex-direction:column;animation:fade .35s ease;}
.screen.active{display:flex;}
@keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
canvas{image-rendering:pixelated;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:var(--gold-deep);border-radius:6px;}
::-webkit-scrollbar-track{background:rgba(0,0,0,.25);}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 18px;border-radius:12px;font-family:'Cinzel',serif;font-weight:700;
  font-size:15px;letter-spacing:.5px;color:#21160a;
  background:linear-gradient(180deg,var(--gold),var(--gold-2));
  border:1px solid #f3dca0; box-shadow:0 6px 0 var(--gold-deep),0 10px 22px rgba(0,0,0,.45);
  transition:transform .08s ease, box-shadow .08s ease; text-shadow:0 1px 0 rgba(255,255,255,.25);}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--gold-deep),0 6px 14px rgba(0,0,0,.4);}
.btn.ghost{background:linear-gradient(180deg,var(--panel-2),var(--panel));color:var(--text);
  border:1px solid var(--line);box-shadow:0 5px 0 rgba(0,0,0,.4);text-shadow:none;}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px;box-shadow:0 4px 0 var(--gold-deep);}
.btn.sm:active{box-shadow:0 1px 0 var(--gold-deep);}
.btn.danger{background:linear-gradient(180deg,#ff7a86,#c8324a);color:#fff;border-color:#ff9aa4;box-shadow:0 6px 0 #7a1322;}
.btn:disabled{filter:grayscale(.7) brightness(.7);cursor:not-allowed;box-shadow:0 3px 0 rgba(0,0,0,.4);}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;
  font-size:12px;background:var(--panel-2);border:1px solid var(--line-soft);font-family:'Cinzel';font-weight:600;}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--shadow);padding:14px;position:relative;}
.panel.parch{background:
  linear-gradient(180deg, rgba(48,30,16,.5), rgba(28,16,46,.85)),
  radial-gradient(120% 80% at 50% 0%, rgba(232,192,116,.08), transparent 60%);
  border:1px solid var(--gold-deep);}
.divider{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:10px 0;}

.home{align-items:center;justify-content:center;text-align:center;gap:14px;}
.logo{font-family:'Cinzel',serif;font-weight:900;font-size:clamp(46px,13vw,92px);line-height:.9;
  text-transform:uppercase;letter-spacing:3px;
  background:linear-gradient(180deg,#fff6df,var(--gold) 45%,var(--gold-2) 70%,var(--ember));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 rgba(0,0,0,.5)) drop-shadow(0 0 22px rgba(232,192,116,.35));}
.logo-sub{font-family:'MedievalSharp';color:var(--magic-2);font-size:clamp(15px,4.4vw,22px);letter-spacing:2px;}
.home-tip{color:var(--dim);font-size:14px;max-width:480px;line-height:1.5;}

.topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.topbar .brand{font-family:'Cinzel';font-weight:900;font-size:18px;letter-spacing:1px;
  background:linear-gradient(180deg,#fff6df,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;}
.res{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;}
.res .chip b{color:var(--gold);}

.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex:0 0 auto;padding:9px 14px;border-radius:11px;font-family:'Cinzel';font-weight:700;font-size:13px;
  background:var(--panel);border:1px solid var(--line-soft);color:var(--dim);white-space:nowrap;display:flex;gap:6px;align-items:center;}
.tab.active{color:#21160a;background:linear-gradient(180deg,var(--gold),var(--gold-2));border-color:#f3dca0;}

.grid{display:grid;gap:10px;}
.grid.c2{grid-template-columns:repeat(2,1fr);}
.grid.c3{grid-template-columns:repeat(3,1fr);}
.grid.auto{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}
.hero-card{background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--line-soft);
  border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;
  position:relative;overflow:hidden;transition:transform .1s,border-color .1s;cursor:pointer;}
.hero-card.sel{border-color:var(--gold);box-shadow:0 0 0 2px rgba(232,192,116,.4),0 8px 22px rgba(0,0,0,.4);}
.hero-card.locked{filter:grayscale(.85) brightness(.55);}
.hero-card .role{font-size:11px;color:var(--dim);font-family:'Cinzel';letter-spacing:.5px;text-transform:uppercase;}
.hero-card .nm{font-family:'Cinzel';font-weight:700;font-size:14px;}
.hero-card canvas{width:74px;height:74px;}
.hero-card .lvl{position:absolute;top:6px;left:6px;font-size:11px;background:rgba(0,0,0,.5);
  padding:2px 7px;border-radius:8px;border:1px solid var(--line-soft);font-family:'Cinzel';}
.rar{position:absolute;top:6px;right:6px;font-size:10px;padding:2px 7px;border-radius:8px;font-family:'Cinzel';font-weight:700;text-transform:uppercase;}
.rar.comum{background:#5a5a5a;color:#fff;} .rar.raro{background:var(--rare);color:#06202b;}
.rar.epico{background:var(--epic);color:#1b0833;} .rar.lendario{background:var(--legend);color:#3a2300;}
.rar.mitico{background:var(--mythic);color:#3a0020;}

.stat-row{display:flex;align-items:center;gap:6px;font-size:12px;margin:2px 0;}
.stat-row .lab{width:36px;color:var(--dim);font-family:'Cinzel';font-weight:600;}
.stat-row .vv{width:34px;text-align:right;color:var(--gold);font-family:'Cinzel';}
.bar{flex:1;height:8px;border-radius:6px;background:rgba(0,0,0,.4);overflow:hidden;border:1px solid var(--line-soft);}
.bar > i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#ff5d6c,#ff9a6c);}
.hpbar > i{background:linear-gradient(90deg,#ff5d6c,#ff9a6c);}
.xpbar > i{background:linear-gradient(90deg,var(--magic),var(--magic-2));}

.overlay{position:fixed;inset:0;background:rgba(5,2,12,.74);backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;z-index:60;padding:14px;}
.overlay.show{display:flex;animation:fade .2s ease;}
.modal{width:min(540px,96vw);max-height:90vh;overflow:auto;}
.x-close{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:10px;
  background:var(--panel-2);border:1px solid var(--line);font-size:18px;font-family:'Cinzel';z-index:2;}

.dgn-stage{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--gold-deep);
  box-shadow:inset 0 0 60px rgba(0,0,0,.7),var(--shadow);background:#05030a;}
.dgn-stage canvas{display:block;width:100%;height:auto;}
.dgn-hud{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px;}
.floor-badge{font-family:'Cinzel';font-weight:900;font-size:16px;color:var(--gold);}
.log{height:148px;overflow:auto;background:rgba(0,0,0,.35);border:1px solid var(--line-soft);
  border-radius:12px;padding:8px 10px;font-size:13.5px;display:flex;flex-direction:column;gap:3px;}
.log .ln{opacity:0;animation:lnin .3s ease forwards;}
@keyframes lnin{to{opacity:1;}}
.log .ev{color:var(--gold);} .log .cb{color:#ff9a6c;} .log .lt{color:var(--rare);}
.log .sc{color:var(--shadow-c);} .log .dn{color:var(--ok);} .log .bd{color:var(--bad);} .log .sy{color:var(--magic-2);}
.party-mini{display:flex;gap:6px;flex-wrap:wrap;}
.pm{flex:1;min-width:150px;background:var(--panel);border:1px solid var(--line-soft);border-radius:10px;padding:6px 8px;display:flex;gap:8px;align-items:center;}
.pm canvas{width:40px;height:40px;flex:0 0 auto;}
.pm .pn{font-size:12px;font-family:'Cinzel';font-weight:700;}
.pm .hpbar{height:15px;}   /* mais alta p/ os números de PV não ficarem cortados */
.pm.dead{filter:grayscale(1) brightness(.5);}
.fct{position:absolute;font-family:'Cinzel';font-weight:900;font-size:17px;pointer-events:none;white-space:nowrap;
  text-shadow:0 0 4px rgba(0,0,0,.9),0 2px 2px rgba(0,0,0,.9),-1px -1px 0 rgba(0,0,0,.7),1px 1px 0 rgba(0,0,0,.7);
  animation:fctup 1.05s ease forwards;z-index:5;}
@keyframes fctup{0%{opacity:0;transform:translateY(6px) scale(.5);}18%{opacity:1;transform:translateY(-3px) scale(1.15);}100%{opacity:0;transform:translateY(-40px) scale(1);}}

.toasts{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:7px;align-items:center;pointer-events:none;}
.toast{background:var(--panel-2);border:1px solid var(--gold);border-radius:12px;padding:9px 14px;font-size:14px;
  box-shadow:var(--shadow);animation:tin .35s ease, tout .4s ease 2.4s forwards;display:flex;gap:9px;align-items:center;}
@keyframes tin{from{opacity:0;transform:translateY(14px) scale(.9);}to{opacity:1;transform:none;}}
@keyframes tout{to{opacity:0;transform:translateY(-8px);}}

.inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:8px;}
.item{position:relative;background:var(--panel-2);border:1px solid var(--line-soft);border-radius:11px;
  padding:7px 4px 5px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;transition:transform .08s;}
.item:active{transform:scale(.94);}
.item .ico{font-size:24px;line-height:1;}
.iico{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;line-height:0;}
.iico canvas{image-rendering:pixelated;}
.item .qn{position:absolute;bottom:3px;right:5px;font-size:11px;font-family:'Cinzel';color:var(--gold);}
.item .tn{font-size:10px;color:var(--dim);text-align:center;line-height:1.05;}
.b-comum{border-color:#5a5a5a;}
.b-raro{border-color:var(--rare);box-shadow:0 0 10px rgba(103,216,255,.25);}
.b-epico{border-color:var(--epic);box-shadow:0 0 10px rgba(176,123,255,.3);}
.b-lendario{border-color:var(--legend);box-shadow:0 0 12px rgba(255,179,71,.4);}
.b-mitico{border-color:var(--mythic);box-shadow:0 0 14px rgba(255,95,168,.45);}
.b-secreto{border-color:var(--shadow-c);box-shadow:0 0 14px rgba(161,75,255,.5);}

.slotline{display:flex;gap:8px;align-items:center;padding:7px;border-radius:10px;background:rgba(0,0,0,.22);border:1px solid var(--line-soft);}
.slotline .sl-ico{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:22px;background:rgba(0,0,0,.3);border:1px solid var(--line-soft);}
.slotline .sl-n{flex:1;font-size:13px;}

.muted{color:var(--dim);} .center{text-align:center;}
.small{font-size:12.5px;} .tiny{font-size:11px;}
.row{display:flex;gap:8px;align-items:center;} .wrap{flex-wrap:wrap;} .between{justify-content:space-between;}
.col{display:flex;flex-direction:column;gap:8px;}
.mt{margin-top:10px;} .mt6{margin-top:6px;} .mb{margin-bottom:10px;}
.tag-secret{color:var(--shadow-c);font-family:'Cinzel';font-weight:700;}
.bossbar{height:14px;border-radius:8px;background:rgba(0,0,0,.5);border:1px solid var(--blood);overflow:hidden;}
.bossbar>i{display:block;height:100%;background:linear-gradient(90deg,#c8324a,#ff7a3c);}
.flash{animation:flash .4s ease;} @keyframes flash{0%,100%{filter:none;}50%{filter:brightness(2);}}
.shake{animation:shake .3s ease;} @keyframes shake{0%,100%{transform:none;}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}
.progress{height:10px;border-radius:6px;background:rgba(0,0,0,.4);overflow:hidden;border:1px solid var(--line-soft);}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-2),var(--gold));transition:width .3s;}
.lab-sm{font-size:11px;color:var(--dim);font-family:'Cinzel';text-transform:uppercase;letter-spacing:.5px;}
.kvs{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13px;}
.kvs b{color:var(--gold);font-weight:600;text-align:right;}

/* --- partículas / juice --- */
.pt{position:absolute;width:5px;height:5px;border-radius:50%;pointer-events:none;z-index:6;
  box-shadow:0 0 6px currentColor;animation:ptfly .7s ease-out forwards;}
@keyframes ptfly{0%{opacity:1;transform:translate(0,0) scale(1.2);}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3);}}
.dgn-stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:4;
  box-shadow:inset 0 0 70px rgba(0,0,0,.85), inset 0 0 26px rgba(0,0,0,.5);border-radius:14px;}
#lootFx{position:fixed;inset:0;pointer-events:none;z-index:75;display:flex;align-items:center;justify-content:center;}
.lb-ring{position:absolute;width:40px;height:40px;border-radius:50%;border:3px solid #fff;animation:lbring .6s ease-out forwards;}
@keyframes lbring{0%{opacity:.9;transform:scale(.2);}100%{opacity:0;transform:scale(7);}}
.lb-spark{position:absolute;width:7px;height:7px;border-radius:50%;box-shadow:0 0 10px currentColor;animation:lbspark .8s ease-out forwards;}
@keyframes lbspark{0%{opacity:1;transform:translate(0,0) scale(1.4);}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.2);}}
.boss-card{position:absolute;left:0;right:0;top:40%;text-align:center;z-index:8;pointer-events:none;animation:bcard 2.6s ease forwards;}
.boss-card .bc-n{font-family:'Cinzel';font-weight:900;font-size:26px;color:#ff7a3c;text-shadow:0 0 16px rgba(255,80,40,.7),0 3px 0 rgba(0,0,0,.6);letter-spacing:1px;}
.boss-card.secret .bc-n{color:#c98bff;text-shadow:0 0 18px rgba(161,75,255,.8);}
.boss-card .bc-i{font-size:12px;color:#f3e9d8;font-style:italic;margin-top:4px;}
@keyframes bcard{0%{opacity:0;transform:scale(.7);}12%{opacity:1;transform:scale(1);}80%{opacity:1;}100%{opacity:0;transform:scale(1.05);}}
.tide-chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;
  font-family:'Cinzel';font-weight:600;background:rgba(125,108,255,.18);border:1px solid var(--magic);color:var(--magic-2);}
.combo-badge{font-family:'Cinzel';font-weight:900;font-size:13px;color:var(--ember);text-shadow:0 0 10px rgba(255,122,60,.6);}
.audio-btn{width:38px;height:38px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);font-size:17px;display:flex;align-items:center;justify-content:center;}
.vol-row{display:flex;align-items:center;gap:8px;margin:8px 0;}
.vol-row input[type=range]{flex:1;accent-color:var(--gold);}
.reward-pop{animation:rpop .5s ease;}
@keyframes rpop{0%{transform:scale(.6);opacity:0;}60%{transform:scale(1.15);}100%{transform:scale(1);opacity:1;}}
.recipe{display:flex;gap:10px;align-items:center;padding:9px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line-soft);}
.recipe .rico{font-size:28px;}
.sellrow{cursor:pointer;user-select:none;transition:background .12s,border-color .12s;}
.sellrow:hover{border-color:var(--gold);}
.sellrow.selsel{border-color:var(--gold);background:rgba(255,209,102,.10);}
.sellrow .selbox{font-size:20px;width:24px;text-align:center;color:var(--gold);}
.sellbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;padding:8px 10px;border-radius:10px;background:rgba(255,209,102,.08);border:1px solid var(--line-soft);position:sticky;top:0;z-index:5;}

/* ============ POLIMENTO VISUAL (estética mais gamificada) ============ */
/* tag de raridade INLINE (corrige o pill que era absolute e sumia) */
.rpill{display:inline-flex;align-items:center;vertical-align:middle;padding:1px 8px;border-radius:999px;
  font-family:'Cinzel',serif;font-weight:800;font-size:10px;letter-spacing:.4px;text-transform:uppercase;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 1px 3px rgba(0,0,0,.4);border:1px solid rgba(0,0,0,.25);}
.rpill.comum{background:linear-gradient(180deg,#a8acb4,#74787f);color:#16181c;}
.rpill.raro{background:linear-gradient(180deg,#8fe3ff,#2aa6dd);color:#04222e;}
.rpill.epico{background:linear-gradient(180deg,#caa2ff,#8b4ff0);color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.4);}
.rpill.lendario{background:linear-gradient(180deg,#ffd98a,#f0972a);color:#3a2300;}
.rpill.mitico{background:linear-gradient(180deg,#ff9ed0,#ff3f9a);color:#3a0020;text-shadow:0 1px 1px rgba(0,0,0,.3);}
.rpill.divino{background:linear-gradient(180deg,#fff3b0,#ffcf2e);color:#3a2c00;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 0 9px rgba(255,209,46,.55);}
.rpill.celestial{background:linear-gradient(180deg,#d4fbff,#62e6ff);color:#053a44;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 0 10px rgba(98,230,255,.6);}
.rpill.secreto{background:linear-gradient(180deg,#d8b6ff,#a14bff);color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 0 9px rgba(161,75,255,.6);}
/* botões com brilho de vidro */
.btn{box-shadow:0 6px 0 var(--gold-deep),0 12px 24px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.55),inset 0 -3px 6px rgba(122,84,24,.35);position:relative;overflow:hidden;}
.btn::after{content:"";position:absolute;left:0;right:0;top:0;height:45%;border-radius:12px 12px 40% 40%;
  background:linear-gradient(180deg,rgba(255,255,255,.40),transparent);pointer-events:none;}
.btn.ghost{box-shadow:0 5px 0 rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.12);}
.btn.ghost::after{background:linear-gradient(180deg,rgba(255,255,255,.10),transparent);}
/* HUD de recursos no topo — pílulas maiores e brilhantes */
.res .chip{padding:6px 12px;font-size:13px;border-radius:999px;
  background:linear-gradient(180deg,rgba(48,30,64,.95),rgba(24,14,38,.95));
  border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 4px 10px rgba(0,0,0,.4);}
.res .chip b{color:var(--gold);text-shadow:0 0 8px rgba(232,192,116,.4);}
/* abas: ativa com brilho */
.tab{box-shadow:inset 0 1px 0 rgba(255,255,255,.06);transition:transform .1s,box-shadow .1s,color .1s;}
.tab.active{box-shadow:0 4px 0 var(--gold-deep),0 6px 14px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.5);transform:translateY(-1px);}
/* painéis com leve realce superior */

.panel::before{content:"";position:absolute;inset:0;border-radius:16px;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.05),transparent 30%);}

.panel > h3, .panel > h4, #tabBody h4{position:relative;}
h3{font-size:18px;}
.chip{box-shadow:inset 0 1px 0 rgba(255,255,255,.08);}

.hero-card > .rpill{position:absolute;top:6px;right:6px;z-index:2;}   /* raridade vira selo de canto no card */

.recipe{background:linear-gradient(180deg,rgba(44,28,64,.92),rgba(30,18,48,.92));box-shadow:inset 0 1px 0 rgba(255,255,255,.05);transition:border-color .12s;}
.recipe:hover{border-color:var(--line);}
/* slotline mais definida */
.slotline{transition:border-color .12s,background .12s;}
/* ganhos do "equipar melhores" */
.statgain{color:#7dff8f;font-family:'Cinzel',serif;font-weight:900;font-size:11px;margin-left:2px;
  text-shadow:0 0 8px rgba(125,255,143,.6);animation:gainpop .45s ease;display:inline-block;}
.gainbanner{margin-top:8px;padding:7px 11px;border-radius:10px;font-size:12.5px;
  color:#bfffce;background:linear-gradient(180deg,rgba(95,209,122,.20),rgba(95,209,122,.08));
  border:1px solid rgba(125,255,143,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.12);animation:gainpop .4s ease;}
.gainbanner b{color:#7dff8f;}
@keyframes gainpop{0%{opacity:0;transform:translateY(-4px) scale(.8);}60%{transform:translateY(0) scale(1.12);}100%{opacity:1;transform:scale(1);}}
/* ---- cards de escolher equipamento (gamificado, comparação limpa em linha) ---- */
.pwr-chip{display:inline-flex;align-items:center;gap:3px;padding:2px 9px;border-radius:999px;font-family:'Cinzel';font-weight:800;
  color:#0d0a06;background:linear-gradient(180deg,#ffe08a,#f0a92a);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 0 8px rgba(240,169,42,.45);font-size:12px;}
.eqpick{border-radius:12px;border:1px solid var(--line-soft);background:linear-gradient(180deg,rgba(38,26,54,.9),rgba(26,16,42,.9));padding:9px;margin-bottom:8px;transition:transform .1s,border-color .12s;}
.eqpick.best{border-color:#5fd17a;box-shadow:0 0 0 1px rgba(95,209,122,.5) inset,0 0 12px rgba(95,209,122,.18);}
.eqpick.cur{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;}
.eqpick .eqhead{display:flex;gap:9px;align-items:center;}
.eqpick .eqhead .sl-ico{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.32);border:1px solid var(--line-soft);flex:0 0 auto;}
.eqpick .eqname{flex:1;min-width:0;font-size:13.5px;line-height:1.35;}
.eqverd{font-size:11px;font-family:'Cinzel';font-weight:800;margin-top:2px;display:inline-block;}
.eqverd.up{color:#5fd17a;} .eqverd.down{color:#ff6d7a;} .eqverd.same{color:var(--dim);} .eqverd.gold{color:var(--gold);}
.eqstats{display:grid;grid-template-columns:1fr 1fr;gap:1px 14px;margin-top:8px;padding-top:7px;border-top:1px dashed var(--line-soft);}
.eqsrow{display:flex;align-items:center;gap:6px;font-size:11.5px;line-height:1.6;}
.eqsrow .k{width:30px;color:var(--dim);font-family:'Cinzel';font-weight:600;}

.eqsrow .d.up{color:#5fd17a;} .eqsrow .d.down{color:#ff6d7a;} .eqsrow .d.same{color:var(--dim);}
.eqnote{font-size:10.5px;margin-top:6px;}

<script>
/* ============================================================================
   A ADRANJA — Masmorra Mágica   ·   roguelike de exploração automática
   Arquivo único, tudo procedural. Arte pixel desenhada em canvas.
   ============================================================================ */
"use strict";

/* ====================== UTILIDADES ====================== */
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
const APP=$('#app');
const TAU=Math.PI*2;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=arr=>arr[Math.floor(Math.random()*arr.length)];
const chance=p=>Math.random()<p;
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const fmt=n=>{n=Math.round(n);return n>=1000?(n/1000).toFixed(n>=10000?0:1).replace('.0','')+'k':''+n;};
// número EXATO com separador de milhar (ex.: 2.543) — usado em saldos de ouro/essência
const bal=n=>{n=Math.round(n||0);return (''+n).replace(/\B(?=(\d{3})+(?!\d))/g,'.');};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function weighted(map){ // map: {key:weight}
  let t=0;for(const k in map)t+=map[k];let r=Math.random()*t;
  for(const k in map){r-=map[k];if(r<=0)return k;}return Object.keys(map)[0];
}
const RARS=['comum','raro','epico','lendario','mitico','divino','celestial','secreto'];
const RAR_NAME={comum:'Comum',raro:'Raro',epico:'Épico',lendario:'Lendário',mitico:'Mítico',divino:'Divino',celestial:'Celestial',secreto:'Único'};
const RAR_COLOR={comum:'#cfcfcf',raro:'#67d8ff',epico:'#b07bff',lendario:'#ffb347',mitico:'#ff5fa8',divino:'#ffd93b',celestial:'#7af0ff',secreto:'#c77dff'};

/* ====================== ÁUDIO — tudo procedural (Web Audio API) ======================
   Trilhas geradas a partir de progressões de acordes + SFX sintetizados. */
function mtof(m){return 440*Math.pow(2,(m-69)/12);}
const SCALES={maior:[0,2,4,5,7,9,11],menor:[0,2,3,5,7,8,10],dorica:[0,2,3,5,7,9,10],frigia:[0,1,3,5,7,8,10]};
function buildScale(root,mode){const iv=SCALES[mode]||SCALES.menor;const out=[];for(let o=0;o<3;o++)for(let i=0;i<7;i++)out.push(root+o*12+iv[i]);return out;}
function buildTrack(def){
  const sc=buildScale(def.root,def.mode);const bars=def.prog.length,len=16*bars;
  const bass=new Array(len).fill(null),arp=new Array(len).fill(null),lead=new Array(len).fill(null),pad=new Array(bars);
  const drum=new Array(len).fill(null);
  const motif=def.motif||[0,2,4,2,3,1,0,-1];
  for(let b=0;b<bars;b++){
    const deg=def.prog[b];
    const chord=[sc[deg],sc[deg+2],sc[deg+4]];
    pad[b]=chord;
    for(let s=0;s<16;s++){
      const gi=b*16+s;
      // baixo
      if(s===0||s===8||(def.style==='drive'&&(s===4||s===12)))bass[gi]=chord[0]-12;
      // arpejo
      const every=def.style==='calm'?4:(def.style==='drive'?2:2);
      if(s%every===0)arp[gi]=chord[(s/every)%3]+12;
      // lead esparso
      if(def.leadOn&&((s===2||s===10||(s===6&&b%2===1)))){const mi=motif[(b*3+(s>>2))%motif.length];lead[gi]=sc[((deg+mi)%14+14)%14]+12;}
      // bateria
      if(def.drums){
        if(s===0||s===8)drum[gi]='k';
        else if(s===4||s===12)drum[gi]='s';
        if(def.style==='drive'&&s%2===0)drum[gi]=drum[gi]||'h';
        if(def.style==='boss'&&(s===0||s===6||s===8||s===14))drum[gi]='k';
      }
    }
  }
  return {bpm:def.bpm,len,bass,arp,lead,pad,drum,style:def.style,padType:def.padType||'triangle',leadType:def.leadType||'square',bassType:def.bassType||'sawtooth'};
}
const TRACK_DEFS={
  camp:{bpm:78,root:57,mode:'maior',prog:[0,4,5,3],style:'calm',leadOn:true,padType:'triangle',leadType:'triangle',motif:[0,2,4,5,4,2]},
  explore:{bpm:96,root:55,mode:'dorica',prog:[0,5,3,4],style:'calm',leadOn:true,padType:'triangle',leadType:'triangle',bassType:'triangle',motif:[0,2,3,2,0,-1,0]},
  battle:{bpm:140,root:52,mode:'menor',prog:[0,3,4,0,0,3,5,4],style:'drive',drums:true,leadOn:true,leadType:'square',bassType:'sawtooth',motif:[0,4,3,2,4,5,4,2]},
  boss:{bpm:120,root:45,mode:'frigia',prog:[0,1,0,5,0,1,3,4],style:'boss',drums:true,leadOn:true,leadType:'sawtooth',bassType:'sawtooth',padType:'sawtooth',motif:[0,1,0,-1,0,3,2,1]},
  secret:{bpm:104,root:49,mode:'frigia',prog:[0,5,1,4],style:'boss',drums:true,leadOn:true,leadType:'sine',bassType:'sawtooth',motif:[0,3,1,4,2]},
  victory:{bpm:128,root:60,mode:'maior',prog:[0,4,5,4],style:'calm',leadOn:true,leadType:'square',padType:'triangle',motif:[0,2,4,7,4,2,4]},
  // ---- variações de EXPLORAÇÃO por profundidade (acompanham os cenários) ----
  explore_b:{bpm:92,root:50,mode:'menor',prog:[0,3,5,4],style:'calm',leadOn:true,padType:'sine',leadType:'triangle',bassType:'triangle',motif:[0,2,3,5,3,2]},   // criptas/gelo
  explore_c:{bpm:104,root:53,mode:'dorica',prog:[0,4,3,5],style:'calm',leadOn:true,padType:'triangle',leadType:'sine',bassType:'sawtooth',motif:[0,3,4,2,4,3]},  // lava/floresta
  explore_d:{bpm:100,root:48,mode:'frigia',prog:[0,1,3,2],style:'calm',leadOn:true,padType:'sawtooth',leadType:'sine',bassType:'sawtooth',motif:[0,1,3,1,-1,0]},  // realeza/catacumba
  explore_e:{bpm:108,root:46,mode:'frigia',prog:[0,5,1,4,0,3,1,5],style:'calm',leadOn:true,padType:'sine',leadType:'triangle',bassType:'sawtooth',motif:[0,-1,1,3,1,0]}, // carmesim/vazio
  // ---- variações de BATALHA por profundidade ----
  battle_b:{bpm:150,root:50,mode:'menor',prog:[0,5,3,4,0,5,4,3],style:'drive',drums:true,leadOn:true,leadType:'square',bassType:'sawtooth',motif:[0,3,5,4,3,2,4,5]},
  battle_c:{bpm:158,root:47,mode:'dorica',prog:[0,4,5,3,0,4,3,5],style:'drive',drums:true,leadOn:true,leadType:'sawtooth',bassType:'sawtooth',motif:[0,4,3,5,4,2,4,3]},
  battle_d:{bpm:166,root:43,mode:'frigia',prog:[0,1,4,5,0,1,5,4],style:'drive',drums:true,leadOn:true,leadType:'sawtooth',bassType:'sawtooth',padType:'sawtooth',motif:[0,1,4,5,1,4,3,1]},
  boss_b:{bpm:132,root:41,mode:'frigia',prog:[0,1,0,5,3,1,4,5],style:'boss',drums:true,leadOn:true,leadType:'sawtooth',bassType:'sawtooth',padType:'sawtooth',motif:[0,1,-1,0,3,1,4,2]},
};
// mapeia a profundidade -> variação de trilha (8 faixas, ciclando com os cenários)
function trackVariant(base){
  if(!RUN)return base; const bi=floorBandIndex(RUN.floor);
  if(base==='explore')return ['explore','explore_b','explore_c','explore_d','explore_e','explore_b','explore_c','explore_d'][bi]||base;
  if(base==='battle')return ['battle','battle','battle_b','battle_b','battle_c','battle_c','battle_d','battle_d'][bi]||base;
  if(base==='boss')return RUN.floor>=60?'boss_b':'boss';
  return base;
}
const Sound={
  ctx:null,master:null,musGain:null,sfxGain:null,on:true,musVol:0.4,sfxVol:0.5,
  cache:{},track:null,trackName:null,_int:null,_step:0,_next:0,
  init(){
    if(this.ctx)return;
    try{const AC=window.AudioContext||window.webkitAudioContext;this.ctx=new AC();
      this.master=this.ctx.createGain();this.master.gain.value=0.9;this.master.connect(this.ctx.destination);
      this.musGain=this.ctx.createGain();this.musGain.connect(this.master);
      this.sfxGain=this.ctx.createGain();this.sfxGain.connect(this.master);
      const p=G.meta&&G.meta.audio;if(p){this.on=p.on!==false;this.musVol=p.musVol??0.4;this.sfxVol=p.sfxVol??0.5;}
      this.musGain.gain.value=this.on?this.musVol:0;this.sfxGain.gain.value=this.on?this.sfxVol:0;
    }catch(e){this.ctx=null;}
  },
  resume(){if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();},
  savePrefs(){if(G.meta){G.meta.audio={on:this.on,musVol:this.musVol,sfxVol:this.sfxVol};saveGame();}},
  setMus(v){this.musVol=v;if(this.musGain)this.musGain.gain.value=this.on?v:0;this.savePrefs();},
  setSfx(v){this.sfxVol=v;if(this.sfxGain)this.sfxGain.gain.value=this.on?v:0;this.savePrefs();},
  toggle(){this.on=!this.on;if(this.musGain)this.musGain.gain.value=this.on?this.musVol:0;if(this.sfxGain)this.sfxGain.gain.value=this.on?this.sfxVol:0;this.savePrefs();if(this.on)this.resume();return this.on;},
  tone(t,freq,dur,o={}){if(!this.ctx)return;const c=this.ctx;const osc=c.createOscillator();const g=c.createGain();
    osc.type=o.type||'square';osc.frequency.setValueAtTime(freq,t);
    if(o.slideTo)osc.frequency.exponentialRampToValueAtTime(Math.max(1,o.slideTo),t+dur);
    if(o.detune)osc.detune.value=o.detune;
    const peak=o.gain??0.2;const a=o.a??0.005,r=o.r??0.06;
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);
    g.gain.setValueAtTime(peak,t+Math.max(a,dur-r));g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    osc.connect(g);g.connect(o.dest||this.sfxGain);osc.start(t);osc.stop(t+dur+0.02);},
  noise(t,dur,o={}){if(!this.ctx)return;const c=this.ctx;const n=Math.floor(c.sampleRate*dur);
    const buf=c.createBuffer(1,n,c.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
    const src=c.createBufferSource();src.buffer=buf;const g=c.createGain();g.gain.value=o.gain??0.2;
    let node=src;if(o.hp||o.lp){const f=c.createBiquadFilter();f.type=o.hp?'highpass':'lowpass';f.frequency.value=o.hp||o.lp;src.connect(f);node=f;}
    node.connect(g);g.connect(o.dest||this.sfxGain);src.start(t);src.stop(t+dur);},
  music(name){
    this.init();if(!this.ctx)return;this.resume();
    if(this.trackName===name)return;this.trackName=name;
    if(!TRACK_DEFS[name]){this.stop();return;}
    if(!this.cache[name])this.cache[name]=buildTrack(TRACK_DEFS[name]);
    this.track=this.cache[name];this._step=0;this._next=this.ctx.currentTime+0.06;
    if(!this._int)this._int=setInterval(()=>this._sched(),25);
  },
  stop(){this.trackName=null;this.track=null;if(this._int){clearInterval(this._int);this._int=null;}},
  _sched(){const tr=this.track;if(!tr||!this.ctx)return;const c=this.ctx;const spb=60/tr.bpm/4;
    while(this._next<c.currentTime+0.12){this._emit(tr,this._step%tr.len,this._next,spb);this._next+=spb;this._step++;}},
  _emit(tr,s,t,spb){const md=this.musGain;
    if(tr.bass[s]!=null)this.tone(t,mtof(tr.bass[s]),spb*3,{type:tr.bassType,gain:0.16,dest:md,r:0.05});
    if(tr.arp[s]!=null)this.tone(t,mtof(tr.arp[s]),spb*1.4,{type:tr.padType,gain:0.05,dest:md,r:0.05});
    if(tr.lead[s]!=null)this.tone(t,mtof(tr.lead[s]),spb*2.5,{type:tr.leadType,gain:0.07,dest:md,a:0.01,r:0.1});
    if(s%16===0){const ch=tr.pad[(s/16)%tr.pad.length];if(ch)ch.forEach(m=>this.tone(t,mtof(m),spb*15,{type:tr.padType,gain:0.025,dest:md,a:0.08,r:0.3}));}
    const d=tr.drum[s];if(d==='k'){this.tone(t,150,0.14,{type:'sine',gain:0.4,slideTo:48,dest:md,r:0.1});}
    else if(d==='s'){this.noise(t,0.12,{gain:0.18,hp:1200,dest:md});this.tone(t,200,0.08,{type:'triangle',gain:0.08,dest:md});}
    else if(d==='h'){this.noise(t,0.03,{gain:0.05,hp:7000,dest:md});}},
  // ---- SFX ----
  sfx(name){this.init();if(!this.ctx||!this.on)return;this.resume();const t=this.ctx.currentTime;
    switch(name){
      case 'click':this.tone(t,520,0.06,{type:'square',gain:0.12});break;
      case 'hover':this.tone(t,700,0.03,{type:'sine',gain:0.05});break;
      case 'hit':this.noise(t,0.08,{gain:0.18,hp:800});this.tone(t,180,0.1,{type:'square',gain:0.12,slideTo:90});break;
      case 'crit':this.noise(t,0.12,{gain:0.25,hp:600});this.tone(t,300,0.16,{type:'sawtooth',gain:0.16,slideTo:120});this.tone(t+0.02,900,0.1,{type:'square',gain:0.1,slideTo:1400});break;
      case 'enemyhit':this.noise(t,0.06,{gain:0.1,hp:1500});this.tone(t,420,0.08,{type:'triangle',gain:0.08,slideTo:260});break;
      case 'heal':[0,4,7,12].forEach((n,i)=>this.tone(t+i*0.05,mtof(72+n),0.18,{type:'sine',gain:0.12,r:0.12}));break;
      case 'levelup':[0,4,7,12,16].forEach((n,i)=>this.tone(t+i*0.06,mtof(64+n),0.2,{type:'square',gain:0.13,r:0.12}));break;
      case 'coin':[0,7].forEach((n,i)=>this.tone(t+i*0.05,mtof(84+n),0.1,{type:'square',gain:0.12}));break;
      case 'loot':[0,4,9].forEach((n,i)=>this.tone(t+i*0.05,mtof(76+n),0.14,{type:'triangle',gain:0.12}));break;
      case 'epic':[0,5,9,12,17].forEach((n,i)=>this.tone(t+i*0.07,mtof(72+n),0.24,{type:'square',gain:0.13,r:0.15}));break;
      case 'secret':[0,3,7,10,12].forEach((n,i)=>this.tone(t+i*0.08,mtof(70+n),0.3,{type:'sine',gain:0.13,detune:6,r:0.2}));break;
      case 'trap':this.noise(t,0.2,{gain:0.2,lp:1800});this.tone(t,300,0.25,{type:'sawtooth',gain:0.14,slideTo:70});break;
      case 'treasure':[0,4,7,12].forEach((n,i)=>this.tone(t+i*0.06,mtof(79+n),0.16,{type:'square',gain:0.12}));break;
      case 'unlock':[0,7,12,16,19].forEach((n,i)=>this.tone(t+i*0.08,mtof(67+n),0.3,{type:'triangle',gain:0.14,r:0.2}));break;
      case 'roar':this.noise(t,0.5,{gain:0.3,lp:600});this.tone(t,80,0.6,{type:'sawtooth',gain:0.2,slideTo:40,r:0.3});break;
      case 'death':[0,-2,-4,-7,-12].forEach((n,i)=>this.tone(t+i*0.12,mtof(60+n),0.4,{type:'triangle',gain:0.14,r:0.3}));break;
      case 'descend':this.tone(t,400,0.3,{type:'sine',gain:0.12,slideTo:200});break;
      case 'chest':this.noise(t,0.1,{gain:0.12,hp:2000});[0,4,7,12,16,19].forEach((n,i)=>this.tone(t+0.1+i*0.07,mtof(72+n),0.22,{type:'square',gain:0.13,r:0.15}));break;
      case 'win':[0,4,7,12,7,12,16].forEach((n,i)=>this.tone(t+i*0.1,mtof(67+n),0.3,{type:'square',gain:0.14,r:0.18}));break;
    }
  }
};
function sfx(n){try{Sound.sfx(n);}catch(e){}}
function music(n){try{Sound.music(n);}catch(e){}}

/* ====================== MOTOR DE PIXEL ART ======================
   Sprites são grades de caracteres. Cada char vira uma cor da paleta.
   '.' = transparente. Desenhamos numa canvas e escalamos com pixelated. */
function spriteCanvas(grid,pal,scale=4,opts={}){
  const h=grid.length,w=grid[0].length;
  const cv=document.createElement('canvas');
  cv.width=w*scale;cv.height=h*scale;
  const ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const c=grid[y][x];if(c==='.'||c===' ')continue;
    const col=pal[c];if(!col)continue;
    ctx.fillStyle=col;ctx.fillRect(x*scale,y*scale,scale,scale);
  }
  if(opts.outline){ // contorno escuro simples
    ctx.globalCompositeOperation='destination-over';
  }
  return cv;
}
// renderiza grade dentro de um ctx já existente (para cenas)
function blitGrid(ctx,grid,pal,ox,oy,scale){
  for(let y=0;y<grid.length;y++)for(let x=0;x<grid[0].length;x++){
    const c=grid[y][x];if(c==='.'||c===' ')continue;const col=pal[c];if(!col)continue;
    ctx.fillStyle=col;ctx.fillRect(ox+x*scale,oy+y*scale,scale,scale);
  }
}

function itemCategory(it){
  const id=it.id||'';
  if(it.type==='arma'){const s=it.stats||{};
    if(/arco|besta/.test(id))return 'bow';
    if(/martelo|maca|porrete|montante|alabarda|cetro/.test(id))return 'mace';
    if((s.mag||0)>(s.atk||0)||/cajado|varinha|grimorio|orbe/.test(id))return 'staff';
    if(/adaga|punhal|katar|sabre|florete|foice|lamina_gemea/.test(id))return 'dagger';
    return 'sword';}
  if(it.type==='elmo')return 'helm';
  if(it.type==='armadura')return 'armor';
  if(it.type==='bracelete')return 'glove';
  if(it.type==='grevas')return 'boot';
  if(it.type==='acessorio')return /amuleto|colar|pingente|broche|coracao|lagrima|dente/.test(id)?'amulet':'ring';
  if(it.type==='talisma')return 'talisman';
  if(it.type==='consumivel')return /bomba/.test(id)?'bomb':/pergaminho/.test(id)?'scroll':'potion';
  if(it.type==='mat')return /cristal|po_estelar|alma|gema/.test(id)?'gem':'ore';
  return 'key';
}

}
function itemSprite(it,scale){

// níveis de liberação MUITO mais espaçados (o jogo vai ao Andar 200; heróis sobem por muitas incursões)
const SKILL_LEVELS=[1,5,11,18,27,38,52,68,90];
function skillLevelFor(i){ return i<SKILL_LEVELS.length?SKILL_LEVELS[i]:SKILL_LEVELS[SKILL_LEVELS.length-1]+(i-SKILL_LEVELS.length+1)*15; }
/* ===== BALANCEAMENTO DE HABILIDADES =====
   Nenhum herói deve ter uma habilidade absurdamente mais forte que a dos outros.
   Cada "slot" (ordem de liberação) tem um TETO de poder para dano de alvo único;
   golpes em área (que atingem todos) e efeitos fortes (execute/crit garantido/roubo
   de vida) recebem um teto proporcionalmente menor. Só REDUZ excessos — nunca infla
   golpes de baixo poder de propósito (multi-hit como duplo/triplo ficam intactos). */
const POW_CAP=[1.6,2.0,2.4,2.9,3.5,4.2,5.0,5.8];
function balanceSkillPow(sk,idx){
  if(sk.kind!=='phys'&&sk.kind!=='mag')return;                 // cura/suporte não têm teto de poder
  if(sk.fx==='double'||sk.fx==='triple'||sk.fx==='combo')return; // multi-hit: poder baixo é proposital
  let cap=POW_CAP[Math.min(idx,POW_CAP.length-1)];
  if(sk.tgt==='all'||sk.tgt==='allies')cap*=0.72;               // acertar TODOS vale muito → teto menor
  if(sk.fx==='execute'||sk.fx==='critmax')cap*=0.90;            // efeitos que "finalizam"/garantem crítico
  else if(sk.fx==='lifesteal')cap*=0.93;
  cap=+cap.toFixed(2);
  if((sk.pow||1)>cap)sk.pow=cap;
}
(function expandSkills(){
  HEROES.forEach(h=>{
    const ex=EXTRA_SKILLS[h.id]||[];
    const cap=CAPSTONE_SKILLS[h.id];
    h.skills=h.skills.concat(ex.map(s=>Object.assign({},s)));
    if(cap)h.skills.push(Object.assign({},cap));
    h.skills.forEach((sk,i)=>{ sk.lvl=skillLevelFor(i); balanceSkillPow(sk,i); });
  });
})();

        weight:elite?Math.max(2,weight-8):weight, elite, base,

  const tmpls=BOSSES.filter(b=>!b.secret&&b.floor<floor);
  const tmpl=tmpls[(Math.floor(floor/5))%tmpls.length]||BMAP.guardiao;
  const nm=DEEP_BOSS_NAMES[(Math.floor(floor/5))%DEEP_BOSS_NAMES.length];
  // base escalada para o andar (chefe sente como ~3x um inimigo normal do andar)
  const k=floor;
  return {id:'lord_'+floor,name:nm+' · Andar '+floor,family:tmpl.family,el:tmpl.el,floor,proc:true,
    base:{hp:Math.round(260+k*k*5.2+k*60), atk:Math.round(16+k*2.2+k*k*0.05), def:Math.round(10+k*1.0+k*k*0.012), spd:Math.round(8+k*0.14)},
    grid:tmpl.grid,pal:tmpl.pal,skills:['esmagar','tremor'],
    intro:'Um senhor das profundezas barra o caminho. A Adranja não quer que você desça mais.'};
}

/* ===== EQUIPAMENTO PROGRESSIVO POR PROFUNDIDADE =====
   Gera famílias de itens por FAIXA de andar. Itens mais fundos têm o mesmo
   "tipo" mas ficam levemente mais fortes (nomes próprios por faixa), e dentro
   de cada faixa a raridade ordena o poder (comum < raro < épico). Isso faz o
   loot evoluir de forma suave em vez de estagnar. */
const GEN_BANDS=20; // faixa a cada 10 andares (andar 1-10, 11-20, ...)
function bandTier(floor){return Math.max(0,Math.min(GEN_BANDS-1,Math.floor(((floor||1)-1)/10)));}
(function genEquipment(){
  const TIERS=['de Ferro','de Bronze','de Aço','de Prata','de Cobalto','de Mitrila','de Obsidiana','de Cristal','de Ônix','Rúnico','Élfico','Dracônico','do Abismo','de Ametista','das Marés','das Sombras','das Estrelas','do Eclipse','do Vazio','Primordial'];
  const RGEN=[['comum',1.0,''],['raro',1.5,'✦'],['epico',2.2,'✦✦']];
  const FAMS=[
    {slot:'arma',key:'espada',noun:'Espada',main:'atk',base:6,ex:{}},
    {slot:'arma',key:'machado',noun:'Machado',main:'atk',base:7,ex:{def:1}},
    {slot:'arma',key:'cajado',noun:'Cajado',main:'mag',base:6,ex:{lck:1}},
    {slot:'arma',key:'arco',noun:'Arco',main:'atk',base:5,ex:{spd:2}},
    {slot:'elmo',key:'elmo',noun:'Elmo',main:'def',base:4,ex:{hp:8}},
    {slot:'armadura',key:'armadura',noun:'Armadura',main:'hp',base:14,ex:{def:4}},
    {slot:'bracelete',key:'manopla',noun:'Manopla',main:'atk',base:4,ex:{def:2}},
    {slot:'grevas',key:'botas',noun:'Botas',main:'spd',base:4,ex:{def:2}},
    {slot:'acessorio',key:'anel',noun:'Anel',main:'lck',base:5,ex:{hp:8}},
    {slot:'talisma',key:'talisma',noun:'Talismã',main:'mag',base:4,ex:{atk:4}},
  ];
  for(let band=0;band<GEN_BANDS;band++){
    const bandMul=1+band*0.15;                  // +15% por faixa (suave)
    FAMS.forEach(f=>{
      RGEN.forEach(([rar,rmul,sym])=>{
        const mul=rmul*bandMul;
        const stats={}; stats[f.main]=Math.max(1,Math.round(f.base*mul));
        for(const k in f.ex)stats[k]=Math.max(1,Math.round(f.ex[k]*mul*0.7));
        ITEMS.push({id:`g_${f.key}_${band}_${rar}`, name:`${f.noun} ${TIERS[band]}${sym?' '+sym:''}`,
          icon:'⚔️', type:f.slot, slot:f.slot, rarity:rar, stats, band, _gen:true});
      });
    });
  }
})();
const IMAP={};ITEMS.forEach(i=>IMAP[i.id]=i);

function defaultMeta(){
  const heroes={};
  HEROES.forEach(h=>{heroes[h.id]={unlocked:!!h.start,level:1,xp:0,maxLevelEver:1,equip:{arma:null,elmo:null,armadura:null,bracelete:null,grevas:null,acessorio:null,talisma:null}};});
  return{
    version:1, essence:0, gold:0, deepestFloor:0, torreDeepest:0, runs:0, totalKills:0,
    tamedCount:0, craftedCount:0, bossesKilled:[], bestiaryKills:{}, eliteKills:0,
    heroes, inventory:{}, party:['cartografo','guerreiro','cleriga'],
    research:{}, researchActive:null, // {id,end}
    codex:{bestiary:[],items:[],secrets:[],bosses:[]},
    flags:{}, mapKnowledge:{}, // floorN -> familiaridade 0..1
    slots:3, relics:[], seenIntro:false, upgrades:{}, equipUpg:{},
    playerName:null, playerSecret:null   // identidade no ranking
  };
}
// preenche campos que faltam em saves antigos / vindos da nuvem
function migrateMeta(){
  HEROES.forEach(h=>{const st=G.meta.heroes[h.id];
    if(!st){G.meta.heroes[h.id]={unlocked:!!h.start,level:1,xp:0,maxLevelEver:1,equip:{arma:null,elmo:null,armadura:null,bracelete:null,grevas:null,acessorio:null,talisma:null}};}
    else{ if(st.level==null)st.level=st.maxLevelEver||1; if(st.xp==null)st.xp=0; if(!st.equip)st.equip={}; EQUIP_SLOTS.forEach(sl=>{if(st.equip[sl]===undefined)st.equip[sl]=null;}); }});
  if(!G.meta.codex)G.meta.codex={bestiary:[],items:[],secrets:[],bosses:[]};
  if(!G.meta.upgrades)G.meta.upgrades={}; if(!G.meta.bestiaryKills)G.meta.bestiaryKills={};
  // aprimoramento por HERÓI+item (separado por personagem). Migra do antigo store compartilhado.
  if(!G.meta.equipUpg){
    G.meta.equipUpg={};
    if(G.meta.upgrades){
      Object.keys(G.meta.heroes||{}).forEach(hid=>{
        const eq=G.meta.heroes[hid].equip||{};
        EQUIP_SLOTS.forEach(sl=>{const id=eq[sl];
          if(id&&G.meta.upgrades[id])G.meta.equipUpg[hid+'|'+id]=G.meta.upgrades[id];});
      });
    }
  }
}
function loadGame(){
  try{const raw=localStorage.getItem(SAVE_KEY);if(raw){G.meta=JSON.parse(raw);migrateMeta();return true;}
  }catch(e){console.warn('save corrompido',e);}
  G.meta=defaultMeta();return false;
}
let _saveT=null;
function saveLocal(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(G.meta));}catch(e){}}   // grava local na hora
function saveGame(){clearTimeout(_saveT);_saveT=setTimeout(()=>{ saveLocal();
  try{if(typeof Account!=='undefined'&&Account.slot!=null)Account.scheduleCloudSave();}catch(e){}
},200);}
function hardReset(){localStorage.removeItem(SAVE_KEY);G.meta=defaultMeta();saveGame();}

function authErr(e){const c=(e&&e.code)||'';const m={
  'auth/email-already-in-use':'Esse e-mail já tem uma conta. Faça login.',
  'auth/invalid-email':'E-mail inválido.',

};return m[c]||((e&&e.message)||'Erro inesperado.');}
function normName(s){return (s||'').trim().toLowerCase().replace(/\s+/g,'_').replace(/[\/.#$\[\]]/g,'').slice(0,16);}
function heroesUnlockedCount(){return Object.values(G.meta.heroes||{}).filter(h=>h.unlocked).length;}
function computeScoreOf(m){m=m||G.meta;
  const heroes=Object.values(m.heroes||{}).filter(h=>h.unlocked).length;
  return Math.round((m.deepestFloor||0)*100 + (m.torreDeepest||0)*300 + (m.bossesKilled||[]).length*180
    + heroes*350 + (m.totalKills||0)*2
    + ((m.flags&&m.flags.beatGame)?6000:0) + ((m.flags&&m.flags.beatTorre)?12000:0));}
function computeScore(){return computeScoreOf(G.meta);}
function playerStats(){const m=G.meta;return {name:m.playerName||'?', score:computeScore(),
  deepest:m.deepestFloor||0, torre:m.torreDeepest||0, heroes:heroesUnlockedCount(),
  bosses:(m.bossesKilled||[]).length, kills:m.totalKills||0,
  beatGame:!!(m.flags&&m.flags.beatGame), beatTorre:!!(m.flags&&m.flags.beatTorre), updated:Date.now()};}
// "dono do jogo" = quem configurou neste aparelho (vê o botão de config; visitantes não)
function isOwner(){try{return localStorage.getItem('adranja_owner')==='1';}catch(e){return false;}}
// config efetiva: o que o dono colou na tela (localStorage) tem prioridade sobre o do código
function getFirebaseConfig(){
  try{const raw=localStorage.getItem('adranja_fb');if(raw){const c=JSON.parse(raw);if(c&&c.apiKey&&c.projectId)return c;}}catch(e){}
  return FIREBASE_CONFIG;
}
// extrai os campos do trecho que o Firebase mostra (aceita JS ou JSON, aspas simples/duplas)
function parseFirebaseSnippet(txt){
  const cfg={};['apiKey','authDomain','projectId','storageBucket','messagingSenderId','appId','measurementId'].forEach(k=>{
    const m=(txt||'').match(new RegExp(k+'\\s*[:=]\\s*[\'"]([^\'"]+)[\'"]'));if(m)cfg[k]=m[1];});
  return cfg;
}
const Rank={
  ready:false, online:false, db:null, _load:null,
  configured(){const c=getFirebaseConfig();return !!(c&&c.apiKey&&c.projectId&&!/COLE_|SEU_PROJETO|YOUR_/.test(c.apiKey));},
  reset(){this.ready=false;this.online=false;this.db=null;       // re-inicia após salvar nova config
    try{ if(window.firebase&&firebase.apps&&firebase.apps.length)firebase.apps.slice().forEach(a=>a.delete()); }catch(e){} },
  _loadSdk(){ if(this._load)return this._load;
    this._load=new Promise((res,rej)=>{let i=0;const next=()=>{ if(i>=FB_SCRIPTS.length)return res();
      const sc=document.createElement('script');sc.src=FB_SCRIPTS[i++];sc.onload=next;sc.onerror=()=>rej(new Error('sdk'));document.head.appendChild(sc);};next();});
    return this._load;},
  async init(){ if(this.ready)return this.online;
    if(!this.configured()){this.ready=true;this.online=false;return false;}
    try{ await this._loadSdk(); if(!firebase.apps.length)firebase.initializeApp(getFirebaseConfig());
      this.db=firebase.firestore(); this.online=true; }
    catch(e){ console.warn('Ranking em modo local (Firebase indisponível):',e&&e.message); this.online=false; }
    this.ready=true; return this.online; },
  _localNames(){try{return JSON.parse(localStorage.getItem('adranja_names')||'{}');}catch(e){return {};}},
  async claim(rawName){
    const name=(rawName||'').trim(); const id=normName(name);
    if(id.length<2)return {ok:false,reason:'Nome muito curto (mín. 2 letras).'};
    if(name.length>16)return {ok:false,reason:'Nome muito longo (máx. 16).'};
    await this.init();
    const secret=Math.random().toString(36).slice(2)+Date.now().toString(36);
    if(!this.online){ const t=this._localNames();
      if(t[id]&&t[id].name!==name){/* local não garante global; segue */}
      t[id]={name}; try{localStorage.setItem('adranja_names',JSON.stringify(t));}catch(e){}
      return {ok:true, name, secret, local:true}; }
    try{
      const ref=this.db.collection('players').doc(id);
      return await this.db.runTransaction(async(tx)=>{
        const snap=await tx.get(ref);
        if(snap.exists)return {ok:false,reason:'Esse nome já está em uso. Escolha outro.'};
        tx.set(ref, Object.assign({}, playerStats(), {name, secret, created:Date.now()}));
        return {ok:true, name, secret};
      });
    }catch(e){ return {ok:false,reason:'Erro de conexão com o ranking. Tente novamente.'}; }
  },
  async submit(){ if(!G.meta.playerName)return; await this.init(); if(!this.online)return;
    try{ const id=normName(G.meta.playerName);
      await this.db.collection('players').doc(id).set(Object.assign({},playerStats(),{secret:G.meta.playerSecret}),{merge:true});
    }catch(e){} },
  async top(n){ await this.init();
    if(!this.online){ return G.meta.playerName?[Object.assign({},playerStats())]:[]; }
    try{ const q=await this.db.collection('players').orderBy('score','desc').limit(n||50).get();
      return q.docs.map(d=>d.data()); }catch(e){ return []; } }
};

/* ============================================================================
   👤 CONTAS (Firebase Auth) + 3 SLOTS DE SAVE com sincronização na nuvem
   ============================================================================ */
const Account={
  user:null, slot:null, _auth:null,
  available(){return Rank.configured();},
  async ensureAuth(){ await Rank.init(); if(!Rank.online)return false;
    if(!this._auth){ try{this._auth=firebase.auth();}catch(e){return false;} } return true; },
  uid(){return this.user&&this.user.uid;},
  loggedIn(){return !!this.user;},
  verified(){return !!(this.user&&this.user.emailVerified);},
  accRef(){return Rank.db.collection('accounts').doc(this.uid());},
  saveRef(i){return this.accRef().collection('saves').doc('s'+i);},
  // observa estado de login (sessão persiste entre aparelhos)
  watch(cb){ this.ensureAuth().then(ok=>{ if(!ok){cb(null);return;}
    this._auth.onAuthStateChanged(u=>{this.user=u;
      if(u){ try{const s=JSON.parse(localStorage.getItem('adranja_slot')||'null');if(s&&s.uid===u.uid)this.slot=s.i;}catch(e){} }
      else this.slot=null;
      cb(u);}); }).catch(()=>cb(null)); },
  _persist(i){try{localStorage.setItem('adranja_slot',JSON.stringify({uid:this.uid(),i}));}catch(e){}},
  async signUp(email,pass){ if(!await this.ensureAuth())return {ok:false,reason:'Sem conexão com o servidor.'};
    try{ const cred=await this._auth.createUserWithEmailAndPassword(email.trim(),pass); this.user=cred.user;
      try{await cred.user.sendEmailVerification();}catch(e){}
      return {ok:true,verifySent:true}; }catch(e){return {ok:false,reason:authErr(e)};} },
  async signIn(email,pass){ if(!await this.ensureAuth())return {ok:false,reason:'Sem conexão com o servidor.'};
    try{ const cred=await this._auth.signInWithEmailAndPassword(email.trim(),pass); this.user=cred.user; return {ok:true}; }
    catch(e){return {ok:false,reason:authErr(e)};} },
  async resendVerify(){ try{await this.user.reloadUserInfo?this.user.reload():0;}catch(e){} try{await this.user.sendEmailVerification();return true;}catch(e){return false;} },
  async refresh(){ try{await this.user.reload(); this.user=this._auth.currentUser; }catch(e){} return this.verified(); },
  async resetPassword(email){ if(!await this.ensureAuth())return false; try{await this._auth.sendPasswordResetEmail(email.trim());return true;}catch(e){return false;} },
  async signOut(){ try{await this._auth.signOut();}catch(e){} this.user=null; this.slot=null; try{localStorage.removeItem('adranja_slot');}catch(e){} },
  // lista os 3 slots (metadados): [{name,score,deepest,...}|null x3]
  async listSlots(){ try{ const snap=await this.accRef().get(); const d=snap.exists?snap.data():{}; const s=d.slots||{};
      return [0,1,2].map(i=> s[i]?Object.assign({},s[i]):null ); }catch(e){ return [null,null,null]; } },
  // cria slot novo com nome único (claim global). retorna {ok}|{ok:false,reason}
  async createSlot(i,rawName,importLocal){
    const name=(rawName||'').trim(), id=normName(name);
    if(id.length<2)return {ok:false,reason:'Nome muito curto (mín. 2 letras).'};
    if(name.length>16)return {ok:false,reason:'Nome muito longo (máx. 16).'};
    if(!await this.ensureAuth())return {ok:false,reason:'Sem conexão.'};
    const secret=Math.random().toString(36).slice(2)+Date.now().toString(36);
    try{
      // garante nome único no ranking (transação)
      const pref=Rank.db.collection('players').doc(id);
      const claim=await Rank.db.runTransaction(async tx=>{ const sn=await tx.get(pref);
        if(sn.exists)return {ok:false,reason:'Esse nome já está em uso. Escolha outro.'};
        tx.set(pref,{name,score:0,deepest:0,torre:0,heroes:0,bosses:0,kills:0,beatGame:false,beatTorre:false,owner:this.uid(),slot:i,secret,created:Date.now()});
        return {ok:true}; });
      if(!claim.ok)return claim;
      // base do save: importa o progresso local ou começa do zero
      const base = importLocal ? JSON.parse(JSON.stringify(G.meta)) : defaultMeta();
      base.playerName=name; base.playerSecret=secret;
      await this.saveRef(i).set({meta:JSON.stringify(base)});
      const st={name,secret,score:computeScoreOf(base),deepest:base.deepestFloor||0,torre:base.torreDeepest||0,heroes:Object.values(base.heroes||{}).filter(h=>h.unlocked).length,bosses:(base.bossesKilled||[]).length,updated:Date.now()};
      await this.accRef().set({email:this.user.email,slots:{[i]:st}},{merge:true});
      // ativa
      G.meta=base; this.slot=i; this._persist(i); saveLocal();
      // se importou e o nome já estava no ranking local, atualiza pontuação
      Rank.submit();
      return {ok:true};
    }catch(e){ return {ok:false,reason:'Erro ao criar o save. Tente de novo.'}; }
  },
  // carrega um slot existente da nuvem
  async loadSlot(i){ if(!await this.ensureAuth())return false;
    try{ const snap=await this.saveRef(i).get(); if(!snap.exists)return false;
      const meta=JSON.parse(snap.data().meta); G.meta=meta; migrateMeta(); this.slot=i; this._persist(i); saveLocal(); return true;
    }catch(e){ return false; } },
  // exclui um slot: libera o nome e some do ranking
  async deleteSlot(i){ if(!await this.ensureAuth())return false;
    try{ const slots=await this.listSlots(); const sl=slots[i];
      if(sl&&sl.name){ try{await Rank.db.collection('players').doc(normName(sl.name)).delete();}catch(e){} }
      try{await this.saveRef(i).delete();}catch(e){}
      const upd={}; upd['slots.'+i]=firebase.firestore.FieldValue.delete();
      try{await this.accRef().update(upd);}catch(e){}
      if(this.slot===i)this.slot=null; return true;
    }catch(e){ return false; } },
  // sincroniza o save ativo para a nuvem (debounced)
  _syncT:null,
  scheduleCloudSave(){ if(this.slot==null||!Rank.online)return; clearTimeout(this._syncT);
    this._syncT=setTimeout(()=>this.cloudSaveNow(),12000); },
  async cloudSaveNow(){ if(this.slot==null||!Rank.online||!this.uid())return;
    try{ const i=this.slot;
      await this.saveRef(i).set({meta:JSON.stringify(G.meta)});
      const st={name:G.meta.playerName,secret:G.meta.playerSecret,score:computeScore(),deepest:G.meta.deepestFloor||0,torre:G.meta.torreDeepest||0,heroes:heroesUnlockedCount(),bosses:(G.meta.bossesKilled||[]).length,updated:Date.now()};
      await this.accRef().set({email:this.user.email,slots:{[i]:st}},{merge:true});
      Rank.submit();
    }catch(e){} }
};

// inventário
function invQty(id){return G.meta.inventory[id]||0;}
function addItem(id,n=1){G.meta.inventory[id]=(G.meta.inventory[id]||0)+n;discover('items',id);saveGame();}
function removeItem(id,n=1){G.meta.inventory[id]=Math.max(0,(G.meta.inventory[id]||0)-n);if(G.meta.inventory[id]===0)delete G.meta.inventory[id];saveGame();}
function canAfford(cost){for(const k in cost)if(invQty(k)<cost[k])return false;return true;}
function payCost(cost){for(const k in cost)removeItem(k,cost[k]);}
// códex
function discover(cat,id){const arr=G.meta.codex[cat];if(arr&&!arr.includes(id)){arr.push(id);saveGame();checkUnlocks();return true;}return false;}
function hasResearch(id){return id?!!G.meta.research[id]:true;}
// essência
function addEssence(n){let mult=0.45;if(G.meta.research.meta_essence)mult+=.3;if(G.meta.relics.includes('lampada_eterna'))mult*=2;  // essência muito escassa: vale muito
  n=Math.round(n*mult);G.meta.essence+=n;saveGame();return n;}

/* ---- DESBLOQUEIOS ---- */
function condMet(h){const u=h.unlock;if(!u)return true;const m=G.meta;
  switch(u.type){
    case 'floor':return m.deepestFloor>=u.v;
    case 'kills':return m.totalKills>=u.v;
    case 'craft':return m.craftedCount>=u.v;
    case 'tame':return m.tamedCount>=u.v;
    case 'boss':return m.bossesKilled.includes(u.v);
    case 'codex':return m.codex.secrets.length>=(typeof u.v==='number'?u.v:5);
    case 'item':return m.codex.items.includes(u.v)||invQty(u.v)>0;
    case 'secret':return !!m.flags[u.v];
    case 'essence':return !!m.flags['bought_'+h.id]; // comprado no Santuário
    default:return false;
  }
}
function checkUnlocks(){let changed=false;
  HEROES.forEach(h=>{const st=G.meta.heroes[h.id];
    if(!st.unlocked && h.unlock && h.unlock.type!=='essence' && condMet(h)){
      st.unlocked=true;changed=true;sfx('unlock');toast('🔓 '+h.icon+' '+h.name+' juntou-se ao acampamento!','lendario');
    }});
  if(changed)saveGame();
  return changed;
}

const STAT_LBL={hp:'PV',atk:'ATQ',def:'DEF',mag:'MAG',spd:'VEL',lck:'SOR'};
const LBL_ORDER=['hp','atk','def','mag','spd','lck'];
function statBar(lab,val,max,cls,delta){

/* stats efetivos de um herói num dado nível (com equipamento + pesquisas) */
function heroStats(heroId,level){
  const h=HMAP[heroId],st=G.meta.heroes[heroId];
  const s={};['hp','atk','def','mag','spd','lck'].forEach(k=>{
    s[k]=h.base[k]+(h.growth[k]||0)*(level-1);
  });
  // equipamento (com nível de aprimoramento +N → +14% por nível)
  EQUIP_SLOTS.forEach(sl=>{const it=st.equip[sl];if(it&&IMAP[it]&&IMAP[it].stats){const u=1+eqUpg(heroId,it)*0.14;
    for(const k in IMAP[it].stats)s[k]+=IMAP[it].stats[k]*u;}});
  // pesquisas meta
  const R=G.meta.research;
  if(R.meta_hp)s.hp*=1.15; if(R.meta_stam)s.hp*=1.10;
  if(R.meta_atk){s.atk*=1.12;s.mag*=1.12;} if(R.meta_def)s.def*=1.15;
  for(const k in s)s[k]=Math.round(s[k]);
  s.maxhp=s.hp;return s;
}
/* ===== PODER (power score): um número único de força do herói ===== */
const POWER_W={hp:0.08, atk:2.2, mag:2.2, def:1.6, spd:1.3, lck:1.0};
function statsPower(s){let p=0;for(const k in POWER_W)p+=(s[k]||0)*POWER_W[k];return Math.round(p);}
function heroPower(id,level){return statsPower(heroStats(id,level));}
// poder do herói SE equipasse itemId no slot (sem alterar o save de verdade)
function powerWithItem(heroId,slot,itemId){
  const st=G.meta.heroes[heroId];const prev=st.equip[slot];
  st.equip[slot]=itemId||null;const p=heroPower(heroId,heroMaxLevel(heroId));st.equip[slot]=prev;return p;
}
// skills permanentemente conhecidas até certo nível
function knownSkills(heroId,uptoLevel){
  const h=HMAP[heroId];return h.skills.filter(sk=>sk.lvl<=uptoLevel);
}
function heroMaxLevel(heroId){return G.meta.heroes[heroId].level||1;}
/* aprimoramento de equipamento — SEPARADO por herói (cada herói melhora a SUA cópia) */
function eqKey(heroId,itemId){return heroId+'|'+itemId;}
function eqUpg(heroId,itemId){return (G.meta.equipUpg&&G.meta.equipUpg[eqKey(heroId,itemId)])||0;}
function upgLevel(id){return (G.meta.upgrades&&G.meta.upgrades[id])||0;}  // legado (não usado p/ heróis)
const UPG_MAX=12;
function upgMax(){return G.meta.research.forja5?12:6;}
// custos calculados a partir do nível ATUAL informado (lv = aprimoramento daquele herói)
function upgGoldCost(id,lv){lv=lv||0;const it=IMAP[id];const rTier=RARS.indexOf(it.rarity)+1;
  let c=(140+lv*lv*70)*rTier; if(G.meta.research.meta_upg)c*=0.7; return Math.round(c);}
// MATERIAIS exigidos: específicos pela raridade do item (+1 material nobre a partir de +4)
function upgMats(id,lv){
  lv=lv||0; const rt=RARS.indexOf(IMAP[id].rarity);
  const prim=['ferro','cristal','obsidiana','alma','po_estelar','po_estelar','po_estelar','po_estelar'][rt]||'ferro';
  const out=[{mat:prim, qty:1+Math.floor(lv/2)+Math.floor(rt/2)}];
  if(lv>=4){ const sec=['couro','pano','seda','essencia_sombria','fragmento','fragmento','nucleo','nucleo'][rt]||'seda';
    out.push({mat:sec, qty:1+Math.floor((lv-4)/2)}); }
  return out;
}
// ESSÊNCIA agora é bem MENOR e linear (antes crescia ao quadrado e explodia)
function upgEssCost(id,lv){lv=lv||0;if(lv<3)return 0;const rTier=RARS.indexOf(IMAP[id].rarity)+1;
  return Math.round((lv-2)*24*rTier);}
function canUpgrade(heroId,itemId){const lv=eqUpg(heroId,itemId);if(lv>=upgMax())return false;
  if(G.meta.gold<upgGoldCost(itemId,lv))return false; if(G.meta.essence<upgEssCost(itemId,lv))return false;
  return upgMats(itemId,lv).every(c=>invQty(c.mat)>=c.qty);}
function doUpgrade(heroId,itemId){if(!canUpgrade(heroId,itemId))return;const lv=eqUpg(heroId,itemId);const ess=upgEssCost(itemId,lv);
  G.meta.gold-=upgGoldCost(itemId,lv); upgMats(itemId,lv).forEach(c=>removeItem(c.mat,c.qty)); if(ess>0)G.meta.essence-=ess;
  G.meta.equipUpg=G.meta.equipUpg||{};G.meta.equipUpg[eqKey(heroId,itemId)]=lv+1;
  saveGame();sfx('levelup');toast('🔨 '+HMAP[heroId].name.split(',')[0]+' · '+IMAP[itemId].icon+' '+IMAP[itemId].name+' +'+(lv+1)+'!','lendario');renderTab();}
// XP necessária p/ subir do nível L -> L+1
function xpForLevel(L){return Math.floor(40+L*L*14+L*30);}  // curva íngreme: subir de nível demora bastante

  const name=inp.value;err.textContent='';btn.disabled=true;btn.textContent='Verificando...';
  const r=await Rank.claim(name);
  if(!r.ok){ err.textContent=r.reason||'Não foi possível usar esse nome.'; btn.disabled=false;btn.textContent='Confirmar nome ▶'; return; }
  G.meta.playerName=r.name; G.meta.playerSecret=r.secret; saveGame();
  closeModal(); toast('🏆 Bem-vindo(a), '+r.name+'!','lendario');
  const cb=window._afterName;window._afterName=null;if(cb)cb();
}

async function saveFirebaseConfig(){
  const ta=$('#fbInput'),msg=$('#fbMsg');if(!ta)return;
  const cfg=parseFirebaseSnippet(ta.value);
  if(!cfg.apiKey||!cfg.projectId){ msg.style.color='var(--bad)';msg.textContent='Não achei apiKey/projectId. Cole o trecho completo do Firebase.';return; }
  localStorage.setItem('adranja_fb',JSON.stringify(cfg));
  Rank.reset();
  msg.style.color='var(--gold)';msg.textContent='Conectando ao Firebase...';
  const ok=await Rank.init();
  if(ok){ try{localStorage.setItem('adranja_owner','1');}catch(e){}   // marca este aparelho como dono
    msg.style.color='var(--ok)';msg.textContent='✅ Ranking online ativado!'; toast('🌐 Ranking online ativado!','lendario'); setTimeout(()=>{closeModal();showRanking();},900); }
  else { msg.style.color='var(--bad)';msg.textContent='Salvei, mas não consegui conectar. Confira a config e se o Firestore foi criado.'; }
}
function clearFirebaseConfig(){localStorage.removeItem('adranja_fb');Rank.reset();toast('📴 Ranking voltou ao modo local.','epico');closeModal();showRanking();}

function drawHomeArt(){
  const cv=$('#homeArt');if(!cv)return;const ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
  const W=cv.width,H=cv.height;
  // céu/caverna
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1a0e2e');g.addColorStop(1,'#0a0610');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // estrelas
  for(let i=0;i<40;i++){ctx.fillStyle='rgba(255,255,255,'+(0.2+Math.random()*0.5)+')';ctx.fillRect((i*53)%W,(i*29)%(H*0.6),2,2);}
  // chão
  ctx.fillStyle='#2a1a18';ctx.fillRect(0,H-34,W,34);
  ctx.fillStyle='#1a1010';for(let x=0;x<W;x+=18)ctx.fillRect(x,H-34,2,34);
  // arco de pedra
  ctx.fillStyle='#3a3040';
  ctx.fillRect(W/2-58,H-150,116,120);
  ctx.fillStyle='#0a0610';ctx.fillRect(W/2-40,H-130,80,100);
  // portal mágico
  const pg=ctx.createRadialGradient(W/2,H-80,4,W/2,H-80,46);
  pg.addColorStop(0,'#d6b0ff');pg.addColorStop(.5,'#7d4bff');pg.addColorStop(1,'rgba(40,16,80,0)');
  ctx.fillStyle=pg;ctx.fillRect(W/2-46,H-130,92,100);
  // tijolos do arco
  ctx.strokeStyle='#241a30';ctx.lineWidth=2;
  for(let y=H-150;y<H-30;y+=14){ctx.beginPath();ctx.moveTo(W/2-58,y);ctx.lineTo(W/2-40,y);ctx.moveTo(W/2+40,y);ctx.lineTo(W/2+58,y);ctx.stroke();}
  // tochas
  [W/2-66,W/2+62].forEach(tx=>{ctx.fillStyle='#5a4a3a';ctx.fillRect(tx,H-96,4,28);
    const fg=ctx.createRadialGradient(tx+2,H-100,1,tx+2,H-100,12);fg.addColorStop(0,'#ffd166');fg.addColorStop(1,'rgba(255,122,60,0)');
    ctx.fillStyle=fg;ctx.fillRect(tx-10,H-114,24,24);});
  // 3 heróis (silhuetas com sprites)
  const party=G.meta.party.slice(0,3);
  party.forEach((id,i)=>{const h=HMAP[id];if(!h)return;const sp=heroSprite(h,3);
    const px=W/2-48+i*40, py=H-72;
    ctx.save();ctx.globalAlpha=.96;ctx.drawImage(sp,px,py);ctx.restore();
    // sombra
    ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(px+8,py+48,32,4);
  });
}

  trap:'Prende o inimigo mais forte.',sacrifice:'Sacrifica vida por dano massivo.','secret+':'Procura ativamente passagens secretas.'
};
function skillFullDesc(sk){
  const parts=[];
  parts.push('<b>Tipo:</b> '+skKindLabel(sk));
  if(sk.kind==='phys'||sk.kind==='mag'){
    const p=sk.pow||1; const tier=p>=2.4?'devastador':p>=1.6?'forte':p>=1.1?'médio':'rápido';
    parts.push('<b>Poder:</b> ×'+p.toFixed(1)+' ('+tier+')');
  } else if(sk.kind==='heal'){ parts.push('<b>Poder de cura:</b> ×'+(sk.pow||1).toFixed(1)); }
  if(sk.tgt)parts.push('<b>Alvo:</b> '+(SK_TGT_DESC[sk.tgt]||sk.tgt));
  if(sk.el)parts.push('<b>Elemento:</b> '+sk.el);
  if(sk.fx&&SK_FX_DESC[sk.fx])parts.push('<b>Efeito:</b> '+SK_FX_DESC[sk.fx]);
  return parts.join('<br>');
}

function slotIcon(sl){return {arma:'🗡️',elmo:'⛑️',armadura:'👕',bracelete:'🧤',grevas:'🥾',acessorio:'💍',talisma:'📿'}[sl];}
function slotLabel(sl){return SLOT_LABEL[sl]||cap(sl);}

/* quantos heróis (exceto um) estão usando esse item neste slot */
function equippedByOthers(itemId,slot,exceptHeroId){
  return Object.keys(G.meta.heroes).filter(hid=>G.meta.heroes[hid].unlocked && hid!==exceptHeroId && G.meta.heroes[hid].equip[slot]===itemId);
}
// stats efetivos de um item (com aprimoramento +N — lv é o nível daquela cópia)
function effItemStats(it,lv){if(!it||!it.stats)return {};const m=1+((lv||0)*0.14);const o={};for(const k in it.stats)o[k]=Math.round(it.stats[k]*m);return o;}
// herói é focado em magia? (define a ordenação e o "melhor" item)
function heroIsMage(heroId){const h=HMAP[heroId];if(!h)return false;return (h.base.mag||0)>(h.base.atk||0);}
// pontua o quanto um item serve a um herói (prioriza o atributo principal dele)
function itemScoreFor(it,mage){const s=effItemStats(it);
  const prim=mage?(s.mag||0):(s.atk||0), off=mage?(s.atk||0):(s.mag||0);
  return prim*2.2 + off*0.5 + (s.def||0)*0.8 + (s.hp||0)*0.25 + (s.spd||0)*0.6 + (s.lck||0)*0.5;}
// cópias livres deste item para ESTE herói (não roubando de outros)
function freeFor(itemId,slot,heroId){return invQty(itemId)-equippedByOthers(itemId,slot,heroId).length;}
// equipa automaticamente o MELHOR item disponível em cada slot (respeitando o que está em outros heróis)
function autoEquipBest(heroId){
  const st=G.meta.heroes[heroId];const mage=heroIsMage(heroId);let changed=0;
  const lv=heroMaxLevel(heroId); const before=heroStats(heroId,lv);   // antes
  EQUIP_SLOTS.forEach(slot=>{
    const cands=Object.keys(G.meta.inventory).map(id=>IMAP[id])
      .filter(it=>it&&it.slot===slot&&freeFor(it.id,slot,heroId)>0)
      .sort((a,b)=>itemScoreFor(b,mage)-itemScoreFor(a,mage));
    if(!cands.length)return;
    const best=cands[0];
    if(st.equip[slot]!==best.id){ st.equip[slot]=best.id; changed++; }
  });
  const after=heroStats(heroId,lv);   // depois
  const d={}; LBL_ORDER.forEach(k=>{const diff=Math.round((after[k]||0)-(before[k]||0));if(diff)d[k]=diff;});
  _equipGains=(changed&&Object.keys(d).length)?{id:heroId,d}:null;
  saveGame();sfx(changed?'levelup':'click');
  if(!changed)toast('Já está usando os melhores disponíveis.','warn');
  _navGuard=true;try{openHero(heroId);}finally{_navGuard=false;}   // re-renderiza mostrando os ganhos
}
// comparação candidato vs equipado atual no slot -> HTML de deltas (verde sobe / vermelho desce)
function equipCompareHTML(slot,cand,heroId){
  const st=G.meta.heroes[heroId];const curId=st.equip[slot];
  if(curId===cand.id)return '';
  const cur=curId?IMAP[curId]:null;
  const a=effItemStats(cur,curId?eqUpg(heroId,curId):0), b=effItemStats(cand,eqUpg(heroId,cand.id));
  const keys=[...new Set([...Object.keys(a),...Object.keys(b)])];
  const parts=keys.map(k=>{const d=(b[k]||0)-(a[k]||0);if(d===0)return '';
    const col=d>0?'#5fd17a':'#ff5d6c';return `<span style="color:${col}">${d>0?'▲+'+d:'▼'+d} ${k.toUpperCase()}</span>`;}).filter(Boolean);
  if(!cur)return `<br><span class="tiny" style="color:var(--ok)">✦ slot vazio — ${parts.join('  ')||'novo'}</span>`;
  if(!parts.length)return `<br><span class="tiny muted">↔ mesmos atributos do atual</span>`;
  // veredito geral por soma simples dos deltas
  const sum=keys.reduce((s,k)=>s+((b[k]||0)-(a[k]||0)),0);
  const verd=sum>0?'<b style="color:#5fd17a">▲ Melhor</b>':sum<0?'<b style="color:#ff5d6c">▼ Pior</b>':'<b class="muted">↔ Igual</b>';
  return `<br><span class="tiny">vs atual: ${verd} &nbsp; ${parts.join('  ')}</span>`;
}
/* escolher equipamento para um slot — cards gamificados com comparação limpa em linha */
function pickEquip(heroId,slot){
  const h=HMAP[heroId], lv=heroMaxLevel(heroId);
  const st=G.meta.heroes[heroId]; const cur=st.equip[slot];
  const basePower=heroPower(heroId,lv);
  const curIt=cur?IMAP[cur]:null;
  // atributos efetivos do item atualmente equipado (base de comparação)
  const aStats=cur?effItemStats(curIt,eqUpg(heroId,cur)):{};
  // ordena pelo que dá MAIS PODER a este herói (o melhor primeiro); raridade desempata
  const owned=Object.keys(G.meta.inventory).map(id=>IMAP[id]).filter(it=>it&&it.slot===slot&&invQty(it.id)>0)
    .sort((a,b)=>powerWithItem(heroId,slot,b.id)-powerWithItem(heroId,slot,a.id) || RARS.indexOf(b.rarity)-RARS.indexOf(a.rarity));
  let bestId=null,bestPd=0;
  owned.forEach(it=>{if(it.id===cur)return;const pd=powerWithItem(heroId,slot,it.id)-basePower;if(pd>bestPd){bestPd=pd;bestId=it.id;}});
  const card=(it)=>{
    const isCur=cur===it.id;
    const others=equippedByOthers(it.id,slot,heroId);
    const freeForThis=invQty(it.id)-others.length;
    const uL=eqUpg(heroId,it.id);
    const b=effItemStats(it,uL);
    const keys=LBL_ORDER.filter(k=>(b[k]||0)||(aStats[k]||0));
    const rows=keys.map(k=>{
      const cv=b[k]||0, d=cv-(aStats[k]||0);
      const dc=isCur?'same':(d>0?'up':d<0?'down':'same');
      const dtxt=isCur?'':(d>0?'▲ +'+d:d<0?'▼ '+d:'— igual');
      return `<div class="eqsrow"><span class="k">${STAT_LBL[k]}</span><span class="v">${cv}</span><span class="d ${dc}">${dtxt}</span></div>`;
    }).join('')||'<span class="tiny muted">Sem atributos.</span>';
    const pd=isCur?0:(powerWithItem(heroId,slot,it.id)-basePower);
    let verd;
    if(isCur)verd=`<span class="eqverd gold">✔ Equipado agora</span>`;
    else if(!cur)verd=`<span class="eqverd up">✦ Novo · ⚡ +${pd}</span>`;
    else if(pd>0)verd=`<span class="eqverd up">▲ Melhor · ⚡ +${pd} poder</span>`;
    else if(pd<0)verd=`<span class="eqverd down">▼ Pior · ⚡ ${pd} poder</span>`;
    else verd=`<span class="eqverd same">↔ Equivalente</span>`;
    let action;
    if(isCur)action=`<button class="btn ghost sm" onclick="doEquip('${heroId}','${slot}',null)">Remover</button>`;
    else if(freeForThis>0)action=`<button class="btn sm" onclick="doEquip('${heroId}','${slot}','${it.id}')">Equipar${invQty(it.id)>1?` <span class="tiny">(${freeForThis})</span>`:''}</button>`;
    else action=`<button class="btn sm" disabled>em uso</button>`;
    const note=others.length?`<div class="eqnote" style="color:var(--bad)">🔒 Também equipado em ${others.map(hid=>HMAP[hid].name.split(',')[0]).join(', ')}</div>`:'';
    const cls=isCur?'cur':(it.id===bestId?'best':'');
    return `<div class="eqpick b-${it.rarity} ${cls}">
      <div class="eqhead">
        <div class="sl-ico">${itemIco(it,3)}</div>
        <div class="eqname"><b>${it.name}</b>${uL>0?` <span style="color:var(--gold)">+${uL}</span>`:''} ${rarPill(it.rarity)}${(it.id===bestId)?' <span class="chip" style="color:#5fd17a;border-color:#5fd17a">★ melhor</span>':''}<br>${verd}</div>
        ${action}
      </div>
      <div class="eqstats">${rows}</div>${note}</div>`;
  };
  const list=owned.map(card).join('')||'<p class="muted small">Nenhum equipamento deste tipo. Encontre na Adranja ou crie na Forja.</p>';
  openModal(`<h3>${slotIcon(slot)} ${slotLabel(slot)} — ${h.name.split(',')[0]}</h3>
    <div class="row between mt6" style="align-items:center">
      <span class="tiny muted">${curIt?`Atual: <b>${curIt.name}${eqUpg(heroId,cur)>0?' +'+eqUpg(heroId,cur):''}</b>`:'Nada equipado aqui.'}</span>
      <span class="pwr-chip">⚡ ${basePower}</span>
    </div>
    <p class="tiny muted mt6" style="margin:4px 0 0">Números à frente de cada atributo: <span style="color:#5fd17a">▲ sobe</span> · <span style="color:#ff6d7a">▼ desce</span> vs. o equipado. ⚡ = quanto o <b>poder</b> do herói muda.</p>
    ${cur?`<button class="btn ghost sm mt6" onclick="doEquip('${heroId}','${slot}',null)">Desequipar atual</button>`:''}
    <div class="col mt">${list}</div>`);
}
function statsStr(st,upgLv){if(!st)return '';const m=1+((upgLv||0)*0.14);return Object.keys(st).map(k=>`+${Math.round(st[k]*m)} ${k.toUpperCase()}`).join('  ');}
function doEquip(heroId,slot,itemId){
  const st=G.meta.heroes[heroId];
  if(itemId){ // só equipa se houver uma cópia livre (não rouba de outro herói)
    const others=equippedByOthers(itemId,slot,heroId);
    if(invQty(itemId)-others.length<=0){ toast('Esse item já está equipado em outro herói.','warn'); return; }
  }
  st.equip[slot]=itemId;saveGame();navBack();   // volta à ficha do herói (atualizada), sem fechar tudo
}

function sellFree(id){return Math.max(0,invQty(id)-totalEquipped(id));}   // cópias livres (não equipadas)

/* ---- venda em LOTE: selecionar vários e vender de uma vez ---- */
let SELL_SEL=new Set();
function sellList(){return Object.keys(G.meta.inventory).map(id=>IMAP[id])
  .filter(it=>it&&invQty(it.id)>0&&!it.secret&&it.type!=='chave'&&it.type!=='relíquia'&&sellFree(it.id)>0)
  .sort((a,b)=>RARS.indexOf(b.rarity)-RARS.indexOf(a.rarity));}
let SELL_FILTER='all';   // all | equip | mats
function setSellFilter(f){SELL_FILTER=f;renderTab();}
function sellFiltered(){const l=sellList();
  if(SELL_FILTER==='equip')return l.filter(it=>isEquip(it));
  if(SELL_FILTER==='mats')return l.filter(it=>!isEquip(it));
  return l;}
function toggleSell(id){if(SELL_SEL.has(id))SELL_SEL.delete(id);else SELL_SEL.add(id);renderTab();}
function sellQuick(mode){
  const list=sellFiltered();   // respeita o filtro de categoria atual
  if(mode==='clear'){SELL_SEL.clear();}
  else if(mode==='all'){list.forEach(it=>SELL_SEL.add(it.id));}
  else if(mode==='equip'){list.forEach(it=>{if(isEquip(it))SELL_SEL.add(it.id);});}
  else if(mode==='mats'){list.forEach(it=>{if(!isEquip(it))SELL_SEL.add(it.id);});}
  else if(mode==='dupes'){list.forEach(it=>{if(sellFree(it.id)>=2)SELL_SEL.add(it.id);});}
  else {const cap=RARS.indexOf(mode);list.forEach(it=>{if(RARS.indexOf(it.rarity)<=cap)SELL_SEL.add(it.id);});}
  renderTab();
}
function sellSelTotal(){let g=0;SELL_SEL.forEach(id=>{g+=sellValue(id)*sellFree(id);});return g;}
function sellSelected(){
  if(!SELL_SEL.size){toast('Selecione itens para vender.','warn');return;}
  let gold=0,count=0;
  SELL_SEL.forEach(id=>{const f=sellFree(id);if(f<=0)return;gold+=sellValue(id)*f;count+=f;removeItem(id,f);});
  G.meta.gold+=gold;SELL_SEL.clear();saveGame();sfx('coin');
  toast('💰 Vendeu '+count+' '+(count===1?'item':'itens')+' por 🪙 '+fmt(gold),'epico');renderTab();}
function buyGood(id,gold){if(G.meta.gold<gold){toast('Ouro insuficiente.','warn');return;}
  G.meta.gold-=gold;addItem(id,1);saveGame();sfx('coin');toast('🛒 Comprou '+IMAP[id].icon+' '+IMAP[id].name,IMAP[id].rarity);renderTab();}
