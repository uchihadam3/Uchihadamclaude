<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>A ADRANJA — Masmorra Mágica</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=MedievalSharp&family=VT323&display=swap" rel="stylesheet" />
<style>
:root{
  --gold:#e8c074; --gold-2:#b8862f; --gold-deep:#7a5418;
  --ember:#ff7a3c; --blood:#c8324a; --magic:#7d6cff; --magic-2:#b39bff;
  --nature:#5fd17a; --ice:#67d8ff; --shadow-c:#a14bff;
  --bg-0:#0a0710; --bg-1:#120a1e; --bg-2:#1c1230;
  --panel:rgba(28,16,46,.82); --panel-2:rgba(40,24,64,.9);
  --line:rgba(232,192,116,.32); --line-soft:rgba(232,192,116,.16);
  --text:#f3e9d8; --dim:#b6a48b; --rare:#67d8ff; --epic:#b07bff;
  --legend:#ffb347; --mythic:#ff5fa8;
  --ok:#5fd17a; --warn:#ffcf5b; --bad:#ff5d6c;
  --shadow:0 14px 50px rgba(0,0,0,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;min-height:100%;color:var(--text);
  font-family:'MedievalSharp',serif;
  background:
    radial-gradient(1200px 800px at 12% -8%, rgba(125,108,255,.20), transparent 60%),
    radial-gradient(1000px 700px at 110% 8%, rgba(255,122,60,.14), transparent 55%),
    radial-gradient(900px 1000px at 50% 120%, rgba(161,75,255,.18), transparent 60%),
    linear-gradient(165deg, var(--bg-0), var(--bg-1) 60%, var(--bg-2));
  background-attachment:fixed; overflow-x:hidden;
}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
  background-image:radial-gradient(rgba(255,255,255,.08) 1px, transparent 1px);
  background-size:42px 42px; animation:drift 60s linear infinite;}
@keyframes drift{to{background-position:420px 420px;}}
.app{max-width:780px;margin:0 auto;padding:10px 10px 28px;min-height:100vh;display:flex;flex-direction:column;}
h1,h2,h3,h4{margin:0;line-height:1.06;font-family:'Cinzel',serif;letter-spacing:.5px;}
.ff-pix{font-family:'VT323',monospace;}
.screen{display:none;flex:1;flex-direction:column;animation:fade .35s ease;}
.screen.active{display:flex;}
@keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
canvas{image-rendering:pixelated;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:var(--gold-deep);border-radius:6px;}
::-webkit-scrollbar-track{background:rgba(0,0,0,.25);}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 18px;border-radius:12px;font-family:'Cinzel',serif;font-weight:700;
  font-size:15px;letter-spacing:.5px;color:#21160a;
  background:linear-gradient(180deg,var(--gold),var(--gold-2));
  border:1px solid #f3dca0; box-shadow:0 6px 0 var(--gold-deep),0 10px 22px rgba(0,0,0,.45);
  transition:transform .08s ease, box-shadow .08s ease; text-shadow:0 1px 0 rgba(255,255,255,.25);}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--gold-deep),0 6px 14px rgba(0,0,0,.4);}
.btn.ghost{background:linear-gradient(180deg,var(--panel-2),var(--panel));color:var(--text);
  border:1px solid var(--line);box-shadow:0 5px 0 rgba(0,0,0,.4);text-shadow:none;}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px;box-shadow:0 4px 0 var(--gold-deep);}
.btn.sm:active{box-shadow:0 1px 0 var(--gold-deep);}
.btn.danger{background:linear-gradient(180deg,#ff7a86,#c8324a);color:#fff;border-color:#ff9aa4;box-shadow:0 6px 0 #7a1322;}
.btn:disabled{filter:grayscale(.7) brightness(.7);cursor:not-allowed;box-shadow:0 3px 0 rgba(0,0,0,.4);}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;
  font-size:12px;background:var(--panel-2);border:1px solid var(--line-soft);font-family:'Cinzel';font-weight:600;}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--shadow);padding:14px;position:relative;}
.panel.parch{background:
  linear-gradient(180deg, rgba(48,30,16,.5), rgba(28,16,46,.85)),
  radial-gradient(120% 80% at 50% 0%, rgba(232,192,116,.08), transparent 60%);
  border:1px solid var(--gold-deep);}
.divider{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:10px 0;}

.home{align-items:center;justify-content:center;text-align:center;gap:14px;}
.logo{font-family:'Cinzel',serif;font-weight:900;font-size:clamp(46px,13vw,92px);line-height:.9;
  text-transform:uppercase;letter-spacing:3px;
  background:linear-gradient(180deg,#fff6df,var(--gold) 45%,var(--gold-2) 70%,var(--ember));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 rgba(0,0,0,.5)) drop-shadow(0 0 22px rgba(232,192,116,.35));}
.logo-sub{font-family:'MedievalSharp';color:var(--magic-2);font-size:clamp(15px,4.4vw,22px);letter-spacing:2px;}
.home-tip{color:var(--dim);font-size:14px;max-width:480px;line-height:1.5;}

.topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.topbar .brand{font-family:'Cinzel';font-weight:900;font-size:18px;letter-spacing:1px;
  background:linear-gradient(180deg,#fff6df,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;}
.res{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;}
.res .chip b{color:var(--gold);}

.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex:0 0 auto;padding:9px 14px;border-radius:11px;font-family:'Cinzel';font-weight:700;font-size:13px;
  background:var(--panel);border:1px solid var(--line-soft);color:var(--dim);white-space:nowrap;display:flex;gap:6px;align-items:center;}
.tab.active{color:#21160a;background:linear-gradient(180deg,var(--gold),var(--gold-2));border-color:#f3dca0;}

.grid{display:grid;gap:10px;}
.grid.c2{grid-template-columns:repeat(2,1fr);}
.grid.c3{grid-template-columns:repeat(3,1fr);}
.grid.auto{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}
.hero-card{background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--line-soft);
  border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;
  position:relative;overflow:hidden;transition:transform .1s,border-color .1s;cursor:pointer;}
.hero-card.sel{border-color:var(--gold);box-shadow:0 0 0 2px rgba(232,192,116,.4),0 8px 22px rgba(0,0,0,.4);}
.hero-card.locked{filter:grayscale(.85) brightness(.55);}
.hero-card .role{font-size:11px;color:var(--dim);font-family:'Cinzel';letter-spacing:.5px;text-transform:uppercase;}
.hero-card .nm{font-family:'Cinzel';font-weight:700;font-size:14px;}
.hero-card canvas{width:74px;height:74px;}
.hero-card .lvl{position:absolute;top:6px;left:6px;font-size:11px;background:rgba(0,0,0,.5);
  padding:2px 7px;border-radius:8px;border:1px solid var(--line-soft);font-family:'Cinzel';}
.rar{position:absolute;top:6px;right:6px;font-size:10px;padding:2px 7px;border-radius:8px;font-family:'Cinzel';font-weight:700;text-transform:uppercase;}
.rar.comum{background:#5a5a5a;color:#fff;} .rar.raro{background:var(--rare);color:#06202b;}
.rar.epico{background:var(--epic);color:#1b0833;} .rar.lendario{background:var(--legend);color:#3a2300;}
.rar.mitico{background:var(--mythic);color:#3a0020;}

.stat-row{display:flex;align-items:center;gap:6px;font-size:12px;margin:2px 0;}
.stat-row .lab{width:36px;color:var(--dim);font-family:'Cinzel';font-weight:600;}
.stat-row .vv{width:34px;text-align:right;color:var(--gold);font-family:'Cinzel';}
.bar{flex:1;height:8px;border-radius:6px;background:rgba(0,0,0,.4);overflow:hidden;border:1px solid var(--line-soft);}
.bar > i{display:block;height:100%;border-radius:6px;}
.hpbar > i{background:linear-gradient(90deg,#ff5d6c,#ff9a6c);}
.xpbar > i{background:linear-gradient(90deg,var(--magic),var(--magic-2));}

.overlay{position:fixed;inset:0;background:rgba(5,2,12,.74);backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;z-index:60;padding:14px;}
.overlay.show{display:flex;animation:fade .2s ease;}
.modal{width:min(540px,96vw);max-height:90vh;overflow:auto;}
.x-close{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:10px;
  background:var(--panel-2);border:1px solid var(--line);font-size:18px;font-family:'Cinzel';z-index:2;}

.dgn-stage{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--gold-deep);
  box-shadow:inset 0 0 60px rgba(0,0,0,.7),var(--shadow);background:#05030a;}
.dgn-stage canvas{display:block;width:100%;height:auto;}
.dgn-hud{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px;}
.floor-badge{font-family:'Cinzel';font-weight:900;font-size:16px;color:var(--gold);}
.log{height:148px;overflow:auto;background:rgba(0,0,0,.35);border:1px solid var(--line-soft);
  border-radius:12px;padding:8px 10px;font-size:13.5px;display:flex;flex-direction:column;gap:3px;}
.log .ln{opacity:0;animation:lnin .3s ease forwards;}
@keyframes lnin{to{opacity:1;}}
.log .ev{color:var(--gold);} .log .cb{color:#ff9a6c;} .log .lt{color:var(--rare);}
.log .sc{color:var(--shadow-c);} .log .dn{color:var(--ok);} .log .bd{color:var(--bad);} .log .sy{color:var(--magic-2);}
.party-mini{display:flex;gap:6px;flex-wrap:wrap;}
.pm{flex:1;min-width:118px;background:var(--panel);border:1px solid var(--line-soft);border-radius:10px;padding:6px 8px;display:flex;gap:8px;align-items:center;}
.pm canvas{width:40px;height:40px;flex:0 0 auto;}
.pm .pn{font-size:12px;font-family:'Cinzel';font-weight:700;}
.pm.dead{filter:grayscale(1) brightness(.5);}
.fct{position:absolute;font-family:'Cinzel';font-weight:900;font-size:18px;pointer-events:none;
  text-shadow:0 2px 0 rgba(0,0,0,.6);animation:fctup 1s ease forwards;z-index:5;}
@keyframes fctup{0%{opacity:0;transform:translateY(6px) scale(.6);}20%{opacity:1;transform:translateY(-2px) scale(1.1);}100%{opacity:0;transform:translateY(-34px) scale(1);}}

.toasts{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:7px;align-items:center;pointer-events:none;}
.toast{background:var(--panel-2);border:1px solid var(--gold);border-radius:12px;padding:9px 14px;font-size:14px;
  box-shadow:var(--shadow);animation:tin .35s ease, tout .4s ease 2.4s forwards;display:flex;gap:9px;align-items:center;}
@keyframes tin{from{opacity:0;transform:translateY(14px) scale(.9);}to{opacity:1;transform:none;}}
@keyframes tout{to{opacity:0;transform:translateY(-8px);}}

.inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:8px;}
.item{position:relative;background:var(--panel-2);border:1px solid var(--line-soft);border-radius:11px;
  padding:7px 4px 5px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;transition:transform .08s;}
.item:active{transform:scale(.94);}
.item .ico{font-size:24px;line-height:1;}
.item .qn{position:absolute;bottom:3px;right:5px;font-size:11px;font-family:'Cinzel';color:var(--gold);}
.item .tn{font-size:10px;color:var(--dim);text-align:center;line-height:1.05;}
.b-comum{border-color:#5a5a5a;}
.b-raro{border-color:var(--rare);box-shadow:0 0 10px rgba(103,216,255,.25);}
.b-epico{border-color:var(--epic);box-shadow:0 0 10px rgba(176,123,255,.3);}
.b-lendario{border-color:var(--legend);box-shadow:0 0 12px rgba(255,179,71,.4);}
.b-mitico{border-color:var(--mythic);box-shadow:0 0 14px rgba(255,95,168,.45);}
.b-secreto{border-color:var(--shadow-c);box-shadow:0 0 14px rgba(161,75,255,.5);}

.slotline{display:flex;gap:8px;align-items:center;padding:7px;border-radius:10px;background:rgba(0,0,0,.22);border:1px solid var(--line-soft);}
.slotline .sl-ico{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:22px;background:rgba(0,0,0,.3);border:1px solid var(--line-soft);}
.slotline .sl-n{flex:1;font-size:13px;}

.muted{color:var(--dim);} .center{text-align:center;}
.small{font-size:12.5px;} .tiny{font-size:11px;}
.row{display:flex;gap:8px;align-items:center;} .wrap{flex-wrap:wrap;} .between{justify-content:space-between;}
.col{display:flex;flex-direction:column;gap:8px;}
.mt{margin-top:10px;} .mt6{margin-top:6px;} .mb{margin-bottom:10px;}
.tag-secret{color:var(--shadow-c);font-family:'Cinzel';font-weight:700;}
.bossbar{height:14px;border-radius:8px;background:rgba(0,0,0,.5);border:1px solid var(--blood);overflow:hidden;}
.bossbar>i{display:block;height:100%;background:linear-gradient(90deg,#c8324a,#ff7a3c);}
.flash{animation:flash .4s ease;} @keyframes flash{0%,100%{filter:none;}50%{filter:brightness(2);}}
.shake{animation:shake .3s ease;} @keyframes shake{0%,100%{transform:none;}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}
.progress{height:10px;border-radius:6px;background:rgba(0,0,0,.4);overflow:hidden;border:1px solid var(--line-soft);}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-2),var(--gold));transition:width .3s;}
.lab-sm{font-size:11px;color:var(--dim);font-family:'Cinzel';text-transform:uppercase;letter-spacing:.5px;}
.kvs{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13px;}
.kvs b{color:var(--gold);font-weight:600;text-align:right;}

/* --- partículas / juice --- */
.pt{position:absolute;width:5px;height:5px;border-radius:50%;pointer-events:none;z-index:6;
  box-shadow:0 0 6px currentColor;animation:ptfly .7s ease-out forwards;}
@keyframes ptfly{0%{opacity:1;transform:translate(0,0) scale(1.2);}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3);}}
.dgn-stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:4;
  box-shadow:inset 0 0 70px rgba(0,0,0,.85), inset 0 0 26px rgba(0,0,0,.5);border-radius:14px;}
#lootFx{position:fixed;inset:0;pointer-events:none;z-index:75;display:flex;align-items:center;justify-content:center;}
.lb-ring{position:absolute;width:40px;height:40px;border-radius:50%;border:3px solid #fff;animation:lbring .6s ease-out forwards;}
@keyframes lbring{0%{opacity:.9;transform:scale(.2);}100%{opacity:0;transform:scale(7);}}
.lb-spark{position:absolute;width:7px;height:7px;border-radius:50%;box-shadow:0 0 10px currentColor;animation:lbspark .8s ease-out forwards;}
@keyframes lbspark{0%{opacity:1;transform:translate(0,0) scale(1.4);}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.2);}}
.boss-card{position:absolute;left:0;right:0;top:40%;text-align:center;z-index:8;pointer-events:none;animation:bcard 2.6s ease forwards;}
.boss-card .bc-n{font-family:'Cinzel';font-weight:900;font-size:26px;color:#ff7a3c;text-shadow:0 0 16px rgba(255,80,40,.7),0 3px 0 rgba(0,0,0,.6);letter-spacing:1px;}
.boss-card.secret .bc-n{color:#c98bff;text-shadow:0 0 18px rgba(161,75,255,.8);}
.boss-card .bc-i{font-size:12px;color:#f3e9d8;font-style:italic;margin-top:4px;}
@keyframes bcard{0%{opacity:0;transform:scale(.7);}12%{opacity:1;transform:scale(1);}80%{opacity:1;}100%{opacity:0;transform:scale(1.05);}}
.tide-chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;
  font-family:'Cinzel';font-weight:600;background:rgba(125,108,255,.18);border:1px solid var(--magic);color:var(--magic-2);}
.combo-badge{font-family:'Cinzel';font-weight:900;font-size:13px;color:var(--ember);text-shadow:0 0 10px rgba(255,122,60,.6);}
.audio-btn{width:38px;height:38px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);font-size:17px;display:flex;align-items:center;justify-content:center;}
.vol-row{display:flex;align-items:center;gap:8px;margin:8px 0;}
.vol-row input[type=range]{flex:1;accent-color:var(--gold);}
.reward-pop{animation:rpop .5s ease;}
@keyframes rpop{0%{transform:scale(.6);opacity:0;}60%{transform:scale(1.15);}100%{transform:scale(1);opacity:1;}}
.recipe{display:flex;gap:10px;align-items:center;padding:9px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line-soft);}
.recipe .rico{font-size:28px;}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toasts" id="toasts"></div>
<div class="overlay" id="overlay"><div class="panel parch modal" id="modal"></div></div>
<script>
/* ============================================================================
   A ADRANJA — Masmorra Mágica   ·   roguelike de exploração automática
   Arquivo único, tudo procedural. Arte pixel desenhada em canvas.
   ============================================================================ */
"use strict";

/* ====================== UTILIDADES ====================== */
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
const APP=$('#app');
const TAU=Math.PI*2;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=arr=>arr[Math.floor(Math.random()*arr.length)];
const chance=p=>Math.random()<p;
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const fmt=n=>{n=Math.round(n);return n>=1000?(n/1000).toFixed(n>=10000?0:1).replace('.0','')+'k':''+n;};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function weighted(map){ // map: {key:weight}
  let t=0;for(const k in map)t+=map[k];let r=Math.random()*t;
  for(const k in map){r-=map[k];if(r<=0)return k;}return Object.keys(map)[0];
}
const RARS=['comum','raro','epico','lendario','mitico','secreto'];
const RAR_NAME={comum:'Comum',raro:'Raro',epico:'Épico',lendario:'Lendário',mitico:'Mítico',secreto:'Secreto'};
const RAR_COLOR={comum:'#cfcfcf',raro:'#67d8ff',epico:'#b07bff',lendario:'#ffb347',mitico:'#ff5fa8',secreto:'#a14bff'};

/* ====================== ÁUDIO — tudo procedural (Web Audio API) ======================
   Trilhas geradas a partir de progressões de acordes + SFX sintetizados. */
function mtof(m){return 440*Math.pow(2,(m-69)/12);}
const SCALES={maior:[0,2,4,5,7,9,11],menor:[0,2,3,5,7,8,10],dorica:[0,2,3,5,7,9,10],frigia:[0,1,3,5,7,8,10]};
function buildScale(root,mode){const iv=SCALES[mode]||SCALES.menor;const out=[];for(let o=0;o<3;o++)for(let i=0;i<7;i++)out.push(root+o*12+iv[i]);return out;}
function buildTrack(def){
  const sc=buildScale(def.root,def.mode);const bars=def.prog.length,len=16*bars;
  const bass=new Array(len).fill(null),arp=new Array(len).fill(null),lead=new Array(len).fill(null),pad=new Array(bars);
  const drum=new Array(len).fill(null);
  const motif=def.motif||[0,2,4,2,3,1,0,-1];
  for(let b=0;b<bars;b++){
    const deg=def.prog[b];
    const chord=[sc[deg],sc[deg+2],sc[deg+4]];
    pad[b]=chord;
    for(let s=0;s<16;s++){
      const gi=b*16+s;
      // baixo
      if(s===0||s===8||(def.style==='drive'&&(s===4||s===12)))bass[gi]=chord[0]-12;
      // arpejo
      const every=def.style==='calm'?4:(def.style==='drive'?2:2);
      if(s%every===0)arp[gi]=chord[(s/every)%3]+12;
      // lead esparso
      if(def.leadOn&&((s===2||s===10||(s===6&&b%2===1)))){const mi=motif[(b*3+(s>>2))%motif.length];lead[gi]=sc[((deg+mi)%14+14)%14]+12;}
      // bateria
      if(def.drums){
        if(s===0||s===8)drum[gi]='k';
        else if(s===4||s===12)drum[gi]='s';
        if(def.style==='drive'&&s%2===0)drum[gi]=drum[gi]||'h';
        if(def.style==='boss'&&(s===0||s===6||s===8||s===14))drum[gi]='k';
      }
    }
  }

  tone(t,freq,dur,o={}){if(!this.ctx)return;const c=this.ctx;const osc=c.createOscillator();const g=c.createGain();

    g.gain.setValueAtTime(peak,t+Math.max(a,dur-r));g.gain.exponentialRampToValueAtTime(0.0001,t+dur);

/* ====================== MOTOR DE PIXEL ART ======================
   Sprites são grades de caracteres. Cada char vira uma cor da paleta.
   '.' = transparente. Desenhamos numa canvas e escalamos com pixelated. */
function spriteCanvas(grid,pal,scale=4,opts={}){
  const h=grid.length,w=grid[0].length;
  const cv=document.createElement('canvas');
  cv.width=w*scale;cv.height=h*scale;
  const ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const c=grid[y][x];if(c==='.'||c===' ')continue;
    const col=pal[c];if(!col)continue;
    ctx.fillStyle=col;ctx.fillRect(x*scale,y*scale,scale,scale);
  }
  if(opts.outline){ // contorno escuro simples
    ctx.globalCompositeOperation='destination-over';
  }
  return cv;
}
// renderiza grade dentro de um ctx já existente (para cenas)
function blitGrid(ctx,grid,pal,ox,oy,scale){
  for(let y=0;y<grid.length;y++)for(let x=0;x<grid[0].length;x++){
    const c=grid[y][x];if(c==='.'||c===' ')continue;const col=pal[c];if(!col)continue;
    ctx.fillStyle=col;ctx.fillRect(ox+x*scale,oy+y*scale,scale,scale);
  }
}

function heroSprite(hero,scale=5){
  const key=hero.id+'@'+scale;
  if(_spriteCache[key])return _spriteCache[key];
  const cv=document.createElement('canvas');
  cv.width=16*scale;cv.height=16*scale;
  const ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
  const layers=[BASE, HEADS[hero.head]||[], WEAPONS[hero.weapon]||[]];

}

/* ---- gerador de chefes para QUALQUER andar múltiplo de 5 (até 100+) ---- */
const DEEP_BOSS_NAMES=['Carcereiro Eterno','Devorador de Andares','Colosso Rúnico','Tirano Espectral','Behemoth Cristalino','Sentinela Proibida','Pesadelo Vivo','Leviatã do Abismo','Algoz das Profundezas','Verdugo de Pedra'];
function getBossForFloor(floor){
  const named=BOSSES.find(b=>b.floor===floor&&!b.secret);
  if(named)return named;
  if(floor%5!==0)return null;
  const tmpls=BOSSES.filter(b=>!b.secret&&b.floor<floor);
  const tmpl=tmpls[(Math.floor(floor/5))%tmpls.length]||BMAP.guardiao;
  const nm=DEEP_BOSS_NAMES[(Math.floor(floor/5))%DEEP_BOSS_NAMES.length];
  // base escalada para o andar (chefe sente como ~3x um inimigo normal do andar)
  const k=floor;
  return {id:'lord_'+floor,name:nm+' · Andar '+floor,family:tmpl.family,el:tmpl.el,floor,proc:true,
    base:{hp:Math.round(260+k*k*5.2+k*60), atk:Math.round(16+k*2.2+k*k*0.05), def:Math.round(10+k*1.0+k*k*0.012), spd:Math.round(8+k*0.14)},
    grid:tmpl.grid,pal:tmpl.pal,skills:['esmagar','tremor'],
    intro:'Um senhor das profundezas barra o caminho. A Adranja não quer que você desça mais.'};
}

const SAVE_KEY='adranja_save_v1';
const G={meta:null,run:null,timers:[]};
let RUN=null;
let _sceneRAF=null;
function rtimeout(fn,ms){const id=setTimeout(()=>{if(RUN&&!RUN.paused)fn();else if(RUN){ // re-agenda se pausado
  const again=()=>{if(!RUN)return;if(RUN.paused)setTimeout(again,120);else fn();};setTimeout(again,120);} },ms/(RUN?RUN.speed:1));return id;}

function defaultMeta(){
  const heroes={};
  HEROES.forEach(h=>{heroes[h.id]={unlocked:!!h.start,maxLevelEver:1,equip:{arma:null,armadura:null,acessorio:null}};});
  return{
    version:1, essence:0, gold:0, deepestFloor:0, runs:0, totalKills:0,
    tamedCount:0, craftedCount:0, bossesKilled:[], bestiaryKills:{}, eliteKills:0,
    heroes, inventory:{}, party:['cartografo','guerreiro','cleriga'],
    research:{}, researchActive:null, // {id,end}
    codex:{bestiary:[],items:[],secrets:[],bosses:[]},
    flags:{}, mapKnowledge:{}, // floorN -> familiaridade 0..1
    slots:3, relics:[], seenIntro:false
  };
}
function loadGame(){
  try{const raw=localStorage.getItem(SAVE_KEY);if(raw){G.meta=JSON.parse(raw);
    // merge p/ heróis novos em saves antigos
    HEROES.forEach(h=>{if(!G.meta.heroes[h.id])G.meta.heroes[h.id]={unlocked:!!h.start,maxLevelEver:1,equip:{arma:null,armadura:null,acessorio:null}};});
    if(!G.meta.codex)G.meta.codex={bestiary:[],items:[],secrets:[],bosses:[]};
    return true;}
  }catch(e){console.warn('save corrompido',e);}
  G.meta=defaultMeta();return false;
}
let _saveT=null;
function saveGame(){clearTimeout(_saveT);_saveT=setTimeout(()=>{
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(G.meta));}catch(e){}
},200);}
function hardReset(){localStorage.removeItem(SAVE_KEY);G.meta=defaultMeta();saveGame();}

// inventário
function invQty(id){return G.meta.inventory[id]||0;}
function addItem(id,n=1){G.meta.inventory[id]=(G.meta.inventory[id]||0)+n;discover('items',id);saveGame();}
function removeItem(id,n=1){G.meta.inventory[id]=Math.max(0,(G.meta.inventory[id]||0)-n);if(G.meta.inventory[id]===0)delete G.meta.inventory[id];saveGame();}
function canAfford(cost){for(const k in cost)if(invQty(k)<cost[k])return false;return true;}
function payCost(cost){for(const k in cost)removeItem(k,cost[k]);}
// códex
function discover(cat,id){const arr=G.meta.codex[cat];if(arr&&!arr.includes(id)){arr.push(id);saveGame();checkUnlocks();return true;}return false;}
function hasResearch(id){return id?!!G.meta.research[id]:true;}
// essência
function addEssence(n){let mult=1;if(G.meta.research.meta_essence)mult+=.3;if(G.meta.relics.includes('lampada_eterna'))mult*=2;
  n=Math.round(n*mult);G.meta.essence+=n;saveGame();return n;}

/* ---- DESBLOQUEIOS ---- */
function condMet(h){const u=h.unlock;if(!u)return true;const m=G.meta;
  switch(u.type){
    case 'floor':return m.deepestFloor>=u.v;
    case 'kills':return m.totalKills>=u.v;
    case 'craft':return m.craftedCount>=u.v;
    case 'tame':return m.tamedCount>=u.v;
    case 'boss':return m.bossesKilled.includes(u.v);
    case 'codex':return m.codex.secrets.length>=5;
    case 'item':return m.codex.items.includes(u.v)||invQty(u.v)>0;
    case 'secret':return !!m.flags[u.v];
    case 'essence':return !!m.flags['bought_'+h.id]; // comprado no Santuário
    default:return false;
  }
}
function checkUnlocks(){let changed=false;
  HEROES.forEach(h=>{const st=G.meta.heroes[h.id];
    if(!st.unlocked && h.unlock && h.unlock.type!=='essence' && condMet(h)){
      st.unlocked=true;changed=true;sfx('unlock');toast('🔓 '+h.icon+' '+h.name+' juntou-se ao acampamento!','lendario');
    }});
  if(changed)saveGame();
  return changed;
}

/* stats efetivos de um herói num dado nível (com equipamento + pesquisas) */
function heroStats(heroId,level){
  const h=HMAP[heroId],st=G.meta.heroes[heroId];
  const s={};['hp','atk','def','mag','spd','lck'].forEach(k=>{
    s[k]=h.base[k]+(h.growth[k]||0)*(level-1);
  });
  // equipamento
  EQUIP_SLOTS.forEach(sl=>{const it=st.equip[sl];if(it&&IMAP[it]&&IMAP[it].stats){
    for(const k in IMAP[it].stats)s[k]+=IMAP[it].stats[k];}});
  // pesquisas meta
  if(G.meta.research.meta_hp)s.hp*=1.15;
  for(const k in s)s[k]=Math.round(s[k]);
  s.maxhp=s.hp;return s;
}
// skills permanentemente conhecidas até certo nível
function knownSkills(heroId,uptoLevel){
  const h=HMAP[heroId];return h.skills.filter(sk=>sk.lvl<=uptoLevel);
}
function heroMaxLevel(heroId){return G.meta.heroes[heroId].maxLevelEver;}
// XP necessária p/ subir do nível L -> L+1
function xpForLevel(L){return Math.floor(18+L*L*6+L*12);}

function drawHomeArt(){
  const cv=$('#homeArt');if(!cv)return;const ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
  const W=cv.width,H=cv.height;
  // céu/caverna
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1a0e2e');g.addColorStop(1,'#0a0610');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // estrelas
  for(let i=0;i<40;i++){ctx.fillStyle='rgba(255,255,255,'+(0.2+Math.random()*0.5)+')';ctx.fillRect((i*53)%W,(i*29)%(H*0.6),2,2);}
  // chão
  ctx.fillStyle='#2a1a18';ctx.fillRect(0,H-34,W,34);
  ctx.fillStyle='#1a1010';for(let x=0;x<W;x+=18)ctx.fillRect(x,H-34,2,34);
  // arco de pedra
  ctx.fillStyle='#3a3040';
  ctx.fillRect(W/2-58,H-150,116,120);
  ctx.fillStyle='#0a0610';ctx.fillRect(W/2-40,H-130,80,100);
  // portal mágico
  const pg=ctx.createRadialGradient(W/2,H-80,4,W/2,H-80,46);
  pg.addColorStop(0,'#d6b0ff');pg.addColorStop(.5,'#7d4bff');pg.addColorStop(1,'rgba(40,16,80,0)');
  ctx.fillStyle=pg;ctx.fillRect(W/2-46,H-130,92,100);
  // tijolos do arco
  ctx.strokeStyle='#241a30';ctx.lineWidth=2;
  for(let y=H-150;y<H-30;y+=14){ctx.beginPath();ctx.moveTo(W/2-58,y);ctx.lineTo(W/2-40,y);ctx.moveTo(W/2+40,y);ctx.lineTo(W/2+58,y);ctx.stroke();}
  // tochas
  [W/2-66,W/2+62].forEach(tx=>{ctx.fillStyle='#5a4a3a';ctx.fillRect(tx,H-96,4,28);
    const fg=ctx.createRadialGradient(tx+2,H-100,1,tx+2,H-100,12);fg.addColorStop(0,'#ffd166');fg.addColorStop(1,'rgba(255,122,60,0)');
    ctx.fillStyle=fg;ctx.fillRect(tx-10,H-114,24,24);});
  // 3 heróis (silhuetas com sprites)
  const party=G.meta.party.slice(0,3);
  party.forEach((id,i)=>{const h=HMAP[id];if(!h)return;const sp=heroSprite(h,3);
    const px=W/2-48+i*40, py=H-72;
    ctx.save();ctx.globalAlpha=.96;ctx.drawImage(sp,px,py);ctx.restore();
    // sombra
    ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(px+8,py+48,32,4);
  });
}

function rosterCard(h){

function mountSprites(){$$('[data-sprite]').forEach(el=>{const id=el.getAttribute('data-sprite');const h=HMAP[id];if(h)mountCanvas(el,heroSprite(h,5));});}
function togglePartyMember(id){
  const p=G.meta.party;const i=p.indexOf(id);

  else{if(p.length>=G.meta.slots){toast('Equipe cheia! Remova alguém ou pesquise mais espaço.','warn');return;}p.push(id);}

function essenceBuyBtn(h){const cost=h.unlock.v;const reqF=h.unlock.reqFloor||0;const floorOk=G.meta.deepestFloor>=reqF;

function skKindLabel(sk){return {phys:'Dano físico',mag:'Dano mágico',heal:'Cura',buff:'Suporte'}[sk.kind]||'';}
function slotIcon(sl){return {arma:'🗡️',armadura:'👕',acessorio:'💍'}[sl];}

/* quantos heróis (exceto um) estão usando esse item neste slot */
function equippedByOthers(itemId,slot,exceptHeroId){
  return Object.keys(G.meta.heroes).filter(hid=>G.meta.heroes[hid].unlocked && hid!==exceptHeroId && G.meta.heroes[hid].equip[slot]===itemId);
}
/* escolher equipamento para um slot — itens equipados em OUTROS heróis ficam bloqueados */
function pickEquip(heroId,slot){
  const owned=Object.keys(G.meta.inventory).map(id=>IMAP[id]).filter(it=>it&&it.slot===slot&&invQty(it.id)>0);
  const st=G.meta.heroes[heroId];const cur=st.equip[slot];
  const list=owned.map(it=>{
    const others=equippedByOthers(it.id,slot,heroId);
    const isCur=cur===it.id;
    const freeForThis=invQty(it.id)-others.length; // cópias não usadas por outros (inclui a deste herói)
    let right, note='';
    if(others.length) note=`<br><span class="tiny" style="color:var(--bad)">🔒 equipado em ${others.map(h=>HMAP[h].name.split(',')[0]).join(', ')}</span>`;
    if(isCur){ right=`<span class="chip" style="color:var(--gold)">✔ equipado aqui</span>`; }
    else if(freeForThis>0){ right=`<button class="btn sm" onclick="doEquip('${heroId}','${slot}','${it.id}')">Equipar${invQty(it.id)>1?` <span class="tiny">(${freeForThis} livre${freeForThis>1?'s':''})</span>`:''}</button>`; }
    else { right=`<button class="btn sm" disabled>indisponível</button>`; }
    return `<div class="slotline b-${it.rarity}">
      <div class="sl-ico">${it.icon}</div>
      <div class="sl-n"><b>${it.name}</b> ${rarPill(it.rarity)}<br><span class="tiny" style="color:var(--gold)">${statsStr(it.stats)}</span>${note}</div>
      ${right}</div>`;
  }).join('')||'<p class="muted small">Nenhum equipamento deste tipo. Encontre na Adranja ou crie na Forja.</p>';
  openModal(`<h3>${slotIcon(slot)} Equipar ${cap(slot)}</h3>
    <p class="tiny muted mt6">Cada cópia de um item só pode estar em um herói. Desequipe para liberar.</p>
    ${cur?`<button class="btn ghost sm mt6" onclick="doEquip('${heroId}','${slot}',null)">Desequipar atual</button>`:''}
    <div class="col mt">${list}</div>`);
}
function statsStr(st){if(!st)return '';return Object.keys(st).map(k=>`+${st[k]} ${k.toUpperCase()}`).join('  ');}
function doEquip(heroId,slot,itemId){
  const st=G.meta.heroes[heroId];
  if(itemId){ // só equipa se houver uma cópia livre (não rouba de outro herói)
    const others=equippedByOthers(itemId,slot,heroId);
    if(invQty(itemId)-others.length<=0){ toast('Esse item já está equipado em outro herói.','warn'); return; }
  }
  st.equip[slot]=itemId;saveGame();closeModal();openHero(heroId);
}

/* ---- TAB EQUIPAR / INVENTÁRIO ---- */
function tabEquip(b){
  const groups=[['arma','🗡️ Armas'],['armadura','🛡️ Armaduras'],['acessorio','💍 Acessórios'],['consumivel','🧪 Consumíveis'],['mat','🧱 Materiais'],['key','🗝️ Relíquias & Chaves']];
  const itemsByGroup=g=>Object.keys(G.meta.inventory).map(id=>IMAP[id]).filter(it=>{
    if(!it)return false;
    if(g==='key')return it.type==='chave'||it.type==='relíquia';
    return it.type===g||it.slot===g;
  });
  let html='';
  groups.forEach(([g,lab])=>{const items=itemsByGroup(g);if(items.length===0)return;
    html+=`<h4 class="mt">${lab}</h4><div class="inv-grid mt6">${items.map(it=>itemCell(it)).join('')}</div>`;
  });
  if(!html)html='<p class="muted small">Inventário vazio. Tudo que seus heróis pegarem na Adranja aparece aqui — para sempre.</p>';
  b.innerHTML=`<div class="panel parch mb"><h3>🎒 Acervo do Acampamento</h3>
     <p class="muted small mt6">Itens recuperados da masmorra ficam guardados mesmo após a morte. Toque para ver detalhes.</p></div>
     <div class="panel">${html}</div>`;
}
function itemCell(it){return `<div class="item ${'b-'+it.rarity}" onclick="openItem('${it.id}')">
  <div class="ico">${it.icon}</div><div class="tn">${it.name}</div><span class="qn">${invQty(it.id)}</span></div>`;}
function openItem(id){const it=IMAP[id];
  openModal(`<div class="center"><div style="font-size:48px">${it.icon}</div>
    <h3 ${it.secret?'class="tag-secret"':''}>${it.name}</h3>${rarPill(it.rarity)}
    <p class="small mt">${it.desc||typeDesc(it)}</p>
    ${it.stats?`<p class="small" style="color:var(--gold)">${statsStr(it.stats)}</p>`:''}
    <p class="muted tiny mt">Quantidade: ${invQty(id)}</p>
    ${it.id==='lampada_eterna'&&!G.meta.relics.includes('lampada_eterna')?`<button class="btn mt" onclick="useRelic('lampada_eterna')">Ativar Relíquia</button>`:''}
    </div>`);}
function typeDesc(it){return {arma:'Arma equipável.',armadura:'Armadura equipável.',acessorio:'Acessório equipável.',mat:'Material de criação usado na Forja.',consumivel:'Usado automaticamente em combate.',chave:'Item misterioso...'}[it.type]||'';}
function useRelic(id){if(!G.meta.relics.includes(id)){G.meta.relics.push(id);saveGame();toast('🏮 Relíquia ativada!','mitico');closeModal();renderCamp();}}

/* ---- TAB BIBLIOTECA (pesquisa) ---- */
function tabLibrary(b){
  const act=G.meta.researchActive;
  let actHtml='';
  if(act){const r=RMAP[act.id];const total=r.time*1000;const left=Math.max(0,act.end-Date.now());
    const pct=clamp((1-left/total)*100,0,100);
    actHtml=`<div class="panel" style="border-color:var(--magic)">
      <b style="color:var(--magic-2)">⏳ Pesquisando: ${r.name}</b>
      <div class="progress mt6"><i style="width:${pct}%"></i></div>
      <div class="row between mt6"><span class="tiny muted">${Math.ceil(left/1000)}s restantes</span>
      <button class="btn ghost sm" onclick="rushResearch()">Acelerar (💠 ${rushCost()})</button></div></div>`;}
  const card=r=>{const done=!!G.meta.research[r.id];const reqOk=hasResearch(r.req);const busy=!!act;
    const can=!done&&reqOk&&!busy&&G.meta.essence>=r.cost;
    return `<div class="recipe" style="${done?'border-color:var(--ok)':''}">
      <div class="rico">${done?'✅':(reqOk?'📜':'🔒')}</div>
      <div style="flex:1"><b>${r.name}</b> ${done?'<span class="chip" style="color:var(--ok)">concluída</span>':`<span class="chip">💠 ${r.cost}</span> <span class="chip">⏱️ ${r.time}s</span>`}<br>
        <span class="tiny">${r.desc}</span>${r.req&&!reqOk?`<br><span class="tiny muted">requer: ${RMAP[r.req].name}</span>`:''}</div>
      ${done?'':`<button class="btn sm" ${can?'':'disabled'} onclick="startResearch('${r.id}')">Pesquisar</button>`}</div>`;};

  G.meta.runs++;saveGame();
  initRun(party,tides);
  CUR.screen='dungeon';renderDungeon();
  RUN.speed=1;music('explore');
  setTimeout(()=>stepBegin(),700);
}
function initRun(party,tides){
  RUN={
    party:party.map(buildCombatant),
    floor:1, room:0, roomsTotal:0, kills:0, gold:0, essence:0, combo:0,
    log:[], scene:{mode:'idle',enemies:[],walk:0,shake:0,flashEnemy:-1},
    passive:{}, alive:true, paused:false, speed:1, fxNodes:[],
    tides:tides||[], tideGold:1, tideTreasure:1, tideEnemyHp:1, tideEssence:1, tideHp:1, tideEvent:1, tideNoRest:0,
    pendingBoss:null, keysThisRun:[], retreated:false, encounters:[]
  };
  computePartyPassives();
  (tides||[]).forEach(t=>t.apply(RUN));
  RUN.party.forEach(c=>applyPassiveStart(c));
}
function buildCombatant(id){
  const h=HMAP[id];const level=1;const s=heroStats(id,level);
  return {id,h,level,xp:0,maxhp:s.maxhp,hp:s.maxhp,st:s,alive:true,
    skills:knownSkills(id,Math.max(level,heroMaxLevel(id))), // já sabe permanentes
    fx:{}, summons:[], anim:{x:0,hit:0}};
}
function computePartyPassives(){
  const p={};
  RUN.party.forEach(c=>{const t=c.h.passive.tags||{};for(const k in t){
    if(typeof t[k]==='number')p[k]=(p[k]||0)+t[k];else p[k]=t[k];
  }});
  // oferendas e pesquisas
  if(G.meta.flags.off_dmg)p.partyAtk=(p.partyAtk||0)+0.1;
  RUN.passive=p;
}
function applyPassiveStart(c){
  // bônus de stats por passivas de grupo
  const p=RUN.passive;
  if(p.partyAtk)c.st.atk=Math.round(c.st.atk*(1+p.partyAtk));
  if(p.partyDef)c.st.def=Math.round(c.st.def*(1+p.partyDef));
  if(p.partySpd)c.st.spd=Math.round(c.st.spd*(1+p.partySpd));
  if(G.meta.flags.off_heal){c.maxhp=Math.round(c.maxhp*1.1);}
  if(RUN.tideHp&&RUN.tideHp!==1){c.maxhp=Math.round(c.maxhp*RUN.tideHp);}
  c.hp=c.maxhp;c.st.maxhp=c.maxhp;
}

  {name:'Cripta',brick:'#3a2a44',brick2:'#2a1d34',floor:'#241830',torch:'#ffb347',tint:'rgba(125,108,255,.05)'},
  {name:'Cavernas de Gelo',brick:'#2a3a3a',brick2:'#1d2a2a',floor:'#16221f',torch:'#67d8ff',tint:'rgba(103,216,255,.06)'},
  {name:'Forjas de Lava',brick:'#3a2a22',brick2:'#2a1d16',floor:'#221610',torch:'#ff7a3c',tint:'rgba(255,122,60,.08)'},
  {name:'Bosque Profano',brick:'#22302a',brick2:'#16221c',floor:'#10180f',torch:'#5fd17a',tint:'rgba(95,209,122,.06)'},
  {name:'Salões Reais',brick:'#3a3020',brick2:'#2a2214',floor:'#1c1608',torch:'#ffd166',tint:'rgba(232,192,116,.08)'},
  {name:'Catacumbas',brick:'#2a2630',brick2:'#1a1620',floor:'#100c16',torch:'#b39bff',tint:'rgba(125,108,255,.07)'},
  {name:'Abismo Carmesim',brick:'#3a1a22',brick2:'#2a1016',floor:'#1c0a10',torch:'#ff5d6c',tint:'rgba(200,50,74,.09)'},
  {name:'O Vazio',brick:'#1a1030',brick2:'#100a20',floor:'#0c0818',torch:'#a14bff',tint:'rgba(161,75,255,.12)'},
];
const FLOOR_BAND_NAMES=['Cripta','Cavernas de Gelo','Forjas de Lava','Bosque Profano','Salões Reais','Catacumbas','Abismo Carmesim','O Vazio'];
function floorBandIndex(f){return Math.floor((f-1)/5)%FLOOR_BANDS.length;}  // novo cenário a cada 5 andares
function floorTheme(f){const b=FLOOR_BANDS[floorBandIndex(f)];b.deco=['crypt','ice','lava','forest','royal','catacomb','crimson','void'][floorBandIndex(f)];return b;}
function startSceneLoop(){
  if(_sceneRAF)cancelAnimationFrame(_sceneRAF);
  const cv=$('#scene');if(!cv)return;const ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
  let t=0;
  function frame(){
    t++;const sc=RUN&&RUN.scene;if(!RUN){return;}
    // só desenha quando a incursão está visível (economiza CPU no acampamento)
    if(CUR.screen!=='dungeon'||!cv.isConnected){ _sceneRAF=requestAnimationFrame(frame); return; }
    if(!RUN.paused&&sc.mode==='walk')sc.walk+=1.6*RUN.speed;
    drawScene(ctx,cv,t);
    _sceneRAF=requestAnimationFrame(frame);
  }
  frame();
}
function drawScene(ctx,cv,t){
  const W=cv.width,H=cv.height,th=floorTheme(RUN.floor),sc=RUN.scene;
  const shake=sc.shake>0?(Math.random()*2-1)*sc.shake:0;if(sc.shake>0)sc.shake*=0.85;
  ctx.save();ctx.translate(shake,0);
  // fundo
  ctx.fillStyle=th.brick2;ctx.fillRect(0,0,W,H);
  // tijolos parallax
  const off=(sc.walk%32);
  ctx.fillStyle=th.brick;
  for(let y=-1;y<5;y++)for(let x=-1;x<W/32+2;x++){
    const bx=x*32-off+((y%2)?16:0);ctx.fillRect(bx,y*22,30,20);
  }
  ctx.fillStyle='rgba(0,0,0,.25)';for(let y=0;y<5;y++)ctx.fillRect(0,y*22+20,W,2);
  // tochas
  for(let i=0;i<4;i++){const tx=((i*120)-(sc.walk*0.6)%480+480)%480-30;
    if(tx>-20&&tx<W){ctx.fillStyle='#3a2a1a';ctx.fillRect(tx,40,3,14);
      const fl=6+Math.sin(t*0.3+i)*2;const fg=ctx.createRadialGradient(tx+1,40,1,tx+1,40,fl+10);
      fg.addColorStop(0,th.torch);fg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=fg;ctx.fillRect(tx-14,26,30,30);}}
  // chão
  ctx.fillStyle=th.floor;ctx.fillRect(0,H-46,W,46);
  ctx.fillStyle='rgba(0,0,0,.3)';for(let x=-off;x<W;x+=32)ctx.fillRect(x,H-46,2,46);
  drawRegionDecor(ctx,W,H,th,t,sc.walk);
  ctx.fillStyle=th.tint;ctx.fillRect(0,0,W,H);
  // poeira/partículas do vazio em andares fundos
  if(RUN.floor>=13){for(let i=0;i<14;i++){ctx.fillStyle='rgba(161,75,255,'+(0.1+((i*7)%5)/12)+')';
    ctx.fillRect((i*53-t*0.5)%W+(i%2?0:W),(i*31+t*0.3)%H,2,2);}}

  const groundY=H-58;
  // HERÓIS (esquerda)
  const aliveParty=RUN.party.filter(c=>c.alive);
  RUN.party.forEach((c,i)=>{
    const sp=heroSprite(c.h,4);const baseX=24+i*30;
    let x=baseX, y=groundY-(sc.mode==='walk'?Math.abs(Math.sin(t*0.2+i))*3:0);
    if(c.anim.hit>0){x+=18*c.anim.hit;c.anim.hit*=0.8;if(c.anim.hit<0.05)c.anim.hit=0;}
    ctx.globalAlpha=c.alive?1:0.25;
    if(!c.alive){ctx.save();ctx.translate(x+32,y+48);ctx.rotate(Math.PI/2);ctx.drawImage(sp,-24,-24);ctx.restore();}
    else ctx.drawImage(sp,x,y);
    ctx.globalAlpha=1;
    ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(x+6,y+62,52,4);
  });
  // INIMIGOS (direita)
  sc.enemies.forEach((en,i)=>{
    if(en.dead)return;
    const grid=en.boss?en.m.grid:en.m.grid;const scl=en.boss?6:4;
    const sp=spriteCanvas(grid,en.m.pal,scl);
    let bx=en.boss?W-110:(W-70-i*36), by=groundY-(en.boss?28:0);
    if(en.hit>0){bx+=14*en.hit;en.hit*=0.78;if(en.hit<0.05)en.hit=0;}
    ctx.globalAlpha=en.flash>0?0.4:1;if(en.flash>0)en.flash*=0.8;
    ctx.save();ctx.scale(-1,1);ctx.drawImage(sp,-bx-sp.width,by);ctx.restore();
    ctx.globalAlpha=1;
    ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(bx,by+sp.height,sp.width,4);
    // barra de vida do inimigo
    if(!en.boss){const bw=34;ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(bx,by-7,bw,4);
      ctx.fillStyle='#ff5d6c';ctx.fillRect(bx,by-7,bw*clamp(en.hp/en.maxhp,0,1),4);}
  });
  ctx.restore();
}
/* ---- decoração específica por região (a cada 5 andares muda totalmente) ---- */
function drawRegionDecor(ctx,W,H,th,t,walk){
  const sx=(walk*0.5)%64; const deco=th.deco;
  ctx.save();
  if(deco==='crypt'){ // correntes penduradas
    ctx.strokeStyle='rgba(120,120,140,.5)';ctx.lineWidth=2;
    for(let i=0;i<6;i++){const x=((i*90)-sx*0.6+540)%540-20; for(let y=0;y<46;y+=6){ctx.beginPath();ctx.arc(x,y,3,0,TAU);ctx.stroke();}}
  } else if(deco==='ice'){ // estalactites de gelo no teto
    for(let i=0;i<10;i++){const x=((i*64)-sx+640)%640-30; const h=14+((i*13)%18);
      ctx.fillStyle='rgba(150,220,255,.45)';ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+10,0);ctx.lineTo(x+5,h);ctx.closePath();ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(x+4,0,1,h*0.7);}
  } else if(deco==='lava'){ // rachaduras brilhantes no chão + brasas subindo
    for(let i=0;i<8;i++){const x=((i*70)-sx*1.2+560)%560-20; const g=0.4+Math.sin(t*4+i)*0.25;
      ctx.strokeStyle='rgba(255,'+Math.floor(90+g*80)+',30,'+g+')';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(x,H-44);ctx.lineTo(x+8,H-30);ctx.lineTo(x+4,H-16);ctx.stroke();}
    for(let i=0;i<16;i++){ctx.fillStyle='rgba(255,140,40,'+(0.5-((t*0.6+i)%1)*0.5)+')';
      ctx.fillRect((i*41-t*22)%W+(i%2?0:W),H-20-((t*30+i*40)%H),2,2);}
  } else if(deco==='forest'){ // raízes/vinhas penduradas + vaga-lumes
    ctx.strokeStyle='rgba(60,120,60,.5)';ctx.lineWidth=3;
    for(let i=0;i<7;i++){const x=((i*80)-sx*0.7+560)%560-20;ctx.beginPath();ctx.moveTo(x,0);
      ctx.quadraticCurveTo(x+6,12,x+2,26);ctx.stroke();}
    for(let i=0;i<10;i++){const a=0.4+Math.sin(t*3+i)*0.4;ctx.fillStyle='rgba(160,255,120,'+a+')';
      ctx.fillRect((i*57-t*8)%W,(40+Math.sin(t+i)*20),2,2);}
  } else if(deco==='royal'){ // estandartes dourados
    for(let i=0;i<5;i++){const x=((i*110)-sx*0.5+550)%550-30;
      ctx.fillStyle='rgba(180,40,40,.55)';ctx.fillRect(x,0,22,30);
      ctx.fillStyle='rgba(232,192,116,.8)';ctx.fillRect(x+8,4,6,6);
      ctx.beginPath();ctx.moveTo(x,30);ctx.lineTo(x+22,30);ctx.lineTo(x+11,38);ctx.closePath();ctx.fill();}
  } else if(deco==='catacomb'){ // crânios na base
    for(let i=0;i<12;i++){const x=((i*52)-sx*0.9+624)%624-20;ctx.fillStyle='rgba(210,200,180,.6)';
      ctx.beginPath();ctx.arc(x,H-44,5,0,TAU);ctx.fill();ctx.fillStyle='#000';ctx.fillRect(x-3,H-45,2,2);ctx.fillRect(x+1,H-45,2,2);}
  } else if(deco==='crimson'){ // brilho pulsante vermelho + gotejar
    const g=0.1+Math.sin(t*2)*0.06;ctx.fillStyle='rgba(200,40,60,'+g+')';ctx.fillRect(0,0,W,H);
    for(let i=0;i<10;i++){ctx.fillStyle='rgba(180,20,40,.5)';ctx.fillRect((i*61-sx)%W,((t*40+i*30)%H),2,8);}
  } else if(deco==='void'){ // fendas roxas flutuantes + estrelas
    for(let i=0;i<26;i++){ctx.fillStyle='rgba(200,180,255,'+(0.2+((i*7)%5)/10)+')';
      ctx.fillRect((i*37-t*6)%W,(i*53+t*3)%H,2,2);}
    for(let i=0;i<4;i++){const x=((i*150)-sx*1.5+600)%600-40,y=20+i*30;const a=0.3+Math.sin(t*1.5+i)*0.2;
      ctx.strokeStyle='rgba(161,75,255,'+a+')';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(x,y,16,4,0.6,0,TAU);ctx.stroke();}
  }
  ctx.restore();
}
function floatText(side,i,txt,color){
  const stage=$('#stage');if(!stage)return;const d=document.createElement('div');
  d.className='fct';d.textContent=txt;d.style.color=color||'#fff';
  if(side==='hero'){d.style.left=(8+i*9)+'%';d.style.top='52%';}
  else if(side==='enemy'){d.style.left=(62-i*9)+'%';d.style.top='40%';}
  else{d.style.left='44%';d.style.top='30%';}
  stage.appendChild(d);setTimeout(()=>d.remove(),1000);
}

function burstAt(side,i,color){const stage=$('#stage');if(!stage)return;
  const x=side==='hero'?(10+i*9):(60-i*9), y=side==='hero'?52:42;
  for(let k=0;k<10;k++){const p=document.createElement('div');p.className='pt';p.style.color=color||'#ffd166';
    p.style.left=x+'%';p.style.top=y+'%';const ang=Math.random()*6.28,d=14+Math.random()*26;

    p.style.background=color||'#ffd166';stage.appendChild(p);setTimeout(()=>p.remove(),720);}}

  const x=side==='hero'?(10+i*9):(60-i*9), y=side==='hero'?52:42;
  for(let k=0;k<6;k++){const p=document.createElement('div');p.className='pt';p.style.color=color||'#fff';

    host.appendChild(s);setTimeout(()=>s.remove(),820);}}

/* ====================== MÁQUINA DE EXPLORAÇÃO ====================== */
function stepBegin(){
  if(!RUN.alive)return;
  updateFloorBadge();
  // anúncio de nova região a cada 5 andares
  const region=floorTheme(RUN.floor);
  if(RUN._lastRegion!==region.name){ RUN._lastRegion=region.name;
    logline(`<span class="sc">🌌 Você adentra uma nova região: <b>${region.name}</b>.</span>`,'sc');
    toast('🌌 '+region.name,'epico');
  }
  const isBoss=RUN.floor%5===0;
  logline(`<span class="sy">⌁ Andar ${RUN.floor}${isBoss?' — você sente uma presença colossal à frente...':' — '+region.name+'.'}</span>`,'ev');
  RUN.roomsTotal=computeRooms();RUN.room=0;
  rtimeout(walkNext,600);
}
function computeRooms(){
  const fam=G.meta.mapKnowledge[RUN.floor]||0;
  // andares bem mais longos e que crescem com a profundidade
  let base=7+Math.min(RUN.floor,14)+ri(0,3);
  base=Math.round(base*(1-fam*0.18));            // mapa conhecido ajuda só um pouco
  if(RUN.passive.alterFloor)base=Math.round(base*(1-RUN.passive.alterFloor));
  return Math.max(6,base);
}
function gainFamiliarity(amt){
  const m=1+(RUN.passive.mapBonus||0);
  const f=RUN.floor;G.meta.mapKnowledge[f]=clamp((G.meta.mapKnowledge[f]||0)+amt*m,0,1);updateRunRes();
}
function walkNext(){
  if(!RUN.alive)return;
  if(RUN.room>=RUN.roomsTotal)return floorClimax();
  RUN.scene.mode='walk';RUN.scene.enemies=[];
  rtimeout(doEncounter,ri(650,1200));
}
function advanceRoom(){
  if(!RUN.alive)return;
  RUN.room++;gainFamiliarity(0.05);saveGame();
  rtimeout(walkNext,500);
}
function floorClimax(){
  gainFamiliarity(0.25);
  if(RUN.floor%5===0){ return startBossFight(); }
  // escada
  logline('<span class="ev">🪜 Você encontra a escadaria para o próximo andar.</span>','ev');
  RUN.scene.mode='idle';
  rtimeout(()=>descend(),900);
}
function descend(){
  if(maybeSecretBoss())return;
  floorClearRewards();
  RUN.floor++;sfx('descend');
  if(RUN.floor>G.meta.deepestFloor){G.meta.deepestFloor=RUN.floor;milestoneCheck();checkUnlocks();}
  saveGame();
  rtimeout(stepBegin,500);
}

/* ---- gerador de encontro ---- */
function doEncounter(){
  if(!RUN.alive)return;
  // passagem secreta? (todos têm uma base; cresce com profundidade e passivas)
  const secretFind=0.06+Math.min(RUN.floor,20)*0.004+(RUN.passive.secretFind||0)+(G.meta.research.meta_loot?0.05:0);
  if(chance(secretFind)){return encSecretPassage();}
  // elite raro (chance pequena, cresce com a profundidade)
  if(RUN.floor>=6 && chance(0.025+Math.min(RUN.floor,40)*0.0015)){return encElite();}
  const w={combate:42,tesouro:Math.round(15*(RUN.tideTreasure||1)),armadilha:12,evento:Math.round(13*(RUN.tideEvent||1))};
  if(!RUN.tideNoRest)w.descanso=8;
  if(RUN.floor>=4)w.fonte=3;
  if(RUN.floor>=6)w.altar=5;
  w.mercador=3+Math.round(avgLuck()/4);
  const type=weighted(w);
  ({combate:encCombat,tesouro:encTreasure,armadilha:encTrap,evento:encEvent,
    descanso:encRest,fonte:encFountain,altar:encAltar,mercador:encMerchant}[type])();
}
function avgLuck(){return RUN.party.filter(c=>c.alive).reduce((a,c)=>a+c.st.lck,0)/Math.max(1,RUN.party.filter(c=>c.alive).length);}

/* ---- TESOURO ---- */
function encTreasure(){
  const flavor=pick(['Um baú empoeirado repousa num canto.','Ossos de um aventureiro guardam uma bolsa.','Um cofre rúnico zumbe baixinho.','Tesouros reluzem sob escombros.']);
  logline('💰 '+flavor,'lt');RUN.scene.mode='idle';sfx('treasure');
  const lootMult=1+(RUN.passive.lootBonus||0)+(G.meta.research.meta_loot?0.2:0);
  rtimeout(()=>{
    const gold=Math.round(ri(8,20)*RUN.floor*lootMult);grantGold(gold);
    if(chance(0.7*lootMult))grantMaterial();
    if(chance(0.35*lootMult))grantEquipment();
    advanceRoom();
  },700);
}
/* ---- ARMADILHA ---- */
function encTrap(){
  const evade=RUN.passive.trapEvade||0;
  const traps=['🔥 jato de chamas','🏹 dardos envenenados','⬇️ fosso de espinhos','❄️ runa congelante','🪨 teto desabando'];
  const tr=pick(traps);
  if(chance(evade)){logline('🪤 '+tr+' — mas a equipe a desarma a tempo! '+RAR_NAME.raro,'dn');
    if(chance(0.3))grantMaterial();rtimeout(advanceRoom,700);return;}
  logline('🪤 Armadilha! '+tr+' atinge o grupo!','bd');RUN.scene.shake=6;sfx('trap');
  const dmg=Math.round(ri(4,9)*RUN.floor*0.6);
  RUN.party.filter(c=>c.alive).forEach((c,i)=>{c.hp=Math.max(0,c.hp-dmg);floatText('hero',i,'-'+dmg,'#ff5d6c');if(c.hp===0)downHero(c);});
  refreshBars();checkWipe()||rtimeout(advanceRoom,800);
}
/* ---- DESCANSO ---- */
function encRest(){
  logline('🏕️ Uma sala silenciosa e segura. O grupo recupera o fôlego.','dn');RUN.scene.mode='idle';
  rtimeout(()=>{RUN.party.filter(c=>c.alive).forEach((c,i)=>{const h=Math.round(c.maxhp*0.2);c.hp=Math.min(c.maxhp,c.hp+h);floatText('hero',i,'+'+h,'#5fd17a');});
    refreshBars();advanceRoom();},700);
}
/* ---- FONTE DAS MEMÓRIAS (segredo) ---- */

}
/* ---- ALTAR PROIBIDO (segredo) ---- */
function encAltar(){
  unlockSecret('altar_proibido');RUN.paused=true;
  openModal(`<h3 class="tag-secret">🩸 Altar Proibido</h3>
   <p class="small">Um altar sussurra promessas. "Dê-me vida e te darei poder..."</p>

function rarityRoll(minRar){
  // tabela melhora com andar
  const f=RUN.floor,bonus=(G.meta.research.meta_loot?1:0);
  const w={comum:Math.max(2,30-f*2),raro:18+f,epico:6+f*0.8+bonus*4,lendario:Math.max(0,f-6)+bonus*2,mitico:Math.max(0,f-12)};
  let r=weighted(w);
  if(minRar){const order=RARS.indexOf(minRar);if(RARS.indexOf(r)<order)r=minRar;}
  return r;
}
function grantMaterial(minRar){
  const rar=rarityRoll(minRar);
  let pool=ITEMS.filter(i=>i.type==='mat'&&RARS.indexOf(i.rarity)<=Math.max(RARS.indexOf(rar),1));
  // tende ao material da raridade sorteada
  const exact=ITEMS.filter(i=>i.type==='mat'&&i.rarity===rar);
  const it=pick(exact.length?exact:pool);
  if(!it)return;addItem(it.id,1);logline('🧱 +1 '+it.icon+' '+it.name+' ('+RAR_NAME[it.rarity]+')','lt');
  sfx(RARS.indexOf(it.rarity)>=2?'epic':'loot');toast('🧱 '+it.icon+' '+it.name,it.rarity);
}
function grantEquipment(minRar){
  const rar=rarityRoll(minRar);
  let pool=ITEMS.filter(i=>isEquip(i)&&i.rarity===rar);
  if(!pool.length)pool=ITEMS.filter(i=>isEquip(i)&&RARS.indexOf(i.rarity)<=RARS.indexOf(rar));
  if(!pool.length)pool=ITEMS.filter(i=>isEquip(i));
  const it=pick(pool);addItem(it.id,1);
  logline('🎁 Equipamento: '+it.icon+' <b style="color:'+RAR_COLOR[it.rarity]+'">'+it.name+'</b>!','lt');
  sfx(RARS.indexOf(it.rarity)>=2?'epic':'loot');lootBurst(it.rarity);toast('🎁 '+it.icon+' '+it.name,it.rarity);
}
function grantSecretKey(){

function grantXP(c,amt){

function levelUp(c){

    toast('✦ '+c.h.name.split(',')[0]+' aprendeu '+sk.n+'!','epico');});

  if(c.level>G.meta.heroes[c.id].maxLevelEver){G.meta.heroes[c.id].maxLevelEver=c.level;saveGame();}
}
function downHero(c){c.alive=false;c.hp=0;

function tryRevive(c){

/* ====================== COMBATE ====================== */
function makeEnemy(monster,floor,boss){
  const b=monster.base;const tideHp=(RUN&&RUN.tideEnemyHp)||1;
  if(boss){
    // TODO chefes escalam por andar automaticamente (vale p/ os 100 andares)
    const hp=Math.round((170+floor*floor*6.5+floor*110)*tideHp);
    const atk=Math.round(12+floor*2.6+floor*floor*0.02);
    const def=Math.round(8+floor*1.1);
    const spd=Math.round(8+floor*0.18);
    return {m:monster,name:monster.name,boss:true,family:monster.family,el:monster.el,
      st:{atk,mag:atk,def,spd,lck:8},maxhp:hp,hp,alive:true,dead:false,hit:0,flash:0,fx:{}};
  }
  // inimigo normal: andares iniciais suaves, profundos brutais (quadrático domina tarde)
  const hpS=1+floor*0.32+floor*floor*0.005, atkS=1+floor*0.155+floor*floor*0.0022, defS=1+floor*0.14, spdS=1+floor*0.05;
  const maxhp=Math.round(b.hp*hpS*tideHp);
  return {m:monster,name:monster.name,boss:false,family:monster.family,el:monster.el,
    st:{atk:Math.round(b.atk*atkS),mag:Math.round(b.atk*atkS),def:Math.round(b.def*defS),spd:Math.round(b.spd*spdS),lck:5},
    maxhp,hp:maxhp,alive:true,dead:false,hit:0,flash:0,fx:{}};
}
function enemyPoolFor(floor){return MONSTERS.filter(m=>floor>=m.floors[0]&&floor<=m.floors[1]);}
function encCombat(){
  let pool=enemyPoolFor(RUN.floor);if(!pool.length)pool=MONSTERS;
  let count=1+ (chance(0.6)?1:0) + (RUN.floor>=4&&chance(0.45)?1:0) + (RUN.floor>=10&&chance(0.45)?1:0) + (RUN.floor>=22&&chance(0.4)?1:0);
  count=Math.min(count,5);
  if(RUN.passive.alterFloor&&chance(RUN.passive.alterFloor))count=Math.max(1,count-1);
  const enemies=[];for(let i=0;i<count;i++){const m=MMAP[weighted(Object.fromEntries(pool.map(x=>[x.id,x.weight])))]||pick(pool);enemies.push(makeEnemy(m,RUN.floor,false));}
  logline('⚔️ Encontro: '+enemies.map(e=>e.name).join(', ')+'!','cb');
  enemies.forEach(e=>discover('bestiary',e.m.id));
  beginCombat(enemies,{boss:false,onWin:()=>{
    // XP modesto baseado em quantidade e andar (NÃO no PV inflado dos inimigos)
    const total=enemies.length*(9+RUN.floor*3.2);
    const alive=Math.max(1,RUN.party.filter(p=>p.alive).length);
    RUN.party.filter(c=>c.alive).forEach(c=>grantXP(c, total/alive));
    grantGold(Math.round(ri(4,10)*RUN.floor));
    RUN.kills+=enemies.length;G.meta.totalKills+=enemies.length;
    if(chance(0.5))grantMaterial();if(chance(0.18))grantEquipment();
    checkUnlocks();saveGame();advanceRoom();
  }});
}
function startBossFight(){
  const boss=getBossForFloor(RUN.floor);
  if(!boss){logline('🪜 Escada para o próximo andar.','ev');return rtimeout(descend,800);}
  const e=makeEnemy(boss,RUN.floor,true);
  logline('<span class="bd">═══ CHEFE: '+boss.name+' ═══</span>','bd');
  logline('<i>'+boss.intro+'</i>','sy');discover('bosses',boss.id);
  sfx('roar');bossCard(boss.name,boss.intro,false);showBossBar(e);
  beginCombat([e],{boss:true,bossDef:boss,onWin:()=>onBossWin(boss,e)});
}
function onBossWin(boss,e){
  hideBossBar();
  if(!G.meta.bossesKilled.includes(boss.id)){G.meta.bossesKilled.push(boss.id);}
  RUN.kills++;G.meta.totalKills++;
  const xp=20+RUN.floor*8;   // chefe dá um bom empurrão, mas controlado
  RUN.party.filter(c=>c.alive).forEach(c=>grantXP(c,xp));
  const ess=runEssence(30+RUN.floor*8);
  grantGold(Math.round(40*RUN.floor));

  if(RUN.floor>=10)grantSecretKey();
  logline('🏆 <b>'+boss.name+' foi derrotado!</b> +'+ess+' essência.','dn');
  toast('🏆 Chefe derrotado: '+boss.name+'!','lendario');
  checkUnlocks();saveGame();
  // marcos narrativos
  if(boss.id==='dragao'){G.meta.flags.beatDragon=true;saveGame();
    logline('🐉 Você derrotou o lendário Valthrax... mas a escada continua a <b>descer</b>. A Adranja é mais funda do que se imaginava.','sc');}
  // vitória final só no Coração da Adranja (Andar 100)
