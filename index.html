function tabLibrary(b){
  const act=G.meta.researchActive;
  let actHtml='';
  if(act){const r=RMAP[act.id];const total=r.time*1000;const left=Math.max(0,act.end-Date.now());
    const pct=clamp((1-left/total)*100,0,100);
    actHtml=`<div class="panel" style="border-color:var(--magic)">
      <b style="color:var(--magic-2)">⏳ Pesquisando: ${r.name}</b>
      <div class="progress mt6"><i style="width:${pct}%"></i></div>
      <div class="row between mt6"><span class="tiny muted">${Math.ceil(left/1000)}s restantes</span>
      <button class="btn ghost sm" onclick="rushResearch()">Acelerar (💠 ${rushCost()})</button></div></div>`;}
  const card=r=>{const done=!!G.meta.research[r.id];const reqOk=hasResearch(r.req);const busy=!!act;
    const can=!done&&reqOk&&!busy&&G.meta.essence>=r.cost;
    return `<div class="recipe" style="${done?'border-color:var(--ok)':''}">
      <div class="rico">${done?'✅':(reqOk?'📜':'🔒')}</div>
      <div style="flex:1"><b>${r.name}</b> ${done?'<span class="chip" style="color:var(--ok)">concluída</span>':`<span class="chip">💠 ${r.cost}</span> <span class="chip">⏱️ ${r.time}s</span>`}<br>
        <span class="tiny">${r.desc}</span>${r.req&&!reqOk?`<br><span class="tiny muted">requer: ${RMAP[r.req].name}</span>`:''}</div>
      ${done?'':`<button class="btn sm" ${can?'':'disabled'} onclick="startResearch('${r.id}')">Pesquisar</button>`}</div>`;};
  b.innerHTML=`<div class="panel parch mb"><h3>📚 Biblioteca Arcana</h3>
     <p class="muted small mt6">Enquanto seus heróis exploram, você pesquisa. Desbloqueie receitas, mais espaço de equipe e bônus permanentes. Uma pesquisa por vez.</p></div>
     ${actHtml}<div class="col mt">${RESEARCH.map(card).join('')}</div>`;
}
function startResearch(id){const r=RMAP[id];if(G.meta.researchActive||G.meta.research[id]||!hasResearch(r.req)||G.meta.essence<r.cost)return;
  G.meta.essence-=r.cost;G.meta.researchActive={id,end:Date.now()+r.time*1000};saveGame();renderTab();}
function rushCost(){const a=G.meta.researchActive;if(!a)return 0;return Math.ceil(Math.max(0,a.end-Date.now())/1000*2);}
function rushResearch(){const a=G.meta.researchActive;if(!a)return;const c=rushCost();if(G.meta.essence<c){toast('Essência insuficiente.','warn');return;}
  G.meta.essence-=c;a.end=Date.now();checkResearch();renderTab();}
function checkResearch(){const a=G.meta.researchActive;if(a&&Date.now()>=a.end){
  G.meta.research[a.id]=true;const r=RMAP[a.id];G.meta.researchActive=null;
  if(a.id==='slot4')G.meta.slots=Math.max(G.meta.slots,4);
  if(a.id==='slot5')G.meta.slots=5;
  saveGame();toast('📚 Pesquisa concluída: '+r.name+'!','epico');}}

// monta a maré da incursão: SEMPRE 2 boas + 2 ruins (heróis com "tideMaster" trocam 1 ruim por 1 boa)
function rollTides(party){
  const good=shuffle(TIDES.filter(t=>t.good)), bad=shuffle(TIDES.filter(t=>!t.good));
  let nGood=2, nBad=2;
  const pIds=party||G.meta.party.filter(id=>G.meta.heroes[id].unlocked);
  const shifters=pIds.filter(id=>{const t=(HMAP[id]&&HMAP[id].passive.tags)||{};return t.tideMaster;}).length;
  for(let i=0;i<shifters&&nBad>1;i++){nBad--;nGood++;}   // cada mestre-das-marés ameniza um risco
  return good.slice(0,nGood).concat(bad.slice(0,nBad));
}

const DIFF_ORDER=['normal','dificil','inferno'];
function diffUnlocked(d,dungeon){
  if(d==='normal')return true;
  const F=G.meta.flags||{};
  if(dungeon==='torre'){
    if(d==='dificil')return !!F.beatTorre;        // zere a Torre no Normal
    if(d==='inferno')return !!F.beatTorreHard;    // zere a Torre no Difícil
    return false;
  }
  if(d==='dificil')return !!F.beatGame;           // zere o Andar 200 no Normal
  if(d==='inferno')return !!F.beatHard;           // zere o Andar 200 no Difícil
  return false;
}
function diffMul(){ const d=(RUN&&RUN.diff)||'normal'; return DIFFS[d]||DIFFS.normal; }

  if(it.mode==='dificil')return d==='dificil'||d==='inferno';

function initRun(party,tides,startFloor,dungeon,diff){
  const sf=Math.max(1,startFloor||1);
  RUN={
    party:party.map(buildCombatant),
    dungeon:dungeon||'adranja', diff:(diff||'normal'), maxFloor:(dungeon==='torre'?TORRE_MAX:200),
    floor:sf, startFloor:sf, room:0, roomsTotal:0, kills:0, gold:0, essence:0, combo:0,
    log:[], scene:{mode:'idle',enemies:[],walk:0,shake:0,flashEnemy:-1},

    tides:tides||[], tideGold:1, tideTreasure:1, tideEnemyHp:1, tideEssence:1, tideHp:1, tideEvent:1, tideNoRest:0,
    pendingBoss:null, keysThisRun:[], retreated:false, encounters:[],
    bestCombo:0, bossKills:0, equipFound:0, secretsFound:0, _t0:Date.now()
  };
  computePartyPassives();
  (tides||[]).forEach(t=>t.apply(RUN));
  RUN.party.forEach(c=>applyPassiveStart(c));
}
function buildCombatant(id){
  const h=HMAP[id];const st=G.meta.heroes[id];
  const level=st.level||1; const xp=st.xp||0; const s=heroStats(id,level);
  return {id,h,level,xp,maxhp:s.maxhp,hp:s.maxhp,st:s,alive:true,
    skills:knownSkills(id,level), // nível e habilidades são PERMANENTES (não resetam ao morrer)
    fx:{}, summons:[], anim:{x:0,hit:0}};
}
function computePartyPassives(){
  const p={};
  RUN.party.forEach(c=>{const t=c.h.passive.tags||{};for(const k in t){
    if(typeof t[k]==='number')p[k]=(p[k]||0)+t[k];else p[k]=t[k];
  }});
  // oferendas e pesquisas
  const F=G.meta.flags;
  if(F.off_dmg)p.partyAtk=(p.partyAtk||0)+0.1;
  if(F.off_def)p.partyDef=(p.partyDef||0)+0.12;
  if(F.off_spd)p.partySpd=(p.partySpd||0)+0.08;
  if(F.off_crit)p.critBonus=(p.critBonus||0)+0.08;
  if(F.off_loot){p.lootBonus=(p.lootBonus||0)+0.15;p.materialBonus=(p.materialBonus||0)+0.15;}
  if(F.off_xp)p.xpBonus=(p.xpBonus||0)+0.15;
  if(F.off_secret)p.secretFind=(p.secretFind||0)+0.1;
  if(F.off_revive)p.reviveOnce=1;
  if(G.meta.research.meta_crit)p.critBonus=(p.critBonus||0)+0.08;
  if(G.meta.research.meta_secret)p.secretFind=(p.secretFind||0)+0.1;
  RUN.passive=p;
}
function applyPassiveStart(c){
  // bônus de stats por passivas de grupo
  const p=RUN.passive;
  if(p.partyAtk)c.st.atk=Math.round(c.st.atk*(1+p.partyAtk));
  if(p.partyDef)c.st.def=Math.round(c.st.def*(1+p.partyDef));
  if(p.partySpd)c.st.spd=Math.round(c.st.spd*(1+p.partySpd));
  if(G.meta.flags.off_heal){c.maxhp=Math.round(c.maxhp*1.1);}
  if(RUN.tideHp&&RUN.tideHp!==1){c.maxhp=Math.round(c.maxhp*RUN.tideHp);}
  c.hp=c.maxhp;c.st.maxhp=c.maxhp;
}

  {name:'Cripta',brick:'#3a2a44',brick2:'#2a1d34',floor:'#241830',torch:'#ffb347',tint:'rgba(125,108,255,.05)'},
  {name:'Cavernas de Gelo',brick:'#2a3a3a',brick2:'#1d2a2a',floor:'#16221f',torch:'#67d8ff',tint:'rgba(103,216,255,.06)'},
  {name:'Forjas de Lava',brick:'#3a2a22',brick2:'#2a1d16',floor:'#221610',torch:'#ff7a3c',tint:'rgba(255,122,60,.08)'},
  {name:'Bosque Profano',brick:'#22302a',brick2:'#16221c',floor:'#10180f',torch:'#5fd17a',tint:'rgba(95,209,122,.06)'},
  {name:'Salões Reais',brick:'#3a3020',brick2:'#2a2214',floor:'#1c1608',torch:'#ffd166',tint:'rgba(232,192,116,.08)'},
  {name:'Catacumbas',brick:'#2a2630',brick2:'#1a1620',floor:'#100c16',torch:'#b39bff',tint:'rgba(125,108,255,.07)'},
  {name:'Abismo Carmesim',brick:'#3a1a22',brick2:'#2a1016',floor:'#1c0a10',torch:'#ff5d6c',tint:'rgba(200,50,74,.09)'},
  {name:'O Vazio',brick:'#1a1030',brick2:'#100a20',floor:'#0c0818',torch:'#a14bff',tint:'rgba(161,75,255,.12)'},
];
const FLOOR_BAND_NAMES=['Cripta','Cavernas de Gelo','Forjas de Lava','Bosque Profano','Salões Reais','Catacumbas','Abismo Carmesim','O Vazio'];
function floorBandIndex(f){return Math.floor((f-1)/5)%FLOOR_BANDS.length;}  // novo cenário a cada 5 andares
function floorTheme(f){const b=FLOOR_BANDS[floorBandIndex(f)];b.deco=['crypt','ice','lava','forest','royal','catacomb','crimson','void'][floorBandIndex(f)];return b;}
function startSceneLoop(){
  if(_sceneRAF)cancelAnimationFrame(_sceneRAF);
  const cv=$('#scene');if(!cv)return;const ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
  let t=0;
  function frame(){
    t++;const sc=RUN&&RUN.scene;if(!RUN){return;}
    // só desenha quando a incursão está visível (economiza CPU no acampamento)
    if(CUR.screen!=='dungeon'||!cv.isConnected){ _sceneRAF=requestAnimationFrame(frame); return; }
    if(!RUN.paused&&sc.mode==='walk')sc.walk+=1.6*RUN.speed;
    drawScene(ctx,cv,t);
    _sceneRAF=requestAnimationFrame(frame);
  }
  frame();
}
function drawScene(ctx,cv,t){
  const W=cv.width,H=cv.height,th=floorTheme(RUN.floor),sc=RUN.scene;
  const shake=sc.shake>0?(Math.random()*2-1)*sc.shake:0;if(sc.shake>0)sc.shake*=0.85;
  ctx.save();ctx.translate(shake,0);
  // fundo
  ctx.fillStyle=th.brick2;ctx.fillRect(0,0,W,H);
  // tijolos parallax
  const off=(sc.walk%32);
  ctx.fillStyle=th.brick;
  for(let y=-1;y<5;y++)for(let x=-1;x<W/32+2;x++){
    const bx=x*32-off+((y%2)?16:0);ctx.fillRect(bx,y*22,30,20);
  }
  ctx.fillStyle='rgba(0,0,0,.25)';for(let y=0;y<5;y++)ctx.fillRect(0,y*22+20,W,2);
  // tochas
  for(let i=0;i<4;i++){const tx=((i*120)-(sc.walk*0.6)%480+480)%480-30;
    if(tx>-20&&tx<W){ctx.fillStyle='#3a2a1a';ctx.fillRect(tx,40,3,14);
      const fl=6+Math.sin(t*0.3+i)*2;const fg=ctx.createRadialGradient(tx+1,40,1,tx+1,40,fl+10);
      fg.addColorStop(0,th.torch);fg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=fg;ctx.fillRect(tx-14,26,30,30);}}
  // chão
  ctx.fillStyle=th.floor;ctx.fillRect(0,H-46,W,46);
  ctx.fillStyle='rgba(0,0,0,.3)';for(let x=-off;x<W;x+=32)ctx.fillRect(x,H-46,2,46);
  drawRegionDecor(ctx,W,H,th,t,sc.walk);
  ctx.fillStyle=th.tint;ctx.fillRect(0,0,W,H);
  // poeira/partículas do vazio em andares fundos
  if(RUN.floor>=13){for(let i=0;i<14;i++){ctx.fillStyle='rgba(161,75,255,'+(0.1+((i*7)%5)/12)+')';
    ctx.fillRect((i*53-t*0.5)%W+(i%2?0:W),(i*31+t*0.3)%H,2,2);}}

  const groundY=H-58;
  // HERÓIS (esquerda)
  const aliveParty=RUN.party.filter(c=>c.alive);
  RUN.party.forEach((c,i)=>{
    const sp=heroSprite(c.h,4);const baseX=24+i*30;
    let x=baseX, y=groundY-(sc.mode==='walk'?Math.abs(Math.sin(t*0.2+i))*3:0);
    if(c.anim.hit>0){x+=18*c.anim.hit;c.anim.hit*=0.8;if(c.anim.hit<0.05)c.anim.hit=0;}
    ctx.globalAlpha=c.alive?1:0.25;
    if(!c.alive){ctx.save();ctx.translate(x+32,y+48);ctx.rotate(Math.PI/2);ctx.drawImage(sp,-24,-24);ctx.restore();}
    else ctx.drawImage(sp,x,y);
    ctx.globalAlpha=1;
    ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(x+6,y+62,52,4);
  });
  // INIMIGOS (direita)
  sc.enemies.forEach((en,i)=>{
    if(en.dead)return;
    const grid=en.boss?en.m.grid:en.m.grid;const scl=en.boss?6:4;
    const sp=spriteCanvas(grid,en.m.pal,scl);
    let bx=en.boss?W-110:(W-70-i*36), by=groundY-(en.boss?28:0);
    if(en.hit>0){bx+=14*en.hit;en.hit*=0.78;if(en.hit<0.05)en.hit=0;}
    ctx.globalAlpha=en.flash>0?0.4:1;if(en.flash>0)en.flash*=0.8;
    ctx.save();ctx.scale(-1,1);ctx.drawImage(sp,-bx-sp.width,by);ctx.restore();
    ctx.globalAlpha=1;
    ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(bx,by+sp.height,sp.width,4);
    // barra de vida do inimigo
    if(!en.boss){const bw=34;ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(bx,by-7,bw,4);
      ctx.fillStyle='#ff5d6c';ctx.fillRect(bx,by-7,bw*clamp(en.hp/en.maxhp,0,1),4);}
  });
  ctx.restore();
}
/* ---- decoração específica por região (a cada 5 andares muda totalmente) ---- */
function drawRegionDecor(ctx,W,H,th,t,walk){
  const sx=(walk*0.5)%64; const deco=th.deco;
  ctx.save();
  if(deco==='crypt'){ // correntes penduradas
    ctx.strokeStyle='rgba(120,120,140,.5)';ctx.lineWidth=2;
    for(let i=0;i<6;i++){const x=((i*90)-sx*0.6+540)%540-20; for(let y=0;y<46;y+=6){ctx.beginPath();ctx.arc(x,y,3,0,TAU);ctx.stroke();}}
  } else if(deco==='ice'){ // estalactites de gelo no teto
    for(let i=0;i<10;i++){const x=((i*64)-sx+640)%640-30; const h=14+((i*13)%18);
      ctx.fillStyle='rgba(150,220,255,.45)';ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+10,0);ctx.lineTo(x+5,h);ctx.closePath();ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(x+4,0,1,h*0.7);}
  } else if(deco==='lava'){ // rachaduras brilhantes no chão + brasas subindo
    for(let i=0;i<8;i++){const x=((i*70)-sx*1.2+560)%560-20; const g=0.4+Math.sin(t*4+i)*0.25;
      ctx.strokeStyle='rgba(255,'+Math.floor(90+g*80)+',30,'+g+')';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(x,H-44);ctx.lineTo(x+8,H-30);ctx.lineTo(x+4,H-16);ctx.stroke();}
    for(let i=0;i<16;i++){ctx.fillStyle='rgba(255,140,40,'+(0.5-((t*0.6+i)%1)*0.5)+')';
      ctx.fillRect((i*41-t*22)%W+(i%2?0:W),H-20-((t*30+i*40)%H),2,2);}
  } else if(deco==='forest'){ // raízes/vinhas penduradas + vaga-lumes
    ctx.strokeStyle='rgba(60,120,60,.5)';ctx.lineWidth=3;
    for(let i=0;i<7;i++){const x=((i*80)-sx*0.7+560)%560-20;ctx.beginPath();ctx.moveTo(x,0);
      ctx.quadraticCurveTo(x+6,12,x+2,26);ctx.stroke();}
    for(let i=0;i<10;i++){const a=0.4+Math.sin(t*3+i)*0.4;ctx.fillStyle='rgba(160,255,120,'+a+')';
      ctx.fillRect((i*57-t*8)%W,(40+Math.sin(t+i)*20),2,2);}
  } else if(deco==='royal'){ // estandartes dourados
    for(let i=0;i<5;i++){const x=((i*110)-sx*0.5+550)%550-30;
      ctx.fillStyle='rgba(180,40,40,.55)';ctx.fillRect(x,0,22,30);
      ctx.fillStyle='rgba(232,192,116,.8)';ctx.fillRect(x+8,4,6,6);
      ctx.beginPath();ctx.moveTo(x,30);ctx.lineTo(x+22,30);ctx.lineTo(x+11,38);ctx.closePath();ctx.fill();}
  } else if(deco==='catacomb'){ // crânios na base
    for(let i=0;i<12;i++){const x=((i*52)-sx*0.9+624)%624-20;ctx.fillStyle='rgba(210,200,180,.6)';
      ctx.beginPath();ctx.arc(x,H-44,5,0,TAU);ctx.fill();ctx.fillStyle='#000';ctx.fillRect(x-3,H-45,2,2);ctx.fillRect(x+1,H-45,2,2);}
  } else if(deco==='crimson'){ // brilho pulsante vermelho + gotejar
    const g=0.1+Math.sin(t*2)*0.06;ctx.fillStyle='rgba(200,40,60,'+g+')';ctx.fillRect(0,0,W,H);
    for(let i=0;i<10;i++){ctx.fillStyle='rgba(180,20,40,.5)';ctx.fillRect((i*61-sx)%W,((t*40+i*30)%H),2,8);}
  } else if(deco==='void'){ // fendas roxas flutuantes + estrelas
    for(let i=0;i<26;i++){ctx.fillStyle='rgba(200,180,255,'+(0.2+((i*7)%5)/10)+')';
      ctx.fillRect((i*37-t*6)%W,(i*53+t*3)%H,2,2);}
    for(let i=0;i<4;i++){const x=((i*150)-sx*1.5+600)%600-40,y=20+i*30;const a=0.3+Math.sin(t*1.5+i)*0.2;
      ctx.strokeStyle='rgba(161,75,255,'+a+')';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(x,y,16,4,0.6,0,TAU);ctx.stroke();}
  }
  ctx.restore();
}
let _fctSeq=0;
function floatText(side,i,txt,color){
  const stage=$('#stage');if(!stage)return;const d=document.createElement('div');
  d.className='fct';d.textContent=txt;d.style.color=color||'#fff';
  // jitter para números de dano em área não ficarem empilhados/ilegíveis
  const seq=_fctSeq++; const jx=(Math.random()*8-4)+(seq%3-1)*5; const jy=(Math.random()*16-8)-(seq%4)*4;
  if(side==='hero'){d.style.left=clamp(8+i*9+jx,2,90)+'%';d.style.top=clamp(52+jy,20,80)+'%';}
  else if(side==='enemy'){d.style.left=clamp(62-i*9+jx,2,92)+'%';d.style.top=clamp(40+jy,12,72)+'%';}
  else{d.style.left=clamp(44+jx,2,92)+'%';d.style.top=clamp(30+jy,8,70)+'%';}
  stage.appendChild(d);setTimeout(()=>d.remove(),1050);
}

function burstAt(side,i,color){const stage=$('#stage');if(!stage)return;
  const x=side==='hero'?(10+i*9):(60-i*9), y=side==='hero'?52:42;
  for(let k=0;k<10;k++){const p=document.createElement('div');p.className='pt';p.style.color=color||'#ffd166';
    p.style.left=x+'%';p.style.top=y+'%';const ang=Math.random()*6.28,d=14+Math.random()*26;
    p.style.setProperty('--dx',Math.cos(ang)*d+'px');p.style.setProperty('--dy',(Math.sin(ang)*d-18)+'px');
    p.style.background=color||'#ffd166';stage.appendChild(p);setTimeout(()=>p.remove(),720);}}

  const x=side==='hero'?(10+i*9):(60-i*9), y=side==='hero'?52:42;
  for(let k=0;k<6;k++){const p=document.createElement('div');p.className='pt';p.style.color=color||'#fff';

/* ====================== MÁQUINA DE EXPLORAÇÃO ====================== */
function stepBegin(){
  if(!RUN.alive)return;
  updateFloorBadge();
  // anúncio de nova região a cada 5 andares
  const region=floorTheme(RUN.floor);
  if(RUN._lastRegion!==region.name){ RUN._lastRegion=region.name;
    logline(`<span class="sc">🌌 Você adentra uma nova região: <b>${region.name}</b>.</span>`,'sc');
    toast('🌌 '+region.name,'epico');
  }
  const isBoss=RUN.floor%5===0;
  logline(`<span class="sy">⌁ Andar ${RUN.floor}${isBoss?' — você sente uma presença colossal à frente...':' — '+region.name+'.'}</span>`,'ev');
  RUN.roomsTotal=computeRooms();RUN.room=0;
  rtimeout(walkNext,600);
}
function computeRooms(){
  const fam=G.meta.mapKnowledge[RUN.floor]||0;
  // andares bem mais longos e que crescem com a profundidade
  let base=10+Math.min(RUN.floor,24)+ri(1,4);
  base=Math.round(base*(1-fam*0.15));            // mapa conhecido ajuda só um pouco
  if(RUN.passive.alterFloor)base=Math.round(base*(1-RUN.passive.alterFloor));
  return Math.max(9,base);
}
function gainFamiliarity(amt){
  const m=1+(RUN.passive.mapBonus||0);
  const f=RUN.floor;G.meta.mapKnowledge[f]=clamp((G.meta.mapKnowledge[f]||0)+amt*m,0,1);updateRunRes();
}
function walkNext(){
  if(!RUN.alive)return;
  if(RUN.room>=RUN.roomsTotal)return floorClimax();
  RUN.scene.mode='walk';RUN.scene.enemies=[];
  rtimeout(doEncounter,ri(650,1200));
}
function advanceRoom(){
  if(!RUN.alive)return;
  RUN.room++;gainFamiliarity(0.05);saveGame();
  rtimeout(walkNext,500);
}
function floorClimax(){
  gainFamiliarity(0.25);
  if(RUN.floor%5===0){ return startBossFight(); }
  // escada
  logline('<span class="ev">🪜 Você encontra a escadaria para o próximo andar.</span>','ev');
  RUN.scene.mode='idle';
  rtimeout(()=>descend(),900);
}
function descend(){
  if(maybeSecretBoss())return;
  floorClearRewards();
  RUN.floor++;sfx('descend');
  if(RUN.floor>G.meta.deepestFloor){G.meta.deepestFloor=RUN.floor;milestoneCheck();checkUnlocks();}
  saveGame();
  rtimeout(stepBegin,500);
}

/* ---- gerador de encontro ---- */
function doEncounter(){
  if(!RUN.alive)return;
  // passagem secreta? (todos têm uma base; cresce com profundidade e passivas)
  const secretFind=0.03+Math.min(RUN.floor,30)*0.0025+(RUN.passive.secretFind||0)*0.6+(G.meta.research.meta_loot?0.03:0);
  if(chance(secretFind)){return encSecretPassage();}
  // elite raro (chance pequena, cresce com a profundidade)
  if(RUN.floor>=6 && chance(0.025+Math.min(RUN.floor,40)*0.0015)){return encElite();}
  const w={combate:42,tesouro:Math.round(15*(RUN.tideTreasure||1)),armadilha:Math.round(12*(RUN.tideTrap||1)),evento:Math.round(13*(RUN.tideEvent||1))};
  if(!RUN.tideNoRest)w.descanso=8;
  if(RUN.floor>=4)w.fonte=3;
  if(RUN.floor>=6)w.altar=5;
  w.mercador=3+Math.round(avgLuck()/4);
  const type=weighted(w);
  ({combate:encCombat,tesouro:encTreasure,armadilha:encTrap,evento:encEvent,
    descanso:encRest,fonte:encFountain,altar:encAltar,mercador:encMerchant}[type])();
}
function avgLuck(){return RUN.party.filter(c=>c.alive).reduce((a,c)=>a+c.st.lck,0)/Math.max(1,RUN.party.filter(c=>c.alive).length);}

/* ---- TESOURO ---- */
function encTreasure(){
  const flavor=pick(['Um baú empoeirado repousa num canto.','Ossos de um aventureiro guardam uma bolsa.','Um cofre rúnico zumbe baixinho.','Tesouros reluzem sob escombros.']);
  logline('💰 '+flavor,'lt');RUN.scene.mode='idle';sfx('treasure');
  const lootMult=1+(RUN.passive.lootBonus||0)+(G.meta.research.meta_loot?0.2:0);
  rtimeout(()=>{
    const gold=Math.round(ri(8,20)*RUN.floor*lootMult);grantGold(gold);
    if(chance(0.18*lootMult))grantMaterial();
    if(chance(0.04*lootMult))grantEquipment();
    advanceRoom();
  },700);
}
/* ---- ARMADILHA ---- */
function encTrap(){
  const evade=RUN.passive.trapEvade||0;
  const traps=['🔥 jato de chamas','🏹 dardos envenenados','⬇️ fosso de espinhos','❄️ runa congelante','🪨 teto desabando'];
  const tr=pick(traps);
  if(chance(evade)){logline('🪤 '+tr+' — mas a equipe a desarma a tempo! '+RAR_NAME.raro,'dn');
    if(chance(0.3))grantMaterial();rtimeout(advanceRoom,700);return;}
  logline('🪤 Armadilha! '+tr+' atinge o grupo!','bd');RUN.scene.shake=6;sfx('trap');
  const dmg=Math.round(ri(4,9)*RUN.floor*0.6);
  RUN.party.filter(c=>c.alive).forEach((c,i)=>{c.hp=Math.max(0,c.hp-dmg);floatText('hero',i,'-'+dmg,'#ff5d6c');if(c.hp===0)downHero(c);});
  refreshBars();checkWipe()||rtimeout(advanceRoom,800);
}
/* ---- DESCANSO ---- */
function encRest(){
  logline('🏕️ Uma sala silenciosa e segura. O grupo recupera o fôlego.','dn');RUN.scene.mode='idle';
  rtimeout(()=>{RUN.party.filter(c=>c.alive).forEach((c,i)=>{const h=Math.round(c.maxhp*0.08);c.hp=Math.min(c.maxhp,c.hp+h);floatText('hero',i,'+'+h,'#5fd17a');});
    refreshBars();advanceRoom();},700);
}
/* ---- FONTE DAS MEMÓRIAS (segredo) ---- */
function encFountain(){
  unlockSecret('fonte');

/* ---- ALTAR PROIBIDO (segredo) ---- */
function encAltar(){
  // AUTOMÁTICO: o grupo decide sozinho conforme o estado (sem cliques)
  unlockSecret('altar_proibido');RUN.scene.mode='idle';
  logline('🩸 <b class="tag-secret">Altar Proibido</b> — "Dê-me vida e te darei poder..."','sc');
  rtimeout(()=>{ altarChoose(altarAutoChoice()); },700);
}
function altarAutoChoice(){
  const alive=RUN.party.filter(c=>c.alive);
  const avgHp=alive.reduce((a,c)=>a+c.hp/c.maxhp,0)/Math.max(1,alive.length);
  // grupo saudável sacrifica sangue por equipamento; senão oferece essência se sobrar; senão ignora
  if(avgHp>0.6)return 'blood';
  if(G.meta.essence>=20*RUN.floor*2)return 'ess';
  return 'skip';
}
function altarChoose(opt){
  if(opt==='blood'){RUN.party.filter(c=>c.alive).forEach((c,i)=>{c.hp=Math.max(1,Math.round(c.hp*0.7));floatText('hero',i,'sacrifício','#c8324a');});refreshBars();
    grantEquipment('epico');logline('🩸 O grupo oferece sangue ao altar. Um artefato materializa-se.','sc');}
  else if(opt==='ess'){const cost=20*RUN.floor;if(G.meta.essence>=cost){G.meta.essence-=cost;updateRunRes();
    if(chance(0.25)){addItem('lampada_eterna',1);discover('items','lampada_eterna');logline('🏮 O altar concede uma RELÍQUIA MÍTICA!','sc');}
    else{grantMaterial('lendario');logline('💠 O altar concede um material raro.','sc');}saveGame();}
    else{logline('💠 Essência insuficiente. O altar silencia.','muted');}}
  else logline('🚶 O grupo ignora o altar e segue em frente.','muted');
  rtimeout(advanceRoom,600);
}
/* ---- MERCADOR ERRANTE (segredo) ---- */
const MERCH_GOODS={
  mat:{cost:80,label:'Material raro 🧱'}, equip:{cost:220,label:'Equipamento aleatório 🎁'},
  potion:{cost:70,label:'Poção de Vida 🧪',item:'pocao_vida'}, ether:{cost:100,label:'Elixir Maior 🍶',item:'pocao_grande'},
  bomb:{cost:95,label:'Bomba Arcana 💣',item:'bomba'}, heal:{cost:120,label:'Curar grupo agora ✨'},
};
function encMerchant(){
  // AUTOMÁTICO: conforme a preferência definida antes da incursão (mercado do acampamento)
  unlockSecret('mercador');RUN.scene.mode='idle';
  logline('🧙 <b class="tag-secret">O Mercador Errante</b> surge das sombras. "Só aceito Essência, viajante..."','sc');
  const mode=(G.meta.settings&&G.meta.settings.merchantAuto)||'smart';
  rtimeout(()=>{ merchAutoBuy(mode); rtimeout(advanceRoom,500); },700);
}
function merchAutoBuy(mode){
  if(mode==='skip'){logline('🧙 O grupo poupa Essência e segue viagem.','muted');return;}
  const keys=shuffle(Object.keys(MERCH_GOODS)).slice(0,3);
  let bought=0;
  keys.forEach(k=>{
    const g=MERCH_GOODS[k]; if(G.meta.essence<g.cost)return;
    let buy=false;
    if(mode==='buy')buy=true;                    // compra tudo que puder pagar
    else { // 'smart': compra com bom senso, sem torrar tudo
      const alive=RUN.party.filter(c=>c.alive);
      const avgHp=alive.reduce((a,c)=>a+c.hp/c.maxhp,0)/Math.max(1,alive.length);
      const reserve=80+RUN.floor*6;              // mantém uma reserva de essência
      if(G.meta.essence-g.cost<reserve)return;
      if((k==='heal'||k==='potion'||k==='ether')&&avgHp<0.6)buy=true;
      else if((k==='equip'||k==='mat')&&chance(0.5))buy=true;
      else if(k==='bomb'&&chance(0.4))buy=true;
    }
    if(buy){ G.meta.essence-=g.cost; updateRunRes();
      if(k==='mat')grantMaterial('raro');
      else if(k==='equip')grantEquipment();
      else if(g.item)addItem(g.item,1);
      else if(k==='heal'){RUN.party.filter(c=>c.alive).forEach((c,i)=>{const _h=Math.round(c.maxhp-c.hp);c.hp=c.maxhp;if(_h>0)floatText('hero',i,'+'+_h,'#5fd17a');});refreshBars();}
      logline('🧙 Comprado: '+g.label+' (−'+g.cost+' 💠).','dn'); bought++;
    }
  });
  if(!bought)logline('🧙 Nada que valha a Essência agora. O grupo segue.','muted');
  saveGame();
}

function runEssence(base){let b=base;if(RUN&&RUN.tideEssence)b*=RUN.tideEssence;const added=addEssence(Math.round(b));if(RUN)RUN.essence+=added;updateRunRes();return added;}
function floorClearRewards(){
  RUN.combo++;RUN.bestCombo=Math.max(RUN.bestCombo||0,RUN.combo);
  const comboMult=1+Math.min(RUN.combo*0.06,0.6); // até +60% por sequência sem morrer

function grantGold(n){let m=0.22;if(G.meta.flags.off_gold)m+=0.4;if(G.meta.research.meta_gold)m+=0.4;if(RUN&&RUN.tideGold)m*=RUN.tideGold;n=Math.round(n*m);RUN.gold+=n;G.meta.gold+=n;updateRunRes();   // ouro bem mais escasso
  logline('🪙 +'+n+' de ouro.','lt');saveGame();}
// TETO de raridade por profundidade: nada de lendário/épico nos andares rasos,
// nem mesmo de baús/segredos forçados. Achados raros são EVENTO de andar fundo.
function floorRarCap(f){
  if(f<6)return 'comum';
  if(f<12)return 'raro';
  if(f<24)return 'epico';
  if(f<40)return 'lendario';
  if(f<60)return 'mitico';
  if(f<90)return 'divino';
  return 'celestial';
}
function rarityRoll(minRar,cap){
  // tabela EXTREMAMENTE avara — itens bons são raros de verdade; lendário+ é evento
  const f=(RUN&&RUN.floor)||1,bonus=(G.meta.research.meta_loot?1:0);
  const w={
    comum:  Math.max(55,110-f*0.6),
    raro:   12+f*0.22,
    epico:  Math.max(0,(f-12)*0.13)+bonus*0.8,
    lendario:Math.max(0,(f-26)*0.05)+bonus*0.25,
    mitico: Math.max(0,(f-42)*0.022),
    divino: Math.max(0,(f-68)*0.010),
    celestial: Math.max(0,(f-100)*0.005),
  };
  let r=weighted(w);
  if(minRar){const order=RARS.indexOf(minRar);if(RARS.indexOf(r)<order)r=minRar;}
  if(cap!==false){const c=floorRarCap(f);if(RARS.indexOf(r)>RARS.indexOf(c))r=c;}   // teto por andar
  return r;
}
function grantMaterial(minRar,cap){
  const rar=rarityRoll(minRar,cap);
  let pool=ITEMS.filter(i=>i.type==='mat'&&RARS.indexOf(i.rarity)<=Math.max(RARS.indexOf(rar),1));
  // tende ao material da raridade sorteada
  const exact=ITEMS.filter(i=>i.type==='mat'&&i.rarity===rar);
  const it=pick(exact.length?exact:pool);
  if(!it)return;let qty=1;if(G.meta.research.meta_mat&&chance(0.3))qty=2;addItem(it.id,qty);
  logline('🧱 +'+qty+' <b style="color:'+RAR_COLOR[it.rarity]+'">'+it.name+'</b> <span class="tiny muted">('+RAR_NAME[it.rarity]+')</span>','lt');
  sfx(RARS.indexOf(it.rarity)>=2?'epic':'loot');
  if(!(typeof RUN!=='undefined'&&RUN))toast('🧱 '+it.name,it.rarity);
}
function grantEquipment(minRar,cap){
  // chance dedicada de soltar um ÚNICO do modo atual (Difícil/Inferno)
  const dmode=(RUN&&RUN.dungeon==='adranja'&&RUN.diff)||'normal';
  if(dmode!=='normal'&&chance(dmode==='inferno'?0.16:0.10)){
    const wants=dmode==='inferno'?(chance(0.5)?'inferno':'dificil'):'dificil';
    const mpool=ITEMS.filter(i=>isEquip(i)&&i.mode===wants&&!i.tower);
    if(mpool.length){const mi=pick(mpool);addItem(mi.id,1);if(RUN)RUN.equipFound=(RUN.equipFound||0)+1;discover('items',mi.id);
      logline('🔥 <b style="color:'+RAR_COLOR[mi.rarity]+'">'+mi.name+'</b> <span class="tiny muted">(único do '+(DIFFS[wants]?DIFFS[wants].name:wants)+')</span>','lt');
      sfx('epic');lootBurst(mi.rarity);if(!RUN)toast('🔥 '+mi.name,mi.rarity);return;}
  }
  const rar=rarityRoll(minRar,cap);
  const curTier=bandTier((typeof RUN!=='undefined'&&RUN)?RUN.floor:1);
  let pool=ITEMS.filter(i=>isEquip(i)&&i.rarity===rar&&!i.tower&&modeOK(i));
  // se há itens GERADOS desta raridade, restringe à faixa de profundidade (loot evolui com o andar)
  const banded=pool.filter(i=>i.band!==undefined);
  if(banded.length){
    const avail=banded.filter(i=>i.band<=curTier);
    const useTier=avail.length?Math.max(...avail.map(i=>i.band)):Math.min(...banded.map(i=>i.band));
    pool=banded.filter(i=>i.band===useTier);
  }
  if(!pool.length)pool=ITEMS.filter(i=>isEquip(i)&&RARS.indexOf(i.rarity)<=RARS.indexOf(rar)&&i.band===undefined&&!i.tower&&modeOK(i));
  if(!pool.length)pool=ITEMS.filter(i=>isEquip(i)&&!i.tower&&modeOK(i));
  const it=pick(pool);addItem(it.id,1);if(RUN)RUN.equipFound=(RUN.equipFound||0)+1;
  logline('🎁 Equipamento achado: <b style="color:'+RAR_COLOR[it.rarity]+'">'+it.name+'</b> <span class="tiny muted">('+RAR_NAME[it.rarity]+')</span>','lt');
  sfx(RARS.indexOf(it.rarity)>=2?'epic':'loot');lootBurst(it.rarity);
  if(!(typeof RUN!=='undefined'&&RUN))toast('🎁 '+it.name,it.rarity);
}
function grantSecretKey(){
  // decide qual chave secreta dropar
  const f=RUN.floor;const pool=[];
  if(f>=10&&invQty('chave_negra')<1)pool.push('chave_negra');
  if(f>=10&&invQty('olho_abissal')<1&&G.meta.codex.secrets.includes('chave_negra'))pool.push('olho_abissal');
  if(f>=8&&invQty('cristal_invocacao')<1)pool.push('cristal_invocacao');
  if(f>=12&&coroaCount()<3)pool.push('coroa_partida');
  if(f>=14&&invQty('selo_leviata')<1)pool.push('selo_leviata');
  if(f>=18&&invQty('fragmento_tempo')<3)pool.push('fragmento_tempo');
  if(f>=35&&invQty('coracao_estelar')<1)pool.push('coracao_estelar');
  if(!pool.length)pool.push(pick(['cristal_invocacao','fragmento_tempo']));
  const id=pick(pool);addItem(id,1);discover('items',id);
  const it=IMAP[id];logline('🗝️ <b class="tag-secret">ITEM SECRETO:</b> '+it.icon+' '+it.name+'!','sc');
  sfx('secret');lootBurst('secreto');toast('🗝️ '+it.icon+' '+it.name,'secreto');
  if(id==='chave_negra')unlockSecret('chave_negra');
  if(id==='olho_abissal'&&invQty('chave_negra')>0)unlockSecret('eco_vazio');
  if(id==='coroa_partida'){if(coroaCount()>=3)unlockSecret('coroa');}
  checkUnlocks();
}
function coroaCount(){return invQty('coroa_partida');}
// item eligível de Torre no modo atual (base sempre; difícil/inferno conforme a dificuldade)
function towerModeOK(it){ const d=(RUN&&RUN.diff)||'normal';
  if(!it.mode)return true; if(it.mode==='dificil')return d==='dificil'||d==='inferno'; if(it.mode==='inferno')return d==='inferno'; return false; }
function grantTowerUnique(){
  const pool=ITEMS.filter(i=>i.tower&&!i.towerSecret&&isEquip(i)&&towerModeOK(i));
  if(!pool.length)return false;
  const it=pick(pool);addItem(it.id,1);if(RUN)RUN.equipFound=(RUN.equipFound||0)+1;discover('items',it.id);
  logline('🗼 <b style="color:'+RAR_COLOR[it.rarity]+'">Despojo da Torre: '+it.name+'</b> <span class="tiny muted">('+RAR_NAME[it.rarity]+')</span>','lt');
  sfx('epic');lootBurst(it.rarity);if(!RUN)toast('🗼 '+it.name,it.rarity);return true;
}

/* ---- XP / NÍVEL ---- */
function grantXP(c,amt){
  if(!c.alive)return;
  let m=1;if(G.meta.research.meta_xp)m+=0.25;if(G.meta.research.meta_xp2)m+=0.25;if(RUN.passive.xpBonus)m+=RUN.passive.xpBonus;
  c.xp+=Math.round(amt*m);
  while(c.xp>=xpForLevel(c.level)){c.xp-=xpForLevel(c.level);levelUp(c);}
  // nível e XP são PERMANENTES — grava no acampamento
  const st=G.meta.heroes[c.id];st.level=c.level;st.xp=c.xp;
  refreshBars();
}
function levelUp(c){
  c.level++;sfx('levelup');burstAt('hero',RUN.party.indexOf(c),'#ffd166');
  const ns=heroStats(c.id,c.level);
  const dh=ns.maxhp-c.maxhp;c.maxhp=ns.maxhp;c.hp=Math.min(c.maxhp,c.hp+dh);
  c.st=ns;applyPassiveStart(c);
  logline('⬆️ <b>'+c.h.name.split(',')[0]+'</b> subiu para o Nível '+c.level+'!','dn');
  floatText('hero',RUN.party.indexOf(c),'NÍVEL '+c.level,'#ffd166');
  // nova habilidade permanente?
  const newSkills=c.h.skills.filter(sk=>sk.lvl===c.level);
  newSkills.forEach(sk=>{c.skills.push(sk);
    logline('✦ <b class="sy">Nova habilidade PERMANENTE:</b> '+sk.n+'!','sc');
    toast('✦ '+c.h.name.split(',')[0]+' aprendeu '+sk.n+'!','epico');});
  // nível permanente: grava no acampamento
  const st=G.meta.heroes[c.id];st.level=c.level;st.xp=c.xp;
  if(c.level>(st.maxLevelEver||1))st.maxLevelEver=c.level;
  saveGame();
}
function downHero(c){c.alive=false;c.hp=0;
  logline('☠️ <b>'+c.h.name.split(',')[0]+'</b> caiu!','bd');
  const pm=$('#pm_'+c.id);if(pm)pm.classList.add('dead');
  // paladino reviveOnce / pesquisa revive
  tryRevive(c);
}
function tryRevive(c){
  // revive de grupo (pesquisa) — uma vez por incursão
  if(!RUN._revivedParty){
    const palaAlive=RUN.party.some(p=>p.alive&&p.h.passive.tags&&p.h.passive.tags.reviveOnce);
    if(G.meta.research.meta_revive||RUN.passive.reviveOnce||palaAlive){
      RUN._revivedParty=true;c.alive=true;c.hp=Math.round(c.maxhp*0.5);
      logline('✨ <b>Pacto do Acampamento!</b> '+c.h.name.split(',')[0]+' renasce!','dn');
      floatText('hero',RUN.party.indexOf(c),'REVIVE','#67d8ff');refreshBars();
    }
  }
}
function checkWipe(){
  if(RUN.party.some(c=>c.alive))return false;
  endRun('death');return true;
}

function healMul(){return 1-((RUN&&RUN.passive&&RUN.passive.healCut)||0);}   // Maré da Fome corta cura
function healAll(frac,why){const hm=healMul();RUN.party.filter(c=>c.alive).forEach((c,i)=>{const h=Math.round(c.maxhp*frac*hm);c.hp=Math.min(c.maxhp,c.hp+h);floatText('hero',i,'+'+h,'#5fd17a');});if(why)logline('💚 '+why+'.','dn');refreshBars();}
function dmgAll(frac,why){RUN.scene.shake=5;RUN.party.filter(c=>c.alive).forEach((c,i)=>{const d=Math.round(c.maxhp*frac)+ri(1,3);c.hp=Math.max(0,c.hp-d);floatText('hero',i,'-'+d,'#ff5d6c');if(c.hp===0)downHero(c);});if(why)logline('💢 '+why+' fere o grupo.','bd');refreshBars();}

/* ====================== COMBATE ====================== */
function makeEnemy(monster,floor,boss){
  const b=monster.base;const tideHp=(RUN&&RUN.tideEnemyHp)||1;
  const dm=diffMul();   // multiplicador do modo (Normal/Difícil/Inferno) — só na Adranja
  if(boss){
    // chefes MUITO mais fortes que inimigos normais: PV alto (lutas longas) e dano pesado
    const hp=Math.round((250+floor*floor*15+floor*180)*tideHp*dm.hp);
    const atk=Math.round((20+floor*4.2+floor*floor*0.036)*dm.stat);
    const def=Math.round((13+floor*1.6)*dm.stat);
    const spd=Math.round(8+floor*0.18);
    return {m:monster,name:monster.name,boss:true,family:monster.family,el:monster.el,
      st:{atk,mag:atk,def,spd,lck:8},maxhp:hp,hp,alive:true,dead:false,hit:0,flash:0,fx:{}};
  }
  // inimigo normal: andares iniciais suaves, profundos brutais (quadrático domina tarde)
  const hpS=1+floor*0.20+floor*floor*0.006, atkS=1+floor*0.10+floor*floor*0.005, defS=1+floor*0.15, spdS=1+floor*0.05;
  const tideSpd=(RUN&&RUN.tideEnemySpd)||1;   // Maré da Tormenta acelera inimigos
  const maxhp=Math.round(b.hp*hpS*tideHp*dm.hp);
  return {m:monster,name:monster.name,boss:false,family:monster.family,el:monster.el,
    st:{atk:Math.round(b.atk*atkS*dm.stat),mag:Math.round(b.atk*atkS*dm.stat),def:Math.round(b.def*defS*dm.stat),spd:Math.round(b.spd*spdS*tideSpd),lck:5},
    maxhp,hp:maxhp,alive:true,dead:false,hit:0,flash:0,fx:{}};
}
function enemyPoolFor(floor){return MONSTERS.filter(m=>floor>=m.floors[0]&&floor<=m.floors[1]);}
function encCombat(){
  let pool=enemyPoolFor(RUN.floor);if(!pool.length)pool=MONSTERS;
  let count=1+ (chance(0.6)?1:0) + (RUN.floor>=4&&chance(0.45)?1:0) + (RUN.floor>=10&&chance(0.45)?1:0) + (RUN.floor>=22&&chance(0.4)?1:0);
  count=Math.min(count,5);
  if(RUN.passive.alterFloor&&chance(RUN.passive.alterFloor))count=Math.max(1,count-1);
  const enemies=[];for(let i=0;i<count;i++){const m=MMAP[weighted(Object.fromEntries(pool.map(x=>[x.id,x.weight])))]||pick(pool);enemies.push(makeEnemy(m,RUN.floor,false));}
  logline('⚔️ Encontro: '+enemies.map(e=>e.name).join(', ')+'!','cb');
  enemies.forEach(e=>discover('bestiary',e.m.id));
  beginCombat(enemies,{boss:false,onWin:()=>{
    // XP baseado em quantidade e andar (NÃO no PV inflado dos inimigos)
    const total=enemies.length*(6+RUN.floor*1.8);
    const alive=Math.max(1,RUN.party.filter(p=>p.alive).length);
    RUN.party.filter(c=>c.alive).forEach(c=>grantXP(c, total/alive));
    grantGold(Math.round(ri(4,10)*RUN.floor));
    RUN.kills+=enemies.length;G.meta.totalKills+=enemies.length;
    if(chance(0.10))grantMaterial();if(chance(0.012))grantEquipment();
    checkUnlocks();saveGame();advanceRoom();
  }});
}
function startBossFight(){
  const boss=getBossForFloor(RUN.floor);
  if(!boss){logline('🪜 Escada para o próximo andar.','ev');return rtimeout(descend,800);}
  const e=makeEnemy(boss,RUN.floor,true);
  logline('<span class="bd">═══ CHEFE: '+boss.name+' ═══</span>','bd');
  logline('<i>'+boss.intro+'</i>','sy');discover('bosses',boss.id);
  sfx('roar');bossCard(boss.name,boss.intro,false);showBossBar(e);
  beginCombat([e],{boss:true,bossDef:boss,onWin:()=>onBossWin(boss,e)});
}
function onBossWin(boss,e){
  hideBossBar();
  if(!G.meta.bossesKilled.includes(boss.id)){G.meta.bossesKilled.push(boss.id);}
  RUN.kills++;G.meta.totalKills++;RUN.bossKills=(RUN.bossKills||0)+1;
  const xp=18+RUN.floor*5;   // chefe: bom empurrão
  RUN.party.filter(c=>c.alive).forEach(c=>grantXP(c,xp));
  const ess=runEssence(30+RUN.floor*8);
  // recompensa por vencer o chefe: cura parcial do grupo (sobreviver ao chefe permite seguir adiante)
  RUN.party.filter(c=>c.alive).forEach((c,i)=>{const h=Math.round(c.maxhp*0.2);c.hp=Math.min(c.maxhp,c.hp+h);if(h>0)floatText('hero',i,'+'+h,'#5fd17a');});refreshBars();
  grantGold(Math.round(40*RUN.floor));
  grantEquipment(RUN.floor>=90?'divino':RUN.floor>=45?'mitico':RUN.floor>=22?'lendario':RUN.floor>=10?'epico':'raro',false);grantMaterial(RUN.floor>=20?'lendario':'raro',false);
  if(RUN.floor>=10)grantSecretKey();
  logline('🏆 <b>'+boss.name+' foi derrotado!</b> +'+ess+' essência.','dn');
  toast('🏆 Chefe derrotado: '+boss.name+'!','lendario');
  checkUnlocks();saveGame();
  // marcos narrativos
  if(boss.id==='dragao'){G.meta.flags.beatDragon=true;saveGame();
    logline('🐉 Você derrotou o lendário Valthrax... mas a escada continua a <b>descer</b>. A Adranja é mais funda do que se imaginava.','sc');}
  // vitória final só no Coração da Adranja (Andar 100)
  if(boss.id==='adranja_viva'){return victoryEnding();}
  if(boss.id==='coracao'){logline('💔 O Coração para... mas a Adranja continua a descer. Algo ainda respira lá no fundo, no Andar 200.','sc');}
  rtimeout(()=>maybeSecretBoss()||descend(),1100);
}
function showBossBar(e){const stage=$('#stage');if(!stage)return;
  let bar=document.createElement('div');bar.id='bossBar';bar.style.cssText='position:absolute;left:8px;right:8px;top:6px;';
  bar.innerHTML=`<div class="row between" style="margin-bottom:2px"><b style="color:#ff7a3c;font-size:12px;font-family:Cinzel">${e.name}</b><span class="tiny" id="bossHpTxt"></span></div><div class="bossbar"><i id="bossHp" style="width:100%"></i></div>`;
  stage.appendChild(bar);updateBossBar(e);}
function updateBossBar(e){const i=$('#bossHp'),t=$('#bossHpTxt');if(i)i.style.width=clamp(e.hp/e.maxhp*100,0,100)+'%';if(t)t.textContent=fmt(Math.max(0,e.hp))+'/'+fmt(e.maxhp);}
function hideBossBar(){const b=$('#bossBar');if(b)b.remove();}

/* ---- núcleo do combate ---- */
function allies(){return RUN.party.filter(c=>c.alive).concat((RUN.combat.minions||[]).filter(m=>m.alive));}
function aliveEnemies(){return RUN.combat.enemies.filter(e=>e.alive);}
function beginCombat(enemies,opts){
  RUN.scene.mode='combat';RUN.scene.enemies=enemies;RUN.scene.shake=4;
  RUN.combat={enemies,opts,minions:[],round:0,queue:[],boss:opts.boss};
  if(_audioReady)applyMusic();
  // invocações iniciais por passiva
  RUN.party.filter(c=>c.alive).forEach(c=>{const sm=c.h.passive.tags&&c.h.passive.tags.summon;if(sm)spawnMinion(c,sm);});
  // consumíveis automáticos no início do combate
  if(opts.boss){
    if(invQty('pergaminho_fogo')>0){removeItem('pergaminho_fogo',1);logline('📜 Pergaminho de Fogo incinera os inimigos!','cb');
      enemies.forEach(e=>{const d=Math.round(avgPartyPow()*3);applyDamageToEnemy(e,d,false,'fogo');if(e.hp<=0)killEnemy(e);});}
    else if(invQty('bomba')>0){removeItem('bomba',1);logline('💣 Bomba Arcana lançada no chefe!','cb');
      enemies.forEach(e=>{const d=Math.round(avgPartyPow()*2);applyDamageToEnemy(e,d,false,'fogo');if(e.hp<=0)killEnemy(e);});}
    if(invQty('pocao_forca')>0){removeItem('pocao_forca',1);RUN.party.filter(c=>c.alive).forEach(c=>c.st.atk=Math.round(c.st.atk*1.3));logline('⚗️ Poção de Força: +ataque do grupo!','cb');}
    if(invQty('pocao_foco')>0){removeItem('pocao_foco',1);RUN.party.filter(c=>c.alive).forEach(c=>c.st.mag=Math.round(c.st.mag*1.3));logline('🧴 Tônico Arcano: +dano mágico!','cb');}
    if(invQty('incenso')>0){removeItem('incenso',1);RUN.party.filter(c=>c.alive).forEach(c=>c.fx.shield=3);logline('🕯️ Incenso Sagrado: escudo no grupo!','cb');}
  }
  rtimeout(()=>combatRound(),500);
}
function spawnMinion(owner,kind){
  const base=owner.level*4+10;
  const m={h:{name:(kind==='esqueleto'?'Esqueleto':kind==='elemental'?'Elemental':'Aliado'),passive:{tags:{}},skills:[]},
    id:'minion_'+Math.random().toString(36).slice(2,6),isMinion:true,level:owner.level,
    st:{atk:Math.round(owner.st.atk*0.6+base),mag:Math.round(owner.st.mag*0.6+base),def:5,spd:owner.st.spd,lck:5},
    maxhp:base*4,hp:base*4,alive:true,fx:{},anim:{hit:0}};
  RUN.combat.minions.push(m);
  logline('🌀 '+owner.h.name.split(',')[0]+' invoca um '+m.h.name+'!','sy');
}
function avgPartyPow(){const a=allies();return a.reduce((s,c)=>s+Math.max(c.st.atk,c.st.mag),0)/Math.max(1,a.length);}

function combatRound(){
  if(!RUN||!RUN.alive||!RUN.combat||!RUN.combat.enemies)return;
  if(aliveEnemies().length===0)return winCombat();
  if(allies().length===0)return; // wipe tratado em downHero/checkWipe
  RUN.combat.round++;
  RUN.combat._extra=false;   // reinicia o gatilho de turno-extra a cada rodada
  // DoT no início da rodada
  processDoT();
  autoConsumables();
  if(aliveEnemies().length===0)return winCombat();
  if(allies().length===0)return checkWipe();
  // ordem por velocidade
  let order=allies().map(c=>({side:'hero',c})).concat(aliveEnemies().map(e=>({side:'enemy',c:e})));
  // firstStrike: heróis primeiro na rodada 1
  if(RUN.combat.round===1&&RUN.passive.firstStrike){order.sort((a,b)=>(a.side==='hero'?-1:1)-(b.side==='hero'?-1:1)||b.c.st.spd-a.c.st.spd);}
  else order.sort((a,b)=>b.c.st.spd-a.c.st.spd+(Math.random()-0.5));
  RUN.combat.queue=order;
  nextActor();
}
function nextActor(){
  if(!RUN||!RUN.alive||!RUN.combat||!RUN.combat.enemies)return;
  if(aliveEnemies().length===0)return winCombat();
  if(allies().length===0)return checkWipe();
  const q=RUN.combat.queue;
  if(!q.length){ // fim da rodada -> turno-extra dos heróis (uma vez por rodada, no máximo)
    if(RUN.passive.extraTurn&&!RUN.combat._extra&&chance(RUN.passive.extraTurn)){
      RUN.combat._extra=true;
      logline('⏳ Fluxo temporal! O grupo age novamente.','sy');
      RUN.combat.queue=allies().filter(actorAlive).map(c=>({side:'hero',c}));   // só os heróis agem de novo
      return rtimeout(nextActor,220);
    }
    return rtimeout(combatRound,260);
  }
  const turn=q.shift();const actor=turn.c;
  if(!actorAlive(actor))return nextActor();
  // atordoado?
  if(actor.fx.stun>0){actor.fx.stun--;logline(actorName(actor)+' está atordoado e perde o turno.','muted');return rtimeout(nextActor,300);}
  if(turn.side==='hero')heroAct(actor);else enemyAct(actor);
}
function actorAlive(a){return a.alive&&a.hp>0;}
function actorName(a){return a.h?a.h.name.split(',')[0]:a.name;}

function chooseHeroSkill(c){
  if(c.isMinion||!c.skills||!c.skills.length)return null;
  const deadAlly=RUN.party.find(p=>!p.alive);
  const revive=c.skills.find(s=>s.fx==='revive');
  if(deadAlly&&revive)return revive;
  const hurt=allies().filter(a=>a.h&&a.hp<a.maxhp*0.55);
  const heals=c.skills.filter(s=>s.kind==='heal'&&s.fx!=='revive');
  if(hurt.length&&heals.length&&chance(0.85)){heals.sort((a,b)=>(b.tgt==='allies')-(a.tgt==='allies')||b.pow-a.pow);return heals[0];}
  const buffs=c.skills.filter(s=>s.kind==='buff');
  if(buffs.length&&RUN.combat.round<=1&&chance(0.55))return pick(buffs);
  if(buffs.length&&chance(0.12))return pick(buffs);
  const offs=c.skills.filter(s=>s.kind==='phys'||s.kind==='mag');
  if(!offs.length)return null;
  let cands=offs.slice();
  if(aliveEnemies().length>=2){const aoe=offs.filter(s=>s.tgt==='all');if(aoe.length&&chance(0.7))cands=aoe;}
  cands.sort((a,b)=>b.pow-a.pow);
  return chance(0.6)?cands[0]:pick(cands);
}
function heroAct(c){
  const skill=chooseHeroSkill(c);
  if(!skill){ // ataque básico
    const tgt=chooseEnemyTarget();if(!tgt)return rtimeout(nextActor,160);
    c.anim.hit=1;hitEnemy(c,tgt,null);return rtimeout(nextActor,actDelay());
  }
  performSkill(c,skill);
}
function performSkill(c,skill){
  c.anim.hit=skill.kind==='heal'||skill.kind==='buff'?0.3:1;
  if(skill.kind==='heal'){
    sfx('heal');
    if(skill.fx==='revive'){const d=RUN.party.find(p=>!p.alive);if(d){d.alive=true;d.hp=Math.round(d.maxhp*0.45);
      logline('✨ '+actorName(c)+' usa <b>'+skill.n+'</b>! '+actorName(d)+' renasce!','dn');floatText('hero',RUN.party.indexOf(d),'REVIVE','#67d8ff');refreshBars();}}
    else{const tgts=skill.tgt==='allies'?allies():[mostHurt()];
      const amt=Math.round(((c.st.mag*0.4*skill.pow)+2)*healMul());
      tgts.forEach(t=>{if(!t)return;t.hp=Math.min(t.maxhp,t.hp+amt);if(t.h)floatText('hero',RUN.party.indexOf(t),'+'+amt,'#5fd17a');});
      logline('💚 '+actorName(c)+' usa <b>'+skill.n+'</b> (+'+amt+' PV).','dn');refreshBars();}
    return rtimeout(nextActor,actDelay());
  }
  if(skill.kind==='buff'){applyBuff(c,skill);return rtimeout(nextActor,actDelay());}
  // dano
  logline('✦ '+actorName(c)+' usa <b>'+skill.n+'</b>!',c===c.h?'':'cb');
  const tgts=skill.tgt==='all'?aliveEnemies().slice():[chooseEnemyTarget()];
  const hits=skill.fx==='double'?2:skill.fx==='triple'?3:1;
  let seq=0;
  const doHit=()=>{
    tgts.forEach(t=>{if(t&&t.alive)hitEnemy(c,t,skill);});
    seq++;if(seq<hits)rtimeout(doHit,140);else rtimeout(nextActor,actDelay());
  };doHit();
}
function applyBuff(c,skill){
  const fx=skill.fx;const allyList=allies();
  const log=(m)=>logline('🜂 '+actorName(c)+' usa <b>'+skill.n+'</b> — '+m,'sy');
  switch(fx){
    case 'taunt':c.fx.taunt=2;c.fx.resist=2;log('atrai e resiste aos golpes.');break;
    case 'shield':allyList.forEach(a=>a.fx.shield=2);log('escudo no grupo!');break;
    case 'resist':allyList.forEach(a=>a.fx.resist=2);log('reduz o dano recebido.');break;
    case 'atkup':allyList.forEach(a=>{a.st.atk=Math.round(a.st.atk*1.18);a.st.mag=Math.round(a.st.mag*1.18);});log('+ataque do grupo!');break;
    case 'allup':allyList.forEach(a=>{a.st.atk=Math.round(a.st.atk*1.15);a.st.mag=Math.round(a.st.mag*1.15);a.st.def=Math.round(a.st.def*1.15);a.st.spd=Math.round(a.st.spd*1.12);});log('TODOS os atributos sobem!');break;
    case 'haste':allyList.forEach(a=>a.st.spd=Math.round(a.st.spd*1.3));log('grupo acelerado!');break;
    case 'scout':case 'critmax':c.fx.critmax=2;log('próximos golpes são críticos!');break;
    case 'evade':case 'dodgeup':case 'phase':c.fx.evade=2;log('esquiva preparada.');break;
    case 'timestop':aliveEnemies().forEach(e=>e.fx.stun=(e.fx.stun||0)+1);log('o tempo congela os inimigos!');break;
    case 'summon':spawnMinion(c,'aliado');break;
    case 'trap':{const e=strongestEnemy();if(e){e.fx.stun=(e.fx.stun||0)+2;log('prende '+e.name+'!');}break;}
    case 'sacrifice':{const cost=Math.round(c.hp*0.25);c.hp-=cost;const e=chooseEnemyTarget();if(e){const d=Math.round(avgPartyPow()*2.4);applyDamageToEnemy(e,d,true,'sombrio');log('sacrifica vida por dano massivo!');}refreshBars();break;}
    case 'secret+':RUN._forceSecret=true;log('procura ativamente passagens secretas.');break;
    default:c.fx.shield=2;log('prepara-se.');
  }
}
function mostHurt(){return allies().filter(a=>a.h).sort((a,b)=>(a.hp/a.maxhp)-(b.hp/b.maxhp))[0];}
function strongestEnemy(){return aliveEnemies().sort((a,b)=>b.st.atk-a.st.atk)[0];}
function chooseEnemyTarget(){const es=aliveEnemies();if(!es.length)return null;
  // mira o de menor vida às vezes p/ finalizar
  if(chance(0.4))return es.sort((a,b)=>a.hp-b.hp)[0];return pick(es);}

function actDelay(){return 360;}

/* ---- aplicação de dano ---- */
function hitEnemy(att,e,skill){
  const r=computeDamage(att,e,skill);
  sfx(r.crit?'crit':'hit');
  applyDamageToEnemy(e,r.dmg,r.crit,skill?skill.el:att.el);
  // efeitos no inimigo
  if(skill){const f=skill.fx;
    if(f==='burn')e.fx.burn={d:Math.round(r.dmg*0.3),t:3};
    if(f==='poison')e.fx.poison={d:Math.round(r.dmg*0.25),t:4};
    if(f==='slow')e.st.spd=Math.round(e.st.spd*0.7);
    if(f==='stun')e.fx.stun=(e.fx.stun||0)+1;
    if(f==='curse')e.fx.curse=true;
    if(f==='execute'&&e.alive&&e.hp<e.maxhp*0.22){e.hp=0;}
    if(f==='lifesteal'&&att.h){const heal=Math.round(r.dmg*0.2);att.hp=Math.min(att.maxhp,att.hp+heal);if(att.h)floatText('hero',RUN.party.indexOf(att),'+'+heal,'#7dff8f');}
  }
  // lifesteal por passiva
  if(att.h&&att.h.passive.tags&&att.h.passive.tags.lifesteal){const heal=Math.round(r.dmg*att.h.passive.tags.lifesteal);att.hp=Math.min(att.maxhp,att.hp+heal);}
  if(att.fx.critmax){att.fx.critmax--;}
  if(e.hp<=0)killEnemy(e);
  refreshBars();
}
function computeDamage(att,def,skill){
  const kind=skill?skill.kind:'phys';
  let base=kind==='mag'?att.st.mag:att.st.atk;
  let pow=skill?(skill.pow||1):1;let raw=base*pow;
  const heroAtt=!!att.h&&!att.isMinion;
  if(kind==='mag'&&RUN.passive.spellAmp)raw*=1+RUN.passive.spellAmp;
  if(heroAtt&&att.h.passive.tags){const t=att.h.passive.tags;
    if(RUN.passive.beastBane&&def.family==='fera')raw*=1+RUN.passive.beastBane;
    if(t.rage)raw*=1+t.rage*(1-att.hp/att.maxhp);
    if(t.darkPower)raw*=1+t.darkPower;if(t.allMastery)raw*=1+t.allMastery;}
  if(skill&&skill.el==='sagrado'&&(def.family==='morto-vivo'||def.family==='demonio'))raw*=1.6;
  if(def.fx&&def.fx.curse)raw*=1.25;
  raw*=rnd(0.86,1.14);
  // crítico: base + sorte + bônus do GRUPO (critBonus de heróis/marés/pesquisas já somado em RUN.passive)
  let cc=0.05+(att.st.lck||0)*0.004+(RUN.passive.critBonus||0);
  if(skill&&skill.fx==='crit+')cc+=0.3;
  if(att.fx&&att.fx.critmax)cc=1;
  const crit=chance(cc);
  let dmg=Math.max(1,raw-(def.st.def||0)*0.5);if(crit)dmg*=1.85;
  if(def.fx&&def.fx.shield)dmg*=0.5;if(def.fx&&def.fx.resist)dmg*=0.8;
  return {dmg:Math.round(dmg),crit};
}
function applyDamageToEnemy(e,dmg,crit,el){
  e.hp-=dmg;e.hit=1;e.flash=1;RUN.scene.shake=Math.max(RUN.scene.shake,crit?5:2);
  const idx=RUN.scene.enemies.indexOf(e);
  floatText('enemy',Math.max(0,idx),(crit?'✸':'')+dmg,crit?'#ffd166':'#fff');
  sceneSpark('enemy',Math.max(0,idx),crit?'#ffd166':'#ff9a6c');
  // espinhos do guerreiro? (thorns aplicado em hero defense)
  if(e.boss)updateBossBar(e);
}
function killEnemy(e){if(e.dead)return;e.alive=false;e.dead=true;e.hp=0;
  logline('💀 '+e.name+' foi derrotado.','dn');

  // elites dão recompensa extra

    G.meta.tamedCount++;saveGame();spawnMinion(tamer,'fera');

  }
}
function winCombat(){
  if(!RUN||!RUN.combat)return;
  RUN.scene.mode='idle';RUN.scene.enemies=[];
  RUN.party.forEach(c=>{c.fx={};});
  const onWin=RUN.combat.opts.onWin;const wasBoss=RUN.combat.boss;
  RUN.combat.minions=[];
  if(RUN.passive.healRoom){RUN.party.filter(c=>c.alive).forEach(c=>{c.hp=Math.min(c.maxhp,c.hp+Math.round(c.maxhp*RUN.passive.healRoom));});refreshBars();}
  // volta à trilha de exploração
  RUN.combat.opts={};RUN.combat.boss=false;if(_audioReady)applyMusic();
  rtimeout(()=>{if(onWin)onWin();},700);
}
function enemyAct(e){
  const tauntHero=RUN.party.find(c=>c.alive&&c.fx.taunt>0);
  let tgt=tauntHero||pick(allies());
  if(!tgt)return rtimeout(nextActor,160);
  if(e.boss&&chance(0.38)){
    logline('☄️ '+e.name+' desencadeia um golpe terrível em todos!','bd');RUN.scene.shake=7;
    allies().slice().forEach(a=>{const r=computeDamage(e,a,{kind:'mag',pow:0.85});applyDamageToHero(a,r.dmg,r.crit,e);});
    return rtimeout(nextActor,actDelay());
  }
  const pow=e.boss&&chance(0.5)?1.5:1;
  const r=computeDamage(e,tgt,{kind:'phys',pow});
  applyDamageToHero(tgt,r.dmg,r.crit,e);
  rtimeout(nextActor,actDelay());
}
function applyDamageToHero(c,dmg,crit,attacker){
  const idx=RUN.party.indexOf(c);
  const t=(c.h&&c.h.passive.tags)||{};
  let avoid=(t.dodge||0)+(t.phase||0);if(c.fx.evade)avoid=1;
  if(avoid>0&&chance(avoid)){if(idx>=0)floatText('hero',idx,'esquiva!','#67d8ff');logline(actorName(c)+' esquiva do golpe!','muted');c.fx.evade=0;return;}
  if(RUN.passive.enemyDmg)dmg=Math.round(dmg*(1+RUN.passive.enemyDmg));   // marés que reforçam inimigos
  c.hp-=dmg;RUN.scene.shake=Math.max(RUN.scene.shake,crit?6:3);sfx('enemyhit');
  if(idx>=0){floatText('hero',idx,'-'+dmg,crit?'#ff5d6c':'#ffb0b0');sceneSpark('hero',idx,'#ff5d6c');}
  // espinhos / thorns
  if(attacker&&attacker.alive){const th=(t.thorns||0)+(RUN.passive.thorns&&c.fx.taunt?0:0);
    if(t.thorns){const ref=Math.round(dmg*t.thorns);attacker.hp-=ref;const ei=RUN.scene.enemies.indexOf(attacker);floatText('enemy',Math.max(0,ei),'-'+ref,'#ffd166');if(attacker.hp<=0)killEnemy(attacker);if(attacker.boss)updateBossBar(attacker);}}
  c.fx.evade=0;
  if(c.hp<=0){c.hp=0;if(c.isMinion){c.alive=false;logline('🌀 O aliado invocado se desfez.','muted');}else downHero(c);}
  refreshBars();
}
function processDoT(){
  aliveEnemies().forEach(e=>{['burn','poison'].forEach(k=>{if(e.fx[k]){e.hp-=e.fx[k].d;const ei=RUN.scene.enemies.indexOf(e);
    floatText('enemy',Math.max(0,ei),'-'+e.fx[k].d,k==='burn'?'#ff7a3c':'#5fd17a');e.fx[k].t--;if(e.fx[k].t<=0)delete e.fx[k];
    if(e.boss)updateBossBar(e);if(e.hp<=0)killEnemy(e);}});});
  allies().forEach(a=>{['shield','resist','taunt','critmax'].forEach(k=>{if(a.fx[k]>0){a.fx[k]--;if(a.fx[k]<=0)delete a.fx[k];}});});
  refreshBars();
}

function maybeSecretBoss(){
  // no máximo UM chefe secreto por incursão, e nunca garantido — cada run é diferente
  if(RUN._secretBossDone)return false;
  // monta a lista de chefes secretos ELEGÍVEIS (item + profundidade + ainda não derrotado)
  const elig=[];
  if(invQty('chave_negra')>0&&invQty('olho_abissal')>0&&RUN.floor>=8&&!G.meta.bossesKilled.includes('eco'))elig.push('eco');
  if(coroaCount()>=3&&RUN.floor>=12&&!G.meta.bossesKilled.includes('rei_esquecido'))elig.push('rei_esquecido');
  if(invQty('selo_leviata')>0&&RUN.floor>=14&&!G.meta.bossesKilled.includes('leviata'))elig.push('leviata');
  if(invQty('coracao_estelar')>0&&RUN.floor>=35&&!G.meta.bossesKilled.includes('arauto_estelar'))elig.push('arauto_estelar');
  if(invQty('fragmento_tempo')>=3&&RUN.floor>=22&&!G.meta.bossesKilled.includes('cronarca'))elig.push('cronarca');
  if(!elig.length)return false;
  // chance crescente com a profundidade (não aparece toda hora; aumenta quanto mais fundo você está)
  const ch=0.18+Math.min(RUN.floor,80)*0.004;   // ~21% no andar 8, ~50% no andar 80
  if(!chance(ch))return false;
  RUN._secretBossDone=true;
  startSecretBoss(pick(elig));
  return true;
}
function startSecretBoss(id){

const SECRET_BOSS_DROP={eco:'olho_onividente',rei_esquecido:'armadura_rei',leviata:'lamina_leviata',arauto_estelar:'manto_arauto',cronarca:'lamina_vazio'};
const SECRET_BOSSES=['eco','rei_esquecido','leviata','arauto_estelar','cronarca'];
function onSecretBossWin(boss,e){
  hideBossBar();if(!G.meta.bossesKilled.includes(boss.id))G.meta.bossesKilled.push(boss.id);

/* ============================================================================
   🗼 TORRE DOS TIRANOS — segunda dungeon: 50 andares, UM tirano colossal por andar.
   Mais difícil que a Adranja: o tirano do Andar 1 é mais forte que o chefe do
   Andar 10 da Adranja, e o do Andar 50 supera o chefe do Andar 200. Batalhas
   longas. Sobe-se a torre (em vez de descer). Há segredos entre os andares.
   ============================================================================ */
const TORRE_MAX=50;
const TORRE_TITLES=['Tirano','Soberano','Devorador','Carrasco','Arconte','Imperador','Profeta','Colosso','Juiz','Algoz','Rei','Avatar'];
const TORRE_DOMAINS=['da Brasa','do Gelo Eterno','das Correntes','do Trovão','da Ruína','do Sangue','das Trevas','do Vazio','da Praga','dos Ossos','da Tempestade','do Abismo','do Pesadelo','da Aurora Negra','do Eclipse','da Fome','do Silêncio','da Loucura','da Eternidade','do Fim'];
const TORRE_INTROS=['"Você subiu apenas para morrer mais alto."','"Nenhum mortal jamais passou deste andar."','"Eu sou o teto do seu destino."','"A Torre se alimenta de ambição como a sua."','"Ajoelhe-se, ou seja esmagado de pé."','"Já vi mil heróis virarem pó aqui."','"Suba mais. Eu insisto. Será delicioso."','"Este é o último degrau que você verá."'];
const TORRE_BOSSES=(function(){
  // formas-base imponentes reaproveitadas dos monstros
  const formIds=['golem_ancestral','colosso_void','serpe_estelar','arauto_fim','demonio_lava','cavaleiro_negro','aberracao','golem_p','cubo','olho'];
  const forms=formIds.map(id=>MMAP[id]).filter(Boolean);
  const schemes=['#c8324a|#8a1a2a|#ffd166','#67d8ff|#2a6a8a|#a0eaff','#a14bff|#3a1a4a|#ff5fa8','#5fd17a|#1a4a2a|#ffd166','#ff7a3c|#8a2a10|#ffea8a','#4a4a6a|#1a1a2a|#67d8ff','#1a1030|#0a0618|#a14bff','#d8b86a|#5a4428|#fff0c0','#ff5fa8|#6a1a3a|#ffd1e8','#8aa0d0|#2a3a5a|#ffffff'];
  const out=[];const used=new Set();
  for(let tf=1;tf<=TORRE_MAX;tf++){
    const form=forms[(tf*3)%forms.length];
    const sc=schemes[(tf*7)%schemes.length].split('|');
    const pal=Object.assign({},form.pal,{a:sc[0],b:sc[1],e:sc[2],c:sc[2],m:sc[0],r:sc[2]});
    const title=TORRE_TITLES[(tf+ (tf>>2))%TORRE_TITLES.length];
    let dom=TORRE_DOMAINS[(tf*2)%TORRE_DOMAINS.length];
    let name=title+' '+dom; let g=0; while(used.has(name)){g++;name=title+' '+TORRE_DOMAINS[(tf*2+g)%TORRE_DOMAINS.length];} used.add(name);
    const els=['fogo','gelo','arcano','veneno','sombrio','terra','sagrado'];
    out.push({id:'torre_'+tf, tf, name:(tf===TORRE_MAX?'☠ '+title+' Supremo, '+dom:name),
      family:form.family, el:els[tf%els.length], grid:form.grid, pal,
      intro:TORRE_INTROS[(tf*5)%TORRE_INTROS.length]});
  }
  return out;
})();
function torreBossFor(tf){return TORRE_BOSSES[Math.min(tf,TORRE_MAX)-1];}
function makeTorreBoss(boss,tf){
  // curva propositalmente BRUTAL — tiranos colossais. O do Andar 1 supera o chefe do
  // Andar 10 da Adranja; o do Andar 50 supera o chefe do Andar 200. Batalhas LONGAS.
  const dm=diffMul();   // Normal / Difícil / Inferno também valem na Torre
  const hp=Math.round((6000+tf*tf*620+tf*6200)*dm.hp);
  const atk=Math.round((72+tf*9+tf*tf*1.15)*dm.stat);
  const def=Math.round((28+tf*3.2)*dm.stat);
  const spd=Math.round(8+tf*0.2);
  return {m:boss,name:boss.name,boss:true,torre:true,family:boss.family,el:boss.el,grid:boss.grid,pal:boss.pal,
    st:{atk,mag:atk,def,spd,lck:12},maxhp:hp,hp,alive:true,dead:false,hit:0,flash:0,fx:{}};
}

}
function torreVictory(){
  if(_sceneRAF)cancelAnimationFrame(_sceneRAF);_sceneRAF=null;
  music('victory');sfx('win');
  const diff=(RUN&&RUN.diff)||'normal';
  const wasHard=!!G.meta.flags.beatTorreHard, wasInf=!!G.meta.flags.beatTorreInferno;
  G.meta.flags.beatTorre=true;
  if(diff==='dificil'||diff==='inferno')G.meta.flags.beatTorreHard=true;
  if(diff==='inferno')G.meta.flags.beatTorreInferno=true;
  let unlockMsg='';
  if(diff==='normal')unlockMsg='🔥 <b>Torre Difícil</b> destravada! Tiranos muito mais fortes e itens únicos te aguardam.';
  else if(diff==='dificil'&&!wasHard)unlockMsg='💀 <b>Torre Inferno</b> destravada! O ápice do desafio — e os equipamentos mais fortes do jogo.';
  else if(diff==='inferno'&&!wasInf)unlockMsg='👑 Você dominou o <b>Inferno</b> da Torre dos Tiranos. Não há rival acima de você.';
  saveGame();try{Rank.submit();if(typeof Account!=="undefined")Account.cloudSaveNow();}catch(e){}
  const s={reason:'torre_win',floor:RUN.floor,startFloor:RUN.startFloor||1,kills:RUN.kills,gold:RUN.gold,essence:RUN.essence,
    bestCombo:RUN.bestCombo||0,bossKills:RUN.bossKills||0,equipFound:RUN.equipFound||0,dur:Math.max(1,Math.round((Date.now()-(RUN._t0||Date.now()))/1000)),dungeon:'torre',diff};
  RUN=null;checkUnlocks();saveGame();CUR.screen='result';
  APP.innerHTML=`<div class="screen active" style="justify-content:center;overflow:auto;padding:14px">
    <div class="panel parch center" style="max-width:540px;margin:auto">
      <div style="font-size:60px">🗼👑</div>
      <h1 style="color:var(--gold);font-size:26px">Você conquistou a Torre dos Tiranos!</h1>
      <p class="small muted mt6">Os 50 tiranos caíram. Do alto da Torre, a Adranja inteira se curva. Você é uma lenda viva — e tudo que conquistou é permanente.</p>
      <p class="small mt6">Modo: <b style="color:${(DIFFS[diff]||DIFFS.normal).col}">${(DIFFS[diff]||DIFFS.normal).icon} ${(DIFFS[diff]||DIFFS.normal).name}</b></p>
      ${unlockMsg?`<p class="small mt6" style="color:var(--gold)">${unlockMsg}</p>`:''}
      <div class="row center wrap mt" style="justify-content:center;gap:6px">
        <button class="btn sm" onclick='shareResultImage(${JSON.stringify(s).replace(/'/g,"&#39;")})'>📤 Compartilhar imagem</button>
        <button class="btn ghost sm" onclick='saveResultImage(${JSON.stringify(s).replace(/'/g,"&#39;")})'>💾 Baixar imagem</button>
      </div>
      <div class="row center mt" style="justify-content:center"><button class="btn" onclick="go('camp','esquadrao')">Voltar ao Acampamento</button></div>
    </div></div>`;
}
function torreUnlocked(){return (G.meta.deepestFloor||1)>=50;}
function startTorreFlow(){
  if(RUN&&RUN.alive){returnToRun();return;}
  if(!torreUnlocked()){toast('Alcance o Andar 50 da Adranja para abrir a Torre.','warn');return;}
  const party=G.meta.party.filter(id=>G.meta.heroes[id].unlocked);
  if(party.length===0){toast('Monte uma equipe primeiro.','warn');return;}
  Sound.init();Sound.resume();
  const tides=rollTides(party);
  RUN_PENDING={party,tides,startFloor:1,dungeon:'torre',diff:'normal'};
  showPreRunScreen();
}

function autoConsumables(){
  const low=RUN.party.find(c=>c.alive&&c.hp<c.maxhp*0.15);
  if(!low)return;
  if(invQty("pocao_grande")>0){removeItem("pocao_grande",1);const _h=Math.round(Math.min(low.maxhp-low.hp,low.maxhp*0.6*healMul()));low.hp=Math.min(low.maxhp,low.hp+_h);
    floatText('hero',RUN.party.indexOf(low),'+'+_h,'#5fd17a');logline('🍶 Elixir Maior usado em '+actorName(low)+'.','dn');refreshBars();return;}
  if(invQty("pocao_vida")>0){removeItem("pocao_vida",1);const h=Math.round(low.maxhp*0.25*healMul());
    low.hp=Math.min(low.maxhp,low.hp+h);floatText('hero',RUN.party.indexOf(low),'+'+h,'#5fd17a');
    logline('🧪 Poção de Vida usada automaticamente em '+actorName(low)+'.','dn');refreshBars();}
}

/* ====================== FIM DA INCURSÃO ====================== */
function runShareText(s){
  const where=s.dungeon==='torre'?'na Torre dos Tiranos':'na Adranja';
  return `⚔️ Adranja — cheguei ao Andar ${s.floor} ${where}, derrotei ${s.kills} monstros e ${s.bossKills} chefes! (recorde: Andar ${G.meta.deepestFloor})`;
}
// desenha um CARTÃO-IMAGEM do resultado da incursão (para compartilhar como imagem, não link)
function genResultCanvas(s){
  const W=620,H=760,cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const x=cv.getContext('2d');
  const death=s.reason==='death',torre=s.dungeon==='torre',win=s.reason==='torre_win'||s.reason==='win';
  // fundo
  const bg=x.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#1a1330');bg.addColorStop(1,'#0e0a18');x.fillStyle=bg;x.fillRect(0,0,W,H);
  // moldura
  x.strokeStyle=death?'#c8324a':'#ffd166';x.lineWidth=6;x.strokeRect(14,14,W-28,H-28);
  x.strokeStyle='rgba(255,209,102,.25)';x.lineWidth=1;x.strokeRect(24,24,W-48,H-48);
  x.textAlign='center';
  // título do jogo
  x.fillStyle='#ffd166';x.font='bold 30px Georgia, serif';x.fillText('⚔ ADRANJA ⚔',W/2,72);
  x.fillStyle='#b39bff';x.font='15px Georgia, serif';x.fillText(torre?'TORRE DOS TIRANOS':'A Masmorra Viva',W/2,98);
  // emoji grande
  x.font='72px serif';x.fillText(death?'💀':(win?'👑':(torre?'🗼':'🏕️')),W/2,182);
  // título resultado
  x.fillStyle=death?'#ff6b78':'#ffd166';x.font='bold 26px Georgia, serif';
  x.fillText(win?'VITÓRIA!':(death?'Tombou na masmorra':'Recuou em segurança'),W/2,224);
  // rank badge
  const rank=s.floor>=150?'SS':s.floor>=100?'S':s.floor>=60?'A':s.floor>=30?'B':s.floor>=12?'C':'D';
  x.beginPath();x.arc(W/2,300,52,0,Math.PI*2);x.fillStyle='rgba(255,209,102,.12)';x.fill();
  x.strokeStyle='#ffd166';x.lineWidth=4;x.stroke();
  x.fillStyle='#ffd166';x.font='bold 46px Georgia, serif';x.fillText('Rank '.length?rank:rank,W/2,316);
  x.fillStyle='#cbd0d8';x.font='14px Georgia, serif';x.fillText('RANK',W/2,272);
  // stats
  const floors=Math.max(0,s.floor-(s.startFloor||1));
  const mm=Math.floor(s.dur/60),ss=s.dur%60;const durStr=(mm?mm+'m ':'')+ss+'s';
  const rows=[['🏰 Andar alcançado',s.floor],['🪜 Andares descidos',floors],['💀 Monstros',s.kills],['👑 Chefes',s.bossKills],
    ['🔥 Maior sequência','x'+s.bestCombo],['🎁 Equipamentos',s.equipFound],['🪙 Ouro',fmt(s.gold)],['💠 Essência',fmt(s.essence)],
    ['⏱️ Duração',durStr],['🏆 Recorde',('Andar '+G.meta.deepestFloor)]];
  let yy=390;x.font='18px Georgia, serif';
  rows.forEach((r,i)=>{
    const ry=yy+i*33;
    if(i%2===0){x.fillStyle='rgba(255,255,255,.04)';x.fillRect(60,ry-22,W-120,30);}
    x.textAlign='left';x.fillStyle='#d8dde6';x.fillText(r[0],74,ry);
    x.textAlign='right';x.fillStyle='#ffd166';x.font='bold 18px Georgia, serif';x.fillText(''+r[1],W-74,ry);
    x.font='18px Georgia, serif';
  });
  x.textAlign='center';x.fillStyle='#8a8fa0';x.font='13px Georgia, serif';
  x.fillText('Adranja • RPG roguelike • jogue você também',W/2,H-40);
  return cv;
}
function downloadCanvas(cv,name){const a=document.createElement('a');a.download=name;a.href=cv.toDataURL('image/png');a.click();}
function shareResultImage(s){
  const cv=genResultCanvas(s);const name='adranja-andar-'+s.floor+'.png';
  if(cv.toBlob){
    cv.toBlob(async(blob)=>{
      try{
        const file=new File([blob],name,{type:'image/png'});
        if(navigator.canShare&&navigator.canShare({files:[file]})){
          await navigator.share({files:[file],text:runShareText(s),title:'Adranja'});return;
        }
      }catch(e){ if(e&&e.name==='AbortError')return; }
      downloadCanvas(cv,name);toast('💾 Imagem salva! Compartilhe onde quiser.','epico');
    },'image/png');
  } else { downloadCanvas(cv,name);toast('💾 Imagem salva!','epico'); }
}
function saveResultImage(s){downloadCanvas(genResultCanvas(s),'adranja-andar-'+s.floor+'.png');toast('💾 Imagem salva!','epico');}
function copyShareText(s){try{navigator.clipboard.writeText(runShareText(s));toast('📋 Texto copiado!','epico');}catch(e){toast('Não foi possível copiar.','warn');}}
function endRun(reason){
  if(!RUN)return;
  const dur=Math.max(1,Math.round((Date.now()-(RUN._t0||Date.now()))/1000));
  const summary={reason,floor:RUN.floor,startFloor:RUN.startFloor||1,kills:RUN.kills,gold:RUN.gold,essence:RUN.essence,
    bestCombo:RUN.bestCombo||0,bossKills:RUN.bossKills||0,equipFound:RUN.equipFound||0,dur,
    dungeon:RUN.dungeon||'adranja', diff:RUN.diff||'normal'};
  if(_sceneRAF)cancelAnimationFrame(_sceneRAF);_sceneRAF=null;
  RUN=null;checkUnlocks();saveGame();
  try{Rank.submit();if(typeof Account!=="undefined")Account.cloudSaveNow();}catch(e){}   // envia conquistas ao ranking
  CUR.screen='result';showResult(summary);
}
function showResult(s){
  const death=s.reason==='death'; const torre=s.dungeon==='torre';
  if(death){Sound.stop();sfx('death');}else{music('camp');sfx('chest');}
  const floors=Math.max(0,s.floor-(s.startFloor||1));
  const mm=Math.floor(s.dur/60), ss=s.dur%60; const durStr=(mm?mm+'m ':'')+ss+'s';
  const title=death?(torre?'A Torre te esmagou':'A Adranja te consumiu'):'Você recuou em segurança';
  // medalha de desempenho
  const rank=s.floor>=150?'SS':s.floor>=100?'S':s.floor>=60?'A':s.floor>=30?'B':s.floor>=12?'C':'D';
  const sj=JSON.stringify(s).replace(/'/g,'&#39;');
  APP.innerHTML=`<div class="screen active" style="justify-content:flex-start;overflow:auto;padding:14px">
    <div class="panel parch center" style="max-width:540px;margin:auto">
      <div style="font-size:56px">${death?'💀':(torre?'🗼':'🏕️')}</div>
      <h1 style="color:${death?'var(--bad)':'var(--gold)'};font-size:26px;margin:2px 0">${title}</h1>
      <div class="row center" style="justify-content:center;gap:8px;margin:6px 0">
        <span class="chip" style="font-size:20px;font-family:Cinzel;color:var(--gold);border-color:var(--gold)">Rank ${rank}</span>
        <span class="chip">${torre?'🗼 Torre dos Tiranos':'🏰 Adranja'}</span>
        ${(s.diff&&s.diff!=='normal')?`<span class="chip" style="color:${DIFFS[s.diff].col};border-color:${DIFFS[s.diff].col}">${DIFFS[s.diff].icon} ${DIFFS[s.diff].name}</span>`:''}
      </div>
      <p class="small muted">${death?'Seus heróis caem... mas a masmorra os cospe de volta. <b>Nada é perdido</b> — níveis, habilidades, itens e segredos continuam com você.':'De volta ao acampamento, sãos e salvos. Tudo que você conquistou continua seu.'}</p>
      <div class="divider"></div>
      <div class="kvs" style="max-width:340px;margin:0 auto">
        <span>🏰 Andar alcançado</span><b>${s.floor}</b>
        <span>🪜 Andares descidos</span><b>${floors}</b>
        <span>💀 Monstros derrotados</span><b>${s.kills}</b>
        <span>👑 Chefes derrotados</span><b>${s.bossKills}</b>
        <span>🔥 Maior sequência</span><b>x${s.bestCombo}</b>
        <span>🎁 Equipamentos achados</span><b>${s.equipFound}</b>
        <span>🪙 Ouro coletado</span><b>${fmt(s.gold)}</b>
        <span>💠 Essência ganha</span><b>${fmt(s.essence)}</b>
        <span>⏱️ Duração</span><b>${durStr}</b>
        <span>🏆 Recorde de profundidade</span><b>${G.meta.deepestFloor}</b>
      </div>
      <div class="divider"></div>
      <p class="tiny muted" style="margin-bottom:6px">📣 Compartilhe uma <b>imagem</b> do resultado:</p>
      <div class="row center wrap" style="justify-content:center;gap:6px">
        <button class="btn sm" onclick='shareResultImage(${sj})'>📤 Compartilhar imagem</button>
        <button class="btn ghost sm" onclick='saveResultImage(${sj})'>💾 Baixar imagem</button>
        <button class="btn ghost sm" onclick='copyShareText(${sj})'>📋 Copiar texto</button>
      </div>
      <div class="divider"></div>
      <div class="row center mt wrap" style="justify-content:center">
        <button class="btn" onclick="go('camp','esquadrao')">Voltar ao Acampamento</button>
        <button class="btn ghost" onclick="startRunFlow()">Nova Incursão ▶</button>
        <button class="btn ghost" onclick="showRanking()">🏆 Ranking</button>
      </div>
    </div></div>`;
}
function victoryEnding(){
  if(_sceneRAF)cancelAnimationFrame(_sceneRAF);_sceneRAF=null;
  music('victory');sfx('win');
  const diff=(RUN&&RUN.diff)||'normal';
  const s={floor:RUN.floor,kills:RUN.kills,gold:RUN.gold,essence:RUN.essence,diff};
  const wasHard=!!G.meta.flags.beatHard, wasInf=!!G.meta.flags.beatInferno;
  RUN=null;G.meta.flags.beatGame=true;
  if(diff==='dificil'||diff==='inferno')G.meta.flags.beatHard=true;
  if(diff==='inferno')G.meta.flags.beatInferno=true;
  // mensagem do que foi destravado agora
  let unlockMsg='';
  if(diff==='normal')unlockMsg='🔥 Modo <b>Difícil</b> destravado! Inimigos muito mais fortes e itens únicos te aguardam.';
  else if(diff==='dificil'&&!wasHard)unlockMsg='💀 Modo <b>Inferno</b> destravado! O desafio final — e os equipamentos mais fortes do jogo.';
  else if(diff==='inferno'&&!wasInf)unlockMsg='👑 Você dominou o <b>Inferno</b> da Adranja. Não há mais fundo a descer... por ora.';
  s.unlockMsg=unlockMsg;
  saveGame();try{Rank.submit();if(typeof Account!=="undefined")Account.cloudSaveNow();}catch(e){}CUR.screen='result';
  APP.innerHTML=`<div class="screen active" style="justify-content:center">
    <div class="panel parch center" style="max-width:540px;margin:auto;border-color:var(--gold)">
      <div style="font-size:64px">💖👑✨</div>
      <h1 class="logo" style="font-size:40px">VITÓRIA</h1>
      <p class="small mt6">No <b>Andar 100</b>, o Coração da Adranja para de bater. A masmorra inteira estremece, suas paredes se dissolvem em luz — e, pela primeira vez em eras, ela <b>lembra de você</b>.</p>
      <p class="small muted">Você conquistou as 100 profundidades da Adranja. Pouquíssimos chegaram tão fundo. Mas a masmorra é mágica... e sempre há um segredo a mais para quem ousa voltar.</p>
      <div class="divider"></div>
      <p class="small">Chegou ao <b>Andar ${s.floor}</b> · ${s.kills} abates nesta incursão.</p>
      <p class="small mt6">Modo: <b style="color:${(DIFFS[s.diff]||DIFFS.normal).col}">${(DIFFS[s.diff]||DIFFS.normal).icon} ${(DIFFS[s.diff]||DIFFS.normal).name}</b></p>
      ${s.unlockMsg?`<p class="small mt6" style="color:var(--gold)">${s.unlockMsg}</p>`:''}
      <p class="tiny tag-secret mt6">🏆 Lenda da Adranja — você zerou as 200 profundidades!</p>
      <div class="row center mt" style="justify-content:center">
        <button class="btn" onclick="go('camp','esquadrao')">Voltar ao Acampamento 🏕️</button>
      </div>
    </div></div>`;
}

/* ====================== ÁUDIO: contexto/transições ====================== */
function desiredTrack(){
  if(CUR.screen==='home'||CUR.screen==='camp')return 'camp';
  if(CUR.screen==='result')return RUN?null:'camp';
  if(CUR.screen==='dungeon'){
    if(RUN&&RUN.combat){const o=RUN.combat.opts||{};
      if(o.secret)return 'secret';if(o.bossDef||o.boss)return trackVariant('boss');return trackVariant('battle');}
    return trackVariant('explore');
  }
  return 'camp';
}
function applyMusic(){const t=desiredTrack();if(t)music(t);else Sound.stop();}
let _audioReady=false;
function firstGesture(){if(_audioReady)return;_audioReady=true;Sound.init();Sound.resume();applyMusic();}

/* ====================== BOOT ====================== */
function boot(){
  loadGame();checkUnlocks();
  go('home');
  // acesso oculto à configuração do ranking (só o dono usa): abra a URL com #setup
  if(location.hash==='#setup'||location.hash==='#rank-setup'){ try{localStorage.setItem('adranja_owner','1');}catch(e){} setTimeout(()=>{try{rankSetupModal();}catch(e){}},300); }
  // detecta sessão de conta (assíncrono); ao resolver, atualiza a home p/ mostrar "Meus saves"
  try{ if(Account.available())Account.watch(()=>{ if(CUR.screen==='home')renderHome(); }); }catch(e){}
  // primeira interação destrava o áudio (política de autoplay)
  ['pointerdown','keydown','touchstart'].forEach(ev=>window.addEventListener(ev,firstGesture,{once:false}));
  // som de clique em botões/abas
  document.addEventListener('pointerdown',e=>{const b=e.target.closest('.btn,.tab,.hero-card,.item,.x-close');if(b)sfx('click');},true);
  setInterval(()=>{
    if(!G.meta)return;
    checkResearch();
    if(CUR.screen==='camp'&&CUR.tab==='biblioteca')renderTab();
  },1000);
  document.addEventListener('visibilitychange',()=>{if(document.hidden){saveGame();if(Sound.ctx)Sound.musGain&&(Sound.musGain.gain.value=0);}else{if(Sound.ctx&&Sound.on)Sound.musGain.gain.value=Sound.musVol;}});
}
window.addEventListener('DOMContentLoaded',boot);
</script>
