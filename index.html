}
function showBossBar(e){const stage=$('#stage');if(!stage)return;
  let bar=document.createElement('div');bar.id='bossBar';bar.style.cssText='position:absolute;left:8px;right:8px;top:6px;';
  bar.innerHTML=`<div class="row between" style="margin-bottom:2px"><b style="color:#ff7a3c;font-size:12px;font-family:Cinzel">${e.name}</b><span class="tiny" id="bossHpTxt"></span></div><div class="bossbar"><i id="bossHp" style="width:100%"></i></div>`;
  stage.appendChild(bar);updateBossBar(e);}
function updateBossBar(e){const i=$('#bossHp'),t=$('#bossHpTxt');if(i)i.style.width=clamp(e.hp/e.maxhp*100,0,100)+'%';if(t)t.textContent=fmt(Math.max(0,e.hp))+'/'+fmt(e.maxhp);}
function hideBossBar(){const b=$('#bossBar');if(b)b.remove();}

/* ---- núcleo do combate ---- */
function allies(){return RUN.party.filter(c=>c.alive).concat((RUN.combat.minions||[]).filter(m=>m.alive));}
function aliveEnemies(){return RUN.combat.enemies.filter(e=>e.alive);}
function beginCombat(enemies,opts){
  RUN.scene.mode='combat';RUN.scene.enemies=enemies;RUN.scene.shake=4;
  RUN.combat={enemies,opts,minions:[],round:0,queue:[],boss:opts.boss};
  if(_audioReady)applyMusic();
  // invocações iniciais por passiva
  RUN.party.filter(c=>c.alive).forEach(c=>{const sm=c.h.passive.tags&&c.h.passive.tags.summon;if(sm)spawnMinion(c,sm);});
  // poção/bomba automática no início (consumível)
  if(opts.boss&&invQty('bomba')>0){removeItem('bomba',1);logline('💣 Bomba Arcana lançada no chefe!','cb');
    enemies.forEach(e=>{const d=Math.round(avgPartyPow()*2);applyDamageToEnemy(e,d,false,'fogo');if(e.hp<=0)killEnemy(e);});}
  rtimeout(()=>combatRound(),500);
}
function spawnMinion(owner,kind){
  const base=owner.level*4+10;
  const m={h:{name:(kind==='esqueleto'?'Esqueleto':kind==='elemental'?'Elemental':'Aliado'),passive:{tags:{}},skills:[]},
    id:'minion_'+Math.random().toString(36).slice(2,6),isMinion:true,level:owner.level,
    st:{atk:Math.round(owner.st.atk*0.6+base),mag:Math.round(owner.st.mag*0.6+base),def:5,spd:owner.st.spd,lck:5},
    maxhp:base*4,hp:base*4,alive:true,fx:{},anim:{hit:0}};
  RUN.combat.minions.push(m);
  logline('🌀 '+owner.h.name.split(',')[0]+' invoca um '+m.h.name+'!','sy');
}
function avgPartyPow(){const a=allies();return a.reduce((s,c)=>s+Math.max(c.st.atk,c.st.mag),0)/Math.max(1,a.length);}

function combatRound(){
  if(!RUN||!RUN.alive||!RUN.combat||!RUN.combat.enemies)return;
  if(aliveEnemies().length===0)return winCombat();
  if(allies().length===0)return; // wipe tratado em downHero/checkWipe
  RUN.combat.round++;
  // DoT no início da rodada
  processDoT();
  autoConsumables();
  if(aliveEnemies().length===0)return winCombat();
  if(allies().length===0)return checkWipe();
  // ordem por velocidade
  let order=allies().map(c=>({side:'hero',c})).concat(aliveEnemies().map(e=>({side:'enemy',c:e})));
  // firstStrike: heróis primeiro na rodada 1
  if(RUN.combat.round===1&&RUN.passive.firstStrike){order.sort((a,b)=>(a.side==='hero'?-1:1)-(b.side==='hero'?-1:1)||b.c.st.spd-a.c.st.spd);}
  else order.sort((a,b)=>b.c.st.spd-a.c.st.spd+(Math.random()-0.5));
  RUN.combat.queue=order;
  nextActor();
}
function nextActor(){
  if(!RUN||!RUN.alive||!RUN.combat||!RUN.combat.enemies)return;
  if(aliveEnemies().length===0)return winCombat();
  if(allies().length===0)return checkWipe();
  const q=RUN.combat.queue;
  if(!q.length){ // fim da rodada -> extraTurn?
    if(RUN.passive.extraTurn&&chance(RUN.passive.extraTurn)){logline('⏳ Fluxo temporal! O grupo age novamente.','sy');}
    return rtimeout(combatRound,260);
  }
  const turn=q.shift();const actor=turn.c;
  if(!actorAlive(actor))return nextActor();
  // atordoado?
  if(actor.fx.stun>0){actor.fx.stun--;logline(actorName(actor)+' está atordoado e perde o turno.','muted');return rtimeout(nextActor,300);}
  if(turn.side==='hero')heroAct(actor);else enemyAct(actor);
}
function actorAlive(a){return a.alive&&a.hp>0;}
function actorName(a){return a.h?a.h.name.split(',')[0]:a.name;}

function chooseHeroSkill(c){
  if(c.isMinion||!c.skills||!c.skills.length)return null;
  const deadAlly=RUN.party.find(p=>!p.alive);
  const revive=c.skills.find(s=>s.fx==='revive');
  if(deadAlly&&revive)return revive;
  const hurt=allies().filter(a=>a.h&&a.hp<a.maxhp*0.55);
  const heals=c.skills.filter(s=>s.kind==='heal'&&s.fx!=='revive');
  if(hurt.length&&heals.length&&chance(0.85)){heals.sort((a,b)=>(b.tgt==='allies')-(a.tgt==='allies')||b.pow-a.pow);return heals[0];}
  const buffs=c.skills.filter(s=>s.kind==='buff');
  if(buffs.length&&RUN.combat.round<=1&&chance(0.55))return pick(buffs);
  if(buffs.length&&chance(0.12))return pick(buffs);
  const offs=c.skills.filter(s=>s.kind==='phys'||s.kind==='mag');
  if(!offs.length)return null;
  let cands=offs.slice();
  if(aliveEnemies().length>=2){const aoe=offs.filter(s=>s.tgt==='all');if(aoe.length&&chance(0.7))cands=aoe;}
  cands.sort((a,b)=>b.pow-a.pow);
  return chance(0.6)?cands[0]:pick(cands);
}
function heroAct(c){
  const skill=chooseHeroSkill(c);
  if(!skill){ // ataque básico
    const tgt=chooseEnemyTarget();if(!tgt)return rtimeout(nextActor,160);
    c.anim.hit=1;hitEnemy(c,tgt,null);return rtimeout(nextActor,actDelay());
  }
  performSkill(c,skill);
}
function performSkill(c,skill){
  c.anim.hit=skill.kind==='heal'||skill.kind==='buff'?0.3:1;
  if(skill.kind==='heal'){
    sfx('heal');
    if(skill.fx==='revive'){const d=RUN.party.find(p=>!p.alive);if(d){d.alive=true;d.hp=Math.round(d.maxhp*0.45);
      logline('✨ '+actorName(c)+' usa <b>'+skill.n+'</b>! '+actorName(d)+' renasce!','dn');floatText('hero',RUN.party.indexOf(d),'REVIVE','#67d8ff');refreshBars();}}
    else{const tgts=skill.tgt==='allies'?allies():[mostHurt()];
      const amt=Math.round((c.st.mag*0.8*skill.pow)+4);
      tgts.forEach(t=>{if(!t)return;t.hp=Math.min(t.maxhp,t.hp+amt);if(t.h)floatText('hero',RUN.party.indexOf(t),'+'+amt,'#5fd17a');});
      logline('💚 '+actorName(c)+' usa <b>'+skill.n+'</b> (+'+amt+' PV).','dn');refreshBars();}
    return rtimeout(nextActor,actDelay());
  }
  if(skill.kind==='buff'){applyBuff(c,skill);return rtimeout(nextActor,actDelay());}
  // dano
  logline('✦ '+actorName(c)+' usa <b>'+skill.n+'</b>!',c===c.h?'':'cb');
  const tgts=skill.tgt==='all'?aliveEnemies().slice():[chooseEnemyTarget()];
  const hits=skill.fx==='double'?2:skill.fx==='triple'?3:1;
  let seq=0;
  const doHit=()=>{
    tgts.forEach(t=>{if(t&&t.alive)hitEnemy(c,t,skill);});
    seq++;if(seq<hits)rtimeout(doHit,140);else rtimeout(nextActor,actDelay());
  };doHit();
}
function applyBuff(c,skill){
  const fx=skill.fx;const allyList=allies();
  const log=(m)=>logline('🜂 '+actorName(c)+' usa <b>'+skill.n+'</b> — '+m,'sy');
  switch(fx){
    case 'taunt':c.fx.taunt=2;c.fx.resist=2;log('atrai e resiste aos golpes.');break;
    case 'shield':allyList.forEach(a=>a.fx.shield=2);log('escudo no grupo!');break;
    case 'resist':allyList.forEach(a=>a.fx.resist=2);log('reduz o dano recebido.');break;
    case 'atkup':allyList.forEach(a=>{a.st.atk=Math.round(a.st.atk*1.18);a.st.mag=Math.round(a.st.mag*1.18);});log('+ataque do grupo!');break;
    case 'allup':allyList.forEach(a=>{a.st.atk=Math.round(a.st.atk*1.15);a.st.mag=Math.round(a.st.mag*1.15);a.st.def=Math.round(a.st.def*1.15);a.st.spd=Math.round(a.st.spd*1.12);});log('TODOS os atributos sobem!');break;
    case 'haste':allyList.forEach(a=>a.st.spd=Math.round(a.st.spd*1.3));log('grupo acelerado!');break;
    case 'scout':case 'critmax':c.fx.critmax=2;log('próximos golpes são críticos!');break;
    case 'evade':case 'dodgeup':case 'phase':c.fx.evade=2;log('esquiva preparada.');break;
    case 'timestop':aliveEnemies().forEach(e=>e.fx.stun=(e.fx.stun||0)+1);log('o tempo congela os inimigos!');break;
    case 'summon':spawnMinion(c,'aliado');break;
    case 'trap':{const e=strongestEnemy();if(e){e.fx.stun=(e.fx.stun||0)+2;log('prende '+e.name+'!');}break;}
    case 'sacrifice':{const cost=Math.round(c.hp*0.25);c.hp-=cost;const e=chooseEnemyTarget();if(e){const d=Math.round(avgPartyPow()*2.4);applyDamageToEnemy(e,d,true,'sombrio');log('sacrifica vida por dano massivo!');}refreshBars();break;}
    case 'secret+':RUN._forceSecret=true;log('procura ativamente passagens secretas.');break;
    default:c.fx.shield=2;log('prepara-se.');
  }
}
function mostHurt(){return allies().filter(a=>a.h).sort((a,b)=>(a.hp/a.maxhp)-(b.hp/b.maxhp))[0];}
function strongestEnemy(){return aliveEnemies().sort((a,b)=>b.st.atk-a.st.atk)[0];}
function chooseEnemyTarget(){const es=aliveEnemies();if(!es.length)return null;
  // mira o de menor vida às vezes p/ finalizar
  if(chance(0.4))return es.sort((a,b)=>a.hp-b.hp)[0];return pick(es);}

function actDelay(){return 360;}

/* ---- aplicação de dano ---- */
function hitEnemy(att,e,skill){
  const r=computeDamage(att,e,skill);
  sfx(r.crit?'crit':'hit');
  applyDamageToEnemy(e,r.dmg,r.crit,skill?skill.el:att.el);
  // efeitos no inimigo
  if(skill){const f=skill.fx;
    if(f==='burn')e.fx.burn={d:Math.round(r.dmg*0.3),t:3};
    if(f==='poison')e.fx.poison={d:Math.round(r.dmg*0.25),t:4};
    if(f==='slow')e.st.spd=Math.round(e.st.spd*0.7);
    if(f==='stun')e.fx.stun=(e.fx.stun||0)+1;
    if(f==='curse')e.fx.curse=true;
    if(f==='execute'&&e.alive&&e.hp<e.maxhp*0.22){e.hp=0;}
    if(f==='lifesteal'&&att.h){const heal=Math.round(r.dmg*0.2);att.hp=Math.min(att.maxhp,att.hp+heal);if(att.h)floatText('hero',RUN.party.indexOf(att),'+'+heal,'#7dff8f');}
  }
  // lifesteal por passiva
  if(att.h&&att.h.passive.tags&&att.h.passive.tags.lifesteal){const heal=Math.round(r.dmg*att.h.passive.tags.lifesteal);att.hp=Math.min(att.maxhp,att.hp+heal);}
  if(att.fx.critmax){att.fx.critmax--;}
  if(e.hp<=0)killEnemy(e);
  refreshBars();
}
function computeDamage(att,def,skill){
  const kind=skill?skill.kind:'phys';
  let base=kind==='mag'?att.st.mag:att.st.atk;
  let pow=skill?(skill.pow||1):1;let raw=base*pow;
  const heroAtt=!!att.h&&!att.isMinion;
  if(kind==='mag'&&RUN.passive.spellAmp)raw*=1+RUN.passive.spellAmp;
  if(heroAtt&&att.h.passive.tags){const t=att.h.passive.tags;
    if(RUN.passive.beastBane&&def.family==='fera')raw*=1+RUN.passive.beastBane;
    if(t.rage)raw*=1+t.rage*(1-att.hp/att.maxhp);
    if(t.darkPower)raw*=1+t.darkPower;if(t.allMastery)raw*=1+t.allMastery;}
  if(skill&&skill.el==='sagrado'&&(def.family==='morto-vivo'||def.family==='demonio'))raw*=1.6;
  if(def.fx&&def.fx.curse)raw*=1.25;
  raw*=rnd(0.86,1.14);
  let cc=0.05+(att.st.lck||0)*0.004+(RUN.passive.critBonus||0);
  if(att.h&&att.h.passive.tags&&att.h.passive.tags.critBonus)cc+=att.h.passive.tags.critBonus;
  if(skill&&skill.fx==='crit+')cc+=0.3;
  if(att.fx&&att.fx.critmax)cc=1;
  const crit=chance(cc);
  let dmg=Math.max(1,raw-(def.st.def||0)*0.5);if(crit)dmg*=1.85;
  if(def.fx&&def.fx.shield)dmg*=0.5;if(def.fx&&def.fx.resist)dmg*=0.8;
  return {dmg:Math.round(dmg),crit};
}
function applyDamageToEnemy(e,dmg,crit,el){
  e.hp-=dmg;e.hit=1;e.flash=1;RUN.scene.shake=Math.max(RUN.scene.shake,crit?5:2);
  const idx=RUN.scene.enemies.indexOf(e);
  floatText('enemy',Math.max(0,idx),(crit?'✸':'')+dmg,crit?'#ffd166':'#fff');
  sceneSpark('enemy',Math.max(0,idx),crit?'#ffd166':'#ff9a6c');
  // espinhos do guerreiro? (thorns aplicado em hero defense)
  if(e.boss)updateBossBar(e);
}
function killEnemy(e){if(e.dead)return;e.alive=false;e.dead=true;e.hp=0;
  logline('💀 '+e.name+' foi derrotado.','dn');
  // contabiliza no bestiário
  if(e.m&&e.m.id){G.meta.bestiaryKills=G.meta.bestiaryKills||{};G.meta.bestiaryKills[e.m.id]=(G.meta.bestiaryKills[e.m.id]||0)+1;}
  // elites dão recompensa extra
  if(e.m&&e.m.elite){G.meta.eliteKills=(G.meta.eliteKills||0)+1;
    logline('⭐ <b class="sc">Elite abatido!</b> Recompensa rara.','sc');
    const ess=runEssence(15+RUN.floor*4);grantEquipment(RUN.floor>=20?'lendario':'epico');grantMaterial('epico');
    if(chance(0.2))grantSecretKey();sfx('secret');}
  // domar fera?
  const tamer=RUN.party.find(c=>c.alive&&c.h.passive.tags&&c.h.passive.tags.tameChance);
  if(tamer&&e.family==='fera'&&chance(tamer.h.passive.tags.tameChance)){
    G.meta.tamedCount++;saveGame();spawnMinion(tamer,'fera');
    logline('🐾 '+actorName(tamer)+' domou '+e.name+'!','sc');checkUnlocks();
  }
}
function winCombat(){
  if(!RUN||!RUN.combat)return;
  RUN.scene.mode='idle';RUN.scene.enemies=[];
  RUN.party.forEach(c=>{c.fx={};});
  const onWin=RUN.combat.opts.onWin;const wasBoss=RUN.combat.boss;
  RUN.combat.minions=[];
  if(RUN.passive.healRoom){RUN.party.filter(c=>c.alive).forEach(c=>{c.hp=Math.min(c.maxhp,c.hp+Math.round(c.maxhp*RUN.passive.healRoom));});refreshBars();}
  // volta à trilha de exploração
  RUN.combat.opts={};RUN.combat.boss=false;if(_audioReady)applyMusic();
  rtimeout(()=>{if(onWin)onWin();},700);
}
function enemyAct(e){
  const tauntHero=RUN.party.find(c=>c.alive&&c.fx.taunt>0);
  let tgt=tauntHero||pick(allies());
  if(!tgt)return rtimeout(nextActor,160);
  if(e.boss&&chance(0.38)){
    logline('☄️ '+e.name+' desencadeia um golpe terrível em todos!','bd');RUN.scene.shake=7;
    allies().slice().forEach(a=>{const r=computeDamage(e,a,{kind:'mag',pow:0.85});applyDamageToHero(a,r.dmg,r.crit,e);});
    return rtimeout(nextActor,actDelay());
  }
  const pow=e.boss&&chance(0.5)?1.5:1;
  const r=computeDamage(e,tgt,{kind:'phys',pow});
  applyDamageToHero(tgt,r.dmg,r.crit,e);
  rtimeout(nextActor,actDelay());
}
function applyDamageToHero(c,dmg,crit,attacker){
  const idx=RUN.party.indexOf(c);
  const t=(c.h&&c.h.passive.tags)||{};
  let avoid=(t.dodge||0)+(t.phase||0);if(c.fx.evade)avoid=1;
  if(avoid>0&&chance(avoid)){if(idx>=0)floatText('hero',idx,'esquiva!','#67d8ff');logline(actorName(c)+' esquiva do golpe!','muted');c.fx.evade=0;return;}
  c.hp-=dmg;RUN.scene.shake=Math.max(RUN.scene.shake,crit?6:3);sfx('enemyhit');
  if(idx>=0){floatText('hero',idx,'-'+dmg,crit?'#ff5d6c':'#ffb0b0');sceneSpark('hero',idx,'#ff5d6c');}
  // espinhos / thorns
  if(attacker&&attacker.alive){const th=(t.thorns||0)+(RUN.passive.thorns&&c.fx.taunt?0:0);
    if(t.thorns){const ref=Math.round(dmg*t.thorns);attacker.hp-=ref;const ei=RUN.scene.enemies.indexOf(attacker);floatText('enemy',Math.max(0,ei),'-'+ref,'#ffd166');if(attacker.hp<=0)killEnemy(attacker);if(attacker.boss)updateBossBar(attacker);}}
  c.fx.evade=0;
  if(c.hp<=0){c.hp=0;if(c.isMinion){c.alive=false;logline('🌀 O aliado invocado se desfez.','muted');}else downHero(c);}
  refreshBars();
}
function processDoT(){
  aliveEnemies().forEach(e=>{['burn','poison'].forEach(k=>{if(e.fx[k]){e.hp-=e.fx[k].d;const ei=RUN.scene.enemies.indexOf(e);
    floatText('enemy',Math.max(0,ei),'-'+e.fx[k].d,k==='burn'?'#ff7a3c':'#5fd17a');e.fx[k].t--;if(e.fx[k].t<=0)delete e.fx[k];
    if(e.boss)updateBossBar(e);if(e.hp<=0)killEnemy(e);}});});
  allies().forEach(a=>{['shield','resist','taunt','critmax'].forEach(k=>{if(a.fx[k]>0){a.fx[k]--;if(a.fx[k]<=0)delete a.fx[k];}});});
  refreshBars();
}

/* ---- CHEFES SECRETOS ---- */
function maybeSecretBoss(){
  if(invQty('chave_negra')>0&&invQty('olho_abissal')>0&&!G.meta.bossesKilled.includes('eco')){
    startSecretBoss('eco');return true;}
  if(coroaCount()>=3&&!G.meta.bossesKilled.includes('rei_esquecido')){
    startSecretBoss('rei_esquecido');return true;}
  if(invQty('selo_leviata')>0&&RUN.floor>=14&&!G.meta.bossesKilled.includes('leviata')){
    startSecretBoss('leviata');return true;}
  if(invQty('coracao_estelar')>0&&RUN.floor>=35&&!G.meta.bossesKilled.includes('arauto_estelar')){
    startSecretBoss('arauto_estelar');return true;}
  if(invQty('fragmento_tempo')>=3&&!G.meta.bossesKilled.includes('cronarca')){
    startSecretBoss('cronarca');return true;}
  return false;
}
function startSecretBoss(id){
  const boss=BMAP[id];const fl=Math.max(RUN.floor,boss===BMAP.rei_esquecido?14:10);
  const e=makeEnemy(Object.assign({},boss,{floor:Math.max(8,RUN.floor-4)}),fl,true);
  logline('<span class="sc">⟁⟁⟁ A realidade racha... ⟁⟁⟁</span>','sc');
  logline('<b class="tag-secret">CHEFE SECRETO: '+boss.name+'</b>','sc');
  logline('<i>'+boss.intro+'</i>','sy');discover('bosses',id);
  sfx('roar');bossCard(boss.name,boss.intro,true);showBossBar(e);
  beginCombat([e],{boss:true,secret:true,onWin:()=>onSecretBossWin(boss,e)});
}
const SECRET_BOSS_DROP={eco:'olho_onividente',rei_esquecido:'armadura_rei',leviata:'lamina_leviata',arauto_estelar:'manto_arauto',cronarca:'lamina_vazio'};
const SECRET_BOSSES=['eco','rei_esquecido','leviata','arauto_estelar','cronarca'];
function onSecretBossWin(boss,e){
  hideBossBar();if(!G.meta.bossesKilled.includes(boss.id))G.meta.bossesKilled.push(boss.id);
  RUN.kills++;G.meta.totalKills++;
  RUN.party.filter(c=>c.alive).forEach(c=>grantXP(c,40+RUN.floor*10));
  const ess=runEssence(200+RUN.floor*12);
  // equipamento secreto exclusivo do chefe
  const drop=SECRET_BOSS_DROP[boss.id];
  if(drop){addItem(drop,1);discover('items',drop);logline('🏆 <b class="tag-secret">DESPOJO SECRETO:</b> '+IMAP[drop].icon+' '+IMAP[drop].name+'!','sc');lootBurst('secreto');}
  grantEquipment('mitico');
  if(!G.meta.relics.includes('lampada_eterna')&&chance(0.5)){addItem('lampada_eterna',1);discover('items','lampada_eterna');}
  logline('🌟 <b>'+boss.name+' caiu!</b> Poder imenso é seu. +'+ess+' essência.','sc');
  toast('🌟 Chefe SECRETO derrotado!','mitico');
  // desbloqueio do Andarilho (mítico) — exige DERROTAR TODOS os chefes secretos
  const allSecret=SECRET_BOSSES.every(id=>G.meta.bossesKilled.includes(id));
  if(allSecret && !G.meta.flags.andarilho){
    G.meta.flags.andarilho=true;unlockSecret('andarilho');checkUnlocks();
    logline('🌌 <b class="tag-secret">Todos os segredos sombrios foram desvendados. O Andarilho do Vazio se revela...</b>','sc');
  } else if(!allSecret){
    const left=SECRET_BOSSES.filter(id=>!G.meta.bossesKilled.includes(id)).length;
    logline('🌑 Chefes secretos restantes para revelar o Andarilho: <b>'+left+'</b>.','sy');
  }
  saveGame();rtimeout(()=>descend(),1200);
}

function autoConsumables(){
  const low=RUN.party.find(c=>c.alive&&c.hp<c.maxhp*0.22);
  if(low&&invQty('pocao_vida')>0){removeItem('pocao_vida',1);const h=Math.round(low.maxhp*0.4);
    low.hp=Math.min(low.maxhp,low.hp+h);floatText('hero',RUN.party.indexOf(low),'+'+h,'#5fd17a');
    logline('🧪 Poção de Vida usada automaticamente em '+actorName(low)+'.','dn');refreshBars();}
}

/* ====================== FIM DA INCURSÃO ====================== */
function endRun(reason){
  if(!RUN)return;const summary={reason,floor:RUN.floor,kills:RUN.kills,gold:RUN.gold,essence:RUN.essence};
  if(_sceneRAF)cancelAnimationFrame(_sceneRAF);_sceneRAF=null;
  RUN=null;checkUnlocks();saveGame();
  CUR.screen='result';showResult(summary);
}
function showResult(s){
  const death=s.reason==='death';
  if(death){Sound.stop();sfx('death');}else{music('camp');sfx('chest');}
  APP.innerHTML=`<div class="screen active" style="justify-content:center">
    <div class="panel parch center" style="max-width:520px;margin:auto">
      <div style="font-size:60px">${death?'💀':'🏕️'}</div>
      <h1 style="color:${death?'var(--bad)':'var(--gold)'};font-size:30px">${death?'A Adranja te consumiu':'Você recuou em segurança'}</h1>
      <p class="small muted mt6">${death
        ?'Seus heróis caem na escuridão... e a masmorra rouba suas memórias. Os níveis se perdem — mas as <b>habilidades, itens e segredos permanecem para sempre</b>.'
        :'De volta ao acampamento, sãos e salvos. Os níveis se desfazem, mas tudo que você conquistou é seu.'}</p>
      <div class="divider"></div>
      <div class="kvs" style="max-width:280px;margin:0 auto">
        <span>🏰 Andar alcançado</span><b>${s.floor}</b>
        <span>💀 Monstros derrotados</span><b>${s.kills}</b>
        <span>🪙 Ouro coletado</span><b>${fmt(s.gold)}</b>
        <span>💠 Essência ganha</span><b>${fmt(s.essence)}</b>
        <span>🏆 Recorde de profundidade</span><b>${G.meta.deepestFloor}</b>
      </div>
      <div class="divider"></div>
      <p class="tiny muted">Tudo coletado foi enviado ao seu acampamento automaticamente.</p>
      <div class="row center mt" style="justify-content:center">
        <button class="btn" onclick="go('camp','esquadrao')">Voltar ao Acampamento</button>
        <button class="btn ghost" onclick="startRunFlow()">Nova Incursão ▶</button>
      </div>
    </div></div>`;
}
function victoryEnding(){
  if(_sceneRAF)cancelAnimationFrame(_sceneRAF);_sceneRAF=null;
  music('victory');sfx('win');
  const s={floor:RUN.floor,kills:RUN.kills,gold:RUN.gold,essence:RUN.essence};
  RUN=null;G.meta.flags.beatGame=true;saveGame();CUR.screen='result';
  APP.innerHTML=`<div class="screen active" style="justify-content:center">
    <div class="panel parch center" style="max-width:540px;margin:auto;border-color:var(--gold)">
      <div style="font-size:64px">💖👑✨</div>
      <h1 class="logo" style="font-size:40px">VITÓRIA</h1>
      <p class="small mt6">No <b>Andar 100</b>, o Coração da Adranja para de bater. A masmorra inteira estremece, suas paredes se dissolvem em luz — e, pela primeira vez em eras, ela <b>lembra de você</b>.</p>
      <p class="small muted">Você conquistou as 100 profundidades da Adranja. Pouquíssimos chegaram tão fundo. Mas a masmorra é mágica... e sempre há um segredo a mais para quem ousa voltar.</p>
      <div class="divider"></div>
      <p class="small">Chegou ao <b>Andar ${s.floor}</b> · ${s.kills} abates nesta incursão.</p>
      <p class="tiny tag-secret mt6">🏆 Lenda da Adranja — você zerou as 100 profundidades!</p>
      <div class="row center mt" style="justify-content:center">
        <button class="btn" onclick="go('camp','esquadrao')">Voltar ao Acampamento 🏕️</button>
      </div>
    </div></div>`;
}

/* ====================== ÁUDIO: contexto/transições ====================== */
function desiredTrack(){
  if(CUR.screen==='home'||CUR.screen==='camp')return 'camp';
  if(CUR.screen==='result')return RUN?null:'camp';
  if(CUR.screen==='dungeon'){
    if(RUN&&RUN.combat){const o=RUN.combat.opts||{};
      if(o.secret)return 'secret';if(o.bossDef||o.boss)return 'boss';return 'battle';}
    return 'explore';
  }
  return 'camp';
}
function applyMusic(){const t=desiredTrack();if(t)music(t);else Sound.stop();}
let _audioReady=false;
function firstGesture(){if(_audioReady)return;_audioReady=true;Sound.init();Sound.resume();applyMusic();}

/* ====================== BOOT ====================== */
function boot(){
  loadGame();checkUnlocks();
  go('home');
  // primeira interação destrava o áudio (política de autoplay)
  ['pointerdown','keydown','touchstart'].forEach(ev=>window.addEventListener(ev,firstGesture,{once:false}));
  // som de clique em botões/abas
  document.addEventListener('pointerdown',e=>{const b=e.target.closest('.btn,.tab,.hero-card,.item,.x-close');if(b)sfx('click');},true);
  setInterval(()=>{
    if(!G.meta)return;
    checkResearch();
    if(CUR.screen==='camp'&&CUR.tab==='biblioteca')renderTab();
  },1000);
  document.addEventListener('visibilitychange',()=>{if(document.hidden){saveGame();if(Sound.ctx)Sound.musGain&&(Sound.musGain.gain.value=0);}else{if(Sound.ctx&&Sound.on)Sound.musGain.gain.value=Sound.musVol;}});
}
window.addEventListener('DOMContentLoaded',boot);
</script>
