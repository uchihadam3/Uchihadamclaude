<!doctype html><meta charset="utf-8"><title>vitrine de glifos · Mnemonic</title>
<!--
  A VITRINE. Os 144 símbolos que vão dentro da carta, mostrados como o jogador
  os vê: na face, na cor da família, dentro da moldura pintada, no tamanho de
  um tabuleiro cheio.

  Julgar glifo em folha de contato engana. Sobre magenta, num PNG de 128px,
  qualquer coisa parece nítida; o que decide é o mesmo desenho a quarenta
  pixels, sobre o azul do fundo, ao lado de dezessete parecidos. Foi assim que
  apareceram os dois sóis quase iguais da família Espaço.

  O CSS vem do próprio jogo.  python3 -m http.server 8123
-->
<style>
  body{margin:0;background:#0a1424;color:#8fa6c8;
       font:900 12px/1 system-ui,-apple-system,sans-serif}
  h1{font-size:14px;letter-spacing:.18em;padding:16px 16px 4px;color:#63789e}
  h2{font-size:12px;letter-spacing:.16em;padding:18px 16px 6px;color:#8fa6c8;
     text-transform:uppercase}
  h2 em{font-style:normal;color:#63789e;font-weight:800;letter-spacing:.04em}
  /* prefixo vg- em tudo: o CSS do jogo é carregado inteiro nesta página e
     nomes curtos como .cx e .fila já existem lá com outro sentido */
  .vg-fila{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px}
  .vg-cx{display:flex;flex-direction:column;align-items:center;gap:4px}
  .vg-cx b{font-size:9px;color:#4b5d7c;font-weight:800}
  /* a carta, do tamanho em que ela realmente é lida */
  .vg-cx .ct{--cel:70px;--r:9px}
  .vg-cx .fx{position:relative;transform:none}
  .vg-cx .ff{transform:none;position:relative;width:var(--cel);
             height:calc(var(--cel)*1.34)}
</style>
<h1>VITRINE DE GLIFOS</h1>
<div id="tudo"></div>
<script type="module">
const html = await (await fetch('../jogo.html')).text();
document.head.insertAdjacentHTML('beforeend', '<style>'
  + html.match(/<style>([\s\S]*?)<\/style>/)[1].replace(/url\(arte\//g,'url(../arte/')
  + '</style>');

const { FAMILIAS, LISTA_FAMILIAS } = await import('../js/data/familias.js');
const { svgGlifo, POR_FAMILIA, FAMILIA_PINTADA } = await import('../js/arte/glifos.js');
const { MOLDURA_DO_TIPO } = await import('../js/ui/icones.js');

/* o import acima resolve os caminhos a partir de js/arte/, mas o src da arte
   é relativo à raiz do jogo — esta página mora um nível abaixo */
const arrumar = m => m.replace('src="arte/', 'src="../arte/');

const tudo = document.getElementById('tudo');
for(const f of LISTA_FAMILIAS){
  const pintada = FAMILIA_PINTADA.has(f.id);
  tudo.insertAdjacentHTML('beforeend',
    `<h2>${f.nome} — <em>${f.traco} · ${pintada ? 'pintada' : 'desenhada'}</em></h2>`);
  const fila = document.createElement('div'); fila.className = 'vg-fila';
  for(let i = 0; i < POR_FAMILIA; i++){
    const cx = document.createElement('div'); cx.className = 'vg-cx';
    cx.innerHTML =
      `<button class="ct temold ${pintada ? 'pint ' : ''}${MOLDURA_DO_TIPO.normal}"
               style="--fc:${f.cor}">
         <span class="fx"><span class="ff">${arrumar(svgGlifo(f.id, i))}</span></span>
       </button><b>${String(i).padStart(2,'0')}</b>`;
    fila.append(cx);
  }
  tudo.append(fila);
}
</script>
