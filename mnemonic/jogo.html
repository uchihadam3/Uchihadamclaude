<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#070910">
<title>Mnemonic</title>
<style>
/* ═══════════════════════════════════════════════════════════════════
   MNEMONIC — o palácio da memória desenhado como planta de arquiteto
   à noite: papel escuro, tinta âmbar, régua fina. Tudo é medida e
   inscrição, porque é disso que o jogo trata — guardar onde as coisas
   estão.
   ═══════════════════════════════════════════════════════════════════ */
:root{
  --tinta:#070910; --painel:#101420; --painel2:#161c2a; --alto:#1e2637;
  --linha:#232c3e;
  --txt:#e6ebf5; --txt2:#8b96ac; --txt3:#5d6880;
  --ouro:#e8b44a; --ouro2:#f6d78e; --ouroS:rgba(232,180,74,.13);
  --perigo:#ff6a5a; --bom:#7ee3a8; --frio:#7fd4ff;
  --r:12px; --g:6px;
  --fonte:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{
  background:
    radial-gradient(120% 80% at 50% -10%, #131a2b 0%, rgba(19,26,43,0) 60%),
    repeating-linear-gradient(0deg, rgba(255,255,255,.014) 0 1px, transparent 1px 46px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.014) 0 1px, transparent 1px 46px),
    var(--tinta);
  color:var(--txt); font-family:var(--fonte); font-size:15px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
svg{display:block}
.gl{width:100%;height:100%;stroke:currentColor;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round;fill:none}
.num{font-variant-numeric:tabular-nums}

/* ---------- telas ---------- */
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.tela{position:absolute;inset:0;display:none;flex-direction:column;
      padding:calc(10px + env(safe-area-inset-top)) 12px calc(10px + env(safe-area-inset-bottom));
      overflow:hidden}
.tela.on{display:flex;animation:entra .26s ease both}
@keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.rol{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
     flex:1;min-height:0;padding-right:2px}

/* ---------- tipografia ---------- */
.rot{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;
     color:var(--txt3);font-weight:700}
.tit{font-size:clamp(19px,5.4vw,26px);font-weight:800;letter-spacing:-.01em;
     margin:0;text-wrap:balance}
.sub{color:var(--txt2);font-size:13.5px;margin:4px 0 0}
.mini{font-size:12px;color:var(--txt2);line-height:1.5}
.hr{height:1px;background:var(--linha);margin:12px 0;border:0}

/* ---------- botões ---------- */
.bt{display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:12px 18px;border-radius:11px;background:var(--painel2);
    border:1px solid var(--linha);font-weight:650;font-size:14.5px;
    transition:transform .09s, background .15s, border-color .15s}
.bt:active{transform:scale(.97)}
.bt.p{background:linear-gradient(180deg,var(--ouro2),var(--ouro));color:#241a05;
      border-color:#f0c76a;font-weight:800;box-shadow:0 3px 0 #9a7420,0 8px 20px rgba(232,180,74,.2)}
.bt.p:active{box-shadow:0 1px 0 #9a7420;transform:translateY(2px) scale(.99)}
.bt.g{width:100%}
.bt[disabled]{opacity:.4;pointer-events:none}
.bt.pq{padding:8px 12px;font-size:12.5px;border-radius:9px}

/* ═══════════ TÍTULO ═══════════ */
#t-titulo{justify-content:center;align-items:center;text-align:center;gap:0}
.logo{font-size:clamp(40px,13vw,74px);font-weight:800;letter-spacing:.14em;
      margin:0 0 0 .14em;line-height:1;
      background:linear-gradient(180deg,#fff 8%,var(--ouro2) 46%,#a8792a 100%);
      -webkit-background-clip:text;background-clip:text;color:transparent;
      filter:drop-shadow(0 4px 18px rgba(232,180,74,.22))}
.lema{color:var(--txt2);font-size:13px;letter-spacing:.24em;text-transform:uppercase;
      margin:12px 0 30px}
.menu{display:flex;flex-direction:column;gap:9px;width:min(320px,86vw)}
.creditos{position:absolute;bottom:calc(12px + env(safe-area-inset-bottom));
          font-size:11px;color:var(--txt3);letter-spacing:.06em}
/* cartas caindo no fundo da tela de título */
#fundo{position:absolute;inset:0;z-index:-1;opacity:.5;pointer-events:none;overflow:hidden}
#fundo i{position:absolute;display:block;width:46px;height:61px;border-radius:6px;
  border:1px solid var(--linha);background:var(--painel);
  animation:cai linear infinite}
@keyframes cai{from{transform:translateY(-90px) rotate(var(--a))}
               to{transform:translateY(112vh) rotate(calc(var(--a) + 40deg))}}

/* ═══════════ CABEÇALHO DE COMBATE ═══════════ */
#topo{flex:0 0 auto;display:flex;flex-direction:column;gap:7px;margin-bottom:8px}
.linha1{display:flex;align-items:center;gap:9px}
.chefe{display:flex;align-items:center;gap:7px;padding:5px 11px;border-radius:99px;
       background:var(--painel2);border:1px solid var(--linha);font-size:11.5px;
       font-weight:700;min-width:0;overflow:hidden}
.chefe .pico{flex:0 0 17px}
.chefe .pico .gl{width:17px;height:17px}
.chefe span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chefe b{color:var(--perigo)}
.onde{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--txt3);
      font-weight:700;margin-left:auto}
.placar{display:flex;align-items:baseline;gap:7px}
.pts{font-size:clamp(26px,8vw,36px);font-weight:800;line-height:1;color:var(--ouro2)}
.meta{font-size:13px;color:var(--txt2);font-weight:600}
.barra{height:7px;border-radius:99px;background:#0c1019;border:1px solid var(--linha);
       overflow:hidden;position:relative}
.barra i{display:block;height:100%;min-width:3px;width:0;border-radius:99px;
  background:linear-gradient(90deg,#a8792a,var(--ouro),var(--ouro2));
  transition:width .45s cubic-bezier(.2,.9,.25,1)}
.barra.cheia i{background:linear-gradient(90deg,var(--bom),#c8f7dd)}
.medidores{display:flex;gap:6px;flex-wrap:wrap;align-items:stretch}
.med{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:9px;
     background:var(--painel);border:1px solid var(--linha)}
.med .i{width:14px;height:14px;flex:0 0 14px;color:var(--txt3)}
.med .i .gl{width:14px;height:14px;stroke-width:2}
.med .k{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt3);
        font-weight:700;white-space:nowrap}
.med .v{font-weight:800;font-size:15px}
.med.al{border-color:rgba(255,106,90,.5);background:rgba(255,106,90,.09)}
.med.al .v{color:var(--perigo)}
.focos{display:flex;gap:3px}
.focos b{width:9px;height:9px;border-radius:50%;background:var(--perigo);display:block;
         box-shadow:0 0 8px rgba(255,106,90,.5)}
.focos b.off{background:#2a3244;box-shadow:none}
.combo{margin-left:auto;text-align:right;line-height:1.15}
.combo .n{font-size:12.5px;font-weight:800;letter-spacing:.03em;color:var(--ouro)}
.combo .m{font-size:11px;color:var(--txt2);font-weight:700}
.combo.zero .n{color:var(--txt3)}
.combo.sobe{animation:pulsa .34s ease}
@keyframes pulsa{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}

/* ═══════════ TABULEIRO ═══════════ */
#area{flex:1;min-height:0;display:grid;place-items:center;position:relative}
#mesa{display:grid;gap:var(--g);justify-content:center;align-content:center}
.ct{perspective:620px;position:relative;background:none;border:0;
    width:var(--cel);height:calc(var(--cel)*1.34)}
.fx{position:absolute;inset:0;transform-style:preserve-3d;
    transition:transform .32s cubic-bezier(.3,.9,.3,1)}
.ct.ab .fx{transform:rotateY(180deg)}
.fr,.ff{position:absolute;inset:0;border-radius:var(--r);
        backface-visibility:hidden;-webkit-backface-visibility:hidden;
        display:grid;place-items:center;overflow:hidden}
.fr{background:
      repeating-linear-gradient(45deg,rgba(255,255,255,.028) 0 2px,transparent 2px 6px),
      linear-gradient(160deg,#1b2233,#11161f);
    border:1px solid #2a3447;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 2px 5px rgba(0,0,0,.4)}
.fr:after{content:'';width:44%;height:44%;border-radius:50%;
  border:1.5px solid rgba(232,180,74,.16)}
.ff{transform:rotateY(180deg);background:linear-gradient(165deg,var(--painel2),#0e1320);
    border:1px solid color-mix(in srgb, var(--fc) 42%, var(--linha));
    color:var(--fc); padding:9%;
    box-shadow:inset 0 0 22px color-mix(in srgb, var(--fc) 12%, transparent)}
.ff .gl{stroke-width:1.9}
.ct.sai{animation:sai .42s cubic-bezier(.4,0,.2,1) both}
@keyframes sai{
  40%{transform:scale(1.14);filter:brightness(1.7)}
  100%{transform:scale(.2) rotate(9deg);opacity:0}
}
.ct.nao .fx{animation:nao .42s}
@keyframes nao{0%,100%{transform:rotateY(180deg) translateX(0)}
  25%{transform:rotateY(180deg) translateX(-6px)}
  75%{transform:rotateY(180deg) translateX(6px)}}
.ct.marc .fr{border-color:var(--ouro);box-shadow:0 0 0 1px var(--ouro),0 0 14px rgba(232,180,74,.3)}
.ct.pisca .fr{animation:pisca 1.1s ease-in-out infinite}
@keyframes pisca{0%,100%{box-shadow:0 0 0 1px rgba(127,212,255,.4)}
  50%{box-shadow:0 0 0 1px rgba(127,212,255,.9),0 0 16px rgba(127,212,255,.4)}}
/* selos: o que o jogo já te contou sobre a carta fica escrito nela */
.selo{position:absolute;z-index:3;font-size:8.5px;font-weight:800;letter-spacing:.05em;
      padding:1px 4px;border-radius:5px;line-height:1.35;white-space:nowrap;
      background:#0b0f18;border:1px solid currentColor}
.selo.tp{left:3px;bottom:3px;max-width:calc(100% - 6px);overflow:hidden;text-overflow:ellipsis}
.selo.pv{right:3px;top:3px;color:var(--perigo)}
.selo.of{left:3px;top:3px;color:var(--frio)}
.selo.mi{right:3px;bottom:3px;color:#e05a8a}
.selo.eg{right:3px;top:3px;color:var(--ouro)}
/* pontinhos que sobem quando o par fecha */
.voa{position:absolute;z-index:9;font-weight:800;font-size:17px;color:var(--ouro2);
     pointer-events:none;text-shadow:0 2px 10px rgba(0,0,0,.7);
     animation:voa 1s cubic-bezier(.2,.8,.3,1) both}
@keyframes voa{0%{transform:translate(-50%,-50%) scale(.6);opacity:0}
  18%{transform:translate(-50%,-70%) scale(1.15);opacity:1}
  100%{transform:translate(-50%,-190%) scale(.95);opacity:0}}
.voa.ruim{color:var(--perigo)}
.voa.moeda{color:#ffd77a}

/* ═══════════ BARRA DE BAIXO ═══════════ */
#baixo{flex:0 0 auto;display:flex;gap:7px;align-items:center;margin-top:8px}
.fer{display:flex;align-items:center;gap:8px;padding:9px 13px;border-radius:11px;
     background:linear-gradient(180deg,var(--alto),var(--painel2));
     border:1px solid var(--linha);font-weight:700;font-size:13px;flex:1;min-width:0}
.fer .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fer .u{margin-left:auto;font-size:11px;color:var(--txt2);font-weight:800;flex:0 0 auto}
.fer[disabled]{opacity:.42}
.relq{display:flex;gap:5px;overflow-x:auto;max-width:40%;padding:2px}
.relq b{flex:0 0 auto;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
        background:var(--painel);border:1px solid var(--linha);font-size:14px;font-weight:800}
.ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:0 0 auto;
     background:var(--painel);border:1px solid var(--linha);color:var(--txt2)}
.ico .gl{width:17px;height:17px}
.onde{margin-left:auto}

/* ═══════════ FICHA / PAINEL DE REGRAS ═══════════ */
.folha{position:fixed;inset:0;z-index:40;display:none;background:rgba(4,6,11,.78);
       backdrop-filter:blur(3px);padding:14px;overflow-y:auto;overscroll-behavior:contain}
.folha.on{display:block;animation:entra .2s ease both}
.cartao{max-width:520px;margin:auto;background:var(--painel);border:1px solid var(--linha);
        border-radius:16px;padding:16px;box-shadow:0 22px 60px rgba(0,0,0,.6)}
.verb{display:flex;gap:11px;padding:9px 0;border-top:1px solid var(--linha)}
.verb:first-of-type{border-top:0}
.verb .em{flex:0 0 34px;height:34px;border-radius:9px;display:grid;place-items:center;
          background:var(--painel2);border:1px solid var(--linha)}
.verb .em .gl{width:20px;height:20px}
.verb h4{margin:0 0 2px;font-size:13.5px;font-weight:800;letter-spacing:.02em}
.verb p{margin:0;font-size:12.5px;color:var(--txt2);line-height:1.45}
.tag{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.1em;
     text-transform:uppercase;padding:1px 6px;border-radius:5px;vertical-align:1px;
     border:1px solid currentColor;margin-left:6px}

/* ═══════════ CARTÕES DE ESCOLHA (classe, relíquia, loja, evento) ═══════════ */
.grade{display:grid;gap:9px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.op{text-align:left;padding:13px;border-radius:14px;background:var(--painel);
    border:1px solid var(--linha);display:flex;flex-direction:column;gap:5px;
    transition:transform .1s, border-color .15s, background .15s;position:relative}
.op:active{transform:scale(.98)}
.op.sel{border-color:var(--ouro);background:var(--ouroS)}
.op[disabled]{opacity:.45}
.op h3{margin:0;font-size:15px;font-weight:800;letter-spacing:-.005em}
.op .lm{font-size:11.5px;color:var(--txt3);font-style:italic}
.op p{margin:0;font-size:12.5px;color:var(--txt2);line-height:1.45}
.op.raro{border-color:color-mix(in srgb, var(--fc) 45%, var(--linha));
  background:linear-gradient(160deg, color-mix(in srgb, var(--fc) 8%, var(--painel)), var(--painel))}
.op .gf{position:absolute;right:11px;top:11px;width:24px;height:24px;opacity:.9}
.op .gf .gl{width:24px;height:24px}
.op h3{padding-right:32px}
.op .pr{margin-top:auto;font-weight:800;font-size:13px;color:var(--ouro)}
.op .stats{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
.op .stats span{font-size:10px;color:var(--txt2);font-weight:700;white-space:nowrap;
  text-transform:uppercase;letter-spacing:.07em;padding:2px 7px;border-radius:6px;
  background:var(--painel2);border:1px solid var(--linha)}

/* ═══════════ MAPA ═══════════ */
.trilha{display:flex;align-items:center;gap:0;padding:4px 0;overflow-x:auto}
.sala{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:5px;
      width:58px;position:relative;opacity:.45}
.sala.feito{opacity:.75}
.sala.atual{opacity:1}
.sala .bl{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;
          background:var(--painel);border:1px solid var(--linha);position:relative}
.sala.atual .bl{border-color:var(--ouro);background:var(--ouroS);
  box-shadow:0 0 0 3px rgba(232,180,74,.14);animation:respira 2.2s ease-in-out infinite}
@keyframes respira{0%,100%{box-shadow:0 0 0 3px rgba(232,180,74,.12)}
                   50%{box-shadow:0 0 0 7px rgba(232,180,74,.05)}}
.sala.feito .bl{border-color:rgba(126,227,168,.4)}
.sala .bl .gl{width:21px;height:21px}
.sala .nm{font-size:9px;letter-spacing:.09em;text-transform:uppercase;
          color:var(--txt3);font-weight:700;text-align:center}
.sala:not(:last-child):after{content:'';position:absolute;top:21px;left:calc(50% + 24px);
  width:calc(100% - 48px);height:1px;background:var(--linha)}
.sala.feito:not(:last-child):after{background:rgba(126,227,168,.3)}

/* ═══════════ FIM DE RUN ═══════════ */
.grandao{font-size:clamp(30px,10vw,50px);font-weight:800;line-height:1;margin:0}
.tabnum{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:13.5px}
.tabnum dt{color:var(--txt2)}
.tabnum dd{margin:0;font-weight:800;text-align:right}

/* ═══════════ RANKING ═══════════ */
.lin{display:grid;grid-template-columns:34px 1fr auto;gap:9px;align-items:center;
     padding:9px 0;border-top:1px solid var(--linha);font-size:13.5px}
.lin .pos{font-weight:800;color:var(--txt3);text-align:right}
.lin.eu{color:var(--ouro2)}
.lin .qm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:650}
.lin .qm small{display:block;font-size:10.5px;color:var(--txt3);font-weight:600;
               letter-spacing:.04em;text-transform:uppercase}
.lin .pt{font-weight:800}
.lin .sel{font-size:9px;font-weight:800;letter-spacing:.08em;padding:1px 5px;border-radius:5px;
          border:1px solid currentColor;margin-left:5px;vertical-align:1px}
.abas{display:flex;gap:5px;overflow-x:auto;padding-bottom:3px;margin-bottom:6px}
.abas button{flex:0 0 auto;padding:7px 12px;border-radius:99px;font-size:12px;font-weight:700;
             background:var(--painel);border:1px solid var(--linha);color:var(--txt2)}
.abas button.on{background:var(--ouroS);border-color:var(--ouro);color:var(--ouro2)}

/* ═══════════ AVISO NO MEIO DA TELA ═══════════ */
#aviso{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%);z-index:50;
  pointer-events:none;text-align:center;display:none}
#aviso.on{display:block;animation:aviso 1.5s ease both}
#aviso .a1{font-size:clamp(24px,8vw,40px);font-weight:800;letter-spacing:.02em;
  text-shadow:0 4px 24px rgba(0,0,0,.8)}
#aviso .a2{font-size:13px;color:var(--txt2);font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;margin-top:2px}
@keyframes aviso{0%{opacity:0;transform:translate(-50%,-50%) scale(.8)}
  14%{opacity:1;transform:translate(-50%,-50%) scale(1.04)}
  22%{transform:translate(-50%,-50%) scale(1)}
  76%{opacity:1} 100%{opacity:0;transform:translate(-50%,-56%) scale(1)}}

.topo-linha{display:flex;align-items:flex-start;gap:9px;margin-bottom:10px;flex:0 0 auto}
.topo-linha .bt{flex:0 0 auto;margin-top:2px}
.cabeca{flex:1;min-width:0}
.cabeca .tit{font-size:clamp(17px,4.8vw,23px)}
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>
<div id="app">
  <section id="t-titulo" class="tela on">
    <div id="fundo"></div>
    <h1 class="logo">MNEMONIC</h1>
    <p class="lema">o que você lembra é o que você tem</p>
    <div class="menu">
      <button class="bt p g" data-ir="classe">NOVA RUN</button>
      <button class="bt g" data-ir="diario">RUN DIÁRIA</button>
      <button class="bt g" data-ir="rank">RANKING</button>
      <button class="bt g" data-ir="livro">COMO SE JOGA</button>
    </div>
    <div class="creditos">um jogo de memória com regras que mudam</div>
  </section>

  <section id="t-classe" class="tela"></section>
  <section id="t-mapa"   class="tela"></section>

  <section id="t-sala" class="tela">
    <div id="topo">
      <div class="linha1">
        <div id="chefe" class="chefe" hidden></div>
        <div id="onde" class="onde"></div>
        <button id="bregras" class="ico" aria-label="regras desta sala"></button>
      </div>
      <div class="linha1">
        <div class="placar">
          <span id="pts" class="pts num">0</span>
          <span id="meta" class="meta num"></span>
        </div>
        <div id="combo" class="combo zero"><div class="n">—</div><div class="m">×1,0</div></div>
      </div>
      <div id="barra" class="barra"><i></i></div>
      <div class="medidores">
        <div id="mvir" class="med"><span class="i"></span><span class="k">viradas</span><span class="v num">0</span></div>
        <div id="mfoc" class="med"><span class="i"></span><span class="k">foco</span><span class="focos"></span></div>
        <div id="mmoe" class="med"><span class="i"></span><span class="k">moedas</span><span class="v num">0</span></div>
      </div>
    </div>
    <div id="area"><div id="mesa"></div></div>
    <div id="baixo">
      <button id="bfer" class="fer"><span class="nm">—</span><span class="u"></span></button>
      <div id="relq" class="relq"></div>
    </div>
