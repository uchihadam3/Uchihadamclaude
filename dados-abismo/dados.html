<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dados do Abismo — mesa de dados</title>
<style>
 *{margin:0;padding:0;box-sizing:border-box}
 body{background:#07090b;color:#e8e2d0;font-family:Georgia,serif;overflow:hidden;height:100vh}
 #c{display:block;width:100vw;height:100vh}
 #hud{position:fixed;left:0;right:0;bottom:0;padding:14px 16px 18px;
   background:linear-gradient(180deg,transparent,rgba(4,6,8,.92) 45%);display:flex;flex-direction:column;gap:10px;align-items:center}
 #res{font-size:15px;letter-spacing:.5px;opacity:.9;min-height:22px;text-align:center}
 #res b{color:#ffd24a;font-size:19px}
 .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
 button{font-family:Georgia,serif;font-size:14px;font-weight:700;color:#e8e2d0;cursor:pointer;
   background:linear-gradient(180deg,#1e242c,#141920);border:1px solid rgba(255,255,255,.14);
   border-radius:10px;padding:10px 15px}
 button:active{transform:scale(.96)}
 button.on{border-color:#ffd24a;color:#ffd24a}
 #rolar{background:linear-gradient(180deg,#7a1f2b,#4d1119);border-color:#a33;font-size:17px;padding:13px 30px}
 #top{position:fixed;top:0;left:0;right:0;padding:12px 16px;display:flex;justify-content:space-between;
   font-size:12px;opacity:.72;letter-spacing:1px}
</style></head><body>
<canvas id="c"></canvas>
<div id="top"><span>MESA DE DADOS · física real</span><span id="perf">—</span></div>
<div id="hud">
  <div id="res">toque em ROLAR</div>
  <div class="row" id="tipos"></div>
  <div class="row" id="mats"></div>
  <div class="row"><button id="rolar">ROLAR</button><button id="mais">+ dado</button><button id="menos">− dado</button></div>
</div>
<script type="module" src="./js/dice3d/mesa.js"></script>
</body></html>
