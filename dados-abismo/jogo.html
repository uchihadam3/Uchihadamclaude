<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Dados do Abismo</title>
<style>
 *{margin:0;padding:0;box-sizing:border-box}
 body{background:#07090b;color:#e8e2d0;font-family:Georgia,serif;overflow:hidden;height:100vh;
   -webkit-tap-highlight-color:transparent;user-select:none}
 #c{position:fixed;inset:0;width:100vw;height:100vh}
 .lay{position:fixed;left:0;right:0;pointer-events:none}
 /* topo: inimigos */
 #ini{top:0;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
 .en{pointer-events:auto;background:rgba(10,13,17,.82);border:1px solid rgba(255,255,255,.13);
   border-radius:11px;padding:7px 9px;min-width:104px;max-width:150px;cursor:pointer;backdrop-filter:blur(6px)}
 .en.alvo{border-color:#ffd24a;box-shadow:0 0 0 1px #ffd24a55}
 .en.morto{opacity:.28;filter:grayscale(1)}
 .en .nm{font-size:11.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .en .el{color:#ff7a5c;font-size:9px;letter-spacing:1px}
 .en .hpb{height:6px;background:#2a1518;border-radius:3px;overflow:hidden;margin:4px 0 3px}
 .en .hpb>i{display:block;height:100%;background:linear-gradient(90deg,#c0392b,#e8604a)}
 .en .hp{font-size:9.5px;opacity:.75;font-variant-numeric:tabular-nums}
 .en .it{font-size:11px;font-weight:700;color:#ffb45e;margin-top:3px}
 .en .st{font-size:9px;color:#7fd98a}
 /* rodapé: você + habilidades */
 #baixo{bottom:0;padding:6px 10px calc(10px + env(safe-area-inset-bottom));
   background:linear-gradient(180deg,transparent,rgba(4,6,8,.94) 30%)}
 #voce{display:flex;align-items:center;gap:9px;justify-content:center;font-size:12.5px;margin-bottom:6px}
 #voce b{font-size:16px}
 .pill{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);border-radius:20px;padding:3px 10px}
 #hab{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;pointer-events:auto}
 .h{background:linear-gradient(180deg,#1e242c,#141920);border:1px solid rgba(255,255,255,.15);
   border-radius:11px;padding:8px 11px;cursor:pointer;min-width:88px;text-align:center;transition:.12s}
 .h .hn{font-size:12.5px;font-weight:700}
 .h .hr{font-size:10.5px;color:#8fb0d8;margin-top:2px;font-variant-numeric:tabular-nums}
 .h.ok{border-color:#4ad98a;box-shadow:0 0 12px #4ad98a44}
 .h.off{opacity:.42}
 .h:active{transform:scale(.95)}
 #acoes{display:flex;gap:6px;justify-content:center;margin-top:7px;pointer-events:auto}
 .b{background:linear-gradient(180deg,#2a323d,#181d24);border:1px solid rgba(255,255,255,.16);
   border-radius:10px;padding:8px 14px;font-family:Georgia,serif;color:#e8e2d0;font-size:13px;font-weight:700;cursor:pointer}
 .b.pri{background:linear-gradient(180deg,#7a1f2b,#4d1119);border-color:#a33}
 .b:disabled{opacity:.4}
 /* seleção de dados */
 #sel{position:fixed;left:0;right:0;bottom:150px;text-align:center;font-size:12px;color:#ffd24a;pointer-events:none}
 /* faixa/telas */
 #msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;
   gap:14px;background:rgba(4,6,9,.88);z-index:20;padding:20px;text-align:center}
 #msg.off{display:none}
 #msg{overflow-y:auto;justify-content:flex-start;padding:0}
 #msg h1{font-size:26px;font-weight:900;letter-spacing:.5px}
 /* ============ TELA INICIAL ============ */
 .titwrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
   gap:16px;padding:26px 18px;width:100%;max-width:460px;margin:0 auto}
 .tit{text-align:center;line-height:.92}
 .tit1{font-size:clamp(44px,15vw,72px);font-weight:900;letter-spacing:-2px;
   background:linear-gradient(180deg,#fff,#e8d9a8 55%,#8a6a2a);-webkit-background-clip:text;
   background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 4px 20px rgba(255,200,90,.28))}
 .tit2{font-size:clamp(20px,6.5vw,32px);font-weight:900;letter-spacing:7px;color:#9a8a68;margin-top:2px}
 .titsub{font-size:12px;letter-spacing:3px;color:#6b6250;margin-top:12px;text-transform:uppercase}
 .ecos{display:flex;align-items:center;gap:7px;background:linear-gradient(180deg,#1a1710,#0e0c08);
   border:1px solid #4a3f22;border-radius:30px;padding:8px 18px;box-shadow:0 0 22px rgba(255,200,90,.12)}
 .ecos .eic{color:#ffd24a;font-size:17px;text-shadow:0 0 10px #ffd24a}
 .ecos b{font-size:20px;color:#ffe9b0} .ecos i{font-size:10px;color:#7a6d50;letter-spacing:2px;font-style:normal}
 .ecos.sm{padding:5px 12px} .ecos.sm b{font-size:15px}
 .mbtns{display:flex;flex-direction:column;gap:10px;width:100%;max-width:320px}
 .mb{font-family:Georgia,serif;font-size:16px;font-weight:800;letter-spacing:1px;color:#e8e2d0;
   background:linear-gradient(180deg,#232a33,#141920);border:1px solid rgba(255,255,255,.16);
   border-radius:13px;padding:15px;cursor:pointer;transition:.14s;position:relative;overflow:hidden}
 .mb:active{transform:scale(.97)}
 .mb.pri{background:linear-gradient(180deg,#8a2230,#4d1119);border-color:#c04a4a;
   box-shadow:0 6px 26px rgba(160,30,40,.4)}
 .mb.cof{background:linear-gradient(180deg,#2a2418,#15120c);border-color:#6a5a2a;color:#ffd9a0}
 .mb em{font-style:normal;font-size:11px;opacity:.65;margin-left:6px}
 .recs{display:flex;gap:14px;font-size:11px;color:#6b6250}
 .recs b{color:#b9ab88;font-size:13px}
 /* ============ O COFRE ============ */
 .cofwrap,.clswrap{width:100%;max-width:520px;margin:0 auto;padding:14px 14px 30px;
   min-height:100vh;display:flex;flex-direction:column;gap:12px}
 .cofhd{display:flex;align-items:center;gap:12px;padding-top:calc(6px + env(safe-area-inset-top))}
 .cofhd h2{flex:1;font-size:19px;letter-spacing:4px;color:#e8d9a8}
 .volta{width:38px;height:38px;border-radius:10px;background:#171b22;border:1px solid rgba(255,255,255,.14);
   color:#e8e2d0;font-size:22px;cursor:pointer}
 .cofp{font-size:12px;color:#7a7260;line-height:1.6}
 .cofp b{color:#c9bb95}
 .ramo{border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:11px;
   background:linear-gradient(180deg,rgba(255,255,255,.03),transparent)}
 .rh{display:flex;align-items:center;gap:8px;margin-bottom:9px}
 .rh .ri{font-size:17px} .rh b{color:var(--rc);letter-spacing:3px;font-size:13px}
 .rh i{font-size:10.5px;color:#6b6250;font-style:normal}
 .nos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
 .no{text-align:left;background:linear-gradient(180deg,#161a20,#0e1116);color:#e8e2d0;
   border:1px solid rgba(255,255,255,.10);border-radius:11px;padding:9px;cursor:pointer;
   font-family:Georgia,serif;transition:.14s}
 .no.pode{border-color:var(--rc);box-shadow:0 0 14px color-mix(in srgb,var(--rc) 30%,transparent)}
 .no.max{opacity:.72;border-color:#3a4a35}
 .no.trav{opacity:.4}
 .no:active{transform:scale(.97)}
 .noh{display:flex;justify-content:space-between;align-items:center;gap:6px}
 .noh b{font-size:12.5px}
 .pips{display:flex;gap:2.5px}
 .pips i{width:6px;height:6px;border-radius:50%;background:#2c333c;display:block}
 .pips i.on{background:var(--rc);box-shadow:0 0 6px var(--rc)}
 .notxt{font-size:10.5px;color:#8d8672;margin:5px 0 6px;line-height:1.4;min-height:28px}
 .nofoot{font-size:10.5px;color:#6b6250}
 .cst{color:#8a7a50} .cst.ok{color:#ffd24a;font-weight:900}
 /* ============ ESCOLHA DE CLASSE ============ */
 .cls{display:flex;flex-direction:column;gap:10px}
 .cbtn{display:flex;gap:12px;align-items:center;text-align:left;
   background:linear-gradient(110deg,#171c23,#0e1116);border:1px solid rgba(255,255,255,.12);
   border-left:4px solid var(--cc,#666);border-radius:13px;padding:12px;cursor:pointer;
   color:#e8e2d0;font-family:Georgia,serif;transition:.14s}
 .cbtn:active{transform:scale(.98)} .cbtn:hover{border-color:var(--cc)}
 .cglifo{font-size:34px;filter:drop-shadow(0 0 10px var(--cc));flex:none;width:44px;text-align:center}
 .cinfo b{font-size:17px;display:block}
 .cmat{font-size:11px;color:#8d8672;display:block;margin-top:1px}
 .cstats{display:flex;gap:10px;margin:6px 0 4px}
 .cstats i{font-style:normal;font-size:12px;color:#c9bb95;font-weight:700}
 .cfan{font-size:10.5px;color:#6b6250;font-style:italic;display:block;line-height:1.4}
 /* ============ FIM DE RUN ============ */
 .fimwrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
   gap:9px;padding:26px 18px;width:100%;max-width:400px;margin:0 auto;text-align:center}
 .fimt{font-size:15px;letter-spacing:5px;color:#8a4a4a}
 .fimprof{font-size:38px;font-weight:900;letter-spacing:-1px;
   background:linear-gradient(180deg,#fff,#c9a86a);-webkit-background-clip:text;background-clip:text;
   -webkit-text-fill-color:transparent;margin:2px 0 8px}
 .fimrec{font-size:12px;letter-spacing:3px;color:#ffd24a;animation:matap 1.2s infinite}
 .fimlin{display:flex;justify-content:space-between;width:100%;font-size:12.5px;
   color:#7a7260;border-bottom:1px solid rgba(255,255,255,.06);padding:5px 2px}
 .fimlin b{color:#e8e2d0}
 .fimeco{display:flex;align-items:center;gap:8px;font-size:26px;font-weight:900;color:#ffe9b0;margin:12px 0 6px}
 .fimeco i{font-size:11px;color:#7a6d50;letter-spacing:2px;font-style:normal}
 /* ============ RECOMPENSA ============ */
 .recwrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
   gap:10px;padding:26px 16px;width:100%;max-width:440px;margin:0 auto}
 .rect{font-size:20px;letter-spacing:5px;color:#8fd8a0}
 .recp{font-size:12px;color:#7a7260}
 .recs2{display:flex;flex-direction:column;gap:9px;width:100%}
 .rec{display:flex;align-items:center;gap:11px;text-align:left;padding:12px;cursor:pointer;
   background:linear-gradient(110deg,#171c23,#0e1116);border:1px solid rgba(255,255,255,.12);
   border-radius:12px;color:#e8e2d0;font-family:Georgia,serif;transition:.14s}
 .rec:active{transform:scale(.98)}
 .rec.reliquia{border-color:#8a6ad8}.rec.dado{border-color:#4a9ad8}
 .rec.grav{border-color:#d8a04a}.rec.cura{border-color:#4ad88a}
 .rec .ric{font-size:26px;flex:none;width:36px;text-align:center}
 .rec b{font-size:15px;display:block} .rec span{font-size:11px;color:#8d8672;display:block;margin-top:2px}
 #msg p{font-size:14px;opacity:.8;max-width:420px;line-height:1.6}
 .cls{display:flex;flex-direction:column;gap:8px;width:100%;max-width:330px}
 .cbtn{background:linear-gradient(180deg,#1e242c,#141920);border:1px solid rgba(255,255,255,.15);
   border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;color:#e8e2d0;font-family:Georgia,serif}
 .cbtn b{font-size:16px} .cbtn span{display:block;font-size:11.5px;opacity:.7;margin-top:3px}
 #topo{position:fixed;top:calc(6px + env(safe-area-inset-top));right:10px;font-size:11px;opacity:.65;text-align:right;pointer-events:none}
 #log{position:fixed;left:10px;bottom:150px;font-size:11px;opacity:.75;max-width:44vw;pointer-events:none;line-height:1.5}
 /* ===== sprite do inimigo ===== */
 .en .spr{height:72px;display:flex;align-items:flex-end;justify-content:center;margin:-2px 0 2px}
 .en .spr img{height:72px;image-rendering:auto;filter:drop-shadow(0 4px 6px rgba(0,0,0,.6));
   animation:resp 2.6s ease-in-out infinite}
 .en:nth-child(2n) .spr img{animation-duration:3.1s;animation-delay:-.7s}
 .en:nth-child(3n) .spr img{animation-duration:2.2s;animation-delay:-1.3s}
 @keyframes resp{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-3px) scale(1.03)}}
 .en.alvo .spr img{filter:drop-shadow(0 0 10px #ffd24a) drop-shadow(0 4px 6px rgba(0,0,0,.6))}
 .en.morto .spr img{animation:none;transform:rotate(14deg) translateY(8px);opacity:.5}
 /* impacto */
 .en{position:relative;transition:transform .08s}
 .en.bat{animation:bat .34s cubic-bezier(.2,.8,.3,1)}
 @keyframes bat{0%{transform:translateX(0)}18%{transform:translateX(-7px) scale(1.05)}
   40%{transform:translateX(5px)}70%{transform:translateX(-2px)}100%{transform:translateX(0)}}
 .en.bat .spr img{filter:brightness(3.2) drop-shadow(0 0 14px #fff);animation:none}
 .en.morrendo{animation:morrer .5s forwards}
 @keyframes morrer{to{opacity:.25;transform:scale(.9) rotate(6deg);filter:grayscale(1)}}
 .dmg{position:absolute;left:50%;top:16px;transform:translateX(-50%);font-size:22px;font-weight:900;
   color:#fff;text-shadow:0 2px 0 #8a1010,0 0 12px #ff5a3c;pointer-events:none;
   animation:sobe .9s cubic-bezier(.1,.9,.3,1) forwards;z-index:5}
 .dmg.big{font-size:32px;color:#ffe27a;text-shadow:0 2px 0 #7a2a00,0 0 20px #ff9d2b}
 @keyframes sobe{0%{opacity:0;transform:translateX(-50%) translateY(10px) scale(.6)}
   22%{opacity:1;transform:translateX(-50%) translateY(-6px) scale(1.25)}
   40%{transform:translateX(-50%) translateY(-12px) scale(1)}
   100%{opacity:0;transform:translateX(-50%) translateY(-46px) scale(.95)}}
 .dmgme{position:absolute;left:50%;top:-16px;transform:translateX(-50%);font-size:20px;font-weight:900;
   color:#ff8a7a;text-shadow:0 2px 8px #000;animation:sobe .9s forwards;pointer-events:none}
 #voce{position:relative}
 /* dano no jogador: borda vermelha pulsando */
 #ferida{position:fixed;inset:0;pointer-events:none;z-index:15;
   box-shadow:inset 0 0 90px 20px rgba(190,20,20,.75);animation:ferir .42s ease-out forwards}
 @keyframes ferir{to{opacity:0}}
 /* tremor global da HUD */
 #ini,#baixo{transform:translateX(var(--sk,0px))}
 /* ===== TELEGRAFIA (§12) ===== */
 .en.napre{border-color:#ffd24a;box-shadow:0 0 0 1px #ffd24a66,0 0 22px #ffd24a33}
 .en .prev{position:absolute;top:-13px;left:50%;transform:translateX(-50%);display:flex;gap:4px;
   align-items:center;z-index:6;white-space:nowrap;animation:pin .18s ease-out}
 @keyframes pin{from{opacity:0;transform:translateX(-50%) translateY(6px) scale(.8)}}
 .en .prev .pd{background:#7a1420;border:1px solid #ff6a5a;color:#fff;font-size:14px;font-weight:900;
   border-radius:7px;padding:1px 7px;text-shadow:0 1px 3px #000}
 .en .prev .pe{background:#16324a;border:1px solid #4aa3d8;color:#bfe4ff;font-size:11px;font-weight:800;
   border-radius:7px;padding:2px 6px}
 .en .prev .pk{font-size:16px;filter:drop-shadow(0 0 6px #ff3b3b)}
 .en .prev.mata .pd{background:#a01020;border-color:#ff9a5a;animation:matap .7s infinite}
 @keyframes matap{0%,100%{box-shadow:0 0 0 #ff3b3b}50%{box-shadow:0 0 14px #ff3b3b}}
 .hpb{position:relative}
 .hpb .perda{position:absolute;top:0;height:100%;background:repeating-linear-gradient(45deg,
   #ff5a4a,#ff5a4a 4px,#ffb0a0 4px,#ffb0a0 8px);opacity:.92;animation:pisc .6s infinite}
 @keyframes pisc{0%,100%{opacity:.9}50%{opacity:.45}}
 .en .it .passa{color:#ff8a7a;font-weight:900;margin-left:5px}
 .en .it.doi{color:#ff6a5a}
 .pill.perigo{background:rgba(120,20,20,.5);border-color:#a33;color:#ffb0a0;font-weight:800}
 .pill.perigo.letal{background:#a01020;border-color:#ff6a5a;color:#fff;animation:matap .7s infinite}
 .h.pre{border-color:#ffd24a;box-shadow:0 0 16px #ffd24a55;transform:translateY(-3px)}
 .h .hp2{font-size:11px;font-weight:900;color:#ffd24a;margin-top:3px}
 /* habilidade pronta pulsa */
 .h.ok{animation:pulsa 1.5s ease-in-out infinite}
 @keyframes pulsa{0%,100%{box-shadow:0 0 10px #4ad98a44}50%{box-shadow:0 0 20px #4ad98a99}}
</style></head><body>
<canvas id="c"></canvas>
<div id="ini" class="lay"></div>
<div id="topo"></div>
<div id="log"></div>
<div id="sel"></div>
<div id="baixo" class="lay">
  <div id="voce"></div>
  <div id="hab"></div>
  <div id="acoes">
    <button class="b" id="brer">Re-rolar</button>
    <button class="b pri" id="bfim">Terminar turno</button>
  </div>
</div>
<div id="msg"></div>
<script type="module" src="./js/jogo.js"></script>
</body></html>
