<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Dados do Abismo</title>
<style>
 *{margin:0;padding:0;box-sizing:border-box}
 body{background:#07090b;color:#e8e2d0;font-family:Georgia,serif;overflow:hidden;height:100vh;
   -webkit-tap-highlight-color:transparent;user-select:none}
 #c{position:fixed;left:0;top:0;width:100vw;height:100vh}
 .lay{position:fixed;left:0;right:0;pointer-events:none}
 /* topo: inimigos */
 /* A FILEIRA DE INIMIGOS FICA NO TOPO E PONTO. Antes ela quebrava linha e a
    3ª carta descia por cima do feltro; agora não quebra — rola de lado. */
 #ini{top:0;padding:calc(28px + env(safe-area-inset-top)) 8px 8px;display:flex;gap:6px;
   justify-content:safe center;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;
   z-index:10;pointer-events:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
   max-height:calc(44vh + env(safe-area-inset-top))}
 #ini::-webkit-scrollbar{display:none}
 /* borda esfumada avisa que tem mais inimigo pro lado */
 #ini{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 14px),transparent 100%);
      mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 14px),transparent 100%)}
 .en{pointer-events:auto;background:rgba(8,11,15,.96);border:1px solid rgba(255,255,255,.13);
   border-radius:11px;padding:6px 7px;cursor:pointer;backdrop-filter:blur(6px);
   flex:0 0 auto;width:120px;scroll-snap-align:center}
 .en.alvo{border-color:#ffd24a;box-shadow:0 0 0 1px #ffd24a55}
 .en.morto{opacity:.28;filter:grayscale(1)}
 .en .nm{font-size:11.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .en .el{color:#ff7a5c;font-size:9px;letter-spacing:1px}
 .en .hpb{height:6px;background:#2a1518;border-radius:3px;overflow:hidden;margin:4px 0 3px}
 .en .hpb>i{display:block;height:100%;background:linear-gradient(90deg,#c0392b,#e8604a)}
 .en .hp{font-size:9.5px;opacity:.75;font-variant-numeric:tabular-nums;
   display:flex;align-items:center;gap:4px;flex-wrap:wrap}
 /* bloqueio agora DURA o seu turno — tem que dar pra ver */
 .en .bloq{opacity:1;font-size:10.5px;font-weight:900;color:#8fd8ff;cursor:help;
   background:rgba(60,120,180,.24);border:1px solid #2b4258;border-radius:5px;padding:1px 5px}
 .en .armad{opacity:1;font-size:10px;font-weight:800;color:#cfd8e3;cursor:help;
   background:rgba(120,130,145,.18);border:1px solid #3d4a58;border-radius:5px;padding:1px 4px}
 .en .it{font-size:11px;font-weight:700;color:#ffb45e;margin-top:3px}
 .en .st{font-size:9px;color:#7fd98a}
 .en .pres{font-size:8.5px;color:#9a8fd8;margin-top:2px;letter-spacing:.3px}
 .fer.ult{background:linear-gradient(180deg,#3a2a10,#1a1206);border-color:#c9a13a;color:#ffe9b0;
   box-shadow:0 0 12px rgba(255,200,90,.28)}
 .en .it.clic{cursor:help;text-decoration:underline dotted rgba(255,180,94,.45);text-underline-offset:3px}
 .stc{cursor:help;pointer-events:auto}
 /* ===== CARTÃO DE EXPLICAÇÃO ===== */
 #pop{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
   background:rgba(3,5,8,.72);backdrop-filter:blur(3px);padding:20px}
 #pop.off{display:none}
 .popcard{width:100%;max-width:340px;text-align:left;border-radius:16px;padding:14px;
   background:linear-gradient(180deg,#171c23,#0c1015);border:1px solid #3d4a58;
   box-shadow:0 18px 50px rgba(0,0,0,.6);animation:popin .16s ease-out}
 @keyframes popin{from{opacity:0;transform:scale(.92) translateY(8px)}}
 .pophd{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
 .popico{font-size:26px;line-height:1;flex:none;filter:drop-shadow(0 0 8px rgba(255,210,74,.5))}
 .pophd b{display:block;font-size:15px;color:#e8e2d0}
 .pophd i{display:block;font-size:11px;color:#ffd24a;font-style:normal;margin-top:2px}
 .popd{font-size:12.5px;color:#b9b0a0;line-height:1.55}
 .poprod{font-size:10.5px;color:#8d8672;margin-top:8px;border-top:1px solid #262d35;padding-top:7px}
 .popbts{display:flex;gap:7px;margin-top:11px}
 .popb{flex:1;font-family:Georgia,serif;font-size:12px;font-weight:800;cursor:pointer;
   background:linear-gradient(180deg,#2a323d,#181d24);border:1px solid rgba(255,255,255,.16);
   color:#e8e2d0;border-radius:10px;padding:9px}
 .popb.ver{flex:0 0 auto;font-size:10.5px;font-weight:600;color:#9aa6b2}
 .popb:active{transform:scale(.96)}
 #pop .gex{margin-top:8px;display:flex;flex-direction:column;gap:4px;font-size:11px}
 /* ===== FECHADURA: a regra do inimigo, sempre visível (§12) ===== */
 .en .trava{display:flex;align-items:center;gap:4px;margin-top:4px;padding:3px 5px;border-radius:6px;
   background:rgba(150,120,40,.14);border:1px solid rgba(220,180,80,.35);font-size:9px;line-height:1.25;
   color:#e8d9a8}
 .en .trava .tico{font-size:12px;flex:none}
 .en .trava .ttx{flex:1;min-width:0}
 .en .trava .tst{flex:none;font-weight:900;font-size:8.5px;letter-spacing:.5px}
 .en .trava.abre{background:rgba(40,150,80,.20);border-color:#4ad98a;color:#bff2d0;
   box-shadow:0 0 10px #4ad98a44}
 .en .trava.abre .tst{color:#7ef2a8}
 .en .trava.fecha{background:rgba(150,40,40,.20);border-color:#e0604a;color:#f2c4bb}
 .en .trava.fecha .tst{color:#ff8a7a}
 .en .trava.off{background:rgba(120,90,200,.20);border-color:#a07cff;color:#ddc8ff}
 .en .trava{cursor:help}
 .en .trava .tq{flex:none;width:13px;height:13px;border-radius:50%;display:grid;place-items:center;
   font-size:9px;font-weight:900;background:rgba(255,210,74,.18);border:1px solid #9a7f34;color:#ffd24a}
 /* ===== GRIMÓRIO ===== */
 .grimwrap{width:100%;max-width:560px;margin:0 auto;padding:14px 14px 34px;
   min-height:100vh;display:flex;flex-direction:column;gap:10px;text-align:left}
 .gnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:2px}
 .gtab{font-family:Georgia,serif;font-size:10.5px;color:#cfc4a4;cursor:pointer;
   background:#151a20;border:1px solid #333c46;border-radius:20px;padding:5px 10px}
 .gtab:active{transform:scale(.95)}
 .gsec{border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:11px 12px;
   background:linear-gradient(180deg,rgba(255,255,255,.03),transparent)}
 .gsec h3{font-size:12px;letter-spacing:2.5px;color:#e8d9a8;font-weight:700;
   display:flex;align-items:center;gap:8px;margin-bottom:7px}
 .gsec h3 .gico{font-size:16px}
 .gintro{font-size:11.5px;color:#9a927e;line-height:1.55;margin-bottom:9px}
 .gitem{padding:7px 0;border-top:1px solid #1c2128}
 .gitem:first-of-type{border-top:0}
 .gitem b{display:block;font-size:12.5px;color:#e8e2d0;margin-bottom:2px}
 .gitem span{display:block;font-size:11.5px;color:#8d8672;line-height:1.5}
 .gitem.foco{background:rgba(255,210,74,.10);border:1px solid #9a7f34;border-radius:10px;
   padding:8px 9px;margin:4px -3px}
 .gex{margin-top:5px;display:flex;flex-direction:column;gap:3px;font-size:10.5px}
 .gok{color:#8fd8a0;background:rgba(40,150,80,.13);border-radius:6px;padding:3px 7px}
 .gno{color:#e08a7a;background:rgba(150,40,40,.13);border-radius:6px;padding:3px 7px}
 /* rodapé: você + habilidades */
 #baixo{bottom:0;z-index:10;padding:6px 10px calc(10px + env(safe-area-inset-bottom));
   background:linear-gradient(180deg,transparent,rgba(4,6,8,.94) 30%)}
 #voce{display:flex;align-items:center;gap:9px;justify-content:center;font-size:12.5px;margin-bottom:6px}
 #voce b{font-size:16px}
 .pill{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);border-radius:20px;padding:3px 10px}
 #hab{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;pointer-events:auto;align-items:stretch}
 /* ===== CARTA DE HABILIDADE ===== */
 .h{position:relative;overflow:hidden;cursor:pointer;transition:.13s;
   font-family:Georgia,serif;color:#e8e2d0;text-align:center;
   background:linear-gradient(180deg,#1e242c,#0f141a);border:1px solid rgba(255,255,255,.14);
   border-left:3px solid color-mix(in srgb,var(--hc,#888) 70%,transparent);
   border-radius:12px;padding:6px 8px 5px;min-width:96px;max-width:174px;
   display:flex;flex-direction:column;align-items:center;gap:2px}
 .h .htopo{display:flex;align-items:center;gap:5px}
 .h .hico{width:17px;height:17px;flex:none;color:var(--hc,#cfd8e3);
   filter:drop-shadow(0 0 5px color-mix(in srgb,var(--hc,#888) 55%,transparent))}
 .h .hn{font-size:12px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
 /* requisito desenhado como DADOS */
 .h .hreq{display:flex;align-items:center;gap:2px;flex-wrap:wrap;justify-content:center}
 .h .hreq .op{font-size:10px;color:#8fb0d8;font-weight:900}
 .h .hreq .grp{display:flex;align-items:center;gap:1px}
 .dchip{display:grid;place-items:center;min-width:15px;height:15px;padding:0 2px;
   border-radius:4px;background:#0b1016;border:1px solid #33404d;color:#cfe0f2;
   font-size:9.5px;font-weight:800;font-style:normal;line-height:1}
 .dchip.ig{color:#ffd24a;border-color:#5c4718} .dchip.sq{color:#7ef2c8;border-color:#1f5049}
 .dchip.so{color:#ffb45e;border-color:#6a4a1e} .dchip.pr{color:#c9a6ff;border-color:#4a3a6a;font-size:8.5px}
 .dchip.sb{color:#ffd24a;border-color:#5c4718} .dchip.qq{color:#7d8894;border-color:#333c46}
 /* selo do que a jogada FAZ */
 .h .hsel{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:center;margin-top:1px}
 .h .hsel b{font-size:10.5px;font-weight:900;line-height:1;padding:1px 4px;border-radius:5px;
   background:rgba(0,0,0,.4)}
 .h .hd{color:#ff8a7a} .h .hb{color:#8fd8ff} .h .hc{color:#7ef2a8}
 .h .hx{color:#e0a0a0} .h .hk{color:#ffd24a}
 .h .hest{font-size:8px;letter-spacing:1.4px;color:#5f6874;text-transform:uppercase}
 /* ===== A CONTA DO GOLPE: quantos dados, soma e paridade ===== */
 .conta{display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:center;
   margin-top:2px;padding:2px 5px;border-radius:8px;background:rgba(0,0,0,.35);
   border:1px solid #2b333c;line-height:1}
 .conta .cdd{display:flex;align-items:center;gap:1px}
 .conta .dv{display:grid;place-items:center;min-width:14px;height:14px;padding:0 2px;border-radius:4px;
   background:#e8e2d0;color:#14181d;font-size:9.5px;font-weight:900;font-style:normal;line-height:1}
 .conta .mais{color:#6d7681;font-size:9px;font-weight:700;padding:0 1px}
 .conta .cqt{font-size:9px;font-weight:800;color:#cfe0f2;white-space:nowrap}
 .conta .csoma{font-size:10px;font-weight:900;color:#ffd24a;font-variant-numeric:tabular-nums}
 .conta .cpar{font-size:9px;font-weight:900;letter-spacing:.3px;padding:1px 4px;border-radius:5px;white-space:nowrap}
 .conta .cpar.p{color:#8fd8ff;background:rgba(60,120,180,.22);border:1px solid #2b4258}
 .conta .cpar.i{color:#c9a6ff;background:rgba(120,80,190,.22);border:1px solid #4a3a6a}
 /* na barra de seleção fica maior — é a leitura principal */
 .conta.grande{pointer-events:none;gap:8px;padding:5px 10px;border-radius:10px;
   background:rgba(8,11,15,.9);border-color:#3d4a58}
 .conta.grande .dv{min-width:20px;height:20px;font-size:12.5px}
 .conta.grande .cqt{font-size:11.5px}
 .conta.grande .csoma{font-size:14px}
 .conta.grande .cpar{font-size:11.5px;padding:2px 7px}
 /* estados */
 .h.pode{border-color:rgba(255,255,255,.22)}
 .h.ok{border-color:#4ad98a;box-shadow:0 0 14px #4ad98a3a,inset 0 0 18px #4ad98a14}
 .h.ok .hest{color:#7ef2a8;font-weight:900}
 .h.off{opacity:.38;filter:saturate(.3)}
 .h.pre{border-color:#ffd24a;box-shadow:0 0 18px #ffd24a55;transform:translateY(-2px)}
 .h:active{transform:scale(.95)}
 /* varredura de brilho quando está pronta */
 .h .hbrilho{position:absolute;inset:0;pointer-events:none;opacity:0;
   background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.16) 50%,transparent 62%)}
 .h.ok .hbrilho{opacity:1;animation:varre 2.6s linear infinite}
 @keyframes varre{0%{transform:translateX(-120%)}55%,100%{transform:translateX(120%)}}
 /* onda ao usar */
 .h.usou::after{content:'';position:absolute;left:50%;top:50%;width:8px;height:8px;
   margin:-4px 0 0 -4px;border-radius:50%;border:2px solid var(--hc,#fff);
   animation:hond .45s ease-out forwards}
 @keyframes hond{to{width:180px;height:180px;margin:-90px 0 0 -90px;opacity:0}}
 #acoes{display:flex;gap:6px;justify-content:center;margin-top:7px;pointer-events:auto}
 .b{background:linear-gradient(180deg,#2a323d,#181d24);border:1px solid rgba(255,255,255,.16);
   border-radius:10px;padding:8px 14px;font-family:Georgia,serif;color:#e8e2d0;font-size:13px;font-weight:700;cursor:pointer}
 .b.pri{background:linear-gradient(180deg,#7a1f2b,#4d1119);border-color:#a33}
 .b:disabled{opacity:.4}
 /* seleção de dados */
 #sel{position:static;text-align:center;font-size:12px;color:#ffd24a;margin-bottom:5px;
   pointer-events:none;display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap}
 #sel .selt{text-shadow:0 1px 4px #000}
 /* ferramentas de fechadura vindas do Cofre */
 .fer{pointer-events:auto;font-family:Georgia,serif;font-size:12px;font-weight:800;cursor:pointer;
   background:linear-gradient(180deg,#2a2418,#15120c);border:1px solid #6a5a2a;color:#ffd9a0;
   border-radius:9px;padding:4px 10px}
 .fer:active{transform:scale(.94)}
 .fer.gaz{background:linear-gradient(180deg,#3a2a10,#1a1206);border-color:#c9a13a;color:#ffe9b0;
   box-shadow:0 0 12px rgba(255,200,90,.25)}
 #sel .fern{font-size:10px;color:#8a7a50}
 .fer.pas{background:linear-gradient(180deg,#1d2a33,#0e1720);border-color:#3f6a8a;color:#bfe4ff}
 /* faixa/telas */
 #msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;
   gap:14px;background:rgba(4,6,9,.975);z-index:20;padding:20px;text-align:center}
 #msg.off{display:none}
 #msg{overflow-y:auto;justify-content:flex-start;padding:0}
 /* CENTRALIZAR CORTA O TOPO: num telefone baixo (360x640) o conteúdo maior que
    a tela ficava com o começo acima do zero do scroll, inalcançável — o selo
    da recompensa sumia. Com margin auto nas pontas o espaço que sobra se
    divide (centraliza), e quando não sobra a margem é zero (não corta). */
 .titwrap,.fimwrap,.recwrap,.mapwrap{justify-content:flex-start !important}
 .titwrap>*:first-child,.fimwrap>*:first-child,.recwrap>*:first-child,.mapwrap>*:first-child{margin-top:auto}
 .titwrap>*:last-child,.fimwrap>*:last-child,.recwrap>*:last-child,.mapwrap>*:last-child{margin-bottom:auto}
 #msg h1{font-size:26px;font-weight:900;letter-spacing:.5px}
 /* ============ TELA INICIAL ============ */
 .titwrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
   gap:16px;padding:26px 18px;width:100%;max-width:460px;margin:0 auto}
 .tit{text-align:center;line-height:.92}
 .tit1{font-size:clamp(44px,15vw,72px);font-weight:900;letter-spacing:-2px;
   background:linear-gradient(180deg,#fff,#e8d9a8 55%,#8a6a2a);-webkit-background-clip:text;
   background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 4px 20px rgba(255,200,90,.28))}
 .tit2{font-size:clamp(20px,6.5vw,32px);font-weight:900;letter-spacing:7px;color:#9a8a68;margin-top:2px}
 .titsub{font-size:12px;letter-spacing:3px;color:#6b6250;margin-top:12px;text-transform:uppercase}
 .ecos{display:flex;align-items:center;gap:7px;background:linear-gradient(180deg,#1a1710,#0e0c08);
   border:1px solid #4a3f22;border-radius:30px;padding:8px 18px;box-shadow:0 0 22px rgba(255,200,90,.12)}
 .ecos .eic{color:#ffd24a;font-size:17px;text-shadow:0 0 10px #ffd24a}
 .ecos b{font-size:20px;color:#ffe9b0} .ecos i{font-size:10px;color:#7a6d50;letter-spacing:2px;font-style:normal}
 .ecos.sm{padding:5px 12px} .ecos.sm b{font-size:15px}
 .mbtns{display:flex;flex-direction:column;gap:10px;width:100%;max-width:320px}
 .mb{font-family:Georgia,serif;font-size:16px;font-weight:800;letter-spacing:1px;color:#e8e2d0;
   background:linear-gradient(180deg,#232a33,#141920);border:1px solid rgba(255,255,255,.16);
   border-radius:13px;padding:15px;cursor:pointer;transition:.14s;position:relative;overflow:hidden}
 .mb:active{transform:scale(.97)}
 .mb.pri{background:linear-gradient(180deg,#8a2230,#4d1119);border-color:#c04a4a;
   box-shadow:0 6px 26px rgba(160,30,40,.4)}
 .mb.cof{background:linear-gradient(180deg,#2a2418,#15120c);border-color:#6a5a2a;color:#ffd9a0}
 .mb em{font-style:normal;font-size:11px;opacity:.65;margin-left:6px}
 .recs{display:flex;gap:14px;font-size:11px;color:#6b6250}
 .recs b{color:#b9ab88;font-size:13px}
 /* ============ O COFRE ============ */
 .cofwrap,.clswrap{width:100%;max-width:520px;margin:0 auto;padding:14px 14px 30px;
   min-height:100vh;display:flex;flex-direction:column;gap:12px}
 .cofhd{display:flex;align-items:center;gap:12px;padding-top:calc(6px + env(safe-area-inset-top))}
 .cofhd h2{flex:1;font-size:19px;letter-spacing:4px;color:#e8d9a8}
 .volta{width:38px;height:38px;border-radius:10px;background:#171b22;border:1px solid rgba(255,255,255,.14);
   color:#e8e2d0;font-size:22px;cursor:pointer}
 .cofp{font-size:12px;color:#7a7260;line-height:1.6}
 .cofp b{color:#c9bb95}
 .ramo{border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:11px;
   background:linear-gradient(180deg,rgba(255,255,255,.03),transparent)}
 .rh{display:flex;align-items:center;gap:8px;margin-bottom:9px}
 .rh .ri{font-size:17px} .rh b{color:var(--rc);letter-spacing:3px;font-size:13px}
 .rh i{font-size:10.5px;color:#6b6250;font-style:normal}
 .nos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
 .no{text-align:left;background:linear-gradient(180deg,#161a20,#0e1116);color:#e8e2d0;
   border:1px solid rgba(255,255,255,.10);border-radius:11px;padding:9px;cursor:pointer;
   font-family:Georgia,serif;transition:.14s}
 .no.pode{border-color:var(--rc);box-shadow:0 0 14px color-mix(in srgb,var(--rc) 30%,transparent)}
 .no.max{opacity:.72;border-color:#3a4a35}
 .no.trav{opacity:.4}
 .no:active{transform:scale(.97)}
 .noh{display:flex;justify-content:space-between;align-items:center;gap:6px}
 .noh b{font-size:12.5px}
 .pips{display:flex;gap:2.5px}
 .pips i{width:6px;height:6px;border-radius:50%;background:#2c333c;display:block}
 .pips i.on{background:var(--rc);box-shadow:0 0 6px var(--rc)}
 .notxt{font-size:10.5px;color:#8d8672;margin:5px 0 6px;line-height:1.4;min-height:28px}
 .nofoot{font-size:10.5px;color:#6b6250}
 .cst{color:#8a7a50} .cst.ok{color:#ffd24a;font-weight:900}
 /* ============ ESCOLHA DE CLASSE ============ */
 .cls{display:flex;flex-direction:column;gap:10px}
 .cbtn{display:flex;gap:12px;align-items:center;text-align:left;
   background:linear-gradient(110deg,#171c23,#0e1116);border:1px solid rgba(255,255,255,.12);
   border-left:4px solid var(--cc,#666);border-radius:13px;padding:12px;cursor:pointer;
   color:#e8e2d0;font-family:Georgia,serif;transition:.14s}
 .cbtn:active{transform:scale(.98)} .cbtn:hover{border-color:var(--cc)}
 .cchave{font-size:10.5px;color:#e8d9a8;background:rgba(150,120,40,.16);
   border:1px solid rgba(220,180,80,.3);border-radius:7px;padding:3px 6px;margin:5px 0;line-height:1.35}

 /* ============ RECOMPENSA ============ */
 /* Era uma lista de três caixas iguais: informava, mas não era um MOMENTO.
    Agora é o pódio do andar — selo, raridade com peso e cartas que entram
    em cascata e se acendem quando você escolhe. */
 .recwrap{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;
   justify-content:center;gap:10px;padding:22px 16px 30px;width:100%;max-width:440px;margin:0 auto}
 /* o combate ficava aparecendo por trás e embolava a leitura das cartas */
 .recwrap::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
   background:radial-gradient(120% 70% at 50% 12%,#12161d 0%,#07090c 55%,#04060a 100%)}
 /* quem pediu menos movimento perde a cascata e os brilhos — mas NÃO o retorno
    de qual carta foi levada, que é informação, não enfeite */
 @media (prefers-reduced-motion: reduce){
   .rec,.rec::after,.vitsel,.vitsel::before,.vitanel{animation:none !important}
   .recs2:not(.escolhido) .rec{opacity:1 !important;transform:none !important}
   .recs2.escolhido .rec.levada{opacity:1 !important}
 }

 /* ---- selo do andar ---- */
 .vitsel{position:relative;width:104px;height:104px;display:grid;place-items:center;margin-bottom:2px;
   animation:selopop .55s cubic-bezier(.2,1.5,.4,1) both}
 .vitsel::before{content:'';position:absolute;inset:-14px;border-radius:50%;
   background:radial-gradient(circle,var(--sc,#8fd8a0)33,transparent 68%);animation:pulsar 2.6s ease-in-out infinite}
 .vitanel{position:absolute;inset:0;border-radius:50%;border:2px dashed var(--sc,#8fd8a0);opacity:.5;
   animation:girar 14s linear infinite}
 .vitanel.b{inset:9px;border-style:solid;border-width:1px;opacity:.28;animation-direction:reverse;animation-duration:9s}
 .vitn{font-size:38px;font-weight:900;color:var(--sc,#8fd8a0);line-height:1;
   text-shadow:0 0 18px var(--sc,#8fd8a0)77}
 .vitl{font-size:11px;letter-spacing:5px;color:var(--sc,#8fd8a0);margin-top:-2px}
 .vitsub{font-size:10px;letter-spacing:3px;color:#6d6656;margin-top:5px}
 /* trilha dos 10 andares: dá para ver o quanto falta sem ler nada */
 .vittrilha{display:flex;gap:5px;align-items:center;margin:8px 0 2px}
 .vittrilha span{width:13px;height:5px;border-radius:3px;background:#252017;border:1px solid #322b20;
   transition:.2s}
 .vittrilha span.m{width:19px;height:7px;border-radius:4px}
 .vittrilha span.on{background:var(--sc,#8fd8a0);border-color:var(--sc,#8fd8a0);
   box-shadow:0 0 8px -1px var(--sc,#8fd8a0)}
 .vitstats{display:flex;gap:7px;margin:4px 0 2px}
 .vitstats i{font-style:normal;font-size:10px;letter-spacing:1px;color:#8d8672;
   background:#141109;border:1px solid #2a251d;border-radius:20px;padding:4px 11px}
 .vitstats i b{color:#e8e2d0;font-size:12px;margin-right:3px}
 @keyframes selopop{from{transform:scale(.4) rotate(-25deg);opacity:0}to{transform:none;opacity:1}}
 @keyframes girar{to{transform:rotate(360deg)}}
 @keyframes pulsar{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.09)}}

 .recp{font-size:10px;letter-spacing:4px;color:#6d6656;margin-top:4px}
 .recs2{display:flex;flex-direction:column;gap:11px;width:100%;perspective:900px}

 /* ---- a carta ---- */
 .rec{position:relative;display:flex;flex-direction:column;align-items:stretch;gap:0;
   text-align:left;padding:13px 13px 0;cursor:pointer;overflow:hidden;
   background:linear-gradient(150deg,#1b2029 0%,#12151b 45%,#0d0f14 100%);
   border:1px solid var(--c,#5a5348);border-radius:14px;color:#e8e2d0;font-family:Georgia,serif;
   box-shadow:0 6px 20px #0009, inset 0 1px 0 #ffffff12, 0 0 0 0 var(--c,#5a5348);
   transition:transform .16s cubic-bezier(.2,1,.4,1), box-shadow .16s;
   animation:cartaentra .5s cubic-bezier(.2,1,.35,1) both; animation-delay:calc(var(--d,0)*110ms)}
 @keyframes cartaentra{from{opacity:0;transform:translateY(26px) rotateX(-16deg) scale(.94)}
                       to{opacity:1;transform:none}}
 /* faixa de luz que corre pela carta */
 .rec::after{content:'';position:absolute;top:0;left:-60%;width:45%;height:100%;pointer-events:none;
   background:linear-gradient(100deg,transparent,#ffffff14,transparent);
   animation:brilho 4.5s ease-in-out infinite;animation-delay:calc(var(--d,0)*260ms + 700ms)}
 @keyframes brilho{0%,72%{left:-60%}88%,100%{left:115%}}
 .rec:hover{transform:translateY(-3px) scale(1.012);box-shadow:0 12px 30px #000b, inset 0 1px 0 #ffffff18, 0 0 22px -4px var(--c)}
 .rec:active{transform:scale(.985)}
 .rec.dado{--c:#4a9ad8} .rec.grav{--c:#d8a04a} .rec.cura{--c:#4ad88a} .rec.reliquia{--c:#8a6ad8}
 .rec.r-comum{--c:#9aa3ad} .rec.r-rara{--c:#ffd24a} .rec.r-amaldicoada{--c:#d84a7a}
 /* a rara e a amaldiçoada respiram — dá para sentir a raridade sem ler */
 .rec.r-rara{box-shadow:0 6px 20px #0009, inset 0 1px 0 #ffffff12, 0 0 20px -6px #ffd24a;
   animation:cartaentra .5s cubic-bezier(.2,1,.35,1) both, raro 2.8s ease-in-out infinite 1s}
 @keyframes raro{0%,100%{box-shadow:0 6px 20px #0009, inset 0 1px 0 #ffffff12, 0 0 16px -8px #ffd24a}
                 50%{box-shadow:0 6px 26px #0009, inset 0 1px 0 #ffffff12, 0 0 30px -3px #ffd24a}}
 .rec.r-amaldicoada{animation:cartaentra .5s cubic-bezier(.2,1,.35,1) both, maldito 3.4s ease-in-out infinite 1s}
 @keyframes maldito{0%,100%{box-shadow:0 6px 20px #0009, inset 0 1px 0 #ffffff12, 0 0 16px -8px #d84a7a}
                    50%{box-shadow:0 6px 26px #000b, inset 0 1px 0 #ffffff12, 0 0 32px -2px #d84a7a}}
 /* fita de raridade */
 .rrar{position:absolute;top:0;right:0;font-size:8.5px;letter-spacing:2.5px;font-weight:700;
   color:#0d0f14;background:var(--c,#9aa3ad);padding:3px 11px 3px 14px;
   border-radius:0 14px 0 12px}
 .rec .ric{font-size:26px;flex:none;width:44px;height:44px;display:grid;place-items:center;
   border-radius:11px;background:#00000055;border:1px solid var(--c,#5a5348)55;
   box-shadow:inset 0 0 14px -4px var(--c,#5a5348)}
 .rec b{font-size:15.5px;display:block;color:#f0ead8}
