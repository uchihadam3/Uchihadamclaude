<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Dados do Abismo</title>
<style>
 *{margin:0;padding:0;box-sizing:border-box}
 /* LAYOUT EM TRÊS FAIXAS: inimigos / mesa / rodapé.
    Antes as três eram `position:fixed` e um resize() em JS calculava a altura
    da mesa subtraindo as outras duas. Bastava o rodapé crescer — mais um
    status na barra, uma carta que quebra linha — para ele passar por cima do
    feltro e tapar os dados antes do JS recalcular. Com grid quem garante que
    ninguém invade ninguém é o navegador, não uma conta minha. */
 body{background:#07090b;color:#e8e2d0;font-family:Georgia,serif;overflow:hidden;
   height:100dvh;display:grid;grid-template-rows:auto minmax(150px,1fr) auto;
   -webkit-tap-highlight-color:transparent;user-select:none}
 #c{display:block;width:100%;height:100%;min-height:0}
 .lay{position:relative;left:auto;right:auto;pointer-events:none;min-height:0}
 /* topo: inimigos */
 /* A FILEIRA DE INIMIGOS: TODO MUNDO TEM QUE CABER NA TELA.
    Ela rolava de lado com as cartas em 120px fixos, e a partir do 4º inimigo
    o resto ficava escondido fora da borda direita — no celular ninguém
    descobre que precisa arrastar, e um inimigo que você não vê é um inimigo
    cuja fechadura e cuja intenção você não pode ler.
    Agora as cartas encolhem para caber e, se ainda não couberem, quebram em
    duas linhas. Isso voltou a ser seguro: com o corpo em grid, a fileira que
    cresce faz a MESA encolher, em vez de descer por cima do feltro. */
 #ini{padding:calc(28px + env(safe-area-inset-top)) 6px 8px;display:flex;gap:5px;
   justify-content:center;align-items:flex-start;flex-wrap:wrap;
   z-index:10;pointer-events:auto;max-height:calc(52vh + env(safe-area-inset-top));
   overflow-y:auto;scrollbar-width:none}
 #ini::-webkit-scrollbar{display:none}
 .en{pointer-events:auto;background:rgba(8,11,15,.96);border:1px solid rgba(255,255,255,.13);
   border-radius:11px;padding:6px 7px;cursor:pointer;backdrop-filter:blur(6px);
   flex:1 1 96px;min-width:84px;max-width:132px}
 /* onda cheia: a carta aperta pra sobrar mesa. Sem isto, com 6 inimigos em
    duas linhas a fileira comia quase todo o feltro. */
 #ini.cheia .en{padding:5px 6px}
 #ini.cheia .en .spr{height:54px} #ini.cheia .en .spr img{height:54px}
 #ini.cheia .en .nm{font-size:10.5px}
 #ini.cheia .en .trava{font-size:8.5px;padding:2px 4px}
 #ini.cheia .en .hp{font-size:9.5px}
 .en.alvo{border-color:#ffd24a;box-shadow:0 0 0 1px #ffd24a55}
 .en.morto{opacity:.28;filter:grayscale(1)}
 .en .nm{font-size:11.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .en .el{color:#ff7a5c;font-size:9px;letter-spacing:1px}
 .en .hpb{height:6px;background:#2a1518;border-radius:3px;overflow:hidden;margin:4px 0 3px}
 .en .hpb>i{display:block;height:100%;background:linear-gradient(90deg,#c0392b,#e8604a)}
 .en .hp{font-size:9.5px;opacity:.75;font-variant-numeric:tabular-nums;
   display:flex;align-items:center;gap:4px;flex-wrap:wrap}
 /* bloqueio agora DURA o seu turno — tem que dar pra ver */
 .en .bloq{opacity:1;font-size:10.5px;font-weight:900;color:#8fd8ff;cursor:help;
   background:rgba(60,120,180,.24);border:1px solid #2b4258;border-radius:5px;padding:1px 5px}
 .en .armad{opacity:1;font-size:10px;font-weight:800;color:#cfd8e3;cursor:help;
   background:rgba(120,130,145,.18);border:1px solid #3d4a58;border-radius:5px;padding:1px 4px}
 .en .it{font-size:11px;font-weight:700;color:#ffb45e;margin-top:3px;
   display:flex;flex-wrap:wrap;align-items:baseline;gap:0 4px;line-height:1.3}
 /* "→ 12 no HP" não pode partir deixando o "HP" órfão na linha de baixo */
 .en .it .passa{white-space:nowrap}
 #ini.cheia .en .it{font-size:9.5px}
 .en .st{font-size:9px;color:#7fd98a}
 .en .pres{font-size:8.5px;color:#9a8fd8;margin-top:2px;letter-spacing:.3px}
 .fer.ult{background:linear-gradient(180deg,#3a2a10,#1a1206);border-color:#c9a13a;color:#ffe9b0;
   box-shadow:0 0 12px rgba(255,200,90,.28)}
 .en .it.clic{cursor:help;text-decoration:underline dotted rgba(255,180,94,.45);text-underline-offset:3px}
 .stc{cursor:help;pointer-events:auto}
 /* ===== CARTÃO DE EXPLICAÇÃO ===== */
 #pop{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
   background:rgba(3,5,8,.72);backdrop-filter:blur(3px);padding:20px}
 #pop.off{display:none}
 .popcard{width:100%;max-width:340px;text-align:left;border-radius:16px;padding:14px;
   background:linear-gradient(180deg,#171c23,#0c1015);border:1px solid #3d4a58;
   box-shadow:0 18px 50px rgba(0,0,0,.6);animation:popin .16s ease-out}
 @keyframes popin{from{opacity:0;transform:scale(.92) translateY(8px)}}
 .pophd{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
 .popico{font-size:26px;line-height:1;flex:none;filter:drop-shadow(0 0 8px rgba(255,210,74,.5))}
 .pophd b{display:block;font-size:15px;color:#e8e2d0}
 .pophd i{display:block;font-size:11px;color:#ffd24a;font-style:normal;margin-top:2px}
 .popd{font-size:12.5px;color:#b9b0a0;line-height:1.55}
 .poprod{font-size:10.5px;color:#8d8672;margin-top:8px;border-top:1px solid #262d35;padding-top:7px}
 .popbts{display:flex;gap:7px;margin-top:11px}
 .popb{flex:1;font-family:Georgia,serif;font-size:12px;font-weight:800;cursor:pointer;
   background:linear-gradient(180deg,#2a323d,#181d24);border:1px solid rgba(255,255,255,.16);
   color:#e8e2d0;border-radius:10px;padding:9px}
 .popb.ver{flex:0 0 auto;font-size:10.5px;font-weight:600;color:#9aa6b2}
 .popb:active{transform:scale(.96)}
 #pop .gex{margin-top:8px;display:flex;flex-direction:column;gap:4px;font-size:11px}
 /* ===== FECHADURA: a regra do inimigo, sempre visível (§12) ===== */
 .en .trava{display:flex;align-items:center;gap:4px;margin-top:4px;padding:3px 5px;border-radius:6px;
   background:rgba(150,120,40,.14);border:1px solid rgba(220,180,80,.35);font-size:9px;line-height:1.25;
   color:#e8d9a8}
 .en .trava .tico{font-size:12px;flex:none}
 /* A FECHADURA COMPOSTA ("abre com X OU gastando Y") deixou este texto longo,
    e um card alto demais empurra os inimigos seguintes para fora da fileira.
    Corta em três linhas: o toque abre a explicação inteira, que é onde ela
    deve ser lida com calma. */
 .en .trava .ttx{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;
   overflow:hidden}
 .en .trava .ttx{flex:1;min-width:0}
 /* aviso de que a regra vira no próximo turno: sem isso o jogador acha que a
    carta mentiu quando a fechadura muda sozinha */
 .en .trava .tgira{display:block;font-style:normal;font-size:8.5px;line-height:1.25;
   color:#ffb45e;margin-top:2px;letter-spacing:.2px}
 .en .trava .tst{flex:none;font-weight:900;font-size:8.5px;letter-spacing:.5px}
 .en .trava.abre{background:rgba(40,150,80,.20);border-color:#4ad98a;color:#bff2d0;
   box-shadow:0 0 10px #4ad98a44}
 .en .trava.abre .tst{color:#7ef2a8}
 .en .trava.fecha{background:rgba(150,40,40,.20);border-color:#e0604a;color:#f2c4bb}
 .en .trava.fecha .tst{color:#ff8a7a}
 .en .trava.off{background:rgba(120,90,200,.20);border-color:#a07cff;color:#ddc8ff}
 .en .trava{cursor:help}
 .en .trava .tq{flex:none;width:13px;height:13px;border-radius:50%;display:grid;place-items:center;
   font-size:9px;font-weight:900;background:rgba(255,210,74,.18);border:1px solid #9a7f34;color:#ffd24a}
 /* ===== GRIMÓRIO ===== */
 .grimwrap{width:100%;max-width:560px;margin:0 auto;padding:14px 14px 34px;
   min-height:100vh;display:flex;flex-direction:column;gap:10px;text-align:left}
 /* ABAS DE VERDADE: a que está aberta se acende, e só o conteúdo dela é
    montado. Grade em vez de fila para caber doze no celular sem virar uma
    tira de rolagem lateral. */
 .gnav{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:4px}
 .gtab{font-family:Georgia,serif;cursor:pointer;display:flex;flex-direction:column;
   align-items:center;gap:2px;padding:7px 3px;color:#8d8672;
   background:linear-gradient(180deg,#151a20,#0e1116);border:1px solid #262d36;
   border-radius:11px;transition:.14s;text-align:center}
 .gtab .gti{font-size:15px;line-height:1}
 .gtab b{font-size:8px;letter-spacing:.6px;font-weight:700;line-height:1.15}
 .gtab.on{color:#ffd24a;border-color:#9a7f34;
   background:linear-gradient(180deg,#2a2413,#12100a);
   box-shadow:0 0 12px rgba(255,210,74,.22)}
 .gtab:active{transform:scale(.95)}
 @media(max-width:360px){ .gnav{grid-template-columns:repeat(3,1fr)} }
 /* grupos dentro de uma aba (as quatro classes, as quatro árvores...) */
 .ggrupo{margin-top:12px;padding-left:9px;
   border-left:2px solid color-mix(in srgb,var(--gc,#9a7f34) 55%,transparent)}
 .ggrupo h4{font-size:11.5px;letter-spacing:2px;color:var(--gc,#e8d9a8);margin-bottom:3px}
 .gnota{font-size:10.5px;color:#8d8672;line-height:1.45;margin-bottom:5px;font-style:italic}
 .gsec h3 em{font-style:normal;font-size:9.5px;letter-spacing:1px;color:#6b6250;
   margin-left:auto;text-align:right;max-width:44%;line-height:1.2}
 .gsec{border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:11px 12px;
   background:linear-gradient(180deg,rgba(255,255,255,.03),transparent)}
 .gsec h3{font-size:12px;letter-spacing:2.5px;color:#e8d9a8;font-weight:700;
   display:flex;align-items:center;gap:8px;margin-bottom:7px}
 .gsec h3 .gico{font-size:16px}
 .gintro{font-size:11.5px;color:#9a927e;line-height:1.55;margin-bottom:9px}
 .gitem{padding:7px 0;border-top:1px solid #1c2128}
 .gitem:first-of-type{border-top:0}
 .gitem b{display:block;font-size:12.5px;color:#e8e2d0;margin-bottom:2px}
 .gitem span{display:block;font-size:11.5px;color:#8d8672;line-height:1.5}
 .gitem.foco{background:rgba(255,210,74,.10);border:1px solid #9a7f34;border-radius:10px;
   padding:8px 9px;margin:4px -3px}
 .gex{margin-top:5px;display:flex;flex-direction:column;gap:3px;font-size:10.5px}
 .gok{color:#8fd8a0;background:rgba(40,150,80,.13);border-radius:6px;padding:3px 7px}
 .gno{color:#e08a7a;background:rgba(150,40,40,.13);border-radius:6px;padding:3px 7px}
 /* rodapé: você + habilidades */
 /* A FAIXA DE BAIXO NÃO PODE SER CORTADA. Ela é linha `auto` do grid, então
    crescia à vontade e o overflow:hidden do corpo comia o que passasse — num
    celular de 664px de altura útil os botões Re-rolar/Terminar turno ficavam
    22px fora da tela, junto com a segunda fila de habilidades. Agora ela
    encolhe junto (min-height:0) e, se ainda assim não couber, ROLA por dentro:
    pode ficar apertada, mas nunca inalcançável. */
 #baixo{z-index:10;padding:6px 10px calc(10px + env(safe-area-inset-bottom));
   background:linear-gradient(180deg,transparent,rgba(4,6,8,.94) 30%);
   min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
 #baixo::-webkit-scrollbar{display:none}
 #voce{display:flex;align-items:center;gap:9px;justify-content:center;font-size:12.5px;margin-bottom:6px}
 #voce b{font-size:16px}
 .pill{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);border-radius:20px;padding:3px 10px}
 #hab{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;pointer-events:auto;align-items:stretch}
 /* ===== CARTA DE HABILIDADE ===== */
 .h{position:relative;overflow:hidden;cursor:pointer;transition:.13s;
   font-family:Georgia,serif;color:#e8e2d0;text-align:center;
   background:linear-gradient(180deg,#1e242c,#0f141a);border:1px solid rgba(255,255,255,.14);
   border-left:3px solid color-mix(in srgb,var(--hc,#888) 70%,transparent);
   border-radius:12px;padding:6px 8px 5px;min-width:96px;max-width:174px;
   display:flex;flex-direction:column;align-items:center;gap:2px}
 /* MÃO CHEIA (6+ habilidades, que é o normal depois da trilha aberta): três
    cartas por fila em vez de duas. Encolhe o que é enfeite — ícone, folga,
    corpo do texto — e mantém o que decide a jogada: nome, requisito e a
    conta do golpe. */
 #hab.densa .h{min-width:0;max-width:118px;flex:1 1 104px;padding:3px 5px;gap:0}
 #hab.densa .h .hico{width:13px;height:13px}
 #hab.densa .h .hn{font-size:10.5px}
 #hab.densa .h .htopo{gap:3px}
 #hab.densa .dchip{min-width:13px;height:13px;font-size:8.5px}
 #hab.densa .h .hsel b{font-size:9.5px;padding:1px 3px}
 /* a CONTA (quais dados encaixam) pesa 37px dos 86px da carta. Com a mão
    cheia ela só aparece onde a decisão está acontecendo: na carta que a sua
    seleção deixou PRONTA e na que você abriu a prévia. Nas outras fica o que
    basta para escolher entre elas — nome, requisito e o que a jogada faz. */
 #hab.densa .h:not(.ok):not(.pre) .conta{display:none}
 @media (max-height:800px){ #hab.densa .h{max-width:112px;flex:1 1 98px} }
 .h .htopo{display:flex;align-items:center;gap:5px}
 /* O MULTIPLICADOR na carta: dá para ver de relance que o Colapso vale cinco
    vezes a soma e o Raio três, que é o que decide onde gastar o dado grande. */
 .h .hmult{flex:none;font-size:10px;font-weight:900;letter-spacing:.3px;line-height:1;
   padding:2px 4px;border-radius:5px;color:#ffb45e;
   background:rgba(255,140,60,.14);border:1px solid rgba(255,150,70,.42)}
 .h .hmult.todos{color:#ff8a7a;background:rgba(255,80,60,.16);border-color:rgba(255,110,90,.5)}
 #hab.densa .h .hmult{font-size:9px;padding:1px 3px}
 /* ===== A BANCA DA CONTA =====
    Cada termo diz O QUE É: número grande em cima, ícone junto, e o nome
    embaixo. Sem isso a conta era só algarismo solto — "6 × 3" não conta se
    o 6 são os dados ou o golpe, nem se o 3 é a habilidade ou outro dado. */
 .bancaconta{position:fixed;left:50%;top:29%;transform:translate(-50%,-50%);
   z-index:60;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:6px;
   padding:13px 18px;border-radius:17px;
   background:linear-gradient(180deg,rgba(20,15,9,.975),rgba(8,6,4,.975));
   border:1px solid rgba(255,180,90,.5);
   box-shadow:0 0 36px rgba(255,150,60,.32),0 10px 30px rgba(0,0,0,.68);
   font-family:Georgia,serif;animation:bcent .22s ease-out}
 @keyframes bcent{from{opacity:0;transform:translate(-50%,-50%) scale(.82)}}
 .bclinha{display:flex;flex-direction:column;align-items:center;gap:5px;min-height:64px;
   justify-content:center}
 /* o título da etapa: o que está acontecendo agora */
 .bcrot{font-size:8.5px;letter-spacing:2.4px;color:#9a8c6a;text-align:center;
   transition:.24s}
 .bcrot.funde{opacity:0;transform:translateY(-5px)}
 .bcfila{display:flex;align-items:flex-start;justify-content:center;gap:9px}
 /* UM TERMO: valor + ícone em cima, nome embaixo */
 .bcterm{display:flex;flex-direction:column;align-items:center;gap:1px;
   opacity:0;transform:scale(.45);
   transition:transform .3s cubic-bezier(.2,1.7,.4,1),opacity .22s}
 .bcterm.entra,.bcterm.nasce{opacity:1;transform:none}
 .bcterm b{display:flex;align-items:center;gap:4px;font-size:28px;font-weight:900;
   line-height:1;color:#e8e2d0;text-shadow:0 2px 7px #000}
 .bcterm i{font-style:normal;font-size:8px;letter-spacing:1.2px;color:#8d8672;
   max-width:82px;text-align:center;line-height:1.2}
 .bci{width:17px;height:17px;flex:none}
 .bcterm.dado b{color:#cfe0f2} .bcterm.dado i{color:#7f97ad}
 .bcterm.soma b{color:#e8e2d0}
 .bcterm.skill b{color:#ffb45e} .bcterm.skill i{color:#c08a4a}
 .bcterm.skill .hico{width:18px;height:18px}
 .bcterm.bonus b{color:#7ef2a8} .bcterm.bonus i{color:#5aa87a}
 .bcterm.def b{color:#9fd6ff} .bcterm.def i{color:#6d9ec4}
 .bcop{font-size:22px;font-weight:900;color:#ffb45e;line-height:1;margin-top:3px;
   opacity:0;transform:scale(.4);transition:.24s cubic-bezier(.2,1.7,.4,1)}
 .bcop.entra{opacity:1;transform:none}
 /* COLIDEM: deslizam para o meio e somem juntos */
 .bcfila .bcterm.funde:first-child{transform:translateX(52%) scale(.6);opacity:0}
 .bcfila .bcterm.funde:last-child{transform:translateX(-52%) scale(.6);opacity:0}
 .bcfila .bcop.funde{transform:scale(.2);opacity:0}
 /* e NASCE o resultado, maior que os termos que o geraram */
 .bcterm.res b{font-size:40px}
 .bcterm.res.nasce{animation:bcnasce .42s cubic-bezier(.2,1.8,.35,1)}
 @keyframes bcnasce{0%{transform:scale(.35);filter:brightness(3)}
   55%{transform:scale(1.2)}100%{transform:none;filter:none}}
 .bcterm.res.quente b{color:#ffd24a;text-shadow:0 0 26px rgba(255,210,74,.95),0 2px 8px #000}
 .bcterm.res.quente i{color:#c9a24a}
 .bcterm.res.sangue b{color:#ff8a7a;text-shadow:0 0 28px rgba(255,90,70,.92),0 2px 8px #000}
 .bcterm.res.sangue i{color:#e08a7a;font-weight:900;letter-spacing:2px}
 .bancaconta .bca{font-size:8.5px;letter-spacing:1.8px;color:#ff8a7a;
   border:1px solid rgba(255,110,90,.5);border-radius:20px;padding:2px 9px}
 .bancaconta.saindo{opacity:0;transform:translate(-50%,-50%) scale(.9);transition:.26s}
 /* O RECIBO: a mesma conta, em cima do card de cada inimigo */
 .recibo{position:fixed;transform:translate(-50%,-50%);
   z-index:62;pointer-events:none;padding:7px 11px;border-radius:13px;
   background:linear-gradient(180deg,rgba(22,9,9,.97),rgba(8,4,4,.97));
   border:1px solid rgba(255,120,90,.6);
   box-shadow:0 0 22px rgba(255,80,60,.38),0 6px 18px rgba(0,0,0,.62);
   animation:bcent2 .2s ease-out}
 @keyframes bcent2{from{opacity:0;transform:translate(-50%,-50%) scale(.82)}}
 .recibo .bclinha{min-height:44px;gap:3px}
 .recibo .bcterm b{font-size:20px} .recibo .bcterm.res b{font-size:27px}
 .recibo .bcop{font-size:15px} .recibo .bci{width:13px;height:13px}
 .recibo .bcterm i{font-size:7px;max-width:62px}
 .recibo .bcrot{font-size:7.5px;letter-spacing:1.6px}
 .recibo.saindo{opacity:0;transform:translate(-50%,-88%) scale(.9);transition:.24s}
 @media (max-height:800px){ .bancaconta{top:25%;padding:10px 14px}
   .bcterm b{font-size:24px} .bcterm.res b{font-size:34px} .bcop{font-size:19px}
   .bclinha{min-height:56px} }
 .h .htopo{display:flex;align-items:center;gap:5px}
 /* O MULTIPLICADOR na carta: dá para ver de relance que o Colapso vale cinco
    vezes a soma e o Raio três, que é o que decide onde gastar o dado grande. */
 .h .hmult{flex:none;font-size:10px;font-weight:900;letter-spacing:.3px;line-height:1;
   padding:2px 4px;border-radius:5px;color:#ffb45e;
   background:rgba(255,140,60,.14);border:1px solid rgba(255,150,70,.42)}
 .h .hmult.todos{color:#ff8a7a;background:rgba(255,80,60,.16);border-color:rgba(255,110,90,.5)}
 #hab.densa .h .hmult{font-size:9px;padding:1px 3px}
 /* ===== A BANCA DA CONTA =====
    Um passo por vez: os dois números entram, ficam parados o tempo de ler,
    COLIDEM no meio e nascem virados no resultado. É o mesmo gesto três ou
    quatro vezes até sobrar só o número que entra no couro. */
 .bancaconta{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);
   z-index:60;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:5px;
   padding:12px 20px;border-radius:16px;
   background:linear-gradient(180deg,rgba(18,14,8,.97),rgba(8,6,4,.97));
   border:1px solid rgba(255,180,90,.5);
   box-shadow:0 0 34px rgba(255,150,60,.32),0 10px 30px rgba(0,0,0,.65);
   font-family:Georgia,serif;animation:bcent .22s ease-out}
 @keyframes bcent{from{opacity:0;transform:translate(-50%,-50%) scale(.8)}}
 .bclinha{display:flex;align-items:center;justify-content:center;gap:9px;min-height:44px}
 /* cada número da conta */
 .bcn{font-size:31px;font-weight:900;color:#e8e2d0;line-height:1;
   text-shadow:0 2px 7px #000;opacity:0;transform:scale(.4);
   transition:transform .3s cubic-bezier(.2,1.7,.4,1),opacity .22s}
 .bcn.entra{opacity:1;transform:none}
 .bcop{font-size:23px;font-weight:900;color:#ffb45e;line-height:1;opacity:0;
   transform:scale(.4);transition:.24s cubic-bezier(.2,1.7,.4,1)}
 .bcop.entra{opacity:1;transform:none}
 /* COLIDEM: os dois deslizam para o centro e somem juntos */
 .bclinha .bcn.funde:first-child{transform:translateX(46%) scale(.62);opacity:0}
 .bclinha .bcn.funde:last-child{transform:translateX(-46%) scale(.62);opacity:0}
 .bclinha .bcop.funde{transform:scale(.2);opacity:0}
 /* e NASCE o resultado */
 .bcn.res{font-size:40px;color:#e8e2d0;opacity:0;transform:scale(.35)}
 .bcn.res.nasce{opacity:1;transform:none;
   animation:bcnasce .42s cubic-bezier(.2,1.8,.35,1)}
 @keyframes bcnasce{0%{transform:scale(.35);filter:brightness(3)}
   55%{transform:scale(1.24)}100%{transform:none;filter:none}}
 .bcn.res.quente{color:#ffd24a;text-shadow:0 0 26px rgba(255,210,74,.95),0 2px 8px #000}
 .bcn.res.sangue{color:#ff8a7a;text-shadow:0 0 26px rgba(255,90,70,.9),0 2px 8px #000}
 .bancaconta .bca{font-size:9px;letter-spacing:1.6px;color:#ff8a7a;

 .bancaconta.saindo{opacity:0;transform:translate(-50%,-50%) scale(.9);transition:.26s}
 /* O RECIBO DO ALVO: a mesma colisão, só que em cima do card do inimigo,
    um por um — cada um com a armadura DELE. */
 .recibo{position:fixed;transform:translate(-50%,-50%);
   z-index:62;pointer-events:none;padding:5px 10px;border-radius:11px;
   background:linear-gradient(180deg,rgba(20,8,8,.96),rgba(8,4,4,.96));
   border:1px solid rgba(255,120,90,.55);
   box-shadow:0 0 20px rgba(255,80,60,.35),0 5px 16px rgba(0,0,0,.6);

 @media (max-height:800px){ .bancaconta{top:26%;padding:9px 15px}

   .bclinha{min-height:38px} }
 .h .htopo{display:flex;align-items:center;gap:5px}
 /* O MULTIPLICADOR na carta: dá para ver de relance que o Colapso vale cinco
    vezes a soma e o Raio três, que é o que decide onde gastar o dado grande. */
 .h .hmult{flex:none;font-size:10px;font-weight:900;letter-spacing:.3px;line-height:1;
   padding:2px 4px;border-radius:5px;color:#ffb45e;

 .h .hmult.todos{color:#ff8a7a;background:rgba(255,80,60,.16);border-color:rgba(255,110,90,.5)}
 #hab.densa .h .hmult{font-size:9px;padding:1px 3px}
 /* ===== A BANCA DA CONTA: a multiplicação acontecendo ===== */
 /* fica na FAIXA DOS INIMIGOS, onde o golpe está chegando — e não sobre o
    feltro: os dados não podem ficar tapados, nem por meio segundo. */
 .bancaconta{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%) scale(.86);
   z-index:60;pointer-events:none;display:flex;align-items:center;gap:7px;
   padding:9px 15px;border-radius:14px;
   background:linear-gradient(180deg,rgba(18,14,8,.96),rgba(8,6,4,.96));
   border:1px solid rgba(255,180,90,.5);
   box-shadow:0 0 30px rgba(255,150,60,.3),0 8px 26px rgba(0,0,0,.6);
   font-family:Georgia,serif;opacity:0;animation:bcent .2s ease-out forwards}
 @keyframes bcent{to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
 .bancaconta span{display:block}
 /* os dados entram UM A UM, e o parcial acompanha: dá para ler a conta,
    não só perceber que houve uma. */
 .bancaconta .bcdd{display:flex;align-items:center;gap:3px}
 .bancaconta .bcd{font-style:normal;font-size:16px;font-weight:900;color:#e8e2d0;
   min-width:20px;height:20px;display:grid;place-items:center;border-radius:6px;
   background:#0b1016;border:1px solid #33404d;opacity:0;transform:translateY(-9px) scale(.6);
   transition:.19s cubic-bezier(.2,1.5,.5,1)}
 .bancaconta .bcd.on{opacity:1;transform:none;border-color:#6f8296;
   box-shadow:0 0 9px rgba(160,190,220,.35)}
 .bancaconta .bcmais{font-size:12px;color:#6b6250;opacity:0;transition:.15s}
 .bancaconta .bcmais.on{opacity:1}
 .bancaconta .bcsoma{font-size:22px;font-weight:900;color:#e8e2d0;text-shadow:0 2px 6px #000;
   min-width:30px;text-align:center}
 .bancaconta .bcsoma.pulsa{animation:bcpul .2s ease-out}
 @keyframes bcpul{from{transform:scale(1.45);color:#ffd24a}}
 .bancaconta .bcx{font-size:19px;font-weight:900;color:#ffb45e;
   text-shadow:0 0 10px rgba(255,160,60,.8);opacity:0;transform:rotate(-22deg) scale(1.9);
   transition:.26s cubic-bezier(.2,1.6,.4,1)}
 .bancaconta .bcx.on{opacity:1;transform:none}
 .bancaconta .bcp{font-size:15px;font-weight:800;color:#9fd6ff;opacity:0;transition:.2s}
 .bancaconta .bcp.on{opacity:1}
 /* o que as passivas e os estados somaram por cima da fórmula */
 .bancaconta .bcb2{font-size:15px;font-weight:800;color:#7ef2a8;opacity:0;transition:.2s}
 .bancaconta .bcb2.on{opacity:1}
 .bancaconta .bce{font-size:15px;color:#8d8672}
 .bancaconta.saindo{opacity:0;transform:translate(-50%,-50%) scale(.94);transition:.26s}
 /* ---- ATO 2: a soma recolhe e a defesa entra ----
    Os dados e o Σ já cumpriram o papel; deixá-los na tela enquanto o
    desconto acontece só divide o olho. Eles encolhem para fora e o golpe
    cheio fica sozinho para apanhar da defesa. */
 .bancaconta .bcdd,.bancaconta .bcsoma,.bancaconta .bcx,.bancaconta .bcp,
 .bancaconta .bcb2,.bancaconta .bce{transition:.3s cubic-bezier(.4,0,.2,1)}
 .bancaconta.recolhe .bcdd,.bancaconta.recolhe .bcsoma,.bancaconta.recolhe .bcb2,
 .bancaconta.recolhe .bcx,.bancaconta.recolhe .bcp,.bancaconta.recolhe .bce{
   max-width:0;opacity:0;margin:0;padding:0;overflow:hidden;transform:scale(.5)}
 .bancaconta .bcdef,.bancaconta .bce2,.bancaconta .bcfin{
   max-width:0;opacity:0;overflow:hidden;transition:.28s cubic-bezier(.2,1.5,.4,1)}
 .bancaconta .bcdef.on{max-width:120px;opacity:1;font-size:17px;font-weight:900;
   color:#9fd6ff;text-shadow:0 0 10px rgba(120,190,255,.6);margin-left:6px}
 .bancaconta .bce2.on{max-width:30px;opacity:1;font-size:15px;color:#8d8672;margin:0 5px}
 .bancaconta.fechou .bcfin{max-width:150px;opacity:1;font-size:30px;font-weight:900;
   color:#ffd24a;text-shadow:0 0 24px rgba(255,210,74,.95),0 2px 8px #000;
   transform:scale(1.08)}
 /* golpe barrado pela fechadura: o zero não é dourado, é morto */
 .bancaconta.travado.fechou .bcfin{color:#e08a7a;text-shadow:0 0 16px rgba(220,90,70,.7)}
 .bancaconta.travado .bct{color:#6b6250;text-decoration:line-through;opacity:.7}
 /* sem defesa nenhuma: o golpe cheio JÁ é o dano, e é ele que brilha */
 .bancaconta.semdef .bcdef,.bancaconta.semdef .bce2,.bancaconta.semdef .bcfin{display:none}
 .bancaconta .bct{font-size:27px;font-weight:900;color:#6b6250;
   text-shadow:0 2px 6px #000;transition:.24s cubic-bezier(.2,1.6,.4,1)}
 .bancaconta.estoura .bct{transform:scale(1.3);color:#ffd24a;
   text-shadow:0 0 24px rgba(255,210,74,.95),0 2px 8px #000}
 .bancaconta .bca{font-size:9px;letter-spacing:1.5px;color:#ff8a7a;align-self:center;
   border:1px solid rgba(255,110,90,.5);border-radius:20px;padding:2px 6px}
 @media (max-height:800px){ .bancaconta{top:26%;padding:7px 12px}
   .bancaconta .bcb{font-size:19px} .bancaconta .bct{font-size:23px} }

 .h .hn{font-size:12px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
 /* requisito desenhado como DADOS */
 .h .hreq{display:flex;align-items:center;gap:2px;flex-wrap:wrap;justify-content:center}

 /* selo do que a jogada FAZ */

 .h .hd{color:#ff8a7a} .h .hb{color:#8fd8ff} .h .hc{color:#7ef2a8}

 /* A CONTA DO GOLPE contra a defesa: golpe cheio, o que a defesa come, e o

 .h .hd.conta2{display:inline-flex;align-items:center;gap:3px;color:#ff8a7a}

 /* ===== A CONTA DO GOLPE: quantos dados, soma e paridade ===== */
 .conta{display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:center;

 /* na barra de seleção fica maior — é a leitura principal */

 /* estados */

 /* varredura de brilho quando está pronta */

 @keyframes varre{0%{transform:translateX(-120%)}55%,100%{transform:translateX(120%)}}
 /* onda ao usar */
 .h.usou::after{content:'';position:absolute;left:50%;top:50%;width:8px;height:8px;
   margin:-4px 0 0 -4px;border-radius:50%;border:2px solid var(--hc,#fff);

 @keyframes hond{to{width:180px;height:180px;margin:-90px 0 0 -90px;opacity:0}}
 #acoes{display:flex;gap:6px;justify-content:center;margin-top:7px;pointer-events:auto}
 /* TELA BAIXA (celular com barra de endereço + barra de navegação): a faixa
    de baixo aperta em vez de empurrar o rodapé para fora. Medido em 390×664,
    onde faltavam ~40px para o Re-rolar caber: o log encolhe, a fileira de
    inimigos cede altura e as cartas de habilidade ficam mais rasas. Nenhum
    deles some — o que se perde é folga, não informação. */
 @media (max-height:800px){
   /* a fileira mantém altura, mas o CARD encolhe: com 5+ inimigos e a mão
      cheia, o que não pode acontecer é um inimigo ficar escondido — a
      fechadura e a intenção dele são a metade do quebra-cabeça. */
   #ini{max-height:calc(43vh + env(safe-area-inset-top))}
   #ini.cheia .en .spr{height:28px} #ini.cheia .en .spr img{height:28px}
   /* o selo ELITE sai: a moldura e a cor do card já dizem isso, e cada 10px
      aqui é um inimigo inteiro a mais visível na segunda fila */
   #ini.cheia .en .el{display:none}
   #ini.cheia .en .it{font-size:9px}
   #ini.cheia .en{padding:4px 5px}
   #ini.cheia .en .trava{font-size:8px;line-height:1.22;padding:1px 3px;margin-top:2px}
   #ini.cheia .en .nm{font-size:9.5px}
   #ini.cheia .en .hpb{height:5px;margin:2px 0}
   /* o texto da fechadura corta em duas linhas — o toque abre a explicação
      inteira, então aqui basta o suficiente para reconhecer qual é */
   #ini.cheia .en .trava .ttx{display:-webkit-box;-webkit-line-clamp:2;
     -webkit-box-orient:vertical;overflow:hidden}
   #ini.cheia .en .trava .tgira{display:none}   /* o ⟳ do ícone já avisa que gira */
   #log{max-height:24px;margin-bottom:2px;line-height:1.3}
   #voce{margin-bottom:3px;font-size:12px}
   #sel{margin-bottom:3px}
   #acoes{margin-top:4px}
   .h{padding:4px 7px 4px;gap:1px}
   .b{padding:6px 12px}
   body{grid-template-rows:auto minmax(112px,1fr) auto}   /* a mesa cede 38px */
   #ini{padding-top:calc(19px + env(safe-area-inset-top));padding-bottom:4px}
   #baixo{padding-top:3px}
 }
 @media (max-height:600px){
   #ini{max-height:calc(47vh + env(safe-area-inset-top))}
   #log{display:none}          /* o log é o primeiro a sair: é histórico, não decisão */
   /* tela mínima: a fechadura cabe em uma linha e o retrato quase some.
      Continua dando para ler quem é, quanto tem de vida, qual a regra e o
      que ele vai fazer — que é tudo de que a jogada precisa. */
   #ini.cheia .en .spr{height:22px} #ini.cheia .en .spr img{height:22px}
   #ini.cheia .en .trava .ttx{-webkit-line-clamp:1}
   #ini.cheia .en{padding:3px 4px}
   /* nas cartas que não estão em jogo some também o selo do efeito; o que
      sobra — nome, requisito e o estado — ainda escolhe a jogada */
   #hab.densa .h:not(.ok):not(.pre) .hsel{display:none}
   #voce{font-size:11px;gap:6px} #voce b{font-size:14px}
   .pill{padding:2px 8px}
   #sel:empty{display:none}
   #acoes{margin-top:3px} .b{padding:5px 11px;font-size:12px}
   /* tela muito baixa e onda cheia: o retrato sai e fica o glifo. Perde-se a
      arte, não a informação — nome, vida, fechadura e intenção continuam. */
   #ini.cheia .en .spr{height:26px} #ini.cheia .en .spr img{height:26px}
   body{grid-template-rows:auto minmax(96px,1fr) auto}
 }

 /* EMBLEMA: 4 almas girando em volta de 1 dado — diz o que é o jogo antes de

 /* ============ RECOMPENSA ============ */
 /* Era uma lista de três caixas iguais: informava, mas não era um MOMENTO.
    Agora é o pódio do andar — selo, raridade com peso e cartas que entram
    em cascata e se acendem quando você escolhe. */
 .recwrap{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;
   justify-content:center;gap:10px;padding:22px 16px 30px;width:100%;max-width:440px;margin:0 auto}
 /* o combate ficava aparecendo por trás e embolava a leitura das cartas */
 .recwrap::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
   background:radial-gradient(120% 70% at 50% 12%,#12161d 0%,#07090c 55%,#04060a 100%)}
 /* quem pediu menos movimento perde a cascata e os brilhos — mas NÃO o retorno
    de qual carta foi levada, que é informação, não enfeite */
 @media (prefers-reduced-motion: reduce){
   .rec,.rec::after,.vitsel,.vitsel::before,.vitanel{animation:none !important}
   .recs2:not(.escolhido) .rec{opacity:1 !important;transform:none !important}
   .recs2.escolhido .rec.levada{opacity:1 !important}
 }

 /* ---- selo do andar ---- */
 .vitsel{position:relative;width:104px;height:104px;display:grid;place-items:center;margin-bottom:2px;
   animation:selopop .55s cubic-bezier(.2,1.5,.4,1) both}
 .vitsel::before{content:'';position:absolute;inset:-14px;border-radius:50%;
   background:radial-gradient(circle,var(--sc,#8fd8a0)33,transparent 68%);animation:pulsar 2.6s ease-in-out infinite}
 .vitanel{position:absolute;inset:0;border-radius:50%;border:2px dashed var(--sc,#8fd8a0);opacity:.5;
   animation:girar 14s linear infinite}
 .vitanel.b{inset:9px;border-style:solid;border-width:1px;opacity:.28;animation-direction:reverse;animation-duration:9s}
 .vitn{font-size:38px;font-weight:900;color:var(--sc,#8fd8a0);line-height:1;
   text-shadow:0 0 18px var(--sc,#8fd8a0)77}
 .vitl{font-size:11px;letter-spacing:5px;color:var(--sc,#8fd8a0);margin-top:-2px}
 .vitsub{font-size:10px;letter-spacing:3px;color:#6d6656;margin-top:5px}
 /* trilha dos 10 andares: dá para ver o quanto falta sem ler nada */
 .vittrilha{display:flex;gap:5px;align-items:center;margin:8px 0 2px}
 .vittrilha span{width:13px;height:5px;border-radius:3px;background:#252017;border:1px solid #322b20;
   transition:.2s}
 .vittrilha span.m{width:19px;height:7px;border-radius:4px}
 .vittrilha span.on{background:var(--sc,#8fd8a0);border-color:var(--sc,#8fd8a0);
   box-shadow:0 0 8px -1px var(--sc,#8fd8a0)}
 .vitstats{display:flex;gap:7px;margin:4px 0 2px}
 .vitstats i{font-style:normal;font-size:10px;letter-spacing:1px;color:#8d8672;
   background:#141109;border:1px solid #2a251d;border-radius:20px;padding:4px 11px}
 .vitstats i b{color:#e8e2d0;font-size:12px;margin-right:3px}
 @keyframes selopop{from{transform:scale(.4) rotate(-25deg);opacity:0}to{transform:none;opacity:1}}
 @keyframes girar{to{transform:rotate(360deg)}}
 @keyframes pulsar{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.09)}}

 .recp{font-size:10px;letter-spacing:4px;color:#6d6656;margin-top:4px}
 .recs2{display:flex;flex-direction:column;gap:11px;width:100%;perspective:900px}

 /* ---- a carta ---- */
 .rec{position:relative;display:flex;flex-direction:column;align-items:stretch;gap:0;
   text-align:left;padding:13px 13px 0;cursor:pointer;overflow:hidden;
   background:linear-gradient(150deg,#1b2029 0%,#12151b 45%,#0d0f14 100%);
   border:1px solid var(--c,#5a5348);border-radius:14px;color:#e8e2d0;font-family:Georgia,serif;
   box-shadow:0 6px 20px #0009, inset 0 1px 0 #ffffff12, 0 0 0 0 var(--c,#5a5348);
   transition:transform .16s cubic-bezier(.2,1,.4,1), box-shadow .16s;
   animation:cartaentra .5s cubic-bezier(.2,1,.35,1) both; animation-delay:calc(var(--d,0)*110ms)}
 @keyframes cartaentra{from{opacity:0;transform:translateY(26px) rotateX(-16deg) scale(.94)}
                       to{opacity:1;transform:none}}
 /* faixa de luz que corre pela carta */
 .rec::after{content:'';position:absolute;top:0;left:-60%;width:45%;height:100%;pointer-events:none;
   background:linear-gradient(100deg,transparent,#ffffff14,transparent);
   animation:brilho 4.5s ease-in-out infinite;animation-delay:calc(var(--d,0)*260ms + 700ms)}
 @keyframes brilho{0%,72%{left:-60%}88%,100%{left:115%}}
 .rec:hover{transform:translateY(-3px) scale(1.012);box-shadow:0 12px 30px #000b, inset 0 1px 0 #ffffff18, 0 0 22px -4px var(--c)}
 .rec:active{transform:scale(.985)}
 .rec.dado{--c:#4a9ad8} .rec.grav{--c:#d8a04a} .rec.cura{--c:#4ad88a} .rec.reliquia{--c:#8a6ad8}
 .rec.r-comum{--c:#9aa3ad} .rec.r-rara{--c:#ffd24a} .rec.r-amaldicoada{--c:#d84a7a}
 /* a rara e a amaldiçoada respiram — dá para sentir a raridade sem ler */
 .rec.r-rara{box-shadow:0 6px 20px #0009, inset 0 1px 0 #ffffff12, 0 0 20px -6px #ffd24a;
   animation:cartaentra .5s cubic-bezier(.2,1,.35,1) both, raro 2.8s ease-in-out infinite 1s}
 @keyframes raro{0%,100%{box-shadow:0 6px 20px #0009, inset 0 1px 0 #ffffff12, 0 0 16px -8px #ffd24a}
                 50%{box-shadow:0 6px 26px #0009, inset 0 1px 0 #ffffff12, 0 0 30px -3px #ffd24a}}
 .rec.r-amaldicoada{animation:cartaentra .5s cubic-bezier(.2,1,.35,1) both, maldito 3.4s ease-in-out infinite 1s}
 @keyframes maldito{0%,100%{box-shadow:0 6px 20px #0009, inset 0 1px 0 #ffffff12, 0 0 16px -8px #d84a7a}
                    50%{box-shadow:0 6px 26px #000b, inset 0 1px 0 #ffffff12, 0 0 32px -2px #d84a7a}}
 /* fita de raridade */
 .rrar{position:absolute;top:0;right:0;font-size:8.5px;letter-spacing:2.5px;font-weight:700;

 .rec .ric{font-size:26px;flex:none;width:44px;height:44px;display:grid;place-items:center;

 .rec b{font-size:15.5px;display:block;color:#f0ead8}

 .rectopo{display:flex;align-items:center;gap:11px;padding-right:58px}
 .recdif{margin-top:10px;padding-top:9px;border-top:1px dashed #2f2a22}
 /* rodapé de ação: transforma "clicar num painel" em "levar a carta" */
 .recpeg{margin:9px -13px 0;padding:8px;text-align:center;font-size:9.5px;letter-spacing:3.5px;

 /* as habilidades viram consulta recolhida: estavam competindo com a escolha */
 .recskills{width:100%;margin-top:12px;border-top:1px solid #2a251d;padding-top:4px}

 /* Havia aqui um segundo bloco .cls/.cbtn, sobra do desenho antigo da tela de
    classes. Por vir depois, ele vencia o bloco de verdade lá em cima e

 /* ===== sprite do inimigo ===== */
 .en .spr{height:76px;display:flex;align-items:flex-end;justify-content:center;margin:-1px 0 3px}
  .en .spr img{height:76px;max-width:100%;object-fit:contain;image-rendering:auto;
   filter:drop-shadow(0 4px 7px rgba(0,0,0,.65));
   animation:resp 2.6s ease-in-out infinite}
 .en:nth-child(2n) .spr img{animation-duration:3.1s;animation-delay:-.7s}
 .en:nth-child(3n) .spr img{animation-duration:2.2s;animation-delay:-1.3s}
 @keyframes resp{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-3px) scale(1.03)}}
 .en.alvo .spr img{filter:drop-shadow(0 0 10px #ffd24a) drop-shadow(0 4px 6px rgba(0,0,0,.6))}
 .en.morto .spr img{animation:none;transform:rotate(14deg) translateY(8px);opacity:.5}
 /* impacto */
 .en{position:relative;transition:transform .08s}
 .en.bat{animation:bat .34s cubic-bezier(.2,.8,.3,1)}
 @keyframes bat{0%{transform:translateX(0)}18%{transform:translateX(-7px) scale(1.05)}
   40%{transform:translateX(5px)}70%{transform:translateX(-2px)}100%{transform:translateX(0)}}
 /* o flash de impacto ofuscava o número que aparece em cima dele */
 .en.bat .spr img{filter:brightness(1.85) drop-shadow(0 0 12px #ffd9c0);animation:none}
 .en.morrendo{animation:morrer .5s forwards}
 @keyframes morrer{to{opacity:.25;transform:scale(.9) rotate(6deg);filter:grayscale(1)}}
 /* ===== NÚMEROS FLUTUANTES =====
    O número é o retorno mais importante do combate: é por ele que você
    entende se o golpe entrou, se morreu no escudo, e o quanto pesou.
    Dano sobe em vermelho e sai de lado; aparado sobe reto em azul-metal. */
 .dmg{position:absolute;left:50%;top:24%;transform:translateX(-50%);
   font:900 26px/1 Georgia,serif;color:#fff;pointer-events:none;z-index:6;
   text-shadow:-2px -2px 0 #240404, 0px -2px 0 #240404, 2px -2px 0 #240404, -2px 0px 0 #240404, 2px 0px 0 #240404, -2px 2px 0 #240404, 0px 2px 0 #240404, 2px 2px 0 #240404, 0 0 18px #ff5a3c, 0 4px 12px #000;
   animation:sobe 1.45s cubic-bezier(.12,.85,.25,1) forwards;
   --dx:0px}
 /* o sprite do inimigo tapava o número: ele tem que ficar por cima de tudo */
 .en .dmg,.en .clang{z-index:30}
 .dmg.big{font-size:38px;color:#ffe27a;
   text-shadow:-3px -3px 0 #2a1000, 0px -3px 0 #2a1000, 3px -3px 0 #2a1000, -3px 0px 0 #2a1000, 3px 0px 0 #2a1000, -3px 3px 0 #2a1000, 0px 3px 0 #2a1000, 3px 3px 0 #2a1000, 0 0 30px #ff9d2b, 0 4px 14px #000}
 /* golpe pesado ganha um clarão atrás do número */
 .dmg.big::before{content:'';position:absolute;left:50%;top:50%;width:80px;height:80px;
   margin:-40px 0 0 -40px;border-radius:50%;z-index:-1;
   background:radial-gradient(circle,#ff9d2b55,transparent 68%);animation:estouro .5s ease-out forwards}
 @keyframes estouro{0%{opacity:0;transform:scale(.3)}40%{opacity:1;transform:scale(1)}
   100%{opacity:0;transform:scale(1.6)}}
 @keyframes sobe{0%{opacity:0;transform:translate(calc(-50% + 0px),12px) scale(.55) rotate(-6deg)}
   18%{opacity:1;transform:translate(calc(-50% + var(--dx)),-8px) scale(1.35) rotate(2deg)}
   34%{transform:translate(calc(-50% + var(--dx)),-14px) scale(1) rotate(0)}
   100%{opacity:0;transform:translate(calc(-50% + var(--dx)),-34px) scale(.92)}}
 /* aparado: sobe reto, sem rotação, em azul-metal */
 .dmg.esc{font-size:21px;color:#eaf4ff;
   text-shadow:-2px -2px 0 #06182c, 0px -2px 0 #06182c, 2px -2px 0 #06182c, -2px 0px 0 #06182c, 2px 0px 0 #06182c, -2px 2px 0 #06182c, 0px 2px 0 #06182c, 2px 2px 0 #06182c, 0 0 20px #6fb4ff, 0 3px 10px #000;
   animation:sobeesc .85s cubic-bezier(.15,.9,.3,1) forwards}
 .dmg.esc.raspao{top:14%;font-size:16px;opacity:.95}
 @keyframes sobeesc{0%{opacity:0;transform:translateX(-50%) translateY(8px) scale(.6)}
   20%{opacity:1;transform:translateX(-50%) translateY(-6px) scale(1.2)}
   100%{opacity:0;transform:translateX(-50%) translateY(-28px) scale(.95)}}
 .dmgme{position:absolute;left:50%;top:-6px;transform:translateX(-50%);
   font:900 24px/1 Georgia,serif;color:#ff8a7a;pointer-events:none;z-index:6;
   text-shadow:-2px -2px 0 #240404, 0px -2px 0 #240404, 2px -2px 0 #240404, -2px 0px 0 #240404, 2px 0px 0 #240404, -2px 2px 0 #240404, 0px 2px 0 #240404, 2px 2px 0 #240404, 0 0 18px #ff5a3c, 0 3px 10px #000;
   animation:sobe 1.45s forwards;--dx:0px}

   animation:sobeesc .85s forwards}
 .dmgme.av{font-size:13px;font-weight:800;color:#cfe3ff;white-space:nowrap}
 #voce{position:relative}
 /* dano no jogador: borda vermelha pulsando */

    Tudo em azul-metal e sem tremor, para não se confundir com o vermelho do

 /* a carta do inimigo dá um baque seco pra trás em vez de sacudir de dor */

 /* tremor global da HUD */
