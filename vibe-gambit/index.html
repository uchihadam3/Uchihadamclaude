  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-synthesis:none}
  html,body{height:100%}
  body{background:radial-gradient(130% 90% at 50% -10%,#31404f 0%,var(--bg2) 65%);color:var(--ink);
    font-family:var(--font);min-height:100dvh;display:flex;justify-content:center;
    padding:8px;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-synthesis:none}
  #app{width:min(var(--appw),100%);display:flex;flex-direction:column;gap:10px}

  /* ---------- HUD ---------- */
  #hud{display:flex;flex-wrap:wrap;align-items:center;gap:8px;
    background:linear-gradient(180deg,#f5e9cd,#e9d7ac);border:1px solid var(--line);
    border-radius:14px;padding:9px 12px;box-shadow:0 4px 12px rgba(10,14,20,.35)}
  .brand{font-size:16px;font-weight:900;letter-spacing:.3px;display:flex;align-items:center;gap:8px;flex:1 1 auto;color:var(--ink)}
  .brand small{display:block;font-size:8px;color:var(--dim);letter-spacing:1.4px;text-transform:uppercase;font-weight:700}
  .logo-emblem{height:36px;width:auto;image-rendering:pixelated;filter:drop-shadow(0 2px 2px #0009);flex:none}
  .ticon{width:20px;height:20px;object-fit:contain;image-rendering:pixelated;vertical-align:-4px;margin-right:4px}
  /* ---------- Base: hub RETRATO (celular em pé) com moldura de ARTE sobre o acampamento ---------- */
  #screen-base{position:relative;padding:8px 4px 10px;border-radius:16px;overflow-x:clip;
    background:linear-gradient(rgba(20,26,34,.42),rgba(20,26,34,.60)),url(assets/bg_basecamp.png) center/cover no-repeat;
    box-shadow:0 8px 22px rgba(10,14,20,.45)}
  .base-frame{position:relative;
    border:34px solid transparent;border-image:url(assets/frame9.png) 46 round;
    background:var(--panel);background-clip:padding-box;border-radius:10px;
    padding:10px 8px 10px;image-rendering:pixelated}
  .base-frame > *{image-rendering:auto}
  /* placa: aspect-ratio real (586x81) pra NÃO esticar/cortar espada+escudo, acima da moldura */
  /* placa MONTADA na viga superior (encostada na madeira, sem flutuar) */
  .base-title{position:absolute;top:-17px;left:50%;transform:translate(-50%,-50%);z-index:4;
    width:min(450px,84%);aspect-ratio:559/79;border-radius:8px;overflow:hidden;
    background:url(assets/ribbon.png) center/100% 100% no-repeat;image-rendering:pixelated;
    display:flex;align-items:center;justify-content:center;
    color:#fbeecb;font-size:12.5px;font-weight:400;letter-spacing:.3px;padding:0 17%;text-transform:uppercase;white-space:nowrap;
    text-shadow:0 1px 0 #2c1a0c,0 2px 2px #2c1a0c}
  .base-title span{image-rendering:auto;padding-bottom:2px}

  /* --- hub: MESMO layout da referência (3 colunas lado a lado), ESCALADO p/ caber no retrato --- */
  .hub-fit{width:100%;overflow-x:clip}
  .hub-stage{width:var(--hubw,690px);transform-origin:top left;padding-top:30px}
  .base-hub{width:100%}
  .hub-grid{display:grid;grid-template-columns:1.05fr auto 1.15fr;gap:10px;align-items:stretch;margin-top:20px}
  .hub-panel{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:9px;box-shadow:inset 0 0 0 2px #f4ead0,0 2px 6px rgba(30,20,8,.12);min-width:0;display:flex;flex-direction:column}
  .panel-cap{font-size:14px;font-weight:900;color:var(--ink2);text-align:center;position:relative;
    padding:2px 0 7px;border-bottom:1px dashed var(--line);margin-bottom:8px;letter-spacing:.3px}
  .party-swap{position:absolute;right:0;top:-2px;width:24px;height:24px;border-radius:7px;border:1px solid var(--line);
    background:#fff8e8;color:var(--ink2);font-size:14px;font-weight:900;line-height:1;cursor:pointer;padding:0}
  .party-swap:active{transform:translateY(1px)}
  /* modal: seleção de party */
  .pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
  .pick-hero{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 7px;
    background:#fff8e8;border:1px solid var(--line);border-radius:11px;cursor:pointer;min-width:0}
  .pick-hero.on{border-color:var(--acc);box-shadow:inset 0 0 0 2px var(--acc)}
  .pick-hero:not(.on){opacity:.62;filter:saturate(.85)}
  .ph-face{width:52px;height:52px;border-radius:50%;overflow:hidden;flex:none;
    background:radial-gradient(circle at 50% 35%,#fff,#e9d6ab);border:2px solid var(--acc)}
  .ph-nm{font-weight:900;font-size:12.5px;color:var(--ink);line-height:1.05;text-align:center}
  .ph-cl{font-size:9px;font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:.3px;text-align:center;line-height:1}
  .ph-st{font-size:11px;font-weight:800;color:var(--ink2)} .ph-tags{font-size:12px;line-height:1}
  .ph-ck{position:absolute;top:4px;right:5px;width:18px;height:18px;display:grid;place-items:center;
    font-size:10px;font-weight:900;color:#fff;background:var(--acc);border-radius:50%;border:1.5px solid #fff}

  /* party: coluna de 4 cards */
  .party-cards{display:flex;flex-direction:column;gap:8px}
  .party-card{display:flex;gap:9px;align-items:center;background:#fff8e8;
    border:1px solid var(--line);border-left:5px solid var(--acc,#8a6a34);border-radius:10px;padding:7px 8px;min-width:0}
  .pc-face{width:50px;height:50px;flex:none;border-radius:9px;overflow:hidden;
    background:radial-gradient(circle at 50% 35%,#fff,#e9d6ab);border:2px solid var(--acc,#8a6a34)}
  .pc-face img{width:100%;height:100%;object-fit:cover;object-position:50% 16%;image-rendering:pixelated}
  .pc-info{flex:1;min-width:0}
  .pc-nm{font-weight:900;font-size:15px;color:var(--ink);line-height:1.1}
  .pc-st{font-size:12px;font-weight:800;color:var(--dim);margin:1px 0 5px}
  .eq-row{display:flex;gap:5px}
  .eq-slot{display:inline-flex;align-items:center;gap:2px;padding:4px 6px;border-radius:8px;
    background:var(--inset);border:1px solid var(--line);box-shadow:none;font-size:14px;line-height:1}
  .eq-slot.on{background:#fff3d4;border-color:var(--gold-d)}
  .eq-slot b{font-size:10px;color:var(--gold-d)}
  .eq-ic{filter:saturate(.9)} .eq-ic.big{font-size:26px}

  /* centro: coluna de ícones (arte da referência) */
  .hub-center{display:flex;flex-direction:column;justify-content:center;gap:18px;padding:0 4px}
  .hub-ic{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;box-shadow:none;padding:2px}
  .hub-ic img{width:66px;height:66px;object-fit:contain;image-rendering:pixelated;
    filter:drop-shadow(0 3px 3px rgba(0,0,0,.3));transition:transform .1s}
  .hub-ic:active img{transform:translateY(2px)}
  .hub-ic:hover img{transform:translateY(-3px) scale(1.05)}
  .hub-ic .hub-emoji{width:66px;height:66px;display:grid;place-items:center;font-size:40px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.3))}
  .hub-ic span{font-size:12px;font-weight:900;color:#f3e3bd;text-shadow:0 1px 2px #000,0 0 3px #000}
  /* loja de consumíveis */
  .shop-list{display:flex;flex-direction:column;gap:9px}
  .ci-row{display:flex;align-items:center;gap:11px;background:var(--panel,#fff8e8);border:1px solid var(--line);border-radius:12px;padding:9px 11px}
  .ci-row.own{border-color:#a7d8b3;background:#eef8ef}
  .ci-ic{font-size:26px;flex:none;line-height:1}
  .ci-b{flex:1;min-width:0} .ci-nm{font-weight:900;font-size:14px;color:var(--ink)} .ci-nm small{font-weight:700;color:#3f8f5a;font-size:11px}
  .ci-d{font-size:11.5px;color:var(--ink2)}
  .ci-buy{flex:none;display:flex;flex-direction:column;align-items:center;gap:1px;background:linear-gradient(180deg,#7fc48a,#4f9e6a);color:#fff;border:1px solid #3f8f5a;border-radius:9px;padding:6px 11px;font-weight:800;font-size:12px;cursor:pointer}
  .ci-buy:disabled{opacity:.5;filter:grayscale(.4);cursor:default}
  .ci-cost{font-size:10px;font-weight:800;opacity:.95}

  /* direita: NPC + loja de gambits */
  .shop-wrap{display:flex;flex-direction:column;gap:8px}
  .npc-box{display:flex;align-items:center;gap:10px;background:#fff8e8;border:1px solid var(--line);border-radius:10px;padding:6px 10px}
  .npc-box .npc{width:64px;height:auto;aspect-ratio:184/260;image-rendering:pixelated;flex:none}
  .npc-say{font-size:13px;font-style:italic;color:var(--ink2);font-weight:700}
  .shop-list{display:flex;flex-direction:column;gap:7px;max-height:206px;overflow-y:auto;padding:1px}
  .shop-item{display:flex;align-items:center;gap:8px;background:#dbe8f4;border:1px solid #c2d8ea;
    border-radius:10px;padding:8px 10px;min-width:0}
  .shop-item.owned{background:#e4efe0;border-color:#cadfc3;opacity:.9}
  .si-ic{flex:none;font-size:16px}
  .si-name{flex:1;font-size:13px;font-weight:800;color:#2c5f8f;min-width:0}
  .shop-item.owned .si-name{color:#3a7a44}
  .si-cost{font-size:12.5px;white-space:nowrap;font-weight:800}
  .si-owned{font-size:16px;font-weight:900;color:#3a9b4f;margin-left:auto}
  .shop-buy{padding:6px 11px;font-size:12px;flex:none;background:linear-gradient(180deg,#5aa0e0,#3d7fc4);border-color:#2f6aa8;color:#fff;text-shadow:0 1px 0 #2f6aa8}

  /* rodapé de AÇÕES da base (fora do hub escalado): engrenagem + botão dourado */
  .base-actions{display:flex;align-items:center;gap:9px;max-width:460px;margin:2px auto 0}
  .hub-gear{flex:none;width:46px;height:46px;padding:0;font-size:20px;border-radius:10px}
  .gold-cta{flex:1;background:linear-gradient(180deg,#ffd76b,#eab032);border:2px solid #c88f20;
    color:#4a3410;font-size:17px;font-weight:900;text-shadow:0 1px 0 #ffe9a8;
    box-shadow:0 3px 0 #b07f22,0 5px 12px rgba(120,80,20,.3);padding:13px}
  .hub-x{position:absolute;top:-13px;right:2px;z-index:5;width:32px;height:32px;padding:0;border-radius:8px;
    background:linear-gradient(180deg,#8a95a2,#5f6772);border:2px solid #3f454d;color:#fff;font-weight:900;
    box-shadow:0 2px 0 #3f454d}

  /* modais largos + rosto no título */
  .box-wide{max-width:520px!important}
  .mh-face{width:30px;height:30px;border-radius:6px;object-fit:cover;object-position:50% 16%;vertical-align:-8px;image-rendering:pixelated;border:2px solid var(--acc,#8a6a34)}
  .eq-cur,.eq-empty{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}

  /* seleção do herói no hub */
  .party-card{cursor:pointer;transition:.08s}
  .party-card.sel{box-shadow:0 0 0 2px var(--acc,#8a6a34),0 2px 6px rgba(30,20,8,.25)}

  /* --- painel inferior: DETALHES + INVENTÁRIO (mesma moldura das janelas) --- */
  .detail-frame{position:relative;margin:-14px auto 4px;max-width:460px;
    border:18px solid transparent;border-image:url(assets/frame9.png) 46 round;
    background:var(--panel);background-clip:padding-box;border-radius:10px;
    padding:14px 12px 12px;image-rendering:pixelated}
  .detail-frame > *{image-rendering:auto}
  .detail-title{position:absolute;top:-9px;left:50%;transform:translate(-50%,-50%);z-index:4;
    width:min(290px,71%);aspect-ratio:559/79;border-radius:8px;overflow:hidden;background:url(assets/ribbon.png) center/100% 100% no-repeat;image-rendering:pixelated;
    display:flex;align-items:center;justify-content:center;color:#fbeecb;font-size:11px;font-weight:400;letter-spacing:.2px;padding:0 17%;text-transform:uppercase;white-space:nowrap;text-shadow:0 1px 0 #2c1a0c,0 2px 2px #2c1a0c}
  .detail-title span{image-rendering:auto;padding-bottom:2px}
  .detail-body{display:flex;flex-direction:column;gap:10px;margin-top:6px}
  .d-hero{display:flex;gap:11px;align-items:center;background:#fff8e8;border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:10px;padding:8px 11px}
  .d-face{width:58px;height:58px;flex:none;border-radius:10px;overflow:hidden;background:radial-gradient(circle at 50% 35%,#fff,#e9d6ab);border:2px solid var(--acc)}
  .d-face img{width:100%;height:100%;object-fit:cover;object-position:50% 16%;image-rendering:pixelated}
  .d-meta{flex:1;min-width:0}
  .d-nm{font-weight:900;font-size:16px;color:var(--ink)} .d-nm small{font-weight:700;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin-left:4px}
  /* perfil da classe: peso de armadura + estilo de arma */
  .d-prof{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
  .prof-chip{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:999px;border:1px solid var(--line);background:var(--inset);color:var(--ink2);text-transform:uppercase;letter-spacing:.3px}
  .prof-chip.w-light{background:#e6f0fb;border-color:#bcd6f0;color:#2c5f96}
  .prof-chip.w-medium{background:#e6f6e9;border-color:#bfe3c6;color:#2f7a43}
  .prof-chip.w-heavy{background:#f3ece1;border-color:#dcc9a8;color:#8a6a2a}
  .prof-chip.sty{background:#efe8f7;border-color:#d5c6ee;color:#6a4b9e}
  .d-lv{font-size:11px;font-weight:900;color:#fff;background:var(--acc,#8a6a34);border-radius:6px;padding:1px 6px;margin-left:2px;vertical-align:middle}
  /* botão Licenças + prancha */
  .lic-btn{width:100%;margin:8px 0 2px;padding:9px;border-radius:10px;border:1px solid #cdb8e6;background:#f0e8fa;color:#5a3e8e;font-weight:900;font-size:13px;cursor:pointer}
  .lic-btn:active{transform:translateY(1px)}
  /* ===== PRANCHA DE TALENTOS estilo ATLAS (moldura + cabeçalho por arte) ===== */
  .atlas-hdr{position:relative;width:100%;aspect-ratio:1300/292;background:url('art/tree_header.png') no-repeat center/100% 100%;margin-bottom:4px}
  .atlas-hdr .ah-port{position:absolute;left:11.4%;top:18.5%;width:14.6%;height:57%;display:grid;place-items:center}
  .atlas-hdr .ah-port img,.atlas-hdr .ah-port svg{max-width:86%;max-height:86%;width:auto;height:auto;object-fit:contain;display:block}
  .atlas-hdr .ah-info{position:absolute;left:32.5%;right:15%;top:18%;bottom:18%;display:flex;flex-direction:column;justify-content:center;gap:2px;color:#f2e6c8;line-height:1.1}
  .atlas-hdr .ah-nm{font-size:clamp(14px,4.4vw,21px);font-weight:900;text-shadow:0 1px 2px #000,0 0 6px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .atlas-hdr .ah-sub{font-size:clamp(9px,2.7vw,12px);font-weight:800;color:#e6cf95;text-shadow:0 1px 2px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .atlas-hdr .ah-sub b{color:#ffd98a}
  .atlas-hdr .ah-st{display:flex;gap:7px;flex-wrap:nowrap;overflow:hidden}
  .atlas-hdr .ah-st span{font-size:clamp(9px,2.7vw,11.5px);font-weight:800;color:#efe6d2;text-shadow:0 1px 2px #000}
  .atlas-hint{display:flex;justify-content:space-between;align-items:center;margin:2px 2px 6px;color:#b7ac93;font-size:11px}
  .atlas-z button{background:#26221c;color:#f4e6c8;border:1px solid #5a4e3a;border-radius:7px;width:28px;height:26px;font-size:15px;font-weight:900;cursor:pointer;margin-left:4px}
  .atlas-framed{border:38px solid transparent;border-image:url('art/tree_frame.png') 108 stretch;border-radius:8px}
  .atlas-vp{overflow:auto;height:54vh;touch-action:none;position:relative;background:radial-gradient(circle at 50% 50%,#1a1b1e 0%,#101113 60%,#08090a 100%)}
  .atlas-outer{position:relative}
  .atlas-tree{position:absolute;top:0;left:0;transform-origin:0 0}
  svg.atlas-links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  svg.atlas-links .atg{fill:none;stroke:#fff;opacity:.045;stroke-width:2}
  svg.atlas-links line{stroke-linecap:round}
  svg.atlas-links .off{stroke:#4a4640;stroke-width:3;opacity:.5}
  svg.atlas-links .ghost{stroke:#33312c;stroke-width:2.5;opacity:.3}
  svg.atlas-links .near{stroke:#e9e4d6;stroke-width:3.5;opacity:.85}
  svg.atlas-links .on{stroke:#e7b73c;stroke-width:5;filter:drop-shadow(0 0 5px rgba(231,183,60,.9))}
  .atn{position:absolute;border-radius:50%;display:grid;place-items:center;text-align:center;padding:0;cursor:default;border:none;background:none}
  .atn .ic{line-height:1}
  .atn .tier{position:absolute;bottom:4%;left:50%;transform:translateX(-50%);font-size:38%;font-weight:900}
  .atn.owned{background:radial-gradient(circle at 50% 35%,#f3d873,#c79a2b);border:3px solid #ffe9a6;box-shadow:0 0 12px rgba(231,183,60,.7),inset 0 2px 4px rgba(255,255,255,.4)}
  .atn.owned .ic{color:#4a3608;filter:none} .atn.owned .tier{color:#4a3608}
  .atn.avail{background:radial-gradient(circle at 50% 35%,#fbfbfb,#c9cbd0);border:3px solid #fff;box-shadow:0 0 10px rgba(255,255,255,.55);cursor:pointer}
  .atn.avail .ic{filter:grayscale(1) brightness(.25)} .atn.avail .tier{color:#333}
  .atn.buyable{animation:atpulse 1.5s ease-in-out infinite}
  @keyframes atpulse{0%,100%{box-shadow:0 0 10px rgba(255,255,255,.55)}50%{box-shadow:0 0 20px rgba(255,235,150,.95)}}
  .atn.locked{background:radial-gradient(circle at 50% 35%,#3b3a3e,#26262a);border:2.5px solid #55545a}
  .atn.locked .ic{filter:grayscale(1) brightness(1.6);opacity:.6} .atn.locked .ic.q{filter:none;color:#9a9098;opacity:.85;font-weight:900} .atn.locked .tier{color:#8d8b93}
  .atn.ghost{opacity:.3;filter:saturate(.4)}
  .atn.milestone{background:radial-gradient(circle at 50% 40%,#ffe07a,#b8860f);border:3px solid #fff1b8;box-shadow:0 0 16px rgba(255,200,60,.8),inset 0 2px 5px rgba(255,255,255,.5)}
  .atn.milestone .ic{color:#3a2c08;filter:none}
  .atn.milestone.locked{background:radial-gradient(circle at 50% 40%,#6a5a3a,#3a3020);border-color:#8a7a52;box-shadow:none}
  .atn.milestone.locked .ic{color:#c8b98a}
  .atn.core{z-index:6;cursor:default}
  .atlas-legend{display:flex;justify-content:center;gap:12px;margin-top:8px;flex-wrap:wrap;color:#7a6a4e;font-size:11px;font-weight:700}
  .atlas-legend span{display:flex;align-items:center;gap:5px}
  .atlas-legend i{width:16px;height:16px;border-radius:50%;display:inline-block}
  .atlas-legend .lo{background:radial-gradient(circle at 50% 35%,#f3d873,#c79a2b);border:2px solid #ffe9a6}
  .atlas-legend .la{background:radial-gradient(circle at 50% 35%,#fbfbfb,#c9cbd0);border:2px solid #fff}
  .atlas-legend .ll{background:#2c2c30;border:2px solid #55545a}
  .lic-head{display:flex;gap:11px;align-items:center;background:#f5eefb;border:1px solid #ddccef;border-left:5px solid var(--acc);border-radius:10px;padding:8px 11px;margin-bottom:6px}
  .lic-face{width:52px;height:52px;flex:none;border-radius:10px;overflow:hidden;background:radial-gradient(circle at 50% 35%,#fff,#e9d6ab);border:2px solid var(--acc)}
  .lic-meta{flex:1;min-width:0} .lic-lv{font-size:14px;font-weight:800;color:var(--ink)} .lic-lp{color:#7a4bc0}
  .lic-xpbar{height:8px;background:#e2d4f2;border:1px solid #cbb8e6;border-radius:5px;overflow:hidden;margin:4px 0 2px}
  .lic-xpbar>i{display:block;height:100%;background:linear-gradient(90deg,#9b6fe0,#c9a2ff)}
  .lic-xptxt{font-size:10px;font-weight:700;color:var(--dim)}
  .lic-sec{font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:10px 3px 5px;display:flex;align-items:center;gap:6px}
  .lic-sec::before,.lic-sec::after{content:'';height:1px;flex:1;background:var(--line)}
  .lic-sec span{background:var(--inset);border:1px solid var(--line);border-radius:20px;padding:0 7px;color:var(--ink2)}
  .lic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px}
  .lic-node{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 3px 5px;border-radius:10px;border:1px solid var(--line);background:#fff8e8;cursor:pointer;min-width:0}
  /* moldura do nódulo (recebe a arte PNG depois: background-image no .ln-frame) */
  .lic-node .ln-frame{width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:9px;
    background:radial-gradient(circle at 50% 32%,#fffdf6,#ecdcb6);border:1.5px solid #d9c48f;box-shadow:inset 0 -2px 4px rgba(120,90,30,.18);background-size:cover;background-position:center}
  .lic-node.stat .ln-frame{background:radial-gradient(circle at 50% 32%,#eef4ff,#c9d8f2);border-color:#9db8e0}
  .lic-node .ln-ic{font-size:19px;line-height:1}
  .lic-node .ln-nm{font-size:10.5px;font-weight:800;color:var(--ink);text-align:center;line-height:1.05;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .lic-node .ln-cost{font-size:9.5px;font-weight:800;color:var(--dim)}
  .lic-node.owned{background:#e9f6ec;border-color:#a7d8b3} .lic-node.owned .ln-cost{color:#3f8f5a}
  .lic-node.owned .ln-frame{box-shadow:inset 0 0 0 2px #7ecb96,inset 0 -2px 4px rgba(120,90,30,.18)}
  .lic-node.buy{border-color:#c9a2ff;box-shadow:0 0 0 1px #e0cbff,0 2px 8px rgba(155,111,224,.25)} .lic-node.buy .ln-cost{color:#7a4bc0}
  .lic-node.buy .ln-frame{animation:licpulse 1.6s ease-in-out infinite}
  @keyframes licpulse{0%,100%{box-shadow:inset 0 -2px 4px rgba(120,90,30,.18)}50%{box-shadow:inset 0 -2px 4px rgba(120,90,30,.18),0 0 8px rgba(155,111,224,.55)}}
  .lic-node.lock{opacity:.5;filter:grayscale(.5);cursor:default}
  .d-stats{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .d-stat{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:800;color:var(--ink2);background:var(--inset);border:1px solid var(--line);border-radius:7px;padding:2px 7px}
  .d-stat b{color:var(--ink)}
  /* 6 slots de equipamento — SÓ ícone, enxuto (arte entra depois) */
  .d-slots{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
  .d-slot{position:relative;aspect-ratio:1;display:grid;place-items:center;background:var(--inset);
    border:1px solid var(--line);border-radius:11px;padding:0;box-shadow:none;min-width:0}
  .d-slot.on{background:#fff8e8;border-color:var(--acc);box-shadow:inset 0 0 0 1.5px var(--acc)}
  .ds-ic{font-size:24px;line-height:1}
  .ds-img{width:80%;height:80%;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 1px 1px #0003)}
  .ds-img.ghost{opacity:.30;filter:grayscale(.4)}
  .ds-badge{position:absolute;bottom:1px;right:3px;font-size:9px;font-weight:800;color:#fff;background:var(--acc);border-radius:6px;padding:0 3px;line-height:1.35}
  .ds-x{position:absolute;top:-4px;right:-4px;width:16px;height:16px;display:grid;place-items:center;font-size:9px;color:#fff;background:var(--enemy);border-radius:50%;font-weight:900;border:1.5px solid #fff}
  @media(max-width:360px){ .d-slots{grid-template-columns:repeat(6,1fr);gap:4px} .ds-ic{font-size:20px} }
  .inv-cap{font-size:13px;font-weight:900;color:var(--ink2);margin-top:2px} .inv-cap small{font-weight:700;font-size:10px;color:var(--dim)}
  /* inventário: grade COMPACTA de ícones — tudo visível, sem rolagem */
  .inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:7px}
  .inv-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    background:#fff8e8;border:1px solid var(--line);border-radius:10px;padding:7px 3px 6px;box-shadow:none;min-width:0;aspect-ratio:1/.86}
  .inv-item .ii-ic{font-size:26px;line-height:1;filter:drop-shadow(0 1px 1px #0002)}
  .inv-item .ii-img{width:42px;height:42px;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 1px 1px #0003)}
  .ii-bo{font-size:9.5px;font-weight:800;color:var(--heal);text-align:center;line-height:1.15;white-space:normal}
  .ii-slot,.ii-nm{display:none}
  .inv-item.r-incomum{border-color:#7bc47b;box-shadow:inset 0 0 0 1px #b6e3b6}
  .inv-item.r-raro{border-color:#6fa8e0;box-shadow:inset 0 0 0 1px #b3d3f2}
  .inv-item.r-epico{border-color:#b98be6;box-shadow:inset 0 0 0 1px #d9c2f2}
  .inv-item.r-lendario{border-color:#e6b64e;box-shadow:inset 0 0 0 1px #f3dca0}
  .inv-item:active{transform:translateY(1px)}
  /* item que a classe NÃO pode vestir (peso incompatível) */
  .inv-item.locked{opacity:.55;filter:grayscale(.65)}
  .inv-item.locked .ii-img{filter:grayscale(1) drop-shadow(0 1px 1px #0003)}
  .ii-lock{position:absolute;top:3px;right:4px;font-size:11px;line-height:1}
  .inv-item{position:relative}
  .inv-empty{grid-column:1/-1;text-align:center;color:var(--dim);font-size:12px;padding:12px}
  .loot .drop{color:var(--purple);font-weight:800}
  /* toast de aviso */
  #toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translate(-50%,140%);
    max-width:88%;background:#241d2a;color:#fff;font-size:12.5px;font-weight:700;line-height:1.3;
    padding:10px 15px;border-radius:12px;box-shadow:0 8px 26px #0006;z-index:200;text-align:center;
    opacity:0;transition:transform .28s cubic-bezier(.2,.9,.3,1.4),opacity .28s;pointer-events:none}
  #toast.show{transform:translate(-50%,0);opacity:1}

  /* --- Editor de Gambits — layout LIMPO tipo tabela/linhas --- */
  .gh-box{max-width:560px!important}
  #gh-mount{text-align:left}
  .gh-lede{margin-top:-2px;text-align:center}
  .gh-tabs{display:flex;gap:10px;justify-content:center;margin:12px 0 10px;flex-wrap:wrap}
  .gh-tabs{overflow-x:auto}
  .gh-tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:2px;background:none;border:none;box-shadow:none;flex:none}
  .ght-face{width:52px;height:52px;border-radius:50%;overflow:hidden;image-rendering:pixelated;
    border:2px solid transparent;background:radial-gradient(circle at 50% 35%,#fff,#ecdcb6);display:block}
  .gh-tab.on .ght-face{border-color:var(--acc);box-shadow:0 0 0 2px #fff,0 3px 7px rgba(0,0,0,.25)}
  .gh-tab:not(.on) .ght-face{opacity:.72;filter:saturate(.9)}
  .gh-tab span{font-size:10.5px;font-weight:800;color:var(--dim)}
  .gh-tab.on span{color:var(--ink)}

  /* retrato universal: PNG (fm-img) ou SVG (fm-svg) preenchendo o círculo */
  .fm-img{width:100%;height:100%;object-fit:cover;object-position:50% 16%;image-rendering:pixelated}
  .fm-svg{display:block;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 35%,#fff,#e9d6ab)}
  .fm-svg svg{width:100%;height:100%;transform:scale(1.7);transform-origin:50% 14%}

  /* cabeçalho do herói: slim, sem "caixa azul" */
  .gg-hero{display:flex;align-items:center;gap:8px;padding:4px 2px 8px;border-bottom:2px solid var(--line);margin-bottom:6px}
  .gg-hface{width:26px;height:26px;border-radius:50%;overflow:hidden;image-rendering:pixelated;border:1px solid var(--line);flex:none;display:block}
  .gg-hname{font-size:16px;font-weight:400;color:var(--ink)}
  .gg-hcount{margin-left:auto;font-size:11px;font-weight:800;color:var(--dim)}
  .gg-colhead{display:flex;align-items:center;gap:8px;font-size:9.5px;font-weight:800;letter-spacing:.5px;color:var(--dim2);text-transform:uppercase;padding:0 2px 6px}
  .gg-colhead span:nth-child(1){width:26px;text-align:center;flex:none}
  .gg-colhead span:nth-child(2){flex:1;min-width:0}
  .gg-colhead span:nth-child(3){width:56px;text-align:center;flex:none}

  /* linhas (flat, separadas por fio) */
  .gg-list{display:flex;flex-direction:column}
  .gg{display:flex;align-items:flex-start;gap:8px;padding:9px 2px;border-bottom:1px solid var(--line);touch-action:pan-y;transition:opacity .1s}
  .gg:last-child{border-bottom:none}
  .gg.off{opacity:.45}
  .gg.dragging{background:#fffbec;border-radius:10px;box-shadow:0 8px 20px rgba(20,12,4,.3);position:relative;z-index:5}
  .gg-num{flex:none;width:26px;text-align:center;font-size:24px;font-weight:400;color:var(--ink2);line-height:1.4;cursor:grab;touch-action:none;user-select:none}
  .gg-num:active{cursor:grabbing}
  .gg-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
  .gg-line{display:flex;align-items:center;gap:8px;min-width:0}
  .gg-lb{flex:none;width:30px;text-align:center;font-size:11px;font-weight:800;color:var(--dim);letter-spacing:.5px}
  .gg-lb.arw{color:#b58a3a;font-size:15px}
  .gg-status{flex:none;display:flex;align-items:center;gap:5px;padding-top:3px}
  .gg-en,.gg-rm{width:28px;height:28px;padding:0;border-radius:50%;font-size:14px;font-weight:900;box-shadow:none;line-height:1}
  .gg-en{background:#e8efe4;border:1px solid #c7d9bd;color:#9fb592}
  .gg-en.on{background:#dff0d6;border-color:#8bc07a;color:#3f9b4f}
  .gg-rm{background:#f0ece3;border:1px solid #ddd3c3;color:#b09b83}

  /* pílulas suaves (dropdown) */
  .gpick{flex:1;width:100%;min-width:0;display:flex;align-items:center;gap:4px;text-align:left;
    font-family:var(--font);font-weight:400;font-size:13px;border-radius:9px;padding:9px 11px;box-shadow:none;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid transparent}
  .gpick .gpick-ar{margin-left:auto;flex:none;opacity:.5;font-size:10px}
  .gpick.cond{background:#dbe8f4;color:#2c5f8f;border-color:#c2d8ea}
  .gpick.act{background:#dcecdb;color:#3a7a44;border-color:#c3dcc0}
  .gpick.open{border-color:var(--gold-d);box-shadow:0 0 0 3px #f4c95d33}

  /* lista inline (opções) — pílulas simples full-width */
  .gg-opts{display:flex;flex-direction:column;gap:5px;margin:1px 0 3px 38px;animation:ghpop .12s ease-out}
  @keyframes ghpop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .gopt{display:flex;align-items:center;gap:8px;text-align:left;border-radius:9px;padding:9px 11px;font-size:12.5px;font-weight:400;border:1px solid transparent}
  .gopt .gopt-t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gopt.c{background:#e9f1fa;color:#2c5f8f;border-color:#d3e2f0}
  .gopt.a{background:#e9f3e8;color:#3a7a44;border-color:#d3e7d1}
  .gopt.sel{border-color:var(--gold-d);box-shadow:inset 0 0 0 1px var(--gold-d);font-weight:800}
  .gopt-ck{margin-left:auto;flex:none;font-weight:900;color:var(--gold-d)}

  /* slots bloqueados (compactos e leves) */
  .gg-slots{display:flex;flex-direction:column;gap:6px;margin-top:10px}
  .gg-slot{display:flex;align-items:center;gap:9px;padding:8px 11px;border:1px dashed var(--line);border-radius:10px;background:#f3ecda}
  .gg-slot.dim{opacity:.6}
  .gg-slock{flex:1;font-size:12px;font-weight:800;color:var(--dim)}
  .gh-unlock{flex:none;padding:6px 10px;font-size:12px}
  .gh-add{width:100%;margin-top:12px;background:linear-gradient(180deg,#f8d066,#e3a936);border-color:#c88f20;color:#4a3410;font-weight:900}

  .nav{display:flex;gap:6px;flex:0 0 auto}
  .res{order:3;flex-basis:100%;display:flex;justify-content:space-between;gap:6px;font-weight:800;font-size:12px;
    background:#2c2114;border:1px solid #23190e;border-radius:10px;padding:6px 10px;color:#f2e7d2}
  .res span{display:inline-flex;align-items:center;gap:4px}
  .res .gold{color:var(--gold)} .res .crystal{color:var(--crystal)}
  .res .iron{color:var(--iron)} .res .wood{color:var(--wood)} .res .herb{color:var(--herb)}

  /* ---------- botões ---------- */
  button{font-family:var(--font);cursor:pointer;border:1px solid var(--line2);color:var(--ink);
    background:linear-gradient(180deg,#fdf7e6,#ecdcb4);border-radius:11px;
    padding:9px 14px;font-weight:800;font-size:13px;box-shadow:0 2px 0 #cbab63,0 3px 7px rgba(30,20,8,.18);transition:.1s;touch-action:manipulation}
  button:hover:not(:disabled){filter:brightness(1.03);border-color:var(--gold-d)}
  button:active{transform:translateY(2px);box-shadow:0 0 0 #cbab63}
  button.primary{background:linear-gradient(180deg,#f8d066,#e3a936);border-color:#c88f20;color:#4a3410;text-shadow:0 1px 0 #ffe9a8;box-shadow:0 2px 0 #b07f22,0 4px 10px rgba(120,80,20,.3)}
  button.danger{background:linear-gradient(180deg,#e0685c,#c0463c);border-color:#a83228;color:#fff;text-shadow:none;box-shadow:0 2px 0 #8a2f28}
  button:disabled{opacity:.5;cursor:not-allowed;filter:grayscale(.35)}
  button.small{padding:6px 10px;font-size:12px;box-shadow:0 2px 0 #cbab63}
  button.tab{background:var(--panel2);border-color:var(--line);color:var(--ink2,#7a5f39);box-shadow:none;border-radius:11px 11px 0 0;flex:1;padding:9px 6px;font-size:12px;font-weight:800}
  button.tab.on{background:var(--card);color:var(--ink);border-bottom-color:var(--card);font-weight:900}

  /* ---------- screens ---------- */
  .screen{display:none} .screen.active{display:block}

  /* ---------- MAPA ---------- */
  .map-wrap{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;
    background:linear-gradient(180deg,#3f7d54 0%,#356c47 45%,#2b5a3c 100%);height:62dvh;max-height:560px;min-height:380px;box-shadow:0 4px 0 #120b04}
  .map-wrap .water{position:absolute;right:6%;top:46%;width:34%;height:18%;border-radius:48% 42% 46% 50%;
    background:radial-gradient(120% 120% at 40% 30%,#5aa6d8,#2b6fa8);box-shadow:inset 0 0 20px #1a4e78}
  .map-wrap .mount{position:absolute;top:4%;right:0;width:50%;height:26%;
    background:linear-gradient(160deg,#6b6b78 0%,#4a4a58 60%,transparent 61%);clip-path:polygon(20% 100%,42% 24%,58% 66%,74% 12%,100% 60%,100% 100%);opacity:.6}
  .map-wrap .forest{position:absolute;left:2%;top:8%;width:52%;height:46%;opacity:.5;
    background:radial-gradient(circle at 20% 30%,#204d2c 8%,transparent 9%),radial-gradient(circle at 45% 55%,#204d2c 7%,transparent 8%),radial-gradient(circle at 15% 70%,#1c4527 9%,transparent 10%),radial-gradient(circle at 62% 30%,#204d2c 6%,transparent 7%);background-size:cover}
  .map-title{position:absolute;left:14px;top:14px;font-size:20px;font-weight:900;color:#3a2a16;
    background:linear-gradient(180deg,#e8cf95,#cbab6a);padding:5px 14px;border-radius:8px;border:2px solid #a8894f;
    box-shadow:0 3px 0 #6f5730;text-shadow:0 1px 0 #f3e2b8}
  .map-path{position:absolute;inset:0;pointer-events:none}
  .node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;width:110px}
  .node .disc{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-size:23px;
    background:radial-gradient(circle at 40% 35%,#4c4660,#3a2c18);border:3px solid #8a6a34;box-shadow:0 3px 0 #120b04,inset 0 0 12px #0006}
  .node.active .disc{border-color:var(--gold);box-shadow:0 0 16px #f4c95d88,0 3px 0 #120b04;animation:pulse 1.6s ease-in-out infinite}
  .node.locked{cursor:not-allowed} .node.locked .disc{filter:grayscale(1) brightness(.6);border-color:#555}
  .node .lbl{font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 2px #000,0 0 4px #000,0 0 4px #000;text-align:center;line-height:1.1}
  .node .lbl b{display:block;font-size:11px}
  .node .st{display:block;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;margin-top:1px}
  .node.active .st{color:var(--gold)} .node.locked .st{color:#e2a0a0}
  @keyframes pulse{50%{transform:scale(1.06)}}
  .party-panel{position:absolute;left:10px;right:10px;bottom:10px;background:#f5e9cdf0;border:1px solid var(--line);
    border-radius:12px;padding:8px 8px 10px;box-shadow:0 3px 10px rgba(0,0,0,.3)}
  .party-panel h4{font-size:11px;color:var(--dim);margin-bottom:6px;letter-spacing:1px;text-transform:uppercase;text-align:center}
  .pmini .pn{color:var(--ink)}
  .party-row{display:flex;justify-content:space-around;gap:4px}
  .pmini{display:flex;flex-direction:column;align-items:center;width:23%}
  .pmini .av{width:40px;height:46px} .pmini .av svg{width:100%;height:100%}
  .pmini .pn{font-size:10px;font-weight:800;margin-top:1px}
  .pmini .pbar{width:80%;height:5px;background:#160d06;border-radius:3px;overflow:hidden;margin-top:3px}
  .pmini .pbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--hp),var(--hp2))}

  /* ---------- painéis genéricos ---------- */
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 3px 10px rgba(20,26,34,.18)}
  .panel h3{font-size:14px;margin-bottom:9px;display:flex;align-items:center;gap:7px}
  .row{display:flex;gap:8px} .col{display:flex;flex-direction:column;gap:8px}
  .cost{display:inline-flex;gap:8px;font-weight:800;font-size:12px;flex-wrap:wrap}
  .cost .no{color:var(--enemy)} .cost .ok{color:var(--ink)}
  .muted{color:var(--dim)} .tiny{font-size:11px}

  /* ---------- cartas de herói (base) ---------- */
  .hero-cards{display:flex;flex-direction:column;gap:12px}
  .hcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;overflow:hidden;box-shadow:0 3px 9px rgba(20,26,34,.16)}
  .hcard .top{display:flex;align-items:center;gap:10px;margin:-12px -12px 10px;padding:8px 12px;background:var(--acc,#8a6a34);box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
  .hcard .av{width:40px;height:48px;flex:none;background:rgba(255,255,255,.16);border-radius:8px;padding:2px} .hcard .av svg{width:100%;height:100%}
  .hcard .nm{font-weight:900;font-size:15px;color:var(--ink)}
  .hcard .top .nm{color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.25)} .hcard .top .kl{font-size:11px;color:rgba(255,255,255,.9)}
  .hcard .kl{font-size:11px;color:var(--dim)}
  .hcard .stats{display:flex;gap:16px;font-size:12px;margin:6px 0;color:var(--ink)}
  .hcard .stats b{color:var(--gold-d)}
  .hcard .actionrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;flex-wrap:wrap}
  .wl{display:flex;gap:3px;margin:4px 0}
  .wl i{width:14px;height:14px;border-radius:4px;background:rgba(60,44,25,.12);border:1px solid var(--line)}
  .wl i.on{background:linear-gradient(180deg,#f8d066,#d09a30);border-color:#c88f20}

  /* ---------- GAMBIT BOARD (mobile: seletor + 1 herói) ---------- */
  .gtabs{display:flex;gap:6px;margin-bottom:10px}
  .gtab{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px;border-radius:12px;
    background:var(--panel2);border:1px solid var(--line);cursor:pointer;box-shadow:none;transition:.1s}
  .gtab .av{width:34px;height:40px} .gtab .av svg{width:100%;height:100%}
  .gtab span{font-size:10px;font-weight:800;color:var(--ink2,#7a5f39)}
  .gtab.on{background:var(--card);border-color:var(--gold-d);box-shadow:0 2px 7px rgba(20,26,34,.16)}
  .gtab.on span{color:var(--ink)}
  .gtab .dot{width:16px;height:4px;border-radius:2px;background:rgba(60,44,25,.2);margin-top:2px}
  .gtab.on .dot{background:var(--acc,var(--accent))}
  .gpanel{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 3px 10px rgba(20,26,34,.16)}
  .gphead{display:flex;align-items:center;gap:9px;padding:9px 11px;background:var(--acc,#8a6a34);box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
  .gphead .av{width:34px;height:40px;flex:none;background:rgba(255,255,255,.16);border-radius:7px;padding:2px} .gphead .av svg{width:100%;height:100%}
  .gphead .hn{font-weight:900;font-size:15px;line-height:1.1;flex:1;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.25)}
  .gphead .hn small{display:block;color:rgba(255,255,255,.9);font-size:10px;font-weight:700}
  .glines{padding:10px;display:flex;flex-direction:column;gap:8px;min-height:50px}
  .gline{display:flex;align-items:center;gap:6px}
  .gline .idx{font-size:12px;font-weight:900;color:var(--dim2);width:14px;text-align:center;flex:none}
  .gline select{flex:1;min-width:0;color:var(--ink);border:1px solid var(--line);border-radius:9px;
    padding:9px 7px;font-size:13px;font-family:var(--font);font-weight:800;appearance:none;-webkit-appearance:none;background-color:var(--inset);
    background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
    background-position:calc(100% - 12px) 55%,calc(100% - 7px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:22px}
  .gline select.cond{background-color:#e6f0fb;color:#245e94;border-color:#a7cbe8}
  .gline select.act{background-color:#fbeae4;color:#b1483c;border-color:#e7b6aa}
  .gline .arw{color:var(--dim2);font-weight:900;flex:none}
  .gline .rm{color:var(--enemy);cursor:pointer;font-weight:900;flex:none;padding:4px 4px;opacity:.6;font-size:15px}
  .gline .rm:hover{opacity:1}
  .gline.locked{justify-content:center;font-size:12px;color:var(--dim);font-style:italic;padding:9px;background:var(--panel2);border:1px dashed var(--line2);border-radius:9px}
  .gadd{margin:2px 10px 11px;border-radius:10px;font-size:13px;padding:9px;width:calc(100% - 20px)}

  /* ---------- CENA DE COMBATE ---------- */
  .combat-stage{position:relative;height:40dvh;max-height:320px;min-height:240px;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 3px 0 #120b04}
  .combat-stage canvas.dungeon{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
  .torch-glow{position:absolute;width:120px;height:120px;transform:translate(-50%,-50%);pointer-events:none;
    background:radial-gradient(circle,rgba(255,170,60,.32),rgba(255,140,40,.09) 45%,transparent 70%);animation:flicker 1.4s ease-in-out infinite}
  @keyframes flicker{0%,100%{opacity:.82;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-51%) scale(1.07)}}
  .lane{position:absolute;bottom:16px;display:flex;flex-wrap:nowrap;gap:0;align-items:flex-end}
  .lane.heroes{left:2%}
  .lane.enemies{right:2%}
  .battler{position:relative;width:44px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;transition:opacity .4s,transform .4s}
  .battler .nmtag{font-size:9px;font-weight:800;color:#fff;text-shadow:0 1px 2px #000,0 0 3px #000,0 0 3px #000;margin-bottom:1px;white-space:nowrap}
  .battler .b-status{display:flex;gap:1px;justify-content:center;min-height:13px;margin-bottom:1px}
  .battler .b-status .sp{font-size:11px;line-height:1;filter:drop-shadow(0 1px 1px #000)}
  .battler .ohp{width:44px;height:5px;background:#0b0912;border:1px solid #000;border-radius:3px;overflow:hidden;margin-bottom:1px}
  .battler .ohp>i{display:block;height:100%;background:linear-gradient(90deg,var(--hp),var(--hp2));transition:width .25s}
  .battler.foe .ohp>i{background:linear-gradient(90deg,#ff6a5a,#c0342a)}
  .battler .spr{width:44px;height:60px;filter:drop-shadow(0 5px 3px #0009);animation:bob 2.4s ease-in-out infinite}
  .lane.enemies .battler .spr{transform:scaleX(-1)}
  .battler .shadow{width:34px;height:6px;border-radius:50%;background:#0008;filter:blur(2px);margin-top:-5px}
  /* artes 2D (PNG) */
  .sart{display:block;width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
  .battler .spr{display:flex;align-items:flex-end;justify-content:center;overflow:visible}
  .battler .spr .sart{height:104%;width:auto;max-width:none}
  .stage-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated}
  @keyframes bob{50%{transform:translateY(-4px)}}
  .battler.dead{opacity:0;transform:translateY(10px) scale(.8)}
  .battler.hit .spr{animation:hit .3s}
  @keyframes hit{25%{filter:drop-shadow(0 5px 3px #0009) brightness(2.4)}50%{transform:translateX(3px)}}
  .float{position:absolute;top:-4px;left:50%;transform:translateX(-50%);font-weight:900;font-size:15px;pointer-events:none;text-shadow:0 2px 3px #000;z-index:5;animation:floatUp 1s ease-out forwards}
  .float.dmg{color:#ffd0c8} .float.crit{color:var(--crit);font-size:18px} .float.heal{color:var(--heal)} .float.taunt{color:#ffd766;font-size:16px}
  .float.dot{color:#ffb08a;font-size:13px} .float.buff{color:#ffe08a;font-size:16px} .float.stun{color:#cfd0ff;font-size:16px}
  @keyframes floatUp{0%{opacity:0;transform:translate(-50%,6px)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-26px)}}
  .stage-banner{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:8}
  .stage-banner .msg{font-size:26px;font-weight:900;padding:8px 22px;border-radius:12px;text-shadow:0 3px 6px #000;opacity:0;animation:pop .5s ease forwards}
  .stage-banner .win{color:var(--heal)} .stage-banner .lose{color:var(--enemy)}
  @keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
  .expo-info{position:absolute;top:8px;left:8px;font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 2px #000;
    background:#0009;padding:4px 9px;border-radius:8px;border:1px solid var(--line)}

  /* ---------- abas do painel inferior ---------- */
  .tabbar{display:flex;gap:4px;margin-bottom:-1px}
  .tabbody{background:var(--card);border:1px solid var(--line);border-radius:0 16px 16px 16px;padding:13px;box-shadow:0 3px 10px rgba(20,26,34,.16)}
  .loghead{font-size:13px;font-weight:800;color:var(--dim);margin-bottom:8px}
  /* preparação */
  .prep-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .prep-title{font-weight:900;font-size:18px;line-height:1.15}
  .prep-title small{display:block;color:var(--dim);font-size:11px;font-weight:700;margin-top:2px}
  .prep-head #prep-start{font-size:15px;padding:11px 20px}
  .log{height:120px;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-family:var(--mono);font-size:11px;line-height:1.55;color:var(--ink2)}
  .log .ev{color:var(--ink2)} .log .ev b{color:var(--ink)}
  .log .ev .h{color:var(--hero)} .log .ev .e{color:var(--enemy)} .log .ev .c{color:var(--crit)} .log .ev .g{color:var(--heal)}
  .log .sys{color:var(--gold-d)}

  /* ---------- modal ---------- */
  .modal{position:fixed;inset:0;background:#000b;display:grid;place-items:start center;z-index:30;padding:16px;overflow-y:auto}
  .modal .box{position:relative;margin:auto}
  .modal-x{position:absolute;top:8px;right:8px;z-index:2;width:34px;height:34px;padding:0;font-size:15px;border-radius:9px;
    background:linear-gradient(180deg,#8a95a2,#5f6772);border:2px solid #3f454d;color:#fff;font-weight:900;box-shadow:0 2px 0 #3f454d}
  .modal .box{background:var(--panel);background-clip:padding-box;
    border:17px solid transparent;border-image:url(assets/frame9.png) 46 round;border-radius:14px;
    padding:16px 16px 14px;width:100%;max-width:400px;text-align:center;box-shadow:0 16px 50px rgba(0,0,0,.55);image-rendering:pixelated}
  .modal .box > *{image-rendering:auto}
  .modal h2{font-size:20px;margin-bottom:8px;color:var(--ink)} .modal .loot{display:flex;justify-content:center;gap:14px;margin:12px 0;font-weight:800;font-size:16px;flex-wrap:wrap;color:var(--ink)}
  .modal .row{flex-wrap:wrap;justify-content:center}
  .hidden{display:none!important}

  /* ---------- telas maiores: mantém coluna mobile centralizada ---------- */
  @media(min-width:520px){ :root{--appw:480px} }

</style>
</head>
<body>
  <div id="app">
    <header id="hud">
      <div class="brand"><img class="logo-emblem" src="assets/logo.png" alt="" /><span>Sigil Tactics<small>Idle RPG Tático</small></span></div>
      <div class="nav" id="nav"></div>
      <div class="res" id="res"></div>
    </header>
    <main>
      <section id="screen-map" class="screen active"></section>
      <section id="screen-base" class="screen"></section>
      <section id="screen-prep" class="screen"></section>
      <section id="screen-expedition" class="screen"></section>
    </main>
  </div>
  <div id="modal-root"></div>
  <script type="module" src="./src/game.js"></script>
</body>
</html>
