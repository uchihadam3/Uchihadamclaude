<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>⚔️ Vibe Gambit — Protótipo do Motor</title>
<style>
  :root{
    --bg:#12101a; --panel:#1c1930; --panel2:#242038; --ink:#e8e4f0; --dim:#9a93b5;
    --gold:#f4c95d; --crystal:#6fd3ff; --hp:#4bd66a; --hp2:#2a9d4a; --mp:#5aa9ff; --line:#332e4d;
    --hero:#7cc4ff; --enemy:#ff8a7a; --crit:#ffd34d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:radial-gradient(120% 120% at 50% -10%,#221d38 0%,var(--bg) 60%);color:var(--ink);
    font-family:"Trebuchet MS",system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px;gap:14px}
  .topbar{width:min(920px,100%);display:flex;align-items:center;justify-content:space-between;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
  .title{font-size:20px;font-weight:800;letter-spacing:.5px}
  .title small{display:block;font-size:11px;color:var(--dim);font-weight:600;letter-spacing:1px;text-transform:uppercase}
  .res{display:flex;gap:16px;font-weight:700;font-size:15px}
  .res .gold{color:var(--gold)} .res .crystal{color:var(--crystal)}

  /* ---- Metade superior: arena de combate ---- */
  .arena{width:min(920px,100%);background:linear-gradient(180deg,#201b36,#161327);
    border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;
    grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;min-height:230px}
  .side{display:flex;flex-direction:column;gap:12px}
  .side.enemies{align-items:flex-end}
  .vs{color:var(--dim);font-weight:800;font-size:13px;opacity:.6}
  .unit{position:relative;background:var(--panel2);border:1px solid var(--line);border-radius:10px;
    padding:8px 10px;width:210px;transition:opacity .3s,filter .3s}
  .side.enemies .unit{width:200px}
  .unit.dead{opacity:.35;filter:grayscale(1)}
  .unit .row{display:flex;align-items:center;gap:8px}
  .unit .sprite{font-size:26px;line-height:1}
  .unit .nm{font-weight:700;font-size:14px;flex:1}
  .unit .nm .side-tag{font-size:10px;color:var(--dim);font-weight:600}
  .bar{height:9px;border-radius:6px;background:#0e0c18;overflow:hidden;margin-top:5px;border:1px solid #0a0813}
  .bar > i{display:block;height:100%;transition:width .25s ease}
  .bar.hp > i{background:linear-gradient(90deg,var(--hp),var(--hp2))}
  .bar.mp > i{background:linear-gradient(90deg,#7cc0ff,var(--mp))}
  .stat{display:flex;justify-content:space-between;font-size:10px;color:var(--dim);margin-top:2px}
  /* números flutuantes de dano/cura */
  .float{position:absolute;left:50%;top:6px;transform:translateX(-50%);font-weight:800;font-size:15px;
    pointer-events:none;text-shadow:0 1px 2px #000;animation:floatUp 1s ease-out forwards}
  .float.dmg{color:var(--enemy)} .float.crit{color:var(--crit);font-size:18px} .float.heal{color:var(--hp)}
  @keyframes floatUp{0%{opacity:0;transform:translate(-50%,4px)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-26px)}}

  /* ---- Metade inferior: painel / combat log ---- */
  .panel{width:min(920px,100%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
  .panel .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .panel .head h2{font-size:14px;letter-spacing:.5px}
  .panel .head .tick{font-size:12px;color:var(--dim)}
  .log{height:160px;overflow-y:auto;background:#100e1b;border:1px solid var(--line);border-radius:8px;
    padding:8px 10px;font-family:ui-monospace,"Consolas",monospace;font-size:12px;line-height:1.65}
  .log .ev{color:var(--dim)} .log .ev b{color:var(--ink)}
  .log .ev .h{color:var(--hero)} .log .ev .e{color:var(--enemy)} .log .ev .c{color:var(--crit)} .log .ev .g{color:var(--hp)}
  .controls{display:flex;gap:10px;margin-top:12px;align-items:center}
  button{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;
    padding:9px 16px;font-weight:700;cursor:pointer;font-size:13px}
  button:hover{border-color:#5a4fa0} button.primary{background:#4a3fa0;border-color:#6a5fd0}
  .banner{font-weight:800;font-size:14px;padding:8px 14px;border-radius:8px}
  .banner.win{background:#173d24;color:#7ff0a0} .banner.lose{background:#3d1717;color:#ff9a9a}
  .note{width:min(920px,100%);color:var(--dim);font-size:12px;text-align:center;line-height:1.6}
</style>
</head>
<body>
  <div class="topbar">
    <div class="title">⚔️ Vibe Gambit <small>Protótipo do Motor de Gambits</small></div>
    <div class="res">
      <span class="gold">🪙 <b id="r-gold">0</b></span>
      <span class="crystal">💎 <b id="r-crystal">0</b></span>
    </div>
  </div>

  <!-- Metade superior: combate (esq. heróis → dir. inimigos) -->
  <div class="arena">
    <div class="side heroes" id="heroes"></div>
    <div class="vs">VS</div>
    <div class="side enemies" id="enemies"></div>
  </div>

  <!-- Metade inferior: combat log + controles -->
  <div class="panel">
    <div class="head">
      <h2>📜 Combat Log</h2>
      <span class="tick">Tick <b id="tick">0</b></span>
    </div>
    <div class="log" id="log"></div>
    <div class="controls">
      <button class="primary" id="btn-restart">↺ Nova Batalha</button>
      <button id="btn-step">⏭️ Avançar 1 tick</button>
      <span id="banner"></span>
    </div>
  </div>

  <p class="note">
    Isto é a fundação técnica: a <b>Engine</b> (simulação pura, sem DOM) roda os gambits por tick e esta
    <b>View</b> apenas lê o estado e desenha. Próximos passos: Gambit Board editável, World Map, Forja e Academia.
  </p>

<script type="module">
  import { newGame } from './src/state.js';
  import { SKILLS } from './src/data.js';
  import { Combat, buildParty, buildWave } from './src/engine.js';

  const $ = id => document.getElementById(id);
  const state = newGame();
  $('r-gold').textContent    = state.resources.gold;
  $('r-crystal').textContent = state.resources.crystals;

  let combat, timer, lastLogLen = 0;

  function makeUnitCard(u){
    const el = document.createElement('div');
    el.className = 'unit'; el.id = 'u-' + u.uid;
    el.innerHTML = `
      <div class="row"><span class="sprite">${u.sprite}</span>
        <span class="nm">${u.name} <span class="side-tag">${u.side==='hero'?'herói':'inimigo'}</span></span></div>
      <div class="bar hp"><i></i></div>
      <div class="stat"><span class="hp-txt"></span>${u.maxMp?'<span class="mp-txt"></span>':''}</div>
      ${u.maxMp?'<div class="bar mp"><i></i></div>':''}`;
    return el;
  }
  function refreshUnit(u){
    const el = $('u-' + u.uid); if(!el) return;
    el.classList.toggle('dead', u.hp<=0);
    el.querySelector('.bar.hp > i').style.width = (100*u.hp/u.maxHp) + '%';
    el.querySelector('.hp-txt').textContent = `HP ${u.hp}/${u.maxHp}`;
    if(u.maxMp){
      el.querySelector('.bar.mp > i').style.width = (100*u.mp/u.maxMp) + '%';
      el.querySelector('.mp-txt').textContent = `MP ${u.mp}`;
    }
  }
  function floatText(u, text, cls){
    const el = $('u-' + u.uid); if(!el) return;
    const f = document.createElement('div'); f.className = 'float ' + cls; f.textContent = text;
    el.appendChild(f); setTimeout(()=>f.remove(), 1000);
  }
  function logEvent(ev){
    const skill = SKILLS[ev.skill]?.name || ev.skill;
    const s = ev.source.side==='hero'?'h':'e', t = ev.target.side==='hero'?'h':'e';
    const div = document.createElement('div'); div.className = 'ev';
    if(ev.type==='damage')
      div.innerHTML = `t${ev.tick} <b class="${s}">${ev.source.name}</b> · ${skill} → <b class="${t}">${ev.target.name}</b> `+
        `<span class="${ev.crit?'c':''}">${ev.amount}${ev.crit?' CRIT':''} DMG</span>${ev.dead?' ☠️':''}`;
    else
      div.innerHTML = `t${ev.tick} <b class="${s}">${ev.source.name}</b> · ${skill} → <b class="${t}">${ev.target.name}</b> <span class="g">+${ev.amount} HP</span>`;
    const log = $('log'); log.appendChild(div); log.scrollTop = log.scrollHeight;
  }

  function drawAll(){ combat.units.forEach(refreshUnit); $('tick').textContent = combat.tick; }

  function pumpLog(){
    for(const ev of combat.log.slice(lastLogLen)){
      logEvent(ev);
      floatText(ev.target, ev.type==='heal'?`+${ev.amount}`:`${ev.amount}${ev.crit?'!':''}`,
                ev.type==='heal'?'heal':(ev.crit?'crit':'dmg'));
    }
    lastLogLen = combat.log.length;
  }

  function tickOnce(){
    if(combat.isOver()) return endBattle();
    combat.step(); pumpLog(); drawAll();
    if(combat.isOver()) endBattle();
  }

  function endBattle(){
    clearInterval(timer); timer = null;
    const win = combat.outcome()==='victory';
    $('banner').innerHTML = `<span class="banner ${win?'win':'lose'}">${win?'🏆 VITÓRIA':'💀 DERROTA'} — ${combat.tick} ticks</span>`;
  }

  function startBattle(){
    clearInterval(timer);
    const party   = buildParty(state);
    const enemies = buildWave(['goblin','goblin','goblin_brute','slime']);
    combat = new Combat(party, enemies, { seed: (Math.floor(Date.now()/97) % 100000) });
    lastLogLen = 0; $('log').innerHTML = ''; $('banner').innerHTML = '';
    $('heroes').innerHTML = ''; $('enemies').innerHTML = '';
    party.forEach(u   => $('heroes').appendChild(makeUnitCard(u)));
    enemies.forEach(u => $('enemies').appendChild(makeUnitCard(u)));
    drawAll();
    timer = setInterval(tickOnce, 650);
  }

  $('btn-restart').addEventListener('click', startBattle);
  $('btn-step').addEventListener('click', ()=>{ if(timer){clearInterval(timer);timer=null;} tickOnce(); });
  startBattle();
</script>
</body>
</html>
