<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>A Casa dos Dados</title>
<style>
  :root{ --ink:#f3ead2; --dim:#b7c9bf; --gold:#f2c14e; --chip:#7fd0ff; --mult:#ff7a6b; --wood:#2a1d10; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}   /* garante que o atributo hidden vença o display:flex */
  html,body{height:100%;overflow:hidden;background:#0a1f18;font-family:'Trebuchet MS',system-ui,sans-serif;color:var(--ink)}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #table.boss{filter:saturate(.8) brightness(.86)}

  /* ---- HUD topo ---- */
  #hud{position:fixed;top:0;left:0;right:0;padding:10px 14px 8px;z-index:4;
    background:linear-gradient(#0009,#0000);pointer-events:none}
  #stageName{text-align:center;font-weight:900;letter-spacing:1px;font-size:15px;text-shadow:0 2px 4px #000}
  #candles{text-align:center;font-size:16px;letter-spacing:2px;margin-top:2px;line-height:1}
  #candles .cd{transition:.3s} #candles .out{filter:grayscale(1) brightness(.4);opacity:.6}
  #relics{text-align:center;margin-top:3px;min-height:20px;display:flex;gap:5px;justify-content:center;flex-wrap:wrap;pointer-events:auto}
  #relics .rl{font-size:16px;background:#00000040;border:1px solid #0006;border-radius:8px;padding:1px 5px;line-height:1.3}
  /* ---- recompensa (escolher relíquia) ---- */
  #reward{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    background:rgba(6,16,12,.93);backdrop-filter:blur(3px);padding:22px}
  #rewardTitle{font-size:22px;font-weight:900;color:var(--gold);letter-spacing:1px;text-align:center}
  #rewardCards{display:flex;flex-direction:column;gap:12px;width:100%;max-width:340px}
  .rw{display:flex;align-items:center;gap:14px;text-align:left;cursor:pointer;
    background:linear-gradient(180deg,#241a10,#191109);border:1px solid #4a331c;border-radius:14px;padding:13px 15px;
    box-shadow:0 5px 14px #0007;transition:transform .08s,border-color .15s}
  .rw:active{transform:scale(.98)} .rw:hover{border-color:var(--gold)}
  .rw-ic{font-size:32px;flex:none;width:46px;height:46px;display:grid;place-items:center;background:#0d0a06;border-radius:10px;border:1px solid #3a2a17}
  .rw-t{display:flex;flex-direction:column;gap:2px} .rw-t b{font-size:15px;color:var(--ink)} .rw-t small{font-size:12px;color:var(--dim);line-height:1.35}
  .metaline{display:flex;justify-content:space-between;font-size:12px;font-weight:800;margin:6px 4px 4px}
  .metaline .l{color:var(--dim)} #scoreLbl{color:var(--chip)} #metaLbl{color:var(--gold)}
  #metaBar{height:12px;border-radius:8px;background:#00000055;border:1px solid #0007;overflow:hidden}
  #metaFill{height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,var(--chip),#bfe9ff);transition:width .5s cubic-bezier(.2,.9,.3,1)}
  #metaBar.done #metaFill{background:linear-gradient(90deg,#5adb84,#b9ffcf)}
  #rollsLbl{text-align:center;font-size:15px;letter-spacing:3px;margin-top:5px;filter:drop-shadow(0 1px 2px #000)}

  /* ---- leitura do combo + pontos ---- */
  #combo{position:fixed;left:0;right:0;bottom:150px;text-align:center;z-index:4;pointer-events:none;
    opacity:0;transform:translateY(8px);transition:.25s;font-size:16px;font-weight:800}
  #combo.show{opacity:1;transform:none}
  #combo b{color:var(--ink);font-size:18px} #combo .calc{color:var(--dim);font-size:13px}
  #combo em{color:var(--gold);font-style:normal;font-weight:900;font-size:18px}
  #float{position:fixed;left:0;right:0;bottom:210px;text-align:center;z-index:4;pointer-events:none;
    font-size:40px;font-weight:900;color:var(--gold);text-shadow:0 3px 0 #0008;opacity:0}
  #float.go{animation:floatUp 1s cubic-bezier(.2,.7,.3,1)}
  @keyframes floatUp{0%{opacity:0;transform:translateY(10px) scale(.8)}25%{opacity:1;transform:translateY(-10px) scale(1.1)}100%{opacity:0;transform:translateY(-60px) scale(1)}}

  #banner{position:fixed;left:0;right:0;top:44%;text-align:center;z-index:4;pointer-events:none;
    font-size:30px;font-weight:900;letter-spacing:2px;opacity:0;text-shadow:0 3px 8px #000}
  #banner.ok{color:#7be6a1} #banner.boss{color:var(--gold)} #banner.bad{color:var(--mult)}
  #banner.go{animation:bnr 1.4s ease}
  @keyframes bnr{0%{opacity:0;transform:scale(.7)}20%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}

  /* ---- barra de botões ---- */
  #bar{position:fixed;left:0;right:0;bottom:30px;z-index:5;display:flex;gap:12px;justify-content:center;padding:0 14px}
  .btn{font-family:inherit;font-weight:900;font-size:20px;letter-spacing:.5px;color:#20140a;
    background:linear-gradient(180deg,#f6cf6a,#e0a52f);border:0;border-radius:16px;padding:14px 30px 11px;cursor:pointer;
    box-shadow:0 6px 0 #9c6f16,0 8px 18px #0006;transition:transform .08s,box-shadow .08s;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:120px}
  .btn .sub{font-size:11px;font-weight:800;opacity:.85}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #9c6f16,0 4px 10px #0006}
  .btn:disabled{opacity:.45;cursor:default;box-shadow:0 6px 0 #9c6f16}
  .btn.ghost{color:#f3ead2;background:linear-gradient(180deg,#4a3826,#33261a);box-shadow:0 6px 0 #1c140c,0 8px 18px #0006}
  .btn.ghost:disabled{box-shadow:0 6px 0 #1c140c}
  #holdHint{position:fixed;left:0;right:0;bottom:104px;z-index:5;text-align:center;font-size:12px;font-weight:800;
    color:var(--gold);text-shadow:0 1px 3px #000;pointer-events:none;animation:blink 1.3s infinite}

  /* ---- caixa de diálogo ---- */
  #dlg{position:fixed;left:0;right:0;bottom:0;z-index:8;padding:14px 14px calc(env(safe-area-inset-bottom,0) + 20px);
    display:flex;gap:12px;align-items:flex-end;cursor:pointer;
    background:linear-gradient(#0000,#0b1712 22%,#0b1712)}
  #dlgPortrait{flex:none;width:76px;height:76px;border-radius:14px;position:relative;overflow:hidden;
    background:radial-gradient(120% 120% at 50% 20%, color-mix(in srgb,var(--c) 55%,#1a2620), #10201a);
    border:2px solid var(--c);box-shadow:0 4px 14px #0008}
  #dlgPortrait .pl{position:absolute;inset:0;display:grid;place-items:center;font-size:38px}
  #dlgPortrait img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  #dlgMain{flex:1;min-width:0;background:linear-gradient(180deg,#20160c,#171009);
    border:1px solid #4a331c;border-radius:14px;padding:10px 14px 12px;box-shadow:0 6px 18px #0008;position:relative}
  #dlgName{font-weight:900;font-size:14px;margin-bottom:3px}
  #dlgText{font-size:14.5px;line-height:1.35;color:#efe6d2;min-height:2.7em}
  #dlgHint{position:absolute;right:12px;bottom:8px;font-size:11px;color:#c9b58f;opacity:.8;animation:blink 1.1s infinite}
  @keyframes blink{50%{opacity:.25}}

  /* ---- tela de fim ---- */
  #end{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:rgba(6,16,12,.92);backdrop-filter:blur(3px);padding:24px;text-align:center}
  #endTitle{font-size:28px;font-weight:900;color:var(--gold);letter-spacing:1px}
  #endSub{color:var(--dim);font-size:14px;max-width:300px;line-height:1.5}
  #endBtn{margin-top:6px;font-weight:900;font-size:17px;color:#20140a;background:linear-gradient(180deg,#f6cf6a,#e0a52f);
    border:0;border-radius:14px;padding:14px 30px;cursor:pointer;box-shadow:0 5px 0 #9c6f16}
</style>

<div id="table"><canvas id="c"></canvas></div>

<div id="hud">
  <div id="stageName"></div>
  <div id="candles"></div>
  <div id="relics"></div>
  <div class="metaline"><span class="l">Pontos <span id="scoreLbl">0</span></span><span class="l">Meta <span id="metaLbl">0</span></span></div>
  <div id="metaBar"><div id="metaFill"></div></div>
  <div id="rollsLbl"></div>
</div>

<div id="float"></div>
<div id="combo"></div>
<div id="banner" class="banner"></div>

<div id="holdHint" hidden>👆 toque nos dados para segurar</div>
<div id="bar">
  <button class="btn" id="btnRoll">🎲 ROLAR</button>
  <button class="btn ghost" id="btnReroll" hidden>🔁 De novo</button>
  <button class="btn" id="btnScore" hidden>✓ Pontuar</button>
</div>

<div id="dlg" hidden>
  <div id="dlgPortrait"></div>
  <div id="dlgMain"><div id="dlgName"></div><div id="dlgText"></div><div id="dlgHint">toque ▸</div></div>
</div>

<div id="reward" hidden>
  <div id="rewardTitle">Escolha uma Relíquia</div>
  <div id="rewardCards"></div>
</div>

<div id="end" hidden>
  <div id="endTitle"></div>
  <div id="endSub"></div>
  <button id="endBtn"></button>
</div>

<script type="module" src="game.js"></script>
