<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Dados 3D — Física</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#0a2820;font-family:'Trebuchet MS',system-ui,sans-serif}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .result{position:fixed;top:22px;left:0;right:0;text-align:center;color:#f4ead2;
    font-size:20px;font-weight:900;letter-spacing:1px;text-shadow:0 2px 6px #000a;opacity:0;transition:.3s;pointer-events:none}
  .result.show{opacity:1}
  .result b{color:#f2c14e;font-size:26px}
  .btn{position:fixed;left:50%;bottom:38px;transform:translateX(-50%);
    font-family:inherit;font-weight:900;font-size:22px;letter-spacing:1px;color:#20140a;
    background:linear-gradient(180deg,#f6cf6a,#e0a52f);border:0;border-radius:18px;padding:18px 52px;cursor:pointer;
    box-shadow:0 7px 0 #9c6f16,0 10px 22px #0006;transition:transform .08s,box-shadow .08s;z-index:5}
  .btn:active{transform:translateX(-50%) translateY(5px);box-shadow:0 2px 0 #9c6f16,0 5px 12px #0006}
  .btn:disabled{opacity:.55;cursor:default}
</style>

<canvas id="c"></canvas>
<div class="result" id="result"></div>
<button class="btn" id="btn">🎲 ROLAR</button>

<script type="module">
import * as THREE from './vendor/three.module.js';
import * as CANNON from './vendor/cannon-es.js';

// ---- constantes da bandeja (unidades de mundo) ----
const TX = 3.4, TZ = 6.8;     // meia-largura (estreita p/ retrato) / profundidade
const N  = 2;                 // quantos dados
const S  = 0.9;               // meia-aresta do dado (dado = 1.8)

// ===== THREE (render) ========================================================
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#0c2f26');

const camera = new THREE.PerspectiveCamera(48, 1, 0.1, 100);
camera.position.set(0, 13.5, 13);
camera.lookAt(0, 0, 0.5);

scene.add(new THREE.AmbientLight(0xffffff, 0.62));
const key = new THREE.DirectionalLight(0xffffff, 1.15);
key.position.set(-6, 18, 8);
key.castShadow = true;
key.shadow.mapSize.set(1024,1024);
key.shadow.camera.near = 1; key.shadow.camera.far = 60;
key.shadow.camera.left=-16; key.shadow.camera.right=16; key.shadow.camera.top=16; key.shadow.camera.bottom=-16;
key.shadow.bias = -0.0004;
scene.add(key);
scene.add(new THREE.DirectionalLight(0x88ccbb, 0.25).translateX(8));

// mesa (feltro) — recebe sombra
const floorMat = new THREE.MeshStandardMaterial({ color:'#14614e', roughness:0.95, metalness:0 });
const floor = new THREE.Mesh(new THREE.PlaneGeometry((TX+2)*2,(TZ+2)*2), floorMat);
floor.rotation.x = -Math.PI/2; floor.receiveShadow = true;
scene.add(floor);
// bordas de madeira (visual)
const railMat = new THREE.MeshStandardMaterial({ color:'#3a2a17', roughness:0.8 });
function rail(w,d,x,z){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,0.8,d),railMat); m.position.set(x,0.4,z); m.castShadow=m.receiveShadow=true; scene.add(m); }
rail((TX+1)*2,0.6,0,-(TZ+0.6)); rail((TX+1)*2,0.6,0,(TZ+0.6));
rail(0.6,(TZ+1)*2,-(TX+0.6),0); rail(0.6,(TZ+1)*2,(TX+0.6),0);

// ---- textura de face (pontos) ----
function faceTexture(value){
  const s=200, cv=document.createElement('canvas'); cv.width=cv.height=s;
  const g=cv.getContext('2d');
  g.fillStyle='#f5eddb'; g.fillRect(0,0,s,s);
  g.fillStyle='#e7dcc2'; g.fillRect(0,0,s,10); g.fillRect(0,s-10,s,10); g.fillRect(0,0,10,s); g.fillRect(s-10,0,10,s);
  const P={1:[[.5,.5]],2:[[.28,.28],[.72,.72]],3:[[.28,.28],[.5,.5],[.72,.72]],
    4:[[.28,.28],[.72,.28],[.28,.72],[.72,.72]],5:[[.28,.28],[.72,.28],[.5,.5],[.28,.72],[.72,.72]],
    6:[[.28,.26],[.28,.5],[.28,.74],[.72,.26],[.72,.5],[.72,.74]]};
  for(const [x,y] of P[value]){
    g.beginPath(); g.arc(x*s,y*s,s*0.093,0,7);
    g.fillStyle='#20302a'; g.fill();
    g.beginPath(); g.arc(x*s-4,y*s-4,s*0.03,0,7); g.fillStyle='#3d4f47'; g.fill();
  }
  const t=new THREE.CanvasTexture(cv); t.colorSpace=THREE.SRGBColorSpace;
  t.anisotropy=renderer.capabilities.getMaxAnisotropy(); return t;
}
// ordem de faces do BoxGeometry: +X,-X,+Y,-Y,+Z,-Z  (opostas somam 7)
const FACE_VALUE = [1,6,2,5,3,4];
const dieMats = FACE_VALUE.map(v => new THREE.MeshStandardMaterial({ map:faceTexture(v), roughness:0.45, metalness:0.05 }));
const dieGeo  = new THREE.BoxGeometry(S*2,S*2,S*2);

// ===== CANNON (física) =======================================================
const world = new CANNON.World({ gravity:new CANNON.Vec3(0,-38,0) });
world.broadphase = new CANNON.SAPBroadphase(world);
world.allowSleep = true;
world.defaultContactMaterial.restitution = 0.3;

const mFloor = new CANNON.Material('floor');
const mDie   = new CANNON.Material('die');
const mWall  = new CANNON.Material('wall');
world.addContactMaterial(new CANNON.ContactMaterial(mDie, mFloor, { friction:0.35, restitution:0.25 }));
world.addContactMaterial(new CANNON.ContactMaterial(mDie, mDie,   { friction:0.04, restitution:0.35 }));
world.addContactMaterial(new CANNON.ContactMaterial(mDie, mWall,  { friction:0.08, restitution:0.55 }));

// chão (caixa estática, topo em y=0)
const floorBody = new CANNON.Body({ mass:0, material:mFloor, shape:new CANNON.Box(new CANNON.Vec3(TX+2,0.5,TZ+2)) });
floorBody.position.set(0,-0.5,0); world.addBody(floorBody);
// 4 paredes (caixas estáticas invisíveis)
function wall(hx,hy,hz,x,z){ const b=new CANNON.Body({mass:0,material:mWall,shape:new CANNON.Box(new CANNON.Vec3(hx,hy,hz))}); b.position.set(x,hy,z); world.addBody(b); }
wall(TX+1,3,0.5,0,-(TZ+0.6)); wall(TX+1,3,0.5,0,(TZ+0.6));
wall(0.5,3,TZ+1,-(TX+0.6),0); wall(0.5,3,TZ+1,(TX+0.6),0);

// dados: corpo + malha
const dice = [];
for(let i=0;i<N;i++){
  const body = new CANNON.Body({ mass:1, material:mDie, shape:new CANNON.Box(new CANNON.Vec3(S,S,S)) });
  body.allowSleep=true; body.sleepSpeedLimit=0.2; body.sleepTimeLimit=0.2; body.linearDamping=0.1; body.angularDamping=0.1;
  world.addBody(body);
  const mesh = new THREE.Mesh(dieGeo, dieMats);
  mesh.castShadow = mesh.receiveShadow = true;
  scene.add(mesh);
  dice.push({ body, mesh });
}

// ---- lançar ----
const btn = document.getElementById('btn');
const resultEl = document.getElementById('result');
let rolling=false, settleFrames=0, rollTimer=0;
function throwDice(){
  rolling=true; settleFrames=0;
  clearTimeout(rollTimer);
  rollTimer = setTimeout(()=>{ if(rolling){ rolling=false; dice.forEach(d=>d.body.sleep()); showResult(); } }, 5000);
  resultEl.classList.remove('show');
  dice.forEach((d,i)=>{
    const b=d.body; b.wakeUp();
    // arremesso do FUNDO da mesa em direção à câmera (desce a mesa, tipo craps)
    b.position.set((i-(N-1)/2)*1.6 + (Math.random()-0.5), 5.5+Math.random()*2.5, -TZ+1.3);
    b.quaternion.setFromEuler(Math.random()*6,Math.random()*6,Math.random()*6);
    b.velocity.set((Math.random()-0.5)*4, 1.5+Math.random()*1.5, 6+Math.random()*3);
    b.angularVelocity.set((Math.random()-0.5)*36,(Math.random()-0.5)*36,(Math.random()-0.5)*36);
    b.updateMassProperties();
  });
  btn.disabled=true;
}

// valor da face que aponta p/ CIMA de um dado assentado
const LOCAL_N = [ [new CANNON.Vec3(1,0,0),1],[new CANNON.Vec3(-1,0,0),6],[new CANNON.Vec3(0,1,0),2],
                  [new CANNON.Vec3(0,-1,0),5],[new CANNON.Vec3(0,0,1),3],[new CANNON.Vec3(0,0,-1),4] ];
function topValue(body){
  let best=-2, val=1;
  for(const [n,v] of LOCAL_N){ const w=body.quaternion.vmult(n); if(w.y>best){ best=w.y; val=v; } }
  return val;
}
function showResult(){
  const vals = dice.map(d=>topValue(d.body));
  const sum = vals.reduce((a,b)=>a+b,0);
  resultEl.innerHTML = `${vals.join(' + ')} = <b>${sum}</b>`;
  resultEl.classList.add('show');
  btn.disabled=false;
}

// ===== loop ==================================================================
const clock = new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 1/30);
  world.step(1/60, dt, 4);
  for(const d of dice){ d.mesh.position.copy(d.body.position); d.mesh.quaternion.copy(d.body.quaternion); }
  // detecção de repouso
  if(rolling){
    const asleep = dice.every(d => d.body.sleepState===CANNON.Body.SLEEPING || d.body.velocity.length()<0.12 && d.body.angularVelocity.length()<0.12);
    settleFrames = asleep ? settleFrames+1 : 0;
    if(settleFrames>16){ rolling=false; clearTimeout(rollTimer); showResult(); }
  }
  renderer.render(scene, camera);
}

function resize(){
  const w=innerWidth, h=innerHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
btn.addEventListener('click', throwDice);
tick();
throwDice();
</script>
