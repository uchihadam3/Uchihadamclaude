<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Dados 3D</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{height:100%}
  body{
    min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:60px;
    font-family:'Trebuchet MS',system-ui,sans-serif;
    background:radial-gradient(120% 90% at 50% 20%,#155345,#0a2820);
    overflow:hidden;
  }

  /* ----- palco 3D ----- */
  .scene{
    perspective:850px;perspective-origin:50% 32%;
    display:flex;align-items:center;justify-content:center;
    height:200px;
  }
  /* "câmera" inclinada: vê os dados de cima/lado → mostra profundidade do cubo */
  .board{
    transform-style:preserve-3d;
    transform:rotateX(-28deg) rotateY(-26deg);
    display:flex;gap:52px;align-items:center;
  }
  .wrap{position:relative;width:80px;height:80px;transform-style:preserve-3d}
  .cube{
    position:absolute;inset:0;
    transform-style:preserve-3d;
    transform:rotateX(0deg) rotateY(0deg);
    transition:transform 1.15s cubic-bezier(.18,.9,.24,1);
  }
  .face{
    position:absolute;inset:0;
    display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
    padding:11px;
    background:linear-gradient(145deg,#fefaf0,#d8cba7);
    border-radius:13px;
    box-shadow:inset 0 0 0 2px #b9a97e, inset 0 0 0 3px #fff7, inset 0 -8px 12px #0002;
    backface-visibility:hidden;
  }
  .pip{width:11px;height:11px;border-radius:50%;align-self:center;justify-self:center;
    background:radial-gradient(circle at 35% 30%,#3a4a44,#141d19);
    box-shadow:inset 0 1px 1px #0007, 0 1px 0 #fff8}
  /* sombra deitada no "chão" (rotateX 90 = plano horizontal) */
  .ground{position:absolute;left:50%;top:50%;width:120px;height:120px;
    transform:translate(-50%,-50%) rotateX(90deg) translateZ(-42px);
    background:radial-gradient(ellipse at center,#0007,transparent 62%);filter:blur(3px)}

  /* ----- botão ----- */
  .btn{
    font-family:inherit;font-weight:900;font-size:22px;letter-spacing:1px;color:#20140a;
    background:linear-gradient(180deg,#f6cf6a,#e0a52f);
    border:0;border-radius:18px;padding:20px 54px;cursor:pointer;
    box-shadow:0 7px 0 #9c6f16, 0 10px 20px #0005;
    transition:transform .08s, box-shadow .08s;
  }
  .btn:active{transform:translateY(5px);box-shadow:0 2px 0 #9c6f16, 0 5px 12px #0005}
  .btn:disabled{opacity:.6;cursor:default}
</style>

<div class="scene" id="scene"></div>

<button class="btn" id="btn">🎲 ROLAR</button>

<script>
  const PIPS = {1:[5],2:[1,9],3:[1,5,9],4:[1,3,7,9],5:[1,3,5,7,9],6:[1,3,4,6,7,9]};
  // como cada face é posicionada no cubo (par de faces opostas soma 7)
  const PLACE = { 1:'rotateY(0deg)', 6:'rotateY(180deg)', 3:'rotateY(90deg)',
                  4:'rotateY(-90deg)', 5:'rotateX(90deg)', 2:'rotateX(-90deg)' };
  // rotação do cubo p/ trazer cada valor de FRENTE (inverso do PLACE)
  const FACE_ROT = { 1:[0,0], 2:[90,0], 5:[-90,0], 3:[0,-90], 4:[0,90], 6:[0,-180] };
  const HALF = 40; // metade da aresta (80/2)

  function faceHTML(v){
    const on = new Set(PIPS[v]);
    let cells = '';
    for(let c=1;c<=9;c++) cells += on.has(c) ? '<span class="pip"></span>' : '<span></span>';
    return `<div class="face f-${v}" style="transform:${PLACE[v]} translateZ(${HALF}px)">${cells}</div>`;
  }

  const scene = document.getElementById('scene');
  const board = document.createElement('div');
  board.className = 'board';
  scene.appendChild(board);

  const DICE = 2;                 // quantos dados na tela
  const cubes = [];
  for(let i=0;i<DICE;i++){
    const cube = document.createElement('div');
    cube.className = 'cube';
    cube.innerHTML = [1,2,3,4,5,6].map(faceHTML).join('');
    const ground = document.createElement('div');
    ground.className = 'ground';
    const wrap = document.createElement('div');
    wrap.className = 'wrap';
    wrap.appendChild(ground); wrap.appendChild(cube);
    board.appendChild(wrap);
    cubes.push({ cube, spin: 0 });
  }

  const btn = document.getElementById('btn');
  function roll(){
    btn.disabled = true;
    for(const c of cubes){
      const val = 1 + Math.floor(Math.random()*6);
      c.spin += 4 + Math.floor(Math.random()*3);          // nº de giros (varia por dado)
      const [fx, fy] = FACE_ROT[val];
      const rx = 360*c.spin + fx;
      const ry = 360*c.spin + fy;
      c.cube.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;
    }
    setTimeout(()=>{ btn.disabled = false; }, 1150);
  }
  btn.addEventListener('click', roll);
  roll();   // rola uma vez ao abrir
</script>
