name: Deploy Grimhollow to GitHub Pages

on:
  push:
    branches:
      - claude/road-fighter-recreation-kzjegl
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages-grimhollow
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: grimhollow/package-lock.json

      - name: Install dependencies
        working-directory: grimhollow
        run: npm ci

      - name: Render prompts page (best effort)
        working-directory: grimhollow
        run: |
          python3 -m pip install --quiet --disable-pip-version-check markdown || true
          python3 scripts/render_prompts.py || echo "render de prompts falhou; usando versão commitada"

      - name: Build
        working-directory: grimhollow
        run: npm run build

      - name: Deploy to gh-pages branch (subpasta /nethergloam)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./grimhollow/dist
          publish_branch: gh-pages
          destination_dir: nethergloam
          force_orphan: true

      - name: Solicita a reconstrução do GitHub Pages
        run: |
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" \
            -w "\nHTTP %{http_code}\n" || true
