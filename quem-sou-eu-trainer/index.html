<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Quem Sou Eu? Trainer</title>
<style>
:root{
  --bg0:#0a0a16; --bg1:#12122a; --bg2:#1a1a3a; --panel:#181832;
  --mystery1:#5b4cff; --mystery2:#8a5cff; --mystery-glow:rgba(120,90,255,.45);
  --gold:#f2c94c; --gold2:#ffdf7e;
  --green:#3ddc84; --green-d:#1f7a4d;
  --red:#ff5c6c; --red-d:#7a1f2a;
  --yellow:#ffd166;
  --text:#eceaff; --muted:#9a94c4; --line:rgba(140,120,255,.18);
  --font: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:var(--font); color:var(--text);
  background:
    radial-gradient(1200px 700px at 15% -10%, rgba(120,90,255,.20), transparent 60%),
    radial-gradient(1000px 700px at 110% 10%, rgba(255,180,80,.10), transparent 55%),
    linear-gradient(180deg,var(--bg0),var(--bg1) 45%,var(--bg0));
  min-height:100vh; overflow-x:hidden;
}
#app{max-width:1180px;margin:0 auto;padding:14px 14px 60px;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--mystery1);border-radius:6px;}
::-webkit-scrollbar-track{background:transparent;}

button{font-family:inherit;cursor:pointer;border:none;outline:none;}
.btn{
  background:linear-gradient(180deg,var(--mystery2),var(--mystery1));
  color:#fff;padding:11px 18px;border-radius:12px;font-weight:700;font-size:14px;
  box-shadow:0 6px 18px rgba(90,60,255,.35), inset 0 1px 0 rgba(255,255,255,.2);
  transition:transform .12s ease, box-shadow .12s ease; letter-spacing:.2px;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(90,60,255,.5);}
.btn:active{transform:translateY(0px) scale(.98);}
.btn.ghost{background:rgba(140,120,255,.12);box-shadow:none;border:1px solid var(--line);color:var(--text);}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#3a2a00;box-shadow:0 6px 18px rgba(242,201,76,.35);}
.btn.red{background:linear-gradient(180deg,#ff8a8a,var(--red));box-shadow:0 6px 18px rgba(255,92,108,.3);}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:9px;}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}

.card{
  background:linear-gradient(180deg, rgba(30,28,58,.85), rgba(20,18,42,.85));
  border:1px solid var(--line); border-radius:16px; padding:16px;
  box-shadow:0 10px 30px rgba(0,0,0,.35);
}
.tiny{font-size:11.5px;}
.small{font-size:13px;}
.muted{color:var(--muted);}
.gold-text{color:var(--gold);}
.green-text{color:var(--green);}
.red-text{color:var(--red);}
.row{display:flex;align-items:center;}
.between{justify-content:space-between;}
.wrap{flex-wrap:wrap;}
.gap6{gap:6px;} .gap8{gap:8px;} .gap10{gap:10px;} .gap14{gap:14px;}
.center{display:flex;align-items:center;justify-content:center;}
.hidden{display:none !important;}
.chip{
  display:inline-block;background:rgba(140,120,255,.14);border:1px solid var(--line);
  border-radius:999px;padding:4px 10px;font-size:12px;color:var(--text);
}

h1,h2,h3,h4{margin:0;font-weight:800;letter-spacing:.2px;}
p{margin:0;}

/* ---------- HEADER / TOPBAR ---------- */
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 4px 16px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:10px;}
.brand .mark{
  width:38px;height:38px;border-radius:11px;
  background:linear-gradient(135deg,var(--mystery2),var(--mystery1));
  display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;
  box-shadow:0 4px 14px rgba(90,60,255,.4);
}
.brand .name{font-size:18px;font-weight:800;}
.brand .sub{font-size:11px;color:var(--muted);margin-top:-2px;}
.nav-pills{display:flex;gap:6px;flex-wrap:wrap;}
.pill{
  padding:8px 13px;border-radius:999px;background:rgba(140,120,255,.08);
  border:1px solid var(--line);color:var(--muted);font-size:12.5px;font-weight:700;
}
.pill.active{background:linear-gradient(180deg,var(--mystery2),var(--mystery1));color:#fff;border-color:transparent;}

/* ---------- HOME / MODE SELECT ---------- */
.hero-banner{
  text-align:center;padding:36px 16px 26px;
}
.hero-banner h1{font-size:clamp(26px,5vw,42px);
  background:linear-gradient(90deg,#fff,var(--gold2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero-banner p{color:var(--muted);margin-top:10px;font-size:14.5px;max-width:640px;margin-left:auto;margin-right:auto;}
.mode-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:26px;
}
.mode-card{
  cursor:pointer;position:relative;overflow:hidden;padding:20px;
  transition:transform .15s ease, box-shadow .15s ease;
}
.mode-card:hover{transform:translateY(-4px);box-shadow:0 16px 34px rgba(90,60,255,.28);}
.mode-card .ic{font-size:30px;margin-bottom:10px;display:block;}
.mode-card h3{font-size:16.5px;}
.mode-card p{color:var(--muted);font-size:12.8px;margin-top:6px;line-height:1.5;}
.mode-card .tagr{position:absolute;top:14px;right:14px;font-size:10.5px;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.08);}

/* ---------- SETUP PANEL ---------- */
.setup-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px;}
@media (max-width:640px){.setup-grid{grid-template-columns:1fr;}}
.opt-group label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;}
.opt-btns{display:flex;flex-wrap:wrap;gap:6px;}
.opt-btn{
  padding:8px 12px;border-radius:10px;background:rgba(140,120,255,.08);border:1px solid var(--line);
  color:var(--text);font-size:12.5px;font-weight:600;
}
.opt-btn.sel{background:linear-gradient(180deg,var(--mystery2),var(--mystery1));border-color:transparent;color:#fff;}

/* ---------- GAME SCREEN ---------- */
.game-wrap{display:grid;grid-template-columns:1fr 320px;gap:16px;margin-top:14px;align-items:start;}
@media (max-width:900px){.game-wrap{grid-template-columns:1fr;}}

.game-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px;}
.stat-box{padding:8px 12px;border-radius:11px;background:rgba(140,120,255,.08);border:1px solid var(--line);font-size:12px;text-align:center;min-width:64px;}
.stat-box b{display:block;font-size:16px;color:var(--gold2);}

.mystery-stage{padding:26px 20px;text-align:center;position:relative;}
.mystery-card{
  width:150px;height:200px;margin:0 auto 14px;border-radius:18px;position:relative;
  background:linear-gradient(160deg,#2a2358,#171438);
  border:2px solid var(--mystery2); box-shadow:0 0 0 6px rgba(120,90,255,.08), 0 20px 50px rgba(90,60,255,.35);
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  animation:pulseCard 3.2s ease-in-out infinite;
}
@keyframes pulseCard{0%,100%{box-shadow:0 0 0 6px rgba(120,90,255,.08),0 20px 50px rgba(90,60,255,.35);}50%{box-shadow:0 0 0 14px rgba(120,90,255,.16),0 20px 60px rgba(90,60,255,.55);}}
.mystery-card.revealed{animation:none;border-color:var(--gold);background:linear-gradient(160deg,#3a2f10,#241a05);}
.mystery-card .q-mark{font-size:56px;font-weight:900;color:var(--mystery2);text-shadow:0 0 20px var(--mystery-glow);}
.mystery-card .initials{font-size:40px;font-weight:900;color:var(--gold2);}
.mystery-card .id-name{font-size:14px;font-weight:800;margin-top:6px;padding:0 8px;text-align:center;}
.mystery-card .id-sub{font-size:10.5px;color:var(--muted);margin-top:2px;}
.mystery-title{font-size:15px;font-weight:700;color:var(--muted);margin-bottom:4px;}

.possibility-wrap{max-width:420px;margin:14px auto 0;}
.possibility-label{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-bottom:5px;}
.possibility-bar{height:10px;border-radius:999px;background:rgba(255,255,255,.06);overflow:hidden;border:1px solid var(--line);}
.possibility-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--mystery2),var(--gold2));transition:width .5s cubic-bezier(.4,0,.2,1);}

.last-answer{margin-top:16px;min-height:34px;}
.answer-bubble{
  display:inline-block;padding:9px 18px;border-radius:999px;font-weight:800;font-size:14.5px;
  animation:answerPop .35s cubic-bezier(.2,1.4,.4,1);
}
@keyframes answerPop{0%{transform:scale(.6);opacity:0;}100%{transform:scale(1);opacity:1;}}
.answer-bubble.yes{background:rgba(61,220,132,.16);color:var(--green);border:1px solid rgba(61,220,132,.4);}
.answer-bubble.no{background:rgba(255,92,108,.16);color:var(--red);border:1px solid rgba(255,92,108,.4);}
.answer-bubble.mid{background:rgba(255,209,102,.16);color:var(--yellow);border:1px solid rgba(255,209,102,.4);}

.ask-bar{margin-top:18px;display:flex;gap:8px;}
.ask-bar input{
  flex:1;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;
  padding:13px 15px;color:var(--text);font-size:14.5px;
}
.ask-bar input:focus{border-color:var(--mystery2);}
.quick-qs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.quick-q{padding:6px 11px;font-size:12px;border-radius:9px;background:rgba(140,120,255,.1);border:1px solid var(--line);color:var(--text);}
.quick-q:hover{background:rgba(140,120,255,.22);}

.coach-box{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:13px;line-height:1.5;
  border:1px solid var(--line);background:rgba(140,120,255,.06);animation:slideFade .3s ease;}
.coach-box.excellent{border-color:rgba(61,220,132,.5);background:rgba(61,220,132,.09);}
.coach-box.good{border-color:rgba(61,220,132,.3);background:rgba(61,220,132,.06);}
.coach-box.weak{border-color:rgba(255,209,102,.4);background:rgba(255,209,102,.07);}
.coach-box.redundant, .coach-box.ambiguous, .coach-box.bad{border-color:rgba(255,92,108,.4);background:rgba(255,92,108,.07);}
@keyframes slideFade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.q-tag{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:999px;margin-right:6px;text-transform:uppercase;letter-spacing:.3px;}
.q-tag.excellent{background:var(--green);color:#04321b;}
.q-tag.good{background:rgba(61,220,132,.3);color:var(--green);}
.q-tag.weak{background:rgba(255,209,102,.3);color:var(--yellow);}
.q-tag.redundant,.q-tag.ambiguous,.q-tag.bad{background:rgba(255,92,108,.3);color:var(--red);}

/* side panel */
.side-panel{display:flex;flex-direction:column;gap:12px;}
.history-list{max-height:260px;overflow-y:auto;display:flex;flex-direction:column-reverse;gap:8px;padding-right:4px;}
.hist-item{padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid var(--line);font-size:12.5px;animation:slideFade .3s ease;}
.hist-item .q{font-weight:700;}
.hist-item .a{margin-top:3px;}
.suggest-item{padding:9px 11px;border-radius:10px;background:rgba(140,120,255,.07);border:1px solid var(--line);margin-top:8px;cursor:pointer;transition:background .15s;}
.suggest-item:hover{background:rgba(140,120,255,.16);}
.suggest-item .lbl{font-size:10px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;}
.suggest-item .qt{font-size:13px;font-weight:700;margin-top:3px;}
.suggest-item .why{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.4;}
.suggest-item.segura .lbl{color:var(--green);}
.suggest-item.agressiva .lbl{color:var(--gold);}
.suggest-item.criativa .lbl{color:var(--mystery2);}

/* ---------- REPORT / REVIEW ---------- */
.grade-badge{
  width:88px;height:88px;border-radius:20px;display:flex;align-items:center;justify-content:center;
  font-size:44px;font-weight:900;margin:0 auto 8px;
  background:linear-gradient(160deg,var(--gold2),var(--gold));color:#3a2a00;
  box-shadow:0 10px 26px rgba(242,201,76,.4);
}
.grade-badge.low{background:linear-gradient(160deg,#ff9a9a,var(--red));color:#3a0a0a;box-shadow:0 10px 26px rgba(255,92,108,.35);}
.grade-badge.mid{background:linear-gradient(160deg,#a9a4ff,var(--mystery2));color:#160a3a;box-shadow:0 10px 26px rgba(120,90,255,.35);}
.report-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px;}
@media (max-width:640px){.report-cols{grid-template-columns:1fr;}}
.review-step{padding:10px 12px;border-radius:11px;background:rgba(255,255,255,.03);border:1px solid var(--line);margin-bottom:8px;}

/* ---------- STATS ---------- */
.stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:14px;}
.stat-card{padding:16px;text-align:center;}
.stat-card .val{font-size:26px;font-weight:900;color:var(--gold2);}
.stat-card .lbl{font-size:11.5px;color:var(--muted);margin-top:4px;}
.bar-row{display:flex;align-items:center;gap:10px;margin-top:8px;}
.bar-row .lb{width:110px;font-size:12px;color:var(--muted);flex-shrink:0;}
.bar-track{flex:1;height:9px;border-radius:999px;background:rgba(255,255,255,.06);overflow:hidden;}
.bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--mystery2),var(--gold2));}
.bar-val{width:34px;text-align:right;font-size:11.5px;color:var(--muted);}

/* ---------- ACHIEVEMENTS ---------- */
.ach-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:14px;}
.ach-card{padding:14px;opacity:.4;filter:grayscale(1);}
.ach-card.unlocked{opacity:1;filter:none;border-color:rgba(242,201,76,.5);}
.ach-card .ic{font-size:24px;}
.ach-card h4{font-size:13.5px;margin-top:6px;}
.ach-card p{font-size:11.5px;color:var(--muted);margin-top:3px;}

/* ---------- LESSONS ---------- */
.lesson-nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.lesson-dot{width:30px;height:30px;border-radius:9px;background:rgba(140,120,255,.1);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--muted);}
.lesson-dot.active{background:linear-gradient(180deg,var(--mystery2),var(--mystery1));color:#fff;border-color:transparent;}
.lesson-dot.done{color:var(--green);border-color:var(--green);}
.example-line{padding:7px 10px;border-radius:8px;background:rgba(255,255,255,.03);margin-top:6px;font-size:13px;}
.example-line.good{border-left:3px solid var(--green);}
.example-line.bad{border-left:3px solid var(--red);}
.quiz-opt{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.04);
  border:1px solid var(--line);color:var(--text);margin-top:7px;font-size:13px;}
.quiz-opt:hover{background:rgba(140,120,255,.12);}
.quiz-opt.correct{background:rgba(61,220,132,.18);border-color:var(--green);}
.quiz-opt.wrong{background:rgba(255,92,108,.18);border-color:var(--red);}

/* ---------- FX ---------- */
#fx-layer{position:fixed;inset:0;pointer-events:none;z-index:999;}
.confetti-piece{position:absolute;width:8px;height:8px;top:-10px;opacity:.9;animation:confettiFall linear forwards;}
@keyframes confettiFall{to{transform:translateY(110vh) rotate(600deg);opacity:0;}}
.flash-red{position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,rgba(255,60,70,.35),rgba(0,0,0,.55));
  z-index:998;animation:flashOut 1.1s ease forwards;pointer-events:none;}
@keyframes flashOut{0%{opacity:0;}15%{opacity:1;}100%{opacity:0;}}
.great-q-fx{position:fixed;left:50%;top:78px;transform:translateX(-50%);z-index:998;font-weight:800;font-size:14.5px;
  color:var(--green);background:rgba(10,20,15,.85);border:1px solid rgba(61,220,132,.5);padding:8px 16px;border-radius:999px;
  box-shadow:0 8px 24px rgba(61,220,132,.3);animation:greatFx 1.5s ease forwards;pointer-events:none;white-space:nowrap;}
@keyframes greatFx{0%{opacity:0;transform:translateX(-50%) translateY(-8px) scale(.9);}15%{opacity:1;transform:translateX(-50%) translateY(0) scale(1);}80%{opacity:1;}100%{opacity:0;transform:translateX(-50%) translateY(-10px) scale(1);}}

.streak-flame{font-size:13px;}
footer.credit{text-align:center;color:var(--muted);font-size:11px;margin-top:30px;opacity:.6;}
@media (max-width:640px){
  .mystery-card{width:120px;height:160px;}
  .ask-bar input{padding:14px 14px;font-size:16px;}
  .btn{padding:13px 16px;}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="fx-layer"></div>
<script>
'use strict';
/* =========================================================================
   QUEM SOU EU? TRAINER — arquivo único (sem bundler): dados, motor de
   perguntas, treinador, pontuação, storage e UI, tudo em JS puro.
   Organizado em seções que espelham os módulos do briefing original.
   ========================================================================= */

/* ===================== data/identities.ts (equivalente) ===================== */
function I(id,name,aliases,type,o){
  return Object.assign({
    id,name,aliases,type,
    human:true,gender:'unknown',alive:'unknown',nationality:undefined,
    era:'moderna',area:'geral',franchise:undefined,
    role:(type==='real'?'real':'coadjuvante'),
    fights:false,powers:false,popularity:50,difficulty:'medium',
    tags:[],desc:''
  },o);
}

const RAW_IDENTITIES = [
// ---------- ANIME ----------
I('goku','Goku',['Son Goku','Kakarotto'],'fictional',{human:false,gender:'male',alive:true,area:'anime',franchise:'Dragon Ball',role:'protagonista',fights:true,powers:true,era:'seculo20',popularity:97,difficulty:'easy',tags:['luta','poderes','cabelo espetado','saiyajin'],desc:'Guerreiro saiyajin que defende a Terra buscando sempre ficar mais forte.'}),
I('naruto','Naruto Uzumaki',['Naruto'],'fictional',{human:true,gender:'male',alive:true,area:'anime',franchise:'Naruto',role:'protagonista',fights:true,powers:true,era:'seculo20',popularity:96,difficulty:'easy',tags:['ninja','poderes','loiro','bandana'],desc:'Ninja loiro e hiperativo que sonha em se tornar líder da sua vila.'}),
I('luffy','Monkey D. Luffy',['Luffy'],'fictional',{human:true,gender:'male',alive:true,area:'anime',franchise:'One Piece',role:'protagonista',fights:true,powers:true,era:'seculo20',popularity:95,difficulty:'easy',tags:['pirata','chapéu de palha','elástico'],desc:'Pirata de corpo elástico em busca do maior tesouro dos mares.'}),
I('sasuke','Sasuke Uchiha',['Sasuke'],'fictional',{human:true,gender:'male',alive:true,area:'anime',franchise:'Naruto',role:'coadjuvante',fights:true,powers:true,era:'seculo20',popularity:88,difficulty:'medium',tags:['ninja','vingança','olhos especiais'],desc:'Ninja prodígio movido por vingança contra o próprio irmão.'}),
I('ichigo','Ichigo Kurosaki',['Ichigo'],'fictional',{human:true,gender:'male',alive:true,area:'anime',franchise:'Bleach',role:'protagonista',fights:true,powers:true,era:'seculo20',popularity:80,difficulty:'medium',tags:['espada','shinigami','cabelo laranja'],desc:'Estudante que ganha poderes de shinigami para proteger espíritos.'}),
I('light','Light Yagami',['Light'],'fictional',{human:true,gender:'male',alive:false,area:'anime',franchise:'Death Note',role:'vilao',fights:false,powers:true,era:'moderna',popularity:82,difficulty:'hard',tags:['caderno','gênio','assassino'],desc:'Estudante genial que usa um caderno sobrenatural para matar criminosos.'}),
I('l','L',['L Lawliet'],'fictional',{human:true,gender:'male',alive:false,area:'anime',franchise:'Death Note',role:'coadjuvante',fights:false,powers:false,era:'moderna',popularity:75,difficulty:'hard',tags:['detetive','doces','gênio'],desc:'Detetive excêntrico e brilhante que investiga assassinatos misteriosos.'}),

/* palavras subjetivas: só entram em jogo se nada do banco casou — a IA aponta que a
   pergunta é ambígua em vez de arriscar uma resposta que pode confundir o jogador. */
const SUBJECTIVE_WORDS = ['famoso','famosa','forte','fraco','fraca','bonito','bonita','feio','feia','legal','otimo','otima','pessimo','pessima','bom','ruim','melhor','pior','importante','popular','antigo','antiga','do bem','do mal','malvado','malvada','poderoso','poderosa'];

function normalizeQ(s){
  return (s||'').toString().normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^\w\s?']/g,' ').replace(/\s+/g,' ').trim();
}
function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}

/* ===================== logic/questionAnalyzer.ts (equivalente) ===================== */
function matchQuestion(raw){
  const norm=normalizeQ(raw);
  if(!norm) return {kind:'unclear'};
  // 1) o jogador está citando um nome? tratamos como tentativa de chute (prioridade máxima)
  let bestGuess=null;
  for(const idt of RAW_IDENTITIES){
    const names=[idt.name,...idt.aliases];
    for(const n of names){
      const nn=normalizeQ(n);
      if(nn.length<3) continue;
      const re=new RegExp('\\b'+escRe(nn)+'\\b');
      if(re.test(norm)){
        if(!bestGuess||nn.length>bestGuess.len) bestGuess={id:idt.id,len:nn.length};
      }
    }
  }
  if(bestGuess) return {kind:'guess', identityId:bestGuess.id};

  // 2) casar com o banco de perguntas por frases-chave
  let best=null,bestScore=0;
  QUESTION_BANK.forEach(q=>{
    let score=0;
    q.kw.forEach(k=>{
      const re=new RegExp('\\b'+escRe(k)+'\\b');
      if(re.test(norm)) score+=k.split(' ').length;
    });
    if(score>bestScore){bestScore=score;best=q;}
  });
  if(best) return {kind:'question', question:best};

  // 3) pergunta subjetiva conhecida
  const found = SUBJECTIVE_WORDS.find(w=>new RegExp('\\b'+escRe(w)+'\\b').test(norm));
  if(found) return {kind:'ambiguous'};

  return {kind:'unclear'};
}

function coachFor(quality,type,before,after,mixedCategory){
  if(type==='guess'){
    if(quality==='win') return 'Aí sim! Você fechou o cerco e acertou.';
    if(quality==='bad') return 'Chute muito cedo — ainda restavam '+before+' candidatos possíveis. Antes de arriscar um nome, tente afunilar mais com perguntas de categoria e área.';
    if(quality==='weak') return 'Ainda dava pra afunilar mais antes de chutar, mas o risco não foi tão alto.';
    return 'Bom momento pra chutar — o campo já estava pequeno ('+before+' candidatos).';
  }
  if(quality==='ambiguous') return 'Essa pergunta é subjetiva e pode ter respostas diferentes dependendo de quem responde. Tente perguntar algo objetivo e verificável.';
  if(quality==='redundant') return 'Essa pergunta não trouxe informação nova — todos os '+before+' candidatos restantes já compartilhavam essa resposta. Tente uma pergunta que realmente divida o campo.';
  if(quality==='excellent'){
    const extra = mixedCategory? '' : ' Ótima escolha para este momento da partida.';
    return 'Excelente pergunta! Ela cortou o campo de '+before+' para '+after+' candidatos — quase pela metade.'+extra;
  }
  if(quality==='good'){
    let msg='Boa pergunta, reduziu de '+before+' para '+after+' candidatos.';
    if(mixedCategory && type!=='category') msg+=' Uma pergunta ainda melhor agora seria descobrir se é real ou fictício — isso costuma dividir o campo de forma mais equilibrada.';
    return msg;
  }
  if(type==='specific' && before>35) return 'Essa pergunta é específica demais para este momento — o campo ainda tem '+before+' candidatos. Primeiro descubra a categoria ampla (real/fictício, área) antes de perguntar detalhes assim.';
  return 'Pergunta fraca neste momento: só reduziu de '+before+' para '+after+' candidatos. '+(mixedCategory?'Você ainda não sabe se é real ou fictício — perguntar isso agora seria mais eficiente.':'Tente uma pergunta que separe melhor os candidatos restantes.');
}

function analyzeQuestion(text,state){
  const match=matchQuestion(text);
  const secret=state.identity;
  const poolBefore=state.candidates.slice();
  const mixedCategory = new Set(poolBefore.map(c=>c.type==='real'?'real':'fictional')).size>1;
  const result={rawText:text};

  if(match.kind==='unclear'){
    Object.assign(result,{answer:'Não sei responder com segurança. Tente reformular a pergunta de um jeito mais direto.',
      quality:'weak',questionType:'unclear',
      coaching:'Tente perguntas mais diretas, como "É uma pessoa real?" ou cite uma característica clara.',
      poolBefore:poolBefore.length,poolAfter:poolBefore.length});
    result.betterAlternative=bestAlternativeQuestion(poolBefore,null);
    result.nextSuggestions=nextSuggestions(state,3);
    return result;
  }
  if(match.kind==='ambiguous'){
    Object.assign(result,{answer:'Pergunta ambígua. Tente reformular.',quality:'ambiguous',questionType:'subjective',
      coaching:coachFor('ambiguous','subjective',poolBefore.length,poolBefore.length,mixedCategory),
      poolBefore:poolBefore.length,poolAfter:poolBefore.length});
    result.betterAlternative=bestAlternativeQuestion(poolBefore,null);
    result.nextSuggestions=nextSuggestions(state,3);
    return result;
  }
  if(match.kind==='guess'){
    const guessed=IDMAP[match.identityId];
    const correct = guessed.id===secret.id;
    result.questionType='guess'; result.guessedName=guessed.name;
    if(correct){
      result.answer='Sim! Você acertou — era '+secret.name+'!';
      result.quality='win'; result.win=true;
      state.won=true; state.finished=true;
      result.poolBefore=poolBefore.length; result.poolAfter=1;
    } else {
      result.answer='Não, não era '+guessed.name+'.';
      state.candidates=poolBefore.filter(c=>c.id!==guessed.id);
      result.quality = poolBefore.length>15?'bad':(poolBefore.length>4?'weak':'good');
      result.wrongGuess=true;
      result.poolBefore=poolBefore.length; result.poolAfter=state.candidates.length;
    }
    result.coaching=coachFor(result.quality,'guess',poolBefore.length,result.poolAfter,mixedCategory);
    result.nextSuggestions = correct?[]:nextSuggestions(state,3);
    return result;
  }

  const q=match.question;
  const answerBool = q.test(secret);
  const poolAfter = poolBefore.filter(c=>q.test(c)===answerBool);
  const reduction = poolBefore.length>0 ? 1-(poolAfter.length/poolBefore.length) : 0;
  state.candidates=poolAfter;

  let quality;
  if(poolBefore.length<=1) quality='weak';
  else if(reduction===0) quality='redundant';
  else if(q.type==='specific' && poolBefore.length>35) quality='weak';
  else if(reduction>=0.35 && reduction<=0.65) quality='excellent';
  else if(reduction>=0.15) quality='good';
  else quality='weak';
  if(mixedCategory && q.type!=='category' && quality==='excellent') quality='good';

  result.questionType=q.type; result.questionId=q.id;
  result.answer = answerBool? 'Sim.' : 'Não.';
  result.quality=quality;
  result.poolBefore=poolBefore.length; result.poolAfter=poolAfter.length;
  result.coaching=coachFor(quality,q.type,poolBefore.length,poolAfter.length,mixedCategory);
  if(['weak','redundant','bad'].includes(quality)) result.betterAlternative=bestAlternativeQuestion(poolBefore,q.id);
  result.nextSuggestions=nextSuggestions(state,3);
  return result;
}
function bestAlternativeQuestion(pool,excludeId){
  const scored = QUESTION_BANK.filter(q=>q.id!==excludeId).map(q=>({q,...estimateReduction(q,pool)})).filter(x=>x.yes>0&&x.no>0);
  scored.sort((a,b)=>b.reduction-a.reduction);
  return scored[0]? scored[0].q.text : null;
}

/* ===================== logic/trainer.ts — sugestão de próximas perguntas ===================== */
function estimateReduction(q,pool){
  if(!pool.length) return {reduction:0,yes:0,no:0};
  let yes=0; pool.forEach(c=>{if(q.test(c))yes++;});
  const no=pool.length-yes;
  return {reduction:(Math.min(yes,no)/pool.length)*2, yes, no};
}
function nextSuggestions(state,n){
  const pool=state.candidates;
  if(pool.length<=1){
    return [{label:'segura',text:'Chute o nome agora!',why:'Só resta '+pool.length+' candidato possível — é hora de arriscar a resposta final.'}];
  }
  const scored = QUESTION_BANK.map(q=>({q,...estimateReduction(q,pool)})).filter(x=>x.yes>0 && x.no>0);
  scored.sort((a,b)=>b.reduction-a.reduction);
  const used=new Set(); const picks=[];
  const pickByType=(types)=>scored.find(x=>!used.has(x.q.id) && types.includes(x.q.type));
  const segura = pickByType(['category']) || scored.find(x=>!used.has(x.q.id));
  if(segura){picks.push({q:segura.q,label:'segura',why:'Divide bem o campo restante ('+segura.yes+' x '+segura.no+') e é uma pergunta simples de responder.'});used.add(segura.q.id);}
  const agressiva = pickByType(['media','role']) || scored.find(x=>!used.has(x.q.id));
  if(agressiva){picks.push({q:agressiva.q,label:'agressiva',why:'Aposta em uma área ou papel específico que pode confirmar bastante coisa de uma vez.'});used.add(agressiva.q.id);}
  const criativa = pickByType(['specific']) || scored.find(x=>!used.has(x.q.id));
  if(criativa){picks.push({q:criativa.q,label:'criativa',why:'Explora uma característica que poucos pensariam em perguntar agora, mas pode economizar perguntas.'});used.add(criativa.q.id);}
  return picks.slice(0,n).map(p=>({label:p.label,text:p.q.text,why:p.why}));
}

/* ===================== logic/gameEngine.ts ===================== */
function pickPool(difficulty,category){
  return RAW_IDENTITIES.filter(d=>{
    if(category && category!=='todos'){
      if(category==='ficticio'){ if(d.type==='real') return false; }
      else if(category==='real'){ if(d.type!=='real') return false; }
      else if(category==='brasil'){ if(d.nationality!=='Brasil') return false; }
      else { if(d.area!==category) return false; }
    }
    if(difficulty && difficulty!=='todas'){ if(d.difficulty!==difficulty) return false; }
    return true;
  });
}
function initGame(opts){
  const pool = pickPool(opts.difficulty,opts.category);
  const usablePool = pool.length? pool : RAW_IDENTITIES;
  const secret = opts.forcedIdentity || usablePool[Math.floor(Math.random()*usablePool.length)];
  return {
    mode:opts.mode, difficulty:opts.difficulty||'todas', category:opts.category||'todos',
    identity:secret, candidates:usablePool.slice(), initialCount:usablePool.length,
    log:[], hintsUsed:0, startTime:Date.now(), finished:false, won:false,
    maxQuestions:opts.maxQuestions||null, timeLimit:opts.timeLimit||null,
  };
}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function dailyIdentityForDate(dateStr){
  let h=0; for(let i=0;i<dateStr.length;i++){h=(h*31+dateStr.charCodeAt(i))>>>0;}
  return RAW_IDENTITIES[h % RAW_IDENTITIES.length];
}

/* ===================== logic/scoring.ts ===================== */
function gradeMatch(state){
  const counts={excellent:0,good:0,weak:0,redundant:0,ambiguous:0,bad:0};
  state.log.forEach(l=>{ if(counts[l.quality]!==undefined) counts[l.quality]++; });
  const used=state.log.length;
  const par=Math.max(4,Math.ceil(Math.log2(Math.max(2,state.initialCount)))+2);
  const base = state.won?60:15;
  let effScore=Math.max(-25,Math.min(25,(par-used)*4));
  let qualityScore=counts.excellent*6+counts.good*3-counts.redundant*4-counts.ambiguous*4-counts.bad*5-counts.weak*1;
  qualityScore=Math.max(-30,Math.min(30,qualityScore));
  const hintPenalty=-(state.hintsUsed||0)*4;
  let score=base+effScore+qualityScore+hintPenalty;
  score=Math.max(0,Math.min(100,Math.round(score)));
  const grade= score>=90?'S':score>=78?'A':score>=62?'B':score>=45?'C':score>=25?'D':'E';
  return {score,grade,counts,used,par};
}

/* ===================== logic/storage.ts ===================== */
const STORAGE_KEY='qse_trainer_profile_v1';
function defaultProfile(){return {matches:[],stats:{played:0,wins:0,losses:0,totalQuestionsWin:0,bestQuestions:null,bestScore:0,gradeCounts:{},categoryCounts:{},excellentQs:0,goodQs:0,weakQs:0,ambiguousQs:0,redundantQs:0,badQs:0},achievements:{},daily:{lastDate:null,streak:0,history:{}}};}
function loadProfile(){
  try{const raw=localStorage.getItem(STORAGE_KEY); if(!raw) return defaultProfile();
    const p=JSON.parse(raw); const d=defaultProfile();
    return Object.assign(d,p,{stats:Object.assign(d.stats,p.stats),daily:Object.assign(d.daily,p.daily)});
  }catch(e){return defaultProfile();}
}
function saveProfile(p){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(p));}catch(e){}}
function recordMatch(profile,state,gradeResult){
  const counts=gradeResult.counts;
  profile.stats.played++;
  if(state.won){profile.stats.wins++; profile.stats.totalQuestionsWin+=gradeResult.used; if(profile.stats.bestQuestions===null||gradeResult.used<profile.stats.bestQuestions) profile.stats.bestQuestions=gradeResult.used;}
  else profile.stats.losses++;
  if(gradeResult.score>profile.stats.bestScore) profile.stats.bestScore=gradeResult.score;
  profile.stats.gradeCounts[gradeResult.grade]=(profile.stats.gradeCounts[gradeResult.grade]||0)+1;
  const cat=state.identity.area;
  profile.stats.categoryCounts[cat]=(profile.stats.categoryCounts[cat]||0)+1;
  profile.stats.excellentQs+=counts.excellent; profile.stats.goodQs+=counts.good; profile.stats.weakQs+=counts.weak;
  profile.stats.ambiguousQs+=counts.ambiguous; profile.stats.redundantQs+=counts.redundant; profile.stats.badQs+=counts.bad;
  profile.matches.push({date:Date.now(),won:state.won,identity:state.identity.name,area:cat,difficulty:state.difficulty,questions:gradeResult.used,score:gradeResult.score,grade:gradeResult.grade,mode:state.mode});
  if(profile.matches.length>200) profile.matches=profile.matches.slice(-200);
  return profile;
}

/* ===================== helpers de exibição ===================== */
function escapeHtml(s){return (s||'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function escapeAttr(s){return (s||'').toString().replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
const AREA_LABELS={anime:'Anime',jogos:'Jogo',cinema:'Cinema',series:'Série',desenho:'Desenho',quadrinhos:'Quadrinhos',futebol:'Futebol',basquete:'Basquete',automobilismo:'Automobilismo',natacao:'Natação',atletismo:'Atletismo',boxe:'Boxe',tenis:'Tênis',musica:'Música',politica:'Política',historia:'História',internet:'Internet',literatura:'Literatura',mitologia:'Mitologia',mascote:'Mascote',geral:'Geral'};
function areaLabel(v){return AREA_LABELS[v]||v||'-';}
const DIFF_LABELS={todas:'Todas',easy:'Fácil',medium:'Médio',hard:'Difícil',expert:'Especialista'};
function difficultyLabel(v){return DIFF_LABELS[v]||v;}
const QUALITY_LABELS={excellent:'Excelente',good:'Boa',weak:'Fraca',redundant:'Redundante',ambiguous:'Ambígua',bad:'Chute cedo',win:'Vitória!'};
function qualityLabel(v){return QUALITY_LABELS[v]||v;}
const SUGGEST_LABELS={segura:'Segura',agressiva:'Agressiva',criativa:'Criativa'};
function labelName(v){return SUGGEST_LABELS[v]||v;}
function initialsOf(name){const parts=(name||'').replace(/[()]/g,'').split(' ').filter(Boolean);return ((parts[0]||'')[0]||'').toUpperCase()+((parts[1]||'')[0]||'').toUpperCase();}

function renderReport(){
  const st=APP.game; const g=st.gradeResult||gradeMatch(st); const c=g.counts;
  const strengths=[],weaknesses=[];
  if(c.excellent>0) strengths.push('Fez '+c.excellent+' pergunta(s) excelente(s), cortando o campo quase pela metade.');
  if(c.good>0) strengths.push('Fez '+c.good+' boa(s) pergunta(s) que ajudaram a afunilar direito.');
  if(st.won && g.used<=6) strengths.push('Resolveu com poucas perguntas — sinal de boa estratégia de funil.');
  if(c.bad===0) strengths.push('Evitou chutes muito cedo.');
  if(!strengths.length) strengths.push('Você completou a partida — todo jogo é treino.');
  if(c.redundant>0) weaknesses.push(c.redundant+' pergunta(s) redundante(s), que não trouxeram informação nova.');
  if(c.ambiguous>0) weaknesses.push(c.ambiguous+' pergunta(s) ambígua(s)/subjetiva(s).');
  if(c.bad>0) weaknesses.push(c.bad+' chute(s) muito cedo, com o campo ainda grande.');
  if(c.weak>2) weaknesses.push('Várias perguntas fracas — tente pensar em categorias amplas antes de detalhes.');
  if(!weaknesses.length) weaknesses.push('Nenhum ponto fraco notável dessa vez — ótima partida!');
  const gradeClass = (g.grade==='S'||g.grade==='A')?'':((g.grade==='B'||g.grade==='C')?'mid':'low');
  return topbarHtml('home')+`
  <div class="card" style="max-width:760px;margin:16px auto 0;text-align:center">
    <div class="grade-badge ${gradeClass}">${g.grade}</div>
    <h2>${st.won?'Você acertou!':'Não dessa vez.'}</h2>
    <p class="muted small mt6">A identidade era <b class="gold-text">${escapeHtml(st.identity.name)}</b>. ${st.won?'Você usou '+g.used+' pergunta(s). Nota: '+g.score+'/100.':''}</p>
    <div class="report-cols">
      <div class="card" style="background:rgba(61,220,132,.06);border-color:rgba(61,220,132,.3)">
        <b class="green-text">Pontos fortes</b>
        <ul style="margin:8px 0 0;padding-left:18px;font-size:13px;line-height:1.6;text-align:left">${strengths.map(s=>`<li>${s}</li>`).join('')}</ul>
      </div>
      <div class="card" style="background:rgba(255,92,108,.06);border-color:rgba(255,92,108,.3)">
        <b class="red-text">Pontos a melhorar</b>
        <ul style="margin:8px 0 0;padding-left:18px;font-size:13px;line-height:1.6;text-align:left">${weaknesses.map(s=>`<li>${s}</li>`).join('')}</ul>
      </div>
    </div>
    <div class="row gap10 wrap" style="justify-content:center;margin-top:20px">
      <button class="btn ghost" data-action="openReview">Ver revisão passo a passo</button>
      <button class="btn" data-action="goSetup" data-arg="${st.mode==='daily'?'livre':st.mode}">Jogar de novo</button>
      <button class="btn ghost" data-action="goHome">Início</button>
    </div>
    ${(APP.lastUnlocked&&APP.lastUnlocked.length)?achievementToastHtml(APP.lastUnlocked):''}
  </div>`;
}
function reviewStepHtml(l,i){
  const alt=l.betterAlternative?`<p class="tiny muted mt6" style="margin-top:6px">Pergunta melhor nesse momento: <b class="gold-text">${l.betterAlternative}</b></p>`:'';
  return `<div class="review-step">
    <div class="row between"><b>${i+1}. ${escapeHtml(l.rawText)}</b><span class="q-tag ${l.quality}">${qualityLabel(l.quality)}</span></div>
    <p class="small mt6" style="margin-top:4px">${answerBubbleHtml(l)}</p>
    <p class="tiny muted mt6" style="margin-top:4px">${l.coaching}</p>
    ${alt}
  </div>`;
}
function renderReview(){
  const st=APP.game;
  return topbarHtml('home')+`
  <div class="card" style="max-width:760px;margin:16px auto 0">
    <div class="row between"><h2>Revisão da partida</h2><button class="btn ghost sm" data-action="backReport">Voltar ao relatório</button></div>
    <p class="small muted mt6">A identidade era <b class="gold-text">${escapeHtml(st.identity.name)}</b>.</p>
    <div style="margin-top:14px">${st.log.map(reviewStepHtml).join('')}</div>
  </div>`;
}
function qualityBar(label,val,total,color){
  const pct=total?Math.round(val/total*100):0;
  return `<div class="bar-row"><div class="lb">${label}</div><div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div><div class="bar-val">${val}</div></div>`;
}
function renderStats(){
  const s=APP.profile.stats;
  const winRate=s.played?Math.round(s.wins/s.played*100):0;
  const avgQ=s.wins?(s.totalQuestionsWin/s.wins).toFixed(1):'-';
  const totalQ=s.excellentQs+s.goodQs+s.weakQs+s.ambiguousQs+s.redundantQs+s.badQs;
  const catEntries=Object.entries(s.categoryCounts).sort((a,b)=>b[1]-a[1]);
  const bestCat=catEntries[0]?areaLabel(catEntries[0][0]):'-';
  const worstCat=catEntries.length>1?areaLabel(catEntries[catEntries.length-1][0]):'-';
  return topbarHtml('stats')+`
  <h2 style="margin-top:14px">Estatísticas</h2>
  <div class="stat-cards">
    <div class="card stat-card"><div class="val">${s.played}</div><div class="lbl">Partidas</div></div>
    <div class="card stat-card"><div class="val">${s.wins}</div><div class="lbl">Vitórias</div></div>
    <div class="card stat-card"><div class="val">${winRate}%</div><div class="lbl">Taxa de acerto</div></div>
    <div class="card stat-card"><div class="val">${avgQ}</div><div class="lbl">Média perguntas p/ vitória</div></div>
    <div class="card stat-card"><div class="val">${s.bestQuestions??'-'}</div><div class="lbl">Melhor partida</div></div>
    <div class="card stat-card"><div class="val">${s.bestScore}</div><div class="lbl">Melhor nota</div></div>
  </div>
  <div class="card" style="margin-top:14px">
    <b>Qualidade das perguntas</b>
    <div style="margin-top:10px">
      ${qualityBar('Excelentes',s.excellentQs,totalQ,'var(--green)')}
      ${qualityBar('Boas',s.goodQs,totalQ,'var(--mystery2)')}
      ${qualityBar('Fracas',s.weakQs,totalQ,'var(--yellow)')}
      ${qualityBar('Ambíguas',s.ambiguousQs,totalQ,'var(--red)')}
      ${qualityBar('Redundantes',s.redundantQs,totalQ,'var(--red)')}
    </div>
  </div>
  <div class="card" style="margin-top:14px">
    <b>Categorias jogadas</b>
    <p class="tiny muted mt6" style="margin-top:6px">Melhor categoria: <b class="gold-text">${bestCat}</b> · Menos jogada: ${worstCat}</p>
    <div style="margin-top:8px">${catEntries.slice(0,8).map(([k,v])=>qualityBar(areaLabel(k),v,catEntries[0]?catEntries[0][1]:1,'var(--mystery2)')).join('')||'<p class="tiny muted">Jogue partidas pra ver seu histórico por categoria.</p>'}</div>
  </div>
  <div class="card" style="margin-top:14px">
    <b>Últimas partidas</b>
    <div class="history-list" style="max-height:220px;margin-top:10px">
      ${APP.profile.matches.length? APP.profile.matches.slice(-10).reverse().map(m=>`<div class="hist-item"><div class="q">${m.won?'✅':'❌'} ${escapeHtml(m.identity)} <span class="tiny muted">(${areaLabel(m.area)})</span></div><div class="a tiny muted">${m.questions} perguntas · nota ${m.grade}</div></div>`).join('') : '<p class="tiny muted">Nenhuma partida registrada ainda.</p>'}
    </div>
  </div>`;
}
function renderAchievements(){
  return topbarHtml('achievements')+`
  <h2 style="margin-top:14px">Conquistas</h2>
  <div class="ach-grid">
    ${ACHIEVEMENTS.map(a=>{const unlocked=!!APP.profile.achievements[a.id];return `<div class="card ach-card ${unlocked?'unlocked':''}"><span class="ic">${a.ic}</span><h4>${a.name}</h4><p>${a.desc}</p></div>`;}).join('')}
  </div>`;
}
function quizHtml(l){
  const answered=APP.quizAnswered[l.id];
  return `<div class="card" style="margin-top:14px;background:rgba(140,120,255,.06)">
    <b>🧩 Pergunta rápida</b>
    <p class="small mt6" style="margin-top:6px">${l.quiz.q}</p>
    <div style="margin-top:6px">
      ${l.quiz.options.map((o,i)=>{
        let cls='quiz-opt';
        if(answered!==undefined){ if(i===answered && o.ok) cls+=' correct'; else if(i===answered && !o.ok) cls+=' wrong'; else if(o.ok) cls+=' correct'; }
        return `<button class="${cls}" data-action="answerQuiz" data-arg="${l.id}:${i}" ${answered!==undefined?'disabled':''}>${o.t}</button>`;
      }).join('')}
    </div>
    ${answered!==undefined?`<p class="tiny muted mt6" style="margin-top:8px">${l.quiz.options[answered].why}</p>`:''}
  </div>`;
}
function renderLessons(){
  const l=LESSONS[APP.lessonIdx];
  return topbarHtml('home')+`
  <div class="card" style="max-width:700px;margin:16px auto 0">
    <div class="row between"><h2>Modo Professor</h2><button class="btn ghost sm" data-action="goHome">Sair</button></div>
    <div class="lesson-nav" style="margin-top:12px">
      ${LESSONS.map((ls,i)=>`<div class="lesson-dot ${i===APP.lessonIdx?'active':''} ${APP.quizAnswered[ls.id]!==undefined?'done':''}" data-action="gotoLesson" data-arg="${i}">${i+1}</div>`).join('')}
    </div>
    <h3 style="margin-top:10px">${l.title}</h3>
    <div style="margin-top:8px">
      ${l.body.map(b=>b.ex?`<div class="example-line ${b.ex}">${b.t}</div>`:`<p class="small mt6" style="margin-top:6px">${b.t}</p>`).join('')}
    </div>
    ${l.quiz?quizHtml(l):''}
    <div class="row between" style="margin-top:18px">
      <button class="btn ghost sm" data-action="prevLesson" ${APP.lessonIdx===0?'disabled':''}>← Anterior</button>
      <button class="btn sm" data-action="nextLesson" ${APP.lessonIdx===LESSONS.length-1?'disabled':''}>Próxima →</button>
    </div>
  </div>`;
}

/* ===================== FX ===================== */
function spawnConfetti(){
  const layer=document.getElementById('fx-layer'); if(!layer) return;
  const colors=['#f2c94c','#8a5cff','#3ddc84','#ff8a8a','#ffd166'];
  for(let i=0;i<60;i++){
    const p=document.createElement('div'); p.className='confetti-piece';
    p.style.left=Math.random()*100+'vw';
    p.style.background=colors[Math.floor(Math.random()*colors.length)];
    p.style.animationDuration=(1.6+Math.random()*1.2)+'s';
    p.style.transform='rotate('+Math.floor(Math.random()*360)+'deg)';
    layer.appendChild(p);
    setTimeout(()=>p.remove(),3200);
  }
}
function flashRed(){
  const layer=document.getElementById('fx-layer'); if(!layer) return;
  const d=document.createElement('div'); d.className='flash-red'; layer.appendChild(d);
  setTimeout(()=>d.remove(),1200);
}
function showGreatQFx(text){
  const layer=document.getElementById('fx-layer'); if(!layer) return;
  const d=document.createElement('div'); d.className='great-q-fx'; d.textContent=text; layer.appendChild(d);
  setTimeout(()=>d.remove(),1200);
}

/* ===================== ações / controlador ===================== */
function focusAskInput(){setTimeout(()=>{const el=document.getElementById('ask-input'); if(el) el.focus();},50);}
function goHome(){APP.screen='home';render();}
function goSetup(mode){APP.screen='setup';APP.setup={mode,difficulty:(APP.setup&&APP.setup.difficulty)||'todas',category:(APP.setup&&APP.setup.category)||'todos'};
  if(mode==='professor'){APP.screen='lessons';APP.lessonIdx=0;}
  render();
}
function selectDifficulty(v){APP.setup.difficulty=v;render();}
function selectCategory(v){APP.setup.category=v;render();}
function goStats(){APP.screen='stats';render();}
function goAchievements(){APP.screen='achievements';render();}
function gotoLesson(i){APP.lessonIdx=parseInt(i,10);render();}
function prevLesson(){if(APP.lessonIdx>0){APP.lessonIdx--;render();}}
function nextLesson(){if(APP.lessonIdx<LESSONS.length-1){APP.lessonIdx++;render();}}
function answerQuiz(arg){const parts=arg.split(':');APP.quizAnswered[parts[0]]=parseInt(parts[1],10);render();}
function startGame(mode){
  if(mode==='daily'){
    const today=todayStr();
    const secret=dailyIdentityForDate(today);
    APP.game=initGame({mode:'daily',difficulty:'todas',category:'todos',forcedIdentity:secret});
    APP.game.dailyDate=today;
  } else {
    APP.game=initGame({mode,difficulty:APP.setup.difficulty,category:APP.setup.category});
  }
  APP.game.showSuggestions=(mode==='treino');
  APP.screen='game';
  render();
  focusAskInput();
}
function askQuestion(){
  const el=document.getElementById('ask-input'); if(!el) return;
  const text=el.value.trim(); if(!text) return;
  el.value='';
  submitQuestion(text);
}
function quickQuestion(id){const q=QUESTION_BANK.find(x=>x.id===id); if(q) submitQuestion(q.text);}
function useSuggestion(text){submitQuestion(text);}
function submitQuestion(text){
  const st=APP.game; if(!st||st.finished) return;
  const result=analyzeQuestion(text,st);
  st.log.push(result);
  render();
  focusAskInput();
  if(result.win){ spawnConfetti(); setTimeout(()=>finishMatch(),900); }
  else if(result.wrongGuess){ flashRed(); }
  else if(result.quality==='excellent'){ showGreatQFx('Excelente pergunta!'); }
}
function useHint(){
  const st=APP.game; if(!st) return;
  if(!st.showSuggestions){st.showSuggestions=true; st.hintsUsed=(st.hintsUsed||0)+1;}
  render();
}
function giveUp(){
  const st=APP.game; if(!st) return;
  st.finished=true; st.won=false;
  render();
}
function finishMatch(){
  const st=APP.game; if(!st) return;
  st.finished=true;
  const g=gradeMatch(st);
  st.gradeResult=g;
  const hadExcellent=st.log.some(l=>l.quality==='excellent');
  const onlyGoodOrBetter=st.log.length>0 && st.log.every(l=>['excellent','good','win'].includes(l.quality));
  const extra={won:st.won,questions:g.used,hintsUsed:st.hintsUsed||0,difficulty:st.difficulty,hadExcellent,onlyGoodOrBetter,grade:g.grade};
  recordMatch(APP.profile,st,g);
  if(st.mode==='daily'){
    const today=st.dailyDate||todayStr();
    const y=new Date(); y.setDate(y.getDate()-1);
    const yStr=y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');
    if(APP.profile.daily.lastDate===yStr) APP.profile.daily.streak=(APP.profile.daily.streak||0)+1;
    else if(APP.profile.daily.lastDate!==today) APP.profile.daily.streak=1;
    APP.profile.daily.lastDate=today;
    APP.profile.daily.history[today]={questions:g.used,score:g.score,grade:g.grade,won:st.won};
  }
  const unlocked=checkAchievements(APP.profile,extra);
  APP.lastUnlocked=unlocked;
  saveProfile(APP.profile);
  APP.screen='report';
  render();
}
function openReview(){APP.screen='review';render();}
function backReport(){APP.screen='report';render();}

/* ===================== boot ===================== */
const ACTIONS={goHome,goSetup,selectDifficulty,selectCategory,goStats,goAchievements,gotoLesson,prevLesson,nextLesson,answerQuiz,startGame,askQuestion,quickQuestion,useSuggestion,useHint,giveUp,finishMatch,openReview,backReport};
function render(){
  const app=document.getElementById('app');
  let html='';
  switch(APP.screen){
    case 'home': html=renderHome(); break;
    case 'setup': html=renderSetup(APP.setup.mode); break;
    case 'lessons': html=renderLessons(); break;
    case 'game': html=renderGame(); break;
    case 'report': html=renderReport(); break;
    case 'review': html=renderReview(); break;
    case 'stats': html=renderStats(); break;
    case 'achievements': html=renderAchievements(); break;
    default: html=renderHome();
  }
  app.innerHTML=html;
}
let APP={screen:'home',profile:loadProfile(),setup:{mode:null,difficulty:'todas',category:'todos'},lessonIdx:0,quizAnswered:{},game:null,lastUnlocked:[]};

const appEl=document.getElementById('app');
appEl.addEventListener('click',function(e){
  const el=e.target.closest('[data-action]'); if(!el) return;
  const action=el.dataset.action, arg=el.dataset.arg;
  const fn=ACTIONS[action]; if(fn) fn(arg,el);
});
appEl.addEventListener('keydown',function(e){
  if(e.key==='Enter' && e.target && e.target.id==='ask-input'){ e.preventDefault(); askQuestion(); }
});
render();
console.log('APP_BOOTED', RAW_IDENTITIES.length, QUESTION_BANK.length, LESSONS.length);
</script>
</body>
