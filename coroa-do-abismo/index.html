<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Coroa do Abismo</title>
<style>
:root{
  --gold:#c9a35a; --gold2:#e8cf8a; --ink:#07070c; --panel:#12121b; --panel2:#0c0c13;
  --line:#3a3450; --line2:#5a5170; --red:#c23a3a; --blue:#4a7adf; --ok:#5fd17a; --bad:#e06060;
  --c-comum:#b8b8c0; --c-incomum:#5fd17a; --c-raro:#5aa7ff; --c-epico:#b06aff; --c-lendario:#ffa53a;
  --uisc:1;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:var(--ink);font-family:Georgia,'Times New Roman',serif;color:#d8d4c8}
#game{position:fixed;inset:0;width:100vw;height:100vh;display:block;background:#07070c}
input{user-select:text;-webkit-user-select:text}
button{font-family:inherit;cursor:pointer}

/* ============ COMPONENTES BASE ============ */
.btn{
  background:linear-gradient(180deg,#232030,#15131e);color:var(--gold2);
  border:1px solid var(--line2);border-radius:6px;padding:12px 26px;font-size:17px;letter-spacing:1px;
  box-shadow:0 0 0 1px #000 inset,0 4px 14px rgba(0,0,0,.6),0 0 18px rgba(201,163,90,.06);
  transition:all .15s;position:relative;text-shadow:0 1px 2px #000;
}
.btn:hover{border-color:var(--gold);color:#fff;box-shadow:0 0 0 1px #000 inset,0 4px 18px rgba(0,0,0,.7),0 0 24px rgba(201,163,90,.25);transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn.small{padding:7px 14px;font-size:14px}
.btn.gold{background:linear-gradient(180deg,#6a5322,#3d2f12);border-color:var(--gold)}
.btn:disabled{opacity:.4;pointer-events:none}
.panel{
  background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);
  border-radius:8px;box-shadow:0 0 0 1px #000,0 10px 40px rgba(0,0,0,.7),inset 0 0 40px rgba(0,0,0,.35);
}
.ornate{position:relative}
.ornate::before{content:"";position:absolute;inset:5px;border:1px solid rgba(201,163,90,.22);border-radius:5px;pointer-events:none}
h1,h2,h3{font-weight:normal;color:var(--gold2);letter-spacing:2px;text-shadow:0 2px 8px #000}
.muted{color:#8a8698}.tiny{font-size:12px}.small{font-size:14px}
.scr{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:40}
.hidden{display:none!important}

/* ============ TÍTULO ============ */
#scr-title{background:transparent}
#title-inner{text-align:center;z-index:2}
#logo{font-size:min(64px,9vw);letter-spacing:6px;color:var(--gold2);text-shadow:0 0 30px rgba(201,163,90,.45),0 4px 4px #000,0 0 80px rgba(255,120,40,.25);margin-bottom:4px}
#logo-sub{font-size:15px;letter-spacing:8px;color:#8a8698;text-transform:uppercase;margin-bottom:44px}
#title-btns{display:flex;flex-direction:column;gap:13px;width:min(320px,80vw);margin:0 auto}
#title-foot{position:absolute;bottom:14px;width:100%;text-align:center;font-size:12px;color:#5a5668;letter-spacing:1px}

/* ============ SELEÇÃO DE PERSONAGEM ============ */
#scr-select{background:rgba(5,5,10,.88);z-index:41;padding:12px}
#sel-wrap{display:flex;gap:14px;width:min(1060px,98vw);height:min(640px,94vh)}
#sel-classes{width:270px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:10px}
.classcard{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:7px;background:linear-gradient(180deg,#191724,#100e17);cursor:pointer;transition:all .15s}
.classcard:hover{border-color:var(--line2)}
.classcard.sel{border-color:var(--gold);box-shadow:0 0 16px rgba(201,163,90,.28);background:linear-gradient(180deg,#241f2e,#161119)}
.classcard .ci{width:44px;height:44px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:26px;background:#0a0a12;border:1px solid var(--line)}
.classcard b{color:var(--gold2);font-size:15px;letter-spacing:.5px}
#sel-main{flex:1;padding:16px 20px;display:flex;flex-direction:column;overflow-y:auto}
#sel-preview{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
#sel-canvas{width:190px;height:230px;background:radial-gradient(ellipse at 50% 80%,#1c1926,#0a0a10 75%);border:1px solid var(--line);border-radius:8px}
#sel-info{flex:1;min-width:230px}
#sel-skills{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.skrow{display:flex;gap:10px;align-items:center;background:#0d0d15;border:1px solid #262236;border-radius:6px;padding:7px 10px}
.skrow .ski{font-size:22px;width:34px;text-align:center}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;margin-top:10px;font-size:14px}
.statgrid span b{color:var(--gold2);float:right}
#sel-name{margin-top:auto;padding-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#nameinput{background:#0a0a12;border:1px solid var(--line2);color:#e8e4d8;padding:11px 14px;border-radius:6px;font-size:17px;width:min(260px,60vw);font-family:inherit}
.diffstars{color:var(--gold);letter-spacing:2px}

/* ============ HUD ============ */
#hud{position:fixed;inset:0;pointer-events:none;z-index:20;transform-origin:bottom center}
#hud *{pointer-events:none}
#hud .clk{pointer-events:auto}
.orb{position:fixed;bottom:14px;width:86px;height:86px;border-radius:50%;overflow:hidden;border:3px solid #2a2438;box-shadow:0 0 0 2px #000,0 6px 20px rgba(0,0,0,.7),inset 0 0 20px #000;background:#0a0a10}
.orb .fill{position:absolute;left:0;bottom:0;width:100%;transition:height .25s}
.orb .gloss{position:absolute;inset:0;border-radius:50%;background:radial-gradient(ellipse at 32% 24%,rgba(255,255,255,.30),transparent 42%)}
.orb .val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;text-shadow:0 1px 3px #000;z-index:2}
#hp-orb{left:calc(50% - 232px)}
#hp-orb .fill{background:linear-gradient(180deg,#e05050,#7a1414);box-shadow:0 0 18px rgba(220,60,60,.6)}
#mp-orb{left:calc(50% + 146px)}
#mp-orb .fill{background:linear-gradient(180deg,#5a8aef,#1a2a7a);box-shadow:0 0 18px rgba(80,120,230,.6)}
#hotbar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:7px;align-items:flex-end}
.hbslot{width:54px;height:54px;border-radius:7px;background:linear-gradient(180deg,#191624,#0d0b13);border:1px solid var(--line2);box-shadow:0 0 0 1px #000,0 4px 10px rgba(0,0,0,.6);position:relative;display:flex;align-items:center;justify-content:center;font-size:26px}
.hbslot .key{position:absolute;top:-7px;left:-4px;background:#0a0a12;border:1px solid var(--line);border-radius:4px;font-size:10px;padding:1px 5px;color:var(--gold2)}
.hbslot .cd{position:absolute;left:0;right:0;top:0;background:rgba(5,5,12,.82);height:0%;border-radius:6px 6px 0 0}
.hbslot .cdt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;text-shadow:0 1px 2px #000}
.hbslot .cnt{position:absolute;bottom:-4px;right:-4px;background:#1a1626;border:1px solid var(--gold);color:var(--gold2);font-size:11px;border-radius:9px;padding:1px 6px}
.hbslot.big{width:62px;height:62px;font-size:32px}
#xpwrap{position:fixed;bottom:6px;left:50%;transform:translateX(-50%);width:min(470px,72vw);height:5px;background:#0a0a12;border:1px solid #2a2438;border-radius:3px;overflow:hidden}
#xpfill{height:100%;width:0%;background:linear-gradient(90deg,#7a5cc9,#c9a35a);box-shadow:0 0 8px rgba(201,163,90,.6)}
#pframe{position:fixed;top:10px;left:10px;display:flex;gap:10px;align-items:center;background:linear-gradient(180deg,rgba(18,18,27,.92),rgba(12,12,19,.92));border:1px solid var(--line);border-radius:8px;padding:7px 12px}
#pframe .pico{width:42px;height:42px;border-radius:50%;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:22px;background:#0a0a12}
#pframe .lvl{color:var(--gold2)}
#goldbox{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:rgba(10,10,16,.8);border:1px solid var(--line);border-radius:16px;padding:4px 14px;font-size:14px;color:var(--gold2)}
#mmwrap{position:fixed;top:10px;right:10px;text-align:right}
#minimap{width:148px;height:148px;border-radius:8px;border:2px solid var(--line);box-shadow:0 0 0 1px #000,0 6px 16px rgba(0,0,0,.6);background:#07070c}
#topbtns{display:flex;gap:6px;justify-content:flex-end;margin-top:6px}
.tbtn{width:38px;height:38px;border-radius:7px;background:linear-gradient(180deg,#1d1a29,#100e17);border:1px solid var(--line2);color:var(--gold2);font-size:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(0,0,0,.5)}
.tbtn:hover{border-color:var(--gold)}
#objective{position:fixed;top:172px;right:10px;max-width:230px;background:rgba(10,10,16,.78);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:6px;padding:8px 11px;font-size:13px;text-align:left}
#objective b{color:var(--gold2);display:block;margin-bottom:3px;font-size:12px;letter-spacing:1px}
#interact{position:fixed;bottom:150px;left:50%;transform:translateX(-50%);background:rgba(12,12,20,.9);border:1px solid var(--gold);border-radius:6px;padding:7px 16px;font-size:15px;color:var(--gold2);box-shadow:0 0 20px rgba(201,163,90,.25)}
#bosswrap{position:fixed;top:14px;left:50%;transform:translateX(-50%);width:min(560px,86vw);text-align:center}
#bossname{font-size:16px;letter-spacing:2px;color:#e8c8c8;text-shadow:0 0 12px rgba(200,40,40,.8),0 2px 3px #000;margin-bottom:4px}
#bossbar{height:14px;background:#12060a;border:1px solid #6a2030;border-radius:7px;overflow:hidden;box-shadow:0 0 0 1px #000,0 0 24px rgba(200,30,50,.35)}
#bossfill{height:100%;width:100%;background:linear-gradient(180deg,#d04a4a,#6a1020);transition:width .2s}
#toasts{position:fixed;top:70px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:60;pointer-events:none}
.toast{background:linear-gradient(180deg,rgba(20,18,30,.95),rgba(10,9,16,.95));border:1px solid var(--gold);border-radius:6px;padding:8px 18px;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.7),0 0 20px rgba(201,163,90,.15);animation:tin .3s}
@keyframes tin{from{opacity:0;transform:translateY(-12px)}to{opacity:1}}
#centermsg{position:fixed;top:34%;width:100%;text-align:center;font-size:min(34px,6vw);letter-spacing:4px;color:var(--gold2);text-shadow:0 0 30px rgba(201,163,90,.5),0 3px 6px #000;opacity:0;transition:opacity .5s;z-index:55}

/* ============ MODAIS ============ */
.modal-bg{position:fixed;inset:0;background:rgba(4,4,8,.72);z-index:45;display:flex;align-items:center;justify-content:center;padding:10px}
.modal{max-width:96vw;max-height:92vh;overflow-y:auto;padding:18px 20px;position:relative}
.mx{position:absolute;top:8px;right:10px;width:32px;height:32px;border-radius:6px;background:#1a1626;border:1px solid var(--line2);color:#c8c4b8;font-size:16px}
.mx:hover{border-color:var(--bad);color:#fff}
/* inventário */
#inv-wrap{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
#equip-col{width:230px}
.eqslot{display:flex;align-items:center;gap:9px;background:#0d0d15;border:1px solid #262236;border-radius:6px;padding:6px 9px;margin-bottom:6px;min-height:48px;cursor:pointer}
.eqslot:hover{border-color:var(--line2)}
.eqslot .ei{width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:22px;background:#08080e;border-radius:5px;border:1px solid #201c2e}
.eqslot .en{font-size:12.5px;line-height:1.25}
#inv-grid{display:grid;grid-template-columns:repeat(5,54px);gap:6px;align-content:flex-start}
.islot{width:54px;height:54px;border-radius:6px;background:#0c0c14;border:1px solid #242034;display:flex;align-items:center;justify-content:center;font-size:26px;position:relative;cursor:pointer}
.islot:hover{border-color:var(--line2);background:#141221}
.islot .q{position:absolute;bottom:1px;right:4px;font-size:11px;color:#cfcabd;text-shadow:0 1px 2px #000}
.r-comum{border-color:#3c3c46!important}.r-incomum{border-color:#2c6a3e!important;box-shadow:0 0 8px rgba(95,209,122,.15)}
.r-raro{border-color:#2a5a9a!important;box-shadow:0 0 8px rgba(90,167,255,.2)}
.r-epico{border-color:#6a3aa0!important;box-shadow:0 0 10px rgba(176,106,255,.25)}
.r-lendario{border-color:#a06a20!important;box-shadow:0 0 12px rgba(255,165,58,.3)}
#tooltip{position:fixed;z-index:70;width:250px;pointer-events:none;padding:10px 12px;font-size:13px;display:none}
#tooltip h4{font-size:15px;margin-bottom:2px}
#tooltip .aff{color:#9ecbff}
#tooltip .cmp{border-top:1px solid #2a2438;margin-top:6px;padding-top:6px}
.itemacts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
/* diálogo */
#dlg-box{width:min(560px,94vw)}
#dlg-head{display:flex;gap:12px;align-items:center;margin-bottom:10px}
#dlg-face{width:56px;height:56px;border-radius:8px;border:1px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:32px;background:#0c0c14}
#dlg-text{font-size:15.5px;line-height:1.55;color:#cfcabd;min-height:60px}
#dlg-opts{display:flex;flex-direction:column;gap:7px;margin-top:14px}
/* mapa */
#bigmap{background:#07070c;border:1px solid var(--line);border-radius:6px;image-rendering:pixelated;width:min(560px,88vw);height:min(560px,88vw)}
/* opções */
.optrow{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:9px 0;border-bottom:1px solid #1e1a2c;min-width:min(420px,84vw)}
.optrow input[type=range]{width:150px}
.seg{display:flex;gap:4px}
.seg button{padding:5px 12px;font-size:13px;background:#14121e;border:1px solid var(--line);color:#b8b4a8;border-radius:5px}
.seg button.on{border-color:var(--gold);color:var(--gold2);background:#231d2e}
/* morte */
#m-death h1{color:#e05050;text-shadow:0 0 40px rgba(200,30,30,.6);font-size:46px;letter-spacing:6px}

/* ============ MOBILE ============ */
#vjoy{position:fixed;left:22px;bottom:96px;width:128px;height:128px;border-radius:50%;background:rgba(20,18,30,.35);border:2px solid rgba(90,81,112,.5);z-index:30;display:none}
#vnub{position:absolute;left:50%;top:50%;width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3a3450,#1a1626);border:2px solid var(--line2);transform:translate(-50%,-50%)}
#mbtns{position:fixed;right:14px;bottom:88px;z-index:30;display:none}
.mbtn{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(50,44,70,.85),rgba(18,15,28,.85));border:2px solid var(--line2);color:var(--gold2);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.mbtn:active{border-color:var(--gold);transform:scale(.94)}
.mbtn .cd{position:absolute;inset:0;border-radius:50%;background:rgba(5,5,12,.75);transform:scale(0);}
#mb-atk{width:86px;height:86px;right:0;bottom:0;font-size:38px}
#mb-s1{width:58px;height:58px;right:100px;bottom:6px;font-size:26px}
#mb-s2{width:58px;height:58px;right:118px;bottom:74px;font-size:26px}
#mb-s3{width:58px;height:58px;right:74px;bottom:132px;font-size:26px}
#mb-pot{width:50px;height:50px;right:6px;bottom:104px;font-size:24px}
#mb-dodge{width:50px;height:50px;right:166px;bottom:-8px;font-size:22px}
#mb-int{width:56px;height:56px;right:10px;bottom:170px;font-size:24px;border-color:var(--gold)}
body.mobile #vjoy,body.mobile #mbtns{display:block}
body.mobile #hotbar{display:none}
body.mobile #hp-orb{left:14px;bottom:14px;width:72px;height:72px}
body.mobile #mp-orb{left:94px;bottom:14px;width:58px;height:58px}
body.mobile #xpwrap{bottom:4px;width:56vw}
body.mobile #objective{top:auto;bottom:230px;right:8px;max-width:180px;font-size:11.5px}
body.mobile #interact{display:none!important}
body.uibig #hud{font-size:18px}
body.uibig .hbslot{width:62px;height:62px}
@media (max-width:760px){
  #sel-wrap{flex-direction:column;height:auto;max-height:94vh;overflow-y:auto}
  #sel-classes{width:100%;flex-direction:row;overflow-x:auto;padding:6px}
  .classcard{min-width:150px;flex-direction:column;text-align:center}
}
</style>
</head>
<body>
<canvas id="game"></canvas>

<!-- HUD -->
<div id="hud" class="hidden">
  <div id="pframe"><div class="pico" id="pf-ico">⚔️</div><div><b id="pf-name">—</b><br><span class="tiny muted" id="pf-class">—</span> <span class="tiny lvl" id="pf-lvl">Nv 1</span></div></div>
  <div id="goldbox">🪙 <b id="gold-v">0</b></div>
  <div id="mmwrap"><canvas id="minimap" width="148" height="148"></canvas>
    <div id="topbtns">
      <button class="tbtn clk" id="tb-inv" title="Inventário (I)">🎒</button>
      <button class="tbtn clk" id="tb-char" title="Personagem (C)">👤</button>
      <button class="tbtn clk" id="tb-map" title="Mapa (M)">🗺️</button>
      <button class="tbtn clk" id="tb-menu" title="Menu (ESC)">⚙️</button>
    </div>
  </div>
  <div id="objective"><b>⚜ AS CINZAS CHAMAM</b><span id="obj-text">…</span></div>
  <div class="orb" id="hp-orb"><div class="fill" style="height:100%"></div><div class="gloss"></div><div class="val">100</div></div>
  <div class="orb" id="mp-orb"><div class="fill" style="height:100%"></div><div class="gloss"></div><div class="val">100</div></div>
  <div id="hotbar"></div>
  <div id="xpwrap"><div id="xpfill"></div></div>
  <div id="interact" class="hidden"></div>
  <div id="bosswrap" class="hidden"><div id="bossname">—</div><div id="bossbar"><div id="bossfill"></div></div></div>
</div>
<div id="toasts"></div>
<div id="centermsg"></div>

<!-- MOBILE -->
<div id="vjoy"><div id="vnub"></div></div>
<div id="mbtns">
  <button class="mbtn" id="mb-atk">⚔️<div class="cd"></div></button>
  <button class="mbtn" id="mb-s1">•<div class="cd"></div></button>
  <button class="mbtn" id="mb-s2">•<div class="cd"></div></button>
  <button class="mbtn" id="mb-s3">•<div class="cd"></div></button>
  <button class="mbtn" id="mb-pot">🧪<div class="cd"></div></button>
  <button class="mbtn" id="mb-dodge">💨<div class="cd"></div></button>
  <button class="mbtn hidden" id="mb-int">✦</button>
</div>

<!-- TÍTULO -->
<div class="scr" id="scr-title">
  <div id="title-inner">
    <div id="logo">COROA DO ABISMO</div>
    <div id="logo-sub">— um conto dos campos quebrados —</div>
    <div id="title-btns">
      <button class="btn gold" id="bt-new">⚔ Novo Jogo</button>
      <button class="btn" id="bt-load">📜 Carregar Jogo</button>
      <button class="btn" id="bt-opts">⚙ Opções</button>
      <button class="btn" id="bt-credits">✒ Créditos</button>
    </div>
  </div>
  <div id="title-foot">Protótipo — Ato I · Os Campos Quebrados de Varn</div>
</div>

<!-- SELEÇÃO -->
<div class="scr hidden" id="scr-select">
  <div id="sel-wrap" class="panel ornate">
    <div id="sel-classes"></div>
    <div id="sel-main">
      <div id="sel-preview">
        <canvas id="sel-canvas" width="190" height="230"></canvas>
        <div id="sel-info"></div>
      </div>
      <div id="sel-skills"></div>
      <div id="sel-name">
        <input id="nameinput" maxlength="16" placeholder="Nome do herói…">
        <button class="btn gold" id="bt-start">Despertar ⚔</button>
        <button class="btn small" id="bt-selback">Voltar</button>
      </div>
    </div>
  </div>
</div>

<div id="modals"></div>
<div id="tooltip" class="panel"></div>

<script>
"use strict";
/* ============================================================================
   COROA DO ABISMO — protótipo Ato I
   Arquitetura em módulos (num único arquivo):
   [UTIL] [AUDIO] [OPTS/SAVE] [DATA: classes/skills/inimigos/itens/quest/props]
   [WORLD gen+render] [SPRITES procedurais] [ENTIDADES/IA] [COMBATE/SKILLS]
   [LOOT/INVENTÁRIO] [QUEST/NPC/UI] [INPUT pc+mobile] [LOOP]
   ============================================================================ */

/* ================= [UTIL] ================= */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const dist=(ax,ay,bx,by)=>Math.hypot(bx-ax,by-ay);
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const chance=p=>Math.random()<p;
const fmt=n=>n>=1000?(n/1000).toFixed(1)+'k':''+Math.floor(n);
function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const TW=64,TH=32;                       // tile isométrico
const toSX=(x,y)=>(x-y)*(TW/2);
const toSY=(x,y)=>(x+y)*(TH/2);
function fromScreen(sx,sy){const x=(sx/(TW/2)+sy/(TH/2))/2, y=(sy/(TH/2)-sx/(TW/2))/2;return[x,y]}

const Snd={ctx:null,master:null,mus:null,sfxG:null,
  init(){if(this.ctx)return;try{this.ctx=new (window.AudioContext||window.webkitAudioContext)();
    this.master=this.ctx.createGain();this.master.connect(this.ctx.destination);
    this.sfxG=this.ctx.createGain();this.sfxG.connect(this.master);
    this.mus=this.ctx.createGain();this.mus.connect(this.master);
    this.apply();this.drone();}catch(e){}},
  apply(){if(!this.ctx)return;this.master.gain.value=OPTS.vol;this.sfxG.gain.value=OPTS.volSfx;this.mus.gain.value=OPTS.volMus*0.5},
  tone(f,dur,type='sine',vol=0.2,slide=0){if(!this.ctx)return;const t=this.ctx.currentTime;
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type;o.frequency.value=f;
    if(slide)o.frequency.linearRampToValueAtTime(f+slide,t+dur);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g);g.connect(this.sfxG);o.start(t);o.stop(t+dur)},
  noise(dur,vol=0.15,fc=800){if(!this.ctx)return;const t=this.ctx.currentTime,n=this.ctx.sampleRate*dur;
    const buf=this.ctx.createBuffer(1,n,this.ctx.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
    const s=this.ctx.createBufferSource();s.buffer=buf;const f=this.ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=fc;
    const g=this.ctx.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(this.sfxG);s.start(t)},
  drone(){if(!this.ctx)return;const o=this.ctx.createOscillator(),g=this.ctx.createGain(),o2=this.ctx.createOscillator();
    o.type='sine';o.frequency.value=55;o2.type='sine';o2.frequency.value=55.7;
    g.gain.value=0.05;o.connect(g);o2.connect(g);g.connect(this.mus);o.start();o2.start()},
};
function sfx(k){if(!Snd.ctx)return;switch(k){
  case 'swing':Snd.noise(0.12,0.10,1400);break;
  case 'hit':Snd.noise(0.09,0.16,700);Snd.tone(90,0.08,'square',0.06);break;
  case 'crit':Snd.noise(0.14,0.2,900);Snd.tone(180,0.14,'square',0.1,-60);break;
  case 'hurt':Snd.tone(140,0.16,'sawtooth',0.08,-50);break;
  case 'die':Snd.tone(110,0.5,'sawtooth',0.1,-70);Snd.noise(0.3,0.1,400);break;
  case 'pickup':Snd.tone(660,0.1,'sine',0.12,120);break;
  case 'gold':Snd.tone(880,0.07,'triangle',0.1,60);break;
  case 'potion':Snd.tone(440,0.2,'sine',0.12,150);break;
  case 'level':[440,554,659,880].forEach((f,i)=>setTimeout(()=>Snd.tone(f,0.3,'triangle',0.14),i*90));break;
  case 'cast':Snd.tone(520,0.15,'sine',0.1,180);break;
  case 'bell':Snd.tone(160,1.6,'sine',0.3,-20);Snd.tone(242,1.2,'sine',0.14);break;
  case 'ui':Snd.tone(500,0.05,'triangle',0.06);break;
  case 'quest':[523,659,784].forEach((f,i)=>setTimeout(()=>Snd.tone(f,0.25,'sine',0.12),i*110));break;
}}

function genItem(lvl,boost=0,forceSlot){
  const slot=forceSlot||pick(SLOTS);
  // raridade
  let w={comum:52,incomum:30,raro:13+boost*4,epico:4+boost*2,lendario:1+boost};
  let tot=0;for(const k in w)tot+=w[k];let r=Math.random()*tot,rar='comum';
  for(const k in w){r-=w[k];if(r<=0){rar=k;break}}
  const it={slot,rar,lvl:Math.max(1,lvl),aff:{},id:Date.now()+''+ri(0,99999)};
  let base;
  if(slot==='arma'){base=pick(WEAPON_BASES);it.icon=base.icon;it.wtype=base.n;
    it.dmg=Math.round((4+lvl*3)*(1+RARS.indexOf(rar)*0.22)*rnd(0.9,1.15));}
  else{it.icon=SLOT_ICON[slot];
    it.armor=Math.round((2+lvl*1.8)*(1+RARS.indexOf(rar)*0.2)*rnd(0.9,1.15));
    if(slot==='anel'||slot==='amuleto')it.armor=Math.max(1,Math.round(it.armor*0.35));}
  const nAff=RAR_AFF[rar];
  const pool=AFFIXES.slice();
  for(let i=0;i<nAff&&pool.length;i++){const a=pool.splice(ri(0,pool.length-1),1)[0];it.aff[a.k]=a.v(lvl)}
  const nb=slot==='arma'?base.n:SLOT_NAME[slot];
  it.nome=nb+' '+pick(BASE_SUFFIX);
  it.sell=Math.max(2,Math.round((3+lvl*2)*(1+RARS.indexOf(rar)*1.6)));
  return it;
}

// tipos de tile: 0 grama morta,1 terra,2 estrada pedra,3 água pântano(bloq),4 lama,5 rocha(bloq),6 terra de cova,7 piso capela
const TILE_COL={0:'#2d2f24',1:'#3a3226',2:'#44424a',3:'#16222a',4:'#2a2c1e',5:'#232430',6:'#2e2a24',7:'#3a3644'};
function genWorld(){
  CROWS.length=0;
  const R=mulberry(20777);
  const tiles=new Uint8Array(MW*MH), block=new Uint8Array(MW*MH);
  const T=(x,y)=>tiles[y*MW+x], sT=(x,y,v)=>{tiles[y*MW+x]=v};
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){sT(x,y,R()<0.16?1:0)}
  // bordas rochosas
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){if(x<3||y<3||x>MW-4||y>MH-4){sT(x,y,5);block[y*MW+x]=1}}
  const paint=(cx,cy,r,t,blob=1)=>{for(let y=Math.max(0,cy-r);y<=Math.min(MH-1,cy+r);y++)for(let x=Math.max(0,cx-r);x<=Math.min(MW-1,cx+r);x++){const d=dist(x,y,cx,cy);if(d<=r*(0.75+R()*0.35*blob))sT(x,y,t)}};
  const road=(ax,ay,bx,by,w=1)=>{const n=Math.ceil(dist(ax,ay,bx,by)*2);for(let i=0;i<=n;i++){const x=Math.round(lerp(ax,bx,i/n)+R()*1.2-0.6),y=Math.round(lerp(ay,by,i/n)+R()*1.2-0.6);paint(x,y,w,2,0.4)}};
  // acampamento (sudoeste)
  paint(19,19,7,1);paint(19,19,4,2,0.2);
  // estrada principal: acampamento → centro → capela (nordeste)
  road(24,20,52,44);road(52,44,78,24);road(52,44,50,66);
  // pântano (sul-centro)
  paint(48,70,9,4);paint(48,70,6,3);paint(41,64,3,4);paint(55,75,4,4);
  // cemitério (sudoeste-baixo)
  paint(29,80,7,6,0.5);
  // praça da capela (nordeste)
  paint(80,18,8,7,0.3);
  // afloramentos de rocha
  for(let i=0;i<10;i++){const x=ri(10,MW-10),y=ri(10,MH-10);if(dist(x,y,19,19)>16&&dist(x,y,80,18)>13)paint(x,y,ri(1,2),5,0.6)}
  // bloqueio de água/rocha
  for(let i=0;i<MW*MH;i++){if(tiles[i]===3||tiles[i]===5)block[i]=1}

  const props=[],lights=[],interact=[];
  const addP=(t,x,y,o={})=>{const p=Object.assign({t,x,y,seed:R()*9},o);props.push(p);
    if(o.blk!==false&&PROP_BLOCK[t])block[Math.round(y)*MW+Math.round(x)]=1;return p};
  const addL=(x,y,r,warm,fl=1)=>lights.push({x,y,r,warm,fl});
  const addI=(kind,x,y,o={})=>{const it=Object.assign({kind,x,y},o);interact.push(it);return it};

  /* --- Refúgio da Última Brasa --- */
  addP('campfire',19,19);addL(19,19,4.5,1);
  addP('tent',15.5,16.5);addP('tent',22.5,16);
  addP('npc',20.5,15.8,{npc:'ferreiro',blk:false});addP('anvil',21.4,15.4);addL(21.4,15.4,2,1);
  addP('npc',15.8,20.6,{npc:'curandeira',blk:false});addP('herbs',15,21.4,{blk:false});

let MMC=null;
function bakeMinimap(){ if(!WORLD)return;
  MMC=mkCanvas(MW,MH);const g=MMC.getContext('2d');
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){g.fillStyle=TILE_COL[WORLD.tiles[y*MW+x]];g.fillRect(x,y,1,1)}
  g.fillStyle='#c9a35a';g.fillRect(17,17,4,4); // camp
}
function drawMinimap(){
  const c=$('#minimap'),g=c.getContext('2d');if(!MMC||!P)return;
  g.clearRect(0,0,148,148);
  g.save();g.beginPath();g.arc(74,74,72,0,7);g.clip();
  const z=2.1;
  g.imageSmoothingEnabled=false;
  g.drawImage(MMC,74-P.x*z,74-P.y*z,MW*z,MH*z);
  const mark=(x,y,col,r=3)=>{const mx=74+(x-P.x)*z,my=74+(y-P.y)*z;g.fillStyle=col;g.beginPath();g.arc(mx,my,r,0,7);g.fill()};
  // marcadores
  mark(WORLD.camp.x,WORLD.camp.y,'#ffcf6a',4);
  WORLD.gatesInfo.forEach(gt=>mark(gt.x,gt.y,'#5adfae',3));
  if(QUEST.stage===1)WORLD.fragPos.forEach(([x,y],i)=>{if(!WORLD.fragsTaken.includes(i))mark(x,y,'#ffe98a',3)});
  if(QUEST.stage===2||QUEST.stage===3)mark(WORLD.chapel.x,WORLD.chapel.y,'#ff6a6a',4);
  if(QUEST.stage===4)mark(WORLD.camp.x,WORLD.camp.y,'#ffe98a',5);
  if(QUEST.stage===0)mark(19.5,22.2,'#ffe98a',3);
  ENEMIES.forEach(e=>{if(!e.friend&&dist(e.x,e.y,P.x,P.y)<26)mark(e.x,e.y,'#e05050',1.6)});
  g.fillStyle='#fff';g.beginPath();g.arc(74,74,2.6,0,7);g.fill();
  g.restore();
  g.strokeStyle='rgba(201,163,90,.5)';g.beginPath();g.arc(74,74,71,0,7);g.stroke();
}

/* ================= [RENDER PRINCIPAL] ================= */
function worldToCam(x,y){return[toSX(x,y)-CAM.x+VW/2, toSY(x,y)-CAM.y+VH/2]}
let LIGHT_WARM,LIGHT_COOL,FOGS=[];
function bakeLights(){
  const mk=(col1,col2)=>{const c=mkCanvas(256,256),g=c.getContext('2d');
    const gr=g.createRadialGradient(128,128,10,128,128,128);gr.addColorStop(0,col1);gr.addColorStop(1,col2);
    g.fillStyle=gr;g.fillRect(0,0,256,256);return c};
  LIGHT_WARM=mk('rgba(255,150,60,.55)','rgba(255,120,40,0)');
  LIGHT_COOL=mk('rgba(110,140,255,.4)','rgba(90,120,255,0)');
  for(let i=0;i<14;i++)FOGS.push({x:rnd(0,MW),y:rnd(0,MH),r:rnd(90,220),vx:rnd(-0.12,0.12),vy:rnd(-0.08,0.08),a:rnd(0.05,0.14)});
}
function render(){
  ctx.clearRect(0,0,VW,VH);
  if(STATE==='title'||STATE==='select'){renderTitleBG();return}
  if(!WORLD||!P)return;
  const shx=CAM.shake>0?rnd(-CAM.shake,CAM.shake):0, shy=CAM.shake>0?rnd(-CAM.shake,CAM.shake):0;
  ctx.save();ctx.translate(shx,shy);
  // ---- tiles visíveis ----
  const corners=[fromScreen(CAM.x-VW/2-TW,CAM.y-VH/2-TH),fromScreen(CAM.x+VW/2+TW,CAM.y-VH/2-TH),
                 fromScreen(CAM.x-VW/2-TW,CAM.y+VH/2+TH*3),fromScreen(CAM.x+VW/2+TW,CAM.y+VH/2+TH*3)];
  let minX=MW,maxX=0,minY=MH,maxY=0;
  corners.forEach(([x,y])=>{minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y)});
  minX=clamp(Math.floor(minX)-1,0,MW-1);maxX=clamp(Math.ceil(maxX)+1,0,MW-1);
  minY=clamp(Math.floor(minY)-1,0,MH-1);maxY=clamp(Math.ceil(maxY)+1,0,MH-1);
  for(let y=minY;y<=maxY;y++)for(let x=minX;x<=maxX;x++){
    const t=WORLD.tiles[y*MW+x];
    const[sx,sy]=worldToCam(x,y);
    ctx.drawImage(TILE_SPR[t],sx-TW/2-1,sy-1);
    if(t===3){ // brilho da água
      ctx.fillStyle=`rgba(120,170,200,${0.05+0.04*Math.sin(TIME*1.5+x*2.4+y)})`;
      ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+TW/2,sy+TH/2);ctx.lineTo(sx,sy+TH);ctx.lineTo(sx-TW/2,sy+TH/2);ctx.closePath();ctx.fill();
    }
  }
  // ---- hazards no chão ----
  HAZARDS.forEach(h=>{const[sx,sy]=worldToCam(h.x,h.y);
    ctx.fillStyle=h.col||'rgba(90,200,60,.16)';
    ctx.beginPath();ctx.ellipse(sx,sy,h.r*TW/2*0.9,h.r*TH/2*0.9,0,0,7);ctx.fill();
    ctx.strokeStyle=h.col2||'rgba(120,240,80,.3)';ctx.stroke();
    if(chance(0.3))addPart(h.x+rnd(-h.r*0.7,h.r*0.7),h.y+rnd(-h.r*0.7,h.r*0.7),{vy:-14,t:0.8,col:h.pcol||'#8adf5a',r:2});
  });
  // ---- anéis/ondas ----
  RINGS.forEach(r=>{const[sx,sy]=worldToCam(r.x,r.y);const pr=r.r*(r.t/r.dur);
    ctx.strokeStyle=r.col.replace('%a',''+(1-r.t/r.dur)*0.8);ctx.lineWidth=r.w||3;
    ctx.beginPath();ctx.ellipse(sx,sy,pr*TW/2,pr*TH/2,0,0,7);ctx.stroke();ctx.lineWidth=1});
  // ---- coletar & ordenar drawables ----
  const draws=[];
  WORLD.props.forEach(p=>{if(p.x>=minX-2&&p.x<=maxX+2&&p.y>=minY-2&&p.y<=maxY+2)draws.push({d:p.x+p.y,k:'prop',o:p})});
  DROPS.forEach(d=>{if(d.x>=minX&&d.x<=maxX&&d.y>=minY&&d.y<=maxY)draws.push({d:d.x+d.y,k:'drop',o:d})});
  ENEMIES.forEach(e=>draws.push({d:e.x+e.y,k:'ent',o:e}));
  if(BOSS)draws.push({d:BOSS.x+BOSS.y,k:'boss',o:BOSS});
  draws.push({d:P.x+P.y,k:'player',o:P});
  // fragmentos de sino visíveis
  if(QUEST.stage>=1&&QUEST.stage<4)WORLD.fragPos.forEach(([x,y],i)=>{if(!WORLD.fragsTaken.includes(i))draws.push({d:x+y,k:'frag',o:{x,y}})});
  PROJS.forEach(p=>draws.push({d:p.x+p.y+0.01,k:'proj',o:p}));
  draws.sort((a,b)=>a.d-b.d);
  draws.forEach(dr=>{
    if(dr.k==='prop')drawProp(dr.o);
    else if(dr.k==='drop')drawDrop(dr.o);
    else if(dr.k==='ent')drawEntity(dr.o);
    else if(dr.k==='boss')drawBoss(dr.o);
    else if(dr.k==='player')drawEntity(P);
    else if(dr.k==='frag')drawFrag(dr.o);
    else if(dr.k==='proj')drawProj(dr.o);
  });
  // ---- partículas ----
  PARTS.forEach(p=>{const[sx,sy]=worldToCam(p.x,p.y);
    ctx.globalAlpha=clamp(p.t/p.dur,0,1);ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(sx,sy+(p.z||0),p.r,0,7);ctx.fill();ctx.globalAlpha=1});
  // ---- corvos ----
  CROWS.forEach(cr=>{const[sx,sy]=worldToCam(cr.x,cr.y);
    ctx.strokeStyle='rgba(10,10,14,.8)';ctx.lineWidth=2;const f=Math.sin(TIME*9+cr.t*7)*5;
    ctx.beginPath();ctx.moveTo(sx-7,sy-40+f*0.4);ctx.quadraticCurveTo(sx,sy-46+f,sx,sy-40);ctx.quadraticCurveTo(sx,sy-46+f,sx+7,sy-40+f*0.4);ctx.stroke();ctx.lineWidth=1});
  // ---- escuridão + luzes ----
  const dark=BOSS&&BOSS.phase===2?0.62:0.42;
  ctx.fillStyle=`rgba(8,9,20,${dark})`;ctx.fillRect(-20,-20,VW+40,VH+40);
  if(OPTS.quality!=='baixa'){
    ctx.globalCompositeOperation='lighter';
    WORLD.lights.forEach(L=>{const[sx,sy]=worldToCam(L.x,L.y);
      if(sx<-200||sx>VW+200||sy<-200||sy>VH+200)return;
      const fl=L.fl?1+Math.sin(TIME*7+L.x*3)*0.12*L.fl:1;
      const sz=L.r*TW*fl;
      ctx.globalAlpha=0.9;ctx.drawImage(L.warm?LIGHT_WARM:LIGHT_COOL,sx-sz/2,sy-sz/2,sz,sz)});
    // luz do jogador
    const[px,py]=worldToCam(P.x,P.y);ctx.globalAlpha=0.5;
    ctx.drawImage(LIGHT_WARM,px-170,py-190,340,340);
    ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  }
  // ---- névoa ----
  if(OPTS.quality==='alta'){
    FOGS.forEach(f=>{const[sx,sy]=worldToCam(f.x,f.y);
      if(sx<-400||sx>VW+400||sy<-300||sy>VH+300)return;
      const gr=ctx.createRadialGradient(sx,sy,10,sx,sy,f.r);
      gr.addColorStop(0,`rgba(140,150,180,${f.a})`);gr.addColorStop(1,'rgba(140,150,180,0)');
      ctx.fillStyle=gr;ctx.beginPath();ctx.arc(sx,sy,f.r,0,7);ctx.fill()});
  }
  // ---- números flutuantes ----
  FLOATS.forEach(f=>{const[sx,sy]=worldToCam(f.x,f.y);
    ctx.globalAlpha=clamp(f.t/0.4,0,1);
    ctx.font=(f.big?'bold 22px':'bold 16px')+' Georgia';ctx.textAlign='center';
    ctx.strokeStyle='rgba(0,0,0,.8)';ctx.lineWidth=3;ctx.strokeText(f.txt,sx,sy+f.z);
    ctx.fillStyle=f.col;ctx.fillText(f.txt,sx,sy+f.z);ctx.globalAlpha=1});
  // vinheta
  const vg=ctx.createRadialGradient(VW/2,VH/2,VH*0.36,VW/2,VH/2,VH*0.85);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.5)');
  ctx.fillStyle=vg;ctx.fillRect(-20,-20,VW+40,VH+40);
  ctx.restore();
}

function renderTitleBG(){

  ctx.fillStyle=gr;ctx.fillRect(0,0,VW,VH);

  const R=mulberry(7);
  for(let i=0;i<70;i++){const x=R()*VW,y=R()*VH*0.5;ctx.fillStyle=`rgba(200,210,255,${0.2+R()*0.4*(0.6+0.4*Math.sin(TIME+i))})`;ctx.fillRect(x,y,1.6,1.6)}

  ctx.fillStyle='rgba(200,190,230,.9)';ctx.beginPath();ctx.arc(VW*0.78,VH*0.2,44,0,7);ctx.fill();
  ctx.fillStyle='#0d0c16';ctx.beginPath();ctx.arc(VW*0.78+16,VH*0.2-8,40,0,7);ctx.fill();
  // silhueta de ruínas
  ctx.fillStyle='#08070e';

    ctx.lineTo(x,base-h*0.3);ctx.lineTo(x+w*0.2,base-h);ctx.lineTo(x+w*0.5,base-h+R2()*30);ctx.lineTo(x+w*0.8,base-h*0.5);ctx.lineTo(x+w,base-h*0.2);x+=w}
  ctx.lineTo(VW,VH);ctx.closePath();ctx.fill();

  for(let i=0;i<4;i++){const fx=VW*(0.12+i*0.24),fy=base-10;

  }

    ctx.fillStyle=`rgba(120,130,170,${0.05})`;

let TPARTS=[];

/* ================= [SPRITES PROCEDURAIS — ENTIDADES] ================= */
/* Personagens em camadas: sombra, pernas animadas, torso/armadura, capa, braços,
   arma com arco de ataque, cabeça, brilhos. 8 direções via espelhamento + offsets. */
function facing8(a){ // ângulo mundo → índice 0..7 (E,SE,S,SW,W,NW,N,NE em tela)
  const sa=Math.atan2(Math.sin(a)+Math.cos(a),(Math.cos(a)-Math.sin(a)));
  return ((Math.round(sa/(Math.PI/4))%8)+8)%8;
}
function drawEntity(e){
  const[sx,sy]=worldToCam(e.x,e.y);
  const cls=e.isPlayer?CLASSES[e.cls]:null;
  const sc=(e.scale||1)*1.15;
  const t=TIME*1000;
  const walking=e.moving;
  const wp=e.animT*9;                       // fase de caminhada
  const bob=walking?Math.abs(Math.sin(wp))*3.5:Math.sin(TIME*2+ (e.seed||0))*1.2;
  const atkP=e.atkT>0?1-(e.atkT/e.atkDur):-1;  // 0..1 durante ataque
  const hurt=e.hurtT>0;
  const dead=e.dead;
  const dir=facing8(e.face||0);
  const left=dir>=3&&dir<=5;
  const dscale=dead?clamp(e.deadT/0.6,0,1):1;

  ctx.save();ctx.translate(sx,sy);
  // sombra
  ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.ellipse(0,0,16*sc,6.5*sc,0,0,7);ctx.fill();
  if(dead){ctx.rotate(0.5*(1-dscale)*(left?-1:1));ctx.globalAlpha=clamp(e.deadT*2,0,1)}
  ctx.scale(left?-sc:sc,sc*(atkP>=0&&atkP<0.25?0.96:1));
  ctx.translate(0,-bob);
  if(hurt&&Math.floor(t/50)%2===0){ctx.filter='brightness(2.4)'}
  const C=e.col;
  const swing=walking?Math.sin(wp):0;

  if(e.draw==='dog'){drawDog(e,C,swing,atkP);ctx.restore();return}
  if(e.draw==='worm'){drawWorm(e,C,atkP);ctx.restore();return}

  // ===== humanoide =====
  const legLen=13,hipY=-16;
  // capa
  if(C.cape){ctx.fillStyle=C.cape;
    const cw=Math.sin(TIME*3+(e.seed||0))*2+(walking?3:0);
    ctx.beginPath();ctx.moveTo(-6,-34);ctx.quadraticCurveTo(-13-cw,-16,-9-cw*1.4,-2);
    ctx.lineTo(2,-6);ctx.lineTo(4,-30);ctx.closePath();ctx.fill()}
  // pernas
  ctx.strokeStyle=C.legs||'#1c1a24';ctx.lineWidth=5;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-4,hipY);ctx.lineTo(-4+swing*4,-1);ctx.stroke();
  ctx.beginPath();ctx.moveTo(4,hipY);ctx.lineTo(4-swing*4,-1);ctx.stroke();
  // botas
  ctx.fillStyle=C.boots||'#26222e';
  ctx.beginPath();ctx.ellipse(-4+swing*4,0,4,2.5,0,0,7);ctx.fill();
  ctx.beginPath();ctx.ellipse(4-swing*4,0,4,2.5,0,0,7);ctx.fill();
  // torso

function shadeC(col,amt){

  return `rgb(${clamp(r,0,255)},${clamp(g,0,255)},${clamp(b,0,255)})`}

function drawWorm(e,C,atkP){
  const em=clamp(e.emergeT!==undefined?e.emergeT:1,0,1); // 0=enterrado
  if(em<1){ctx.fillStyle='#241f16';ctx.beginPath();ctx.ellipse(0,0,14,5,0,0,7);ctx.fill()}
  const up=em*26;
  const lung=atkP>=0?Math.sin(atkP*Math.PI)*8:0;
  // segmentos
  for(let i=4;i>=0;i--){const yy=-i*(up/5)-3,ww=11-i*1.2;
    const sway=Math.sin(TIME*3+i*0.9+e.seed)*2*em;
    const gr=ctx.createLinearGradient(0,yy-ww,0,yy+ww);gr.addColorStop(0,'#4a4234');gr.addColorStop(1,'#211c12');
    ctx.fillStyle=gr;ctx.beginPath();ctx.ellipse(sway+ (i===0?lung*0.6:0),yy,ww,ww*0.8,0,0,7);ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.3)';ctx.stroke()}
  // boca circular
  if(em>0.7){const my=-up-2,sway=Math.sin(TIME*3+e.seed)*2;
    ctx.fillStyle='#12100a';ctx.beginPath();ctx.arc(sway+lung,my,6,0,7);ctx.fill();
    ctx.strokeStyle='#7a4a3a';ctx.lineWidth=2;
    for(let i=0;i<6;i++){const a=i/6*Math.PI*2+TIME*2;
      ctx.beginPath();ctx.moveTo(sway+lung+Math.cos(a)*5,my+Math.sin(a)*5);ctx.lineTo(sway+lung+Math.cos(a)*8,my+Math.sin(a)*8);ctx.stroke()}
    ctx.lineWidth=1}
}

function calcStats(p){
  const c=CLASSES[p.cls],lv=p.level-1;
  const s={dmg:c.base.dmg+c.grow.dmg*lv,armor:c.base.armor+c.grow.armor*lv,
    hpMax:c.base.hp+c.grow.hp*lv,mpMax:c.base.mp+c.grow.mp*lv,
    crit:c.base.crit,cdmg:c.base.cdmg,spd:c.base.spd,aspd:0,regen:0.4,rpoison:0,rshadow:0,mf:0};
  for(const k in p.equip){const it=p.equip[k];if(!it)continue;
    if(it.dmg)s.dmg+=it.dmg;if(it.armor)s.armor+=it.armor;
    for(const a in it.aff){if(a==='hp')s.hpMax+=it.aff[a];else if(a==='mp')s.mpMax+=it.aff[a];
      else s[a]=(s[a]||0)+it.aff[a]}}
  if(WORLD&&WORLD.upgraded&&p.equip.arma)s.dmg+=5;
  p.buffs.forEach(b=>{if(b.k==='pacto')s.dmg*=1.45;if(b.k==='bless_dmg')s.dmg*=1.2;if(b.k==='bless_spd')s.spd*=1.18});
  return s;
}

function tryMove(e,dx,dy,dt){
  const spd=(e.isPlayer?e.stats().spd:e.spd)*(e.slowT>0?0.6:1);
  const nx=e.x+dx*spd*dt, ny=e.y+dy*spd*dt;
  if(!blocked(nx,e.y))e.x=nx;
  if(!blocked(e.x,ny))e.y=ny;
}
function blocked(x,y){
  if(x<3.4||y<3.4||x>MW-4.4||y>MH-4.4)return true;
  return !!WORLD.block[Math.round(y)*MW+Math.round(x)];
}
function dmgRoll(base,att){ // att = stats do atacante {crit,cdmg}
  let d=base*rnd(0.88,1.12),crit=false;
  if(att&&chance((att.crit||0)/100)){d*=(att.cdmg||150)/100;crit=true}
  return[Math.max(1,Math.round(d)),crit];
}
function hitEnemy(e,raw,opts={}){
  if(e.dead||e.friend)return;
  const st=P.stats();
  let[d,crit]=opts.noCrit?[Math.round(raw),false]:dmgRoll(raw,st);
  // bloqueio do cavaleiro
  if(e.block&&chance(e.block)&&!opts.pierce){d=Math.round(d*0.2);
    addFloat(e.x,e.y,'BLOQUEADO','#a8b8d8')}
  d=Math.max(1,Math.round(d*(1-e.armor/(e.armor+40))));
  e.hp-=d;e.hurtT=0.15;e.aggro=true;
  addFloat(e.x,e.y,d,crit?'#ffd34a':'#ffffff',crit);
  sfx(crit?'crit':'hit');
  addPart(e.x,e.y,{t:0.35,col:'#3a0f12',r:3,z:-24});
  for(let i=0;i<(crit?7:4);i++)addPart(e.x,e.y,{vx:rnd(-2,2),vy:rnd(-2,2),t:0.3,col:crit?'#ffd34a':'#e8d8c0',r:1.6,z:-26});
  if(opts.kb){const a=Math.atan2(e.y-P.y,e.x-P.x);
    const kx=e.x+Math.cos(a)*opts.kb,ky=e.y+Math.sin(a)*opts.kb;
    if(!blocked(kx,e.y))e.x=kx;if(!blocked(e.x,ky))e.y=ky}
  if(opts.stun)e.stun=Math.max(e.stun,opts.stun);
  if(opts.leech){P.hp=Math.min(P.hpMax,P.hp+d*opts.leech);
    addFloat(P.x,P.y,'+'+Math.round(d*opts.leech),'#5fd17a')}
  if(e.hp<=0){if(e===BOSS)bossDie();else killEnemy(e)}
  else if(e.type==='cultist'&&e.hp<e.maxhp*e.flee)e.fleeing=true;
}
function hitPlayer(raw,src,tag){
  if(P.dead||P.dodging)return;
  const st=P.stats();
  let d=raw*rnd(0.9,1.1);
  if(tag==='poison')d*=(1-(st.rpoison||0)/100);
  if(tag==='shadow')d*=(1-(st.rshadow||0)/100);
  d*=(1-st.armor/(st.armor+60));
  if(P.buffs.some(b=>b.k==='muralha'))d*=0.4;
  d=Math.max(1,Math.round(d));
  if(P.shield>0){const abs=Math.min(P.shield,d);P.shield-=abs;d-=abs;
    if(abs>0)addFloat(P.x,P.y,'('+abs+')','#6a9aff')}
  if(d<=0)return;
  P.hp-=d;P.hurtT=0.18;CAM.shake=Math.max(CAM.shake,3);
  addFloat(P.x,P.y,'-'+d,'#ff7a6a');sfx('hurt');
  for(let i=0;i<4;i++)addPart(P.x,P.y,{vx:rnd(-2,2),vy:rnd(-2,2),t:0.3,col:'#c23a3a',r:1.8,z:-26});
  if(P.hp<=0)playerDie();
}
function killEnemy(e){
  e.dead=true;e.deadT=1;sfx('die');
  addRing(e.x,e.y,1.4,'rgba(200,200,220,%a)',0.4);
  for(let i=0;i<8;i++)addPart(e.x,e.y,{vx:rnd(-3,3),vy:rnd(-3,3),t:0.5,col:'#5a5560',r:2,z:-18});
  grantXP(e.xp);
  // loot
  const g=ri(e.gold[0],e.gold[1]);
  if(g>0)DROPS.push({kind:'gold',x:e.x+rnd(-0.5,0.5),y:e.y+rnd(-0.5,0.5),v:g,seed:rnd(0,9)});
  const st=P.stats();
  const dropCh=0.13+(e.lootBoost?0.45:0)+(st.mf||0)/300;
  if(chance(dropCh)){const it=genItem(clamp(e.lvl,1,10),(e.lootBoost||0)+(st.mf||0)/40);
    DROPS.push({kind:'item',x:e.x+rnd(-0.6,0.6),y:e.y+rnd(-0.6,0.6),item:it,seed:rnd(0,9)})}
  if(chance(0.08))DROPS.push({kind:'potion',x:e.x,y:e.y+0.4,seed:rnd(0,9)});
  if(chance(0.12))DROPS.push({kind:'mat',x:e.x-0.3,y:e.y-0.3,seed:rnd(0,9)});
  if(BOSS&&e.summoned)return;
}
function grantXP(x){
  if(P.level>=10){return}
  P.xp+=x;
  let need=xpNeed(P.level);
  while(P.xp>=need&&P.level<10){P.xp-=need;P.level++;levelUpFx();need=xpNeed(P.level)}
  updHUD();
}
function xpNeed(l){return Math.round(60*Math.pow(l,1.7))}
function levelUpFx(){
  const c=CLASSES[P.cls];

  P.hp=P.hpMax;P.mp=P.mpMax;

  for(let i=0;i<26;i++){const a=i/26*Math.PI*2;

/* ================= [SKILLS] ================= */
function aimAngle(){
  if(MOB.on&&(MOB.jx||MOB.jy))return Math.atan2(MOB.jy,MOB.jx);
  const ne=nearestEnemy(7);
  if(MOB.on&&ne)return Math.atan2(ne.y-P.y,ne.x-P.x);
  // mouse → mundo
  const[wx,wy]=fromScreen(MOUSE.x-VW/2+CAM.x,MOUSE.y-VH/2+CAM.y);
  return Math.atan2(wy-P.y,wx-P.x);
}
function nearestEnemy(maxD){let best=null,bd=maxD;
  ENEMIES.forEach(e=>{if(e.dead||e.friend)return;const d=dist(P.x,P.y,e.x,e.y);if(d<bd){bd=d;best=e}});
  if(BOSS&&!BOSS.dead){const d=dist(P.x,P.y,BOSS.x,BOSS.y);if(d<bd){best=BOSS}}
  return best;
}
function enemiesInArc(x,y,ang,range,arc){
  const out=[];
  const test=e=>{if(e.dead||e.friend)return;
    const d=dist(x,y,e.x,e.y);if(d>range+0.3)return;
    let da=Math.atan2(e.y-y,e.x-x)-ang;
    while(da>Math.PI)da-=Math.PI*2;while(da<-Math.PI)da+=Math.PI*2;
    if(Math.abs(da)<=arc/2)out.push(e)};
  ENEMIES.forEach(test);if(BOSS&&!BOSS.dead)test(BOSS);
  return out;
}
function enemiesInR(x,y,r){const out=[];
  const test=e=>{if(e.dead||e.friend)return;if(dist(x,y,e.x,e.y)<=r)out.push(e)};
  ENEMIES.forEach(test);if(BOSS&&!BOSS.dead)test(BOSS);return out}
function basicAttack(){
  if(P.atkCd>0||P.dead)return;
  const st=P.stats();
  P.atkCd=0.55/(1+(st.aspd||0)/100);
  P.atkT=P.atkDur=0.3;P.face=aimAngle();
  sfx('swing');
  if(P.cls==='arcanista'){fireProj('orb',P.x,P.y,P.face,7.5,st.dmg*0.9,true,{pierce:false});return}
  if(P.cls==='cacadora'&&nearestEnemy(7)&&dist(P.x,P.y,nearestEnemy(7).x,nearestEnemy(7).y)>2){
    fireProj('bolt',P.x,P.y,P.face,9,st.dmg*0.8,true,{});return}
  rtHit(()=>{enemiesInArc(P.x,P.y,P.face,1.7,1.9).forEach(e=>hitEnemy(isBoss(e)?e:e,st.dmg,{kb:0.12}))},110);
}

   case 'luminoso':rtHit(()=>{enemiesInArc(P.x,P.y,P.face,2.0,1.6).forEach(e=>hitEnemy(e,st.dmg*2.0*lvm,{stun:0.6,kb:0.3}));
     addRing(P.x+Math.cos(P.face)*1.1,P.y+Math.sin(P.face)*1.1,1.3,'rgba(255,235,170,%a)',0.4)},130);break;
   case 'pulso':{const h=Math.round(P.hpMax*0.24*lvm);P.hp=Math.min(P.hpMax,P.hp+h);
     addFloat(P.x,P.y,'+'+h,'#5fd17a',true);sfx('potion');
     addRing(P.x,P.y,3,'rgba(140,240,170,%a)',0.8,4);
     for(let k=0;k<14;k++)addPart(P.x+rnd(-1.5,1.5),P.y+rnd(-1.5,1.5),{vy:rnd(-3,-1.5),t:0.9,col:'#8ae0a0',r:2});break}
   case 'julgamento':{const e=nearestEnemy(6.5);if(!e){addFloat(P.x,P.y,'Sem alvo','#aaa');P.cds[i]=0.4;break}
     rtHit(()=>{if(e.dead)return;CAM.shake=5;sfx('bell');
       // raio vertical
       for(let k=0;k<20;k++)addPart(e.x+rnd(-0.3,0.3),e.y+rnd(-0.3,0.3),{t:0.5,col:'#fff4c8',r:2.6,z:-rnd(0,120)});
       addRing(e.x,e.y,1.5,'rgba(255,244,200,%a)',0.5,5);
       hitEnemy(e,st.dmg*2.3*lvm,{stun:1.2})},260);break}
  }
  updHotbar();
}
function fireProj(type,x,y,a,spd,dmg,friendly,o={}){
  PROJS.push(Object.assign({type,x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,dmg,friendly,t:3,r:0.5,h:16},o));
}
function usePotion(){
  if(P.potCd>0||P.potions<=0||P.dead||P.hp>=P.hpMax)return;
  P.potions--;P.potCd=1.4;
  const h=Math.round(P.hpMax*0.45);P.hp=Math.min(P.hpMax,P.hp+h);
  addFloat(P.x,P.y,'+'+h,'#5fd17a',true);sfx('potion');
  for(let k=0;k<10;k++)addPart(P.x+rnd(-0.7,0.7),P.y+rnd(-0.7,0.7),{vy:rnd(-3,-1),t:0.8,col:'#e05050',r:2});
  updHUD();updHotbar();
}
function dodge(){
  if(P.dodgeCd>0||P.dead)return;
  P.dodgeCd=3;P.dodging=0.22;
  const a=INPUT.mx||INPUT.my?Math.atan2(INPUT.my,INPUT.mx):P.face;
  for(let k=0;k<5;k++)addPart(P.x+Math.cos(a)*k*0.4,P.y+Math.sin(a)*k*0.4,{t:0.35,col:'rgba(200,200,220,.4)',r:4,z:-20});
  const nx=P.x+Math.cos(a)*2.0,ny=P.y+Math.sin(a)*2.0;
  if(!blocked(nx,ny)){P.x=nx;P.y=ny}
  updHotbar();
}

/* ================= [IA INIMIGA] ================= */
function updEnemy(e,dt){
  e.animT+=dt*(e.moving?1:0.3);
  if(e.hurtT>0)e.hurtT-=dt;
  if(e.atkT>0)e.atkT-=dt;
  if(e.stun>0){e.stun-=dt;e.moving=false;return}
  if(e.dead){e.deadT-=dt*1.4;return}
  // DoTs
  e.dots=e.dots.filter(d=>{d.t-=dt;d.tick-=dt;
    if(d.tick<=0){d.tick=0.5;e.hp-=d.dps*0.5;addFloat(e.x,e.y,Math.round(d.dps*0.5),'#8adf5a');if(e.hp<=0){killEnemy(e);return false}}
    return d.t>0});
  if(e.dead)return;
  // aliado (sombra servil)
  if(e.friend){
    e.life-=dt;if(e.life<=0){e.dead=true;e.deadT=0.5;return}
    const tgt=(()=>{let b=null,bd=9;ENEMIES.forEach(o=>{if(o.dead||o.friend)return;const d=dist(e.x,e.y,o.x,o.y);if(d<bd){bd=d;b=o}});
      if(BOSS&&!BOSS.dead&&dist(e.x,e.y,BOSS.x,BOSS.y)<bd)b=BOSS;return b})();
    if(!tgt){const d=dist(e.x,e.y,P.x,P.y);e.moving=d>1.6;
      if(e.moving){const a=Math.atan2(P.y-e.y,P.x-e.x);e.face=a;tryMove(e,Math.cos(a),Math.sin(a),dt)}return}
    const d=dist(e.x,e.y,tgt.x,tgt.y);e.face=Math.atan2(tgt.y-e.y,tgt.x-e.x);
    if(d>1.1){e.moving=true;tryMove(e,Math.cos(e.face),Math.sin(e.face),dt)}
    else{e.moving=false;e.acdT-=dt;if(e.acdT<=0){e.acdT=e.acd;e.atkT=e.atkDur=0.35;
      setTimeout(()=>{if(!tgt.dead){if(tgt===BOSS){BOSS.hp-=e.dmgv;BOSS.hurtT=0.1;addFloat(BOSS.x,BOSS.y,Math.round(e.dmgv),'#c9a3ff');if(BOSS.hp<=0)bossDie()}else hitEnemy(tgt,e.dmgv,{noCrit:true})}},150)}}
    return;
  }
  const dP=dist(e.x,e.y,P.x,P.y);
  // emboscada do verme
  if(e.ambush&&e.emergeT<1){
    if(dP<3.4){e.emergeT=Math.min(1,e.emergeT+dt*2);
      if(e.emergeT>=1){addRing(e.x,e.y,1,'rgba(120,100,60,%a)',0.4);
        for(let k=0;k<8;k++)addPart(e.x+rnd(-0.5,0.5),e.y+rnd(-0.5,0.5),{vy:rnd(-3,-1),t:0.5,col:'#5a4a30',r:2.4})}}
    return;
  }
  if(!e.aggro){
    if(dP<(e.elite?7:5.5))e.aggro=true;
    else{ // vagar
      e.wanderT-=dt;
      if(e.wanderT<=0){e.wanderT=rnd(2,5);e.wa=rnd(0,Math.PI*2);e.wd=rnd(0.5,1.5)}
      if(e.wd>0){e.moving=true;e.face=e.wa;tryMove(e,Math.cos(e.wa)*0.4,Math.sin(e.wa)*0.4,dt);e.wd-=dt}
      else e.moving=false;
      return}
  }
  if(dP>26){e.aggro=false;return}
  const aP=Math.atan2(P.y-e.y,P.x-e.x);e.face=aP;
  // fugir (cultista ferido)
  if(e.fleeing){e.moving=true;tryMove(e,-Math.cos(aP),-Math.sin(aP),dt);
    if(dP>9)e.fleeing=false;return}
  // ranged: manter distância
  if(e.ranged){
    if(dP<e.kite){e.moving=true;tryMove(e,-Math.cos(aP)*0.8,-Math.sin(aP)*0.8,dt)}
    else if(dP>e.range){e.moving=true;tryMove(e,Math.cos(aP),Math.sin(aP),dt)}
    else{e.moving=false;e.acdT-=dt;
      if(e.acdT<=0){e.acdT=e.acd;e.atkT=e.atkDur=0.4;
        const pr=fireProj(e.ranged==='witch'?'witch':'arrow',e.x,e.y,aP,e.ranged==='witch'?4.5:6,e.dmg,false,{});
        if(e.pools&&chance(0.5)){setTimeout(()=>{if(!e.dead)HAZARDS.push({x:P.x,y:P.y,r:1.4,dps:e.dmg*0.5,t:7,
          col:'rgba(90,200,60,.15)',col2:'rgba(120,240,80,.3)',pcol:'#8adf5a',tag:'poison'})},400)}}}
    return;
  }
  // melee
  if(dP>e.range){e.moving=true;
    // cerco dos carniçais: leve ângulo lateral
    const off=ENEMY_DEFS[e.type].pack?Math.sin(e.seed*3+TIME*0.7)*0.5:0;
    tryMove(e,Math.cos(aP+off),Math.sin(aP+off),dt)}
  else{e.moving=false;e.acdT-=dt;
    if(e.acdT<=0){e.acdT=e.acd;e.atkT=e.atkDur=e.type==='guardian'?0.55:0.35;
      const dm=e.dmg,poison=e.poison;
      setTimeout(()=>{if(e.dead||P.dead)return;
        if(dist(e.x,e.y,P.x,P.y)<e.range+0.5){hitPlayer(dm,e);
          if(poison&&chance(0.5)){P.dots.push({dps:3,t:4,tick:0.5,tag:'poison'});toast('☠️ Você foi envenenado!')}}},e.type==='guardian'?420:200)}}
}

function startBoss(){
  if(BOSS||WORLD.bossDead)return;
  BOSS={x:80,y:15.5,face:Math.PI/2,hp:BOSS_DEF.hp,maxhp:BOSS_DEF.hp,dmg:BOSS_DEF.dmg,armor:BOSS_DEF.armor,
    scale:BOSS_DEF.scale,phase:1,atkT:0,atkDur:1,hurtT:0,dead:false,deadT:1,stun:0,moving:false,animT:0,seed:1,
    acdT:2.5,waveT:5,summonT:8,block:0,dots:[],aggroed:true};
  $('#bossname').textContent=BOSS_DEF.nome;
  $('#bosswrap').classList.remove('hidden');
  centerMsg('MALACHAR, O SINO ENTERRADO',3.2);
  toast('☠️ '+BOSS_DEF.intro);
  sfx('bell');CAM.shake=6;
  if(QUEST.stage===2){QUEST.stage=3;updQuest()}
}
function updBoss(b,dt){
  if(b.dead){b.deadT-=dt*0.6;if(b.deadT<=-0.5){BOSS=null}return}
  if(b.hurtT>0)b.hurtT-=dt;
  if(b.atkT>0)b.atkT-=dt;
  $('#bossfill').style.width=clamp(b.hp/b.maxhp*100,0,100)+'%';
  // fase 2
  if(b.phase===1&&b.hp<=b.maxhp*0.5){b.phase=2;
    centerMsg('O SINO TOCA',2.6);sfx('bell');CAM.shake=10;
    addRing(b.x,b.y,7,'rgba(255,190,60,%a)',1.4,7);
    toast('🔔 A arena escurece. Malachar desperta de verdade.');
    for(let i=0;i<3;i++){const a=rnd(0,6.28);spawnEnemy('cultist',b.x+Math.cos(a)*3,b.y+Math.sin(a)*3,4,{summoned:true,aggro:true})}}
  if(b.stun>0){b.stun-=dt;return}
  const dP=dist(b.x,b.y,P.x,P.y);
  const aP=Math.atan2(P.y-b.y,P.x-b.x);b.face=aP;
  if(dP>b.scale*0.8+1.1){b.moving=true;tryMove(b,Math.cos(aP),Math.sin(aP),dt);b.animT+=dt}
  else b.moving=false;
  // golpe de corrente
  b.acdT-=dt;
  if(b.acdT<=0&&dP<3.2){b.acdT=b.phase===2?2.0:2.8;b.atkT=b.atkDur=0.6;
    setTimeout(()=>{if(b.dead||P.dead)return;CAM.shake=6;sfx('hit');
      addRing(b.x+Math.cos(b.face)*1.6,b.y+Math.sin(b.face)*1.6,1.8,'rgba(200,180,140,%a)',0.4,4);
      if(dist(b.x,b.y,P.x,P.y)<3.4)hitPlayer(b.dmg,b)},450)}
  // pisada pesada (área ao redor)
  if(!b._stompT)b._stompT=6;
  b._stompT-=dt;
  if(b._stompT<=0&&dP<4){b._stompT=b.phase===2?5:8;b.atkT=b.atkDur=0.7;
    setTimeout(()=>{if(b.dead)return;CAM.shake=9;sfx('hit');
      addRing(b.x,b.y,3.4,'rgba(160,130,90,%a)',0.6,7);
      for(let k=0;k<16;k++)addPart(b.x+rnd(-2.5,2.5),b.y+rnd(-2.5,2.5),{vy:rnd(-3,-1),t:0.7,col:'#7a6a50',r:2.6});
      if(dist(b.x,b.y,P.x,P.y)<3.6)hitPlayer(b.dmg*1.2,b)},550)}
  // invocação
  b.summonT-=dt;
  if(b.summonT<=0){b.summonT=b.phase===2?9:12;
    centerMsg('« Levantem-se »',1.4);sfx('bell');
    for(let i=0;i<2;i++){const a=rnd(0,6.28);const e=spawnEnemy('ghoul',b.x+Math.cos(a)*2.5,b.y+Math.sin(a)*2.5,3,{summoned:true,aggro:true});
      addRing(e.x,e.y,1,'rgba(120,240,140,%a)',0.5)}}
  // fase 2: ondas do sino + zonas
  if(b.phase===2){
    b.waveT-=dt;
    if(b.waveT<=0){b.waveT=4.2;sfx('bell');
      addRing(b.x,b.y,8,'rgba(255,200,80,%a)',1.5,6);
      b._wave={r:0.5,hit:false};
      // zona perigosa sob o jogador
      HAZARDS.push({x:P.x,y:P.y,r:1.6,dps:10,t:5,delay:0.9,
        col:'rgba(255,170,50,.13)',col2:'rgba(255,190,70,.35)',pcol:'#ffb057',tag:'shadow'})}
    if(b._wave){b._wave.r+=dt*5.5;
      const wr=b._wave.r,d=dist(b.x,b.y,P.x,P.y);
      addRing(b.x,b.y,wr,'rgba(255,190,70,%a)',0.12,4);
      if(!b._wave.hit&&Math.abs(d-wr)<0.5&&!P.dodging){b._wave.hit=true;hitPlayer(b.dmg*0.8,b,'shadow');
        toast('🔔 A Onda de Culpa te alcançou.')}
      if(wr>9)b._wave=null}
  }
}
function bossDie(){

  $('#bosswrap').classList.add('hidden');

/* ================= [UPDATE PRINCIPAL] ================= */
let DT=1/60;
function update(dt){
  TIME+=dt;TICK++;
  if(CAM.shake>0)CAM.shake=Math.max(0,CAM.shake-dt*18);
  if(STATE==='title'||STATE==='select')return;
  if(!P||!WORLD)return;
  const st=P.stats();
  // ---- player ----
  if(!P.dead&&STATE==='play'){
    let mx=INPUT.mx,my=INPUT.my;
    if(MOB.on){mx=MOB.jx;my=MOB.jy}
    const mlen=Math.hypot(mx,my);
    if(mlen>0.1){P.moving=true;P.animT+=dt;
      const a=Math.atan2(my,mx);
      if(P.atkT<=0)P.face=a;
      tryMove(P,mx/mlen,my/mlen,dt)}
    else P.moving=false;
    if(P.atkT>0)P.atkT-=dt;
    if(P.hurtT>0)P.hurtT-=dt;
    if(P.dodging>0)P.dodging-=dt;
    P.atkCd-=dt;P.dodgeCd-=dt;P.potCd-=dt;
    for(let i=0;i<3;i++)P.cds[i]=Math.max(0,P.cds[i]-dt);
    // regen
    P.hp=Math.min(P.hpMax,P.hp+st.regen*dt);
    P.mp=Math.min(P.mpMax,P.mp+(3+P.level*0.4)*dt);
    P.hpMax=st.hpMax;P.mpMax=st.mpMax;
    // buffs
    P.buffs=P.buffs.filter(b=>{b.t-=dt;return b.t>0});
    if(!P.buffs.some(b=>b.k==='barreira'))P.shield=0;
    // dots no player
    P.dots=P.dots.filter(d=>{d.t-=dt;d.tick-=dt;
      if(d.tick<=0){d.tick=0.5;hitPlayer(d.dps*0.5,null,d.tag)}return d.t>0});
    // hazards
    HAZARDS.forEach(h=>{if(h.delay>0){h.delay-=dt;return}
      if(dist(P.x,P.y,h.x,h.y)<h.r&&!P.dodging){h.acc=(h.acc||0)+dt;
        if(h.acc>0.5){h.acc=0;hitPlayer(h.dps*0.5,null,h.tag)}}});
    // ataque segurando
    if(INPUT.atk)basicAttack();
    // pegar drops
    for(let i=DROPS.length-1;i>=0;i--){const d=DROPS[i];
      if(dist(P.x,P.y,d.x,d.y)<0.9){
        if(d.kind==='gold'){P.gold+=d.v;sfx('gold');addFloat(d.x,d.y,'+'+d.v+' 🪙','#ffcf5a')}
        else if(d.kind==='potion'){if(P.potions>=P.maxPotions){continue}P.potions++;sfx('pickup');addFloat(d.x,d.y,'+ Poção','#e05050')}
        else if(d.kind==='mat'){P.mats=(P.mats||0)+1;sfx('pickup');addFloat(d.x,d.y,'+ Sucata de Ferro','#b8b8c0')}
        else{if(P.inv.length>=40){toast('🎒 Inventário cheio!');continue}
          P.inv.push(d.item);sfx('pickup');
          addFloat(d.x,d.y,d.item.nome,RAR_COLOR[d.item.rar]);
          if(RARS.indexOf(d.item.rar)>=2)toast(`<span style="color:${RAR_COLOR[d.item.rar]}">◆ ${d.item.nome}</span>`)}
        DROPS.splice(i,1);updHUD()}}
    // trigger do chefe
    if(!WORLD.bossDead&&!BOSS&&dist(P.x,P.y,80,18)<6.5)startBoss();
    // interação próximo
    updInteract();
  }
  // ---- inimigos ----
  ENEMIES.forEach(e=>updEnemy(e,dt));
  for(let i=ENEMIES.length-1;i>=0;i--)if(ENEMIES[i].dead&&ENEMIES[i].deadT<=0)ENEMIES.splice(i,1);
  if(BOSS)updBoss(BOSS,dt);
  // ---- spawner ----
  if(TICK%30===0)WORLD.spawns.forEach(s=>{
    const d=dist(s.x,s.y,P.x,P.y);
    if(d<30&&d>10&&s.alive<=0&&(!s.spawned||TIME-s.tresp>75)){
      s.spawned=true;s.tresp=TIME;s.alive=s.n;
      for(let i=0;i<s.n;i++){const e=spawnEnemy(s.type,s.x+rnd(-1.5,1.5),s.y+rnd(-1.5,1.5),s.lvl);
        e.spawnRef=s}}});
  ENEMIES.forEach(e=>{if(e.dead&&e.spawnRef&&!e.counted){e.counted=true;e.spawnRef.alive--}});
  // ---- projéteis ----
  for(let i=PROJS.length-1;i>=0;i--){const p=PROJS[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.t-=dt;
    let del=p.t<=0||blocked(p.x,p.y);
    if(p.type==='orb'&&chance(0.5))addPart(p.x,p.y,{t:0.3,col:'rgba(120,170,255,.6)',r:2.5,z:-16});
    if(p.type==='witch'&&chance(0.5))addPart(p.x,p.y,{t:0.3,col:'rgba(140,230,90,.5)',r:2,z:-16});
    if(p.friendly){
      const test=e=>{if(del&&!p.pierce)return;if(e.dead||e.friend)return;
        if(dist(p.x,p.y,e.x,e.y)<0.7){hitEnemy(e,p.dmg,{});if(!p.pierce)del=true}};
      ENEMIES.forEach(test);if(BOSS&&!BOSS.dead)test(BOSS);
      if(BOSS&&!BOSS.dead&&BOSS.hp<=0)bossDie();
    }else if(!P.dead&&!P.dodging&&dist(p.x,p.y,P.x,P.y)<0.7){hitPlayer(p.dmg,null,p.type==='witch'?'poison':null);del=true}
    if(del)PROJS.splice(i,1)}
  // dano no chefe via hitEnemy genérico
  if(BOSS&&!BOSS.dead&&BOSS.hp<=0)bossDie();
  // ---- partículas / floats / rings / hazards ----
  for(let i=PARTS.length-1;i>=0;i--){const p=PARTS[i];
    p.t-=dt;p.x+=(p.vx||0)*dt;p.y+=(p.vy||0)*dt;p.z+=(p.vz||-20)*dt;
    if(p.t<=0)PARTS.splice(i,1)}
  for(let i=FLOATS.length-1;i>=0;i--){const f=FLOATS[i];f.t-=dt;f.z-=34*dt;if(f.t<=0)FLOATS.splice(i,1)}
  for(let i=RINGS.length-1;i>=0;i--){const r=RINGS[i];r.t+=dt;if(r.t>=r.dur)RINGS.splice(i,1)}
  for(let i=HAZARDS.length-1;i>=0;i--){HAZARDS[i].t-=dt;if(HAZARDS[i].t<=0)HAZARDS.splice(i,1)}
  // corvos
  CROWS.forEach(c=>{c.t+=dt;c.x+=Math.cos(c.a)*2.4*dt;c.y+=Math.sin(c.a)*2.4*dt;
    if(chance(0.005))c.a+=rnd(-0.8,0.8);
    if(c.x<6||c.x>MW-6)c.a=Math.PI-c.a;if(c.y<6||c.y>MH-6)c.a=-c.a});
  // névoa
  FOGS.forEach(f=>{f.x+=f.vx*dt;f.y+=f.vy*dt;
    if(f.x<-4)f.x=MW+4;if(f.x>MW+4)f.x=-4;if(f.y<-4)f.y=MH+4;if(f.y>MH+4)f.y=-4});
  // câmera
  const tx=toSX(P.x,P.y),ty=toSY(P.x,P.y)-30;
  CAM.x=lerp(CAM.x,tx,1-Math.pow(0.001,dt));CAM.y=lerp(CAM.y,ty,1-Math.pow(0.001,dt));
  // HUD
  if(TICK%4===0){updHUD();updHotbar()}
  if(TICK%8===0)drawMinimap();
  // autosave
  if(TICK%1800===0&&STATE==='play')saveGame(true);
}

let NEARBY=null;
function updInteract(){
  NEARBY=null;let bd=1.9;
  WORLD.interact.forEach(it=>{
    if(it.kind==='chest'&&WORLD.chestsOpen.includes(it.ci))return;
    if(it.kind==='frag'&&(QUEST.stage<1||WORLD.fragsTaken.includes(it.fi)))return;
    if(it.kind==='altar'&&WORLD.altarsUsed.includes(it.ai))return;
    const d=dist(P.x,P.y,it.x,it.y);
    if(d<bd){bd=d;NEARBY=it}});
  const el=$('#interact'),mb=$('#mb-int');
  if(NEARBY){
    const lbl={npc:'Falar',chest:'Abrir baú',altar:'Rezar no altar',gate:'Examinar portão',stash:'Abrir baú de armazenamento',maptable:'Ver mesa de mapa',waystone:'Tocar a pedra',frag:'Pegar Fragmento de Sino'}[NEARBY.kind];
    el.textContent='E — '+lbl;el.classList.remove('hidden');
    if(MOB.on)mb.classList.remove('hidden');
  }else{el.classList.add('hidden');mb.classList.add('hidden')}
}
function doInteract(){
  if(!NEARBY||STATE!=='play')return;
  const it=NEARBY;Snd.init();
  switch(it.kind){
    case 'npc':openNPC(it.npc);break;
    case 'chest':{WORLD.chestsOpen.push(it.ci);sfx('pickup');
      const n=1+(it.tl||1);
      for(let i=0;i<n;i++)DROPS.push({kind:'item',x:it.x+rnd(-0.7,0.7),y:it.y+rnd(0.3,0.9),item:genItem(clamp(P.level+it.tl-1,1,10),it.tl),seed:rnd(0,9)});
      DROPS.push({kind:'gold',x:it.x,y:it.y+0.6,v:ri(10,30)*it.tl,seed:rnd(0,9)});
      toast('🧰 O baú range e se abre.');saveGame(true);break}
    case 'altar':{WORLD.altarsUsed.push(it.ai);sfx('quest');
      const b=pick([{k:'bless_dmg',n:'Fúria das Brasas: +20% de dano'},{k:'bless_spd',n:'Passo do Vento: +18% de velocidade'}]);
      P.buffs.push({k:b.k,t:60});addRing(P.x,P.y,2,'rgba(180,150,255,%a)',0.8,4);
      toast('🕯️ '+b.n+' (60s)');break}
    case 'gate':{openModal(`<h3>${it.nome}</h3><p class="muted" style="margin:12px 0">"${it.msg}"</p>
      <p class="tiny muted">Esta passagem será aberta numa expansão futura.</p>
      <div style="margin-top:14px"><button class="btn" onclick="closeModal()">Afastar-se</button></div>`);break}
    case 'stash':openStash();break;

function itemTipHTML(it,compare){
  let h=`<h4 style="color:${RAR_COLOR[it.rar]}">${it.icon} ${it.nome}</h4>
    <div class="tiny muted">${RAR_NAME[it.rar]} · ${it.slot==='arma'?(it.wtype||'Arma'):SLOT_NAME[it.slot]} · Nv ${it.lvl}</div>`;
  if(it.dmg)h+=`<div style="margin-top:5px">⚔ Dano: <b>${it.dmg}</b></div>`;
  if(it.armor)h+=`<div style="margin-top:5px">🛡 Armadura: <b>${it.armor}</b></div>`;
  for(const k in it.aff){const a=AFFIXES.find(x=>x.k===k);
    h+=`<div class="aff">+${it.aff[k]}${a&&a.pct?'%':''} ${a?a.n:k}</div>`}
  h+=`<div class="tiny muted" style="margin-top:5px">Venda: ${it.sell} 🪙</div>`;
  if(compare){const cur=P.equip[it.slot];
    if(cur&&cur.id!==it.id){h+=`<div class="cmp tiny"><b class="muted">Equipado: ${cur.nome}</b>`;
      const dd=(it.dmg||0)-(cur.dmg||0),da=(it.armor||0)-(cur.armor||0);
      if(it.dmg||cur.dmg)h+=`<div style="color:${dd>=0?'var(--ok)':'var(--bad)'}">Dano ${dd>=0?'+':''}${dd}</div>`;
      if(it.armor||cur.armor)h+=`<div style="color:${da>=0?'var(--ok)':'var(--bad)'}">Armadura ${da>=0?'+':''}${da}</div>`;
      h+='</div>'}}
  return h;
}

    <div class="optrow"><span>Efeitos</span><input type="range" id="o-sfx" min="0" max="1" step="0.05" value="${OPTS.volSfx}"></div>
    <div class="optrow"><span>Qualidade visual</span>${seg('o-q',['baixa','média','alta'],OPTS.quality)}</div>
    <div class="optrow"><span>Números de dano</span>${seg('o-d',['sim','não'],OPTS.dmgNums?'sim':'não')}</div>
    <div class="optrow"><span>Tamanho da interface</span>${seg('o-u',['normal','grande'],OPTS.uiSize)}</div>
    <div class="optrow"><span>Idioma</span><b class="muted">Português</b></div>
    <div style="text-align:center;margin-top:14px"><button class="btn" onclick="${fromGame?'openMenuBack()':'closeModal()'}">Fechar</button></div></div>`,'m-opts');
  $('#o-vol').oninput=e=>{OPTS.vol=+e.target.value;saveOpts();Snd.apply()};
  $('#o-mus').oninput=e=>{OPTS.volMus=+e.target.value;saveOpts();Snd.apply()};
  $('#o-sfx').oninput=e=>{OPTS.volSfx=+e.target.value;saveOpts();Snd.apply();sfx('ui')};
  const wire=(id,fn)=>{document.querySelectorAll('#'+id+' button').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('#'+id+' button').forEach(x=>x.classList.remove('on'));b.classList.add('on');fn(b.dataset.v);saveOpts();applyOpts()})};
  wire('o-q',v=>OPTS.quality=v);wire('o-d',v=>OPTS.dmgNums=v==='sim');wire('o-u',v=>OPTS.uiSize=v);
};
window.openMenuBack=function(){openMenu()};

/* ================= [HUD] ================= */
function updHUD(){
  if(!P)return;
  $('#hp-orb .fill').style.height=clamp(P.hp/P.hpMax*100,0,100)+'%';
  $('#hp-orb .val').textContent=Math.max(0,Math.round(P.hp));
  $('#mp-orb .fill').style.height=clamp(P.mp/P.mpMax*100,0,100)+'%';
  $('#mp-orb .val').textContent=Math.round(P.mp);
  $('#gold-v').textContent=fmt(P.gold);
  $('#pf-name').textContent=P.name;
  $('#pf-class').textContent=CLASSES[P.cls].nome;
  $('#pf-ico').textContent=CLASSES[P.cls].icon;
  $('#pf-lvl').textContent='Nv '+P.level;
  $('#xpfill').style.width=(P.level>=10?100:P.xp/xpNeed(P.level)*100)+'%';
}
function buildHotbar(){
  const c=CLASSES[P.cls];
  $('#hotbar').innerHTML=`
   <div class="hbslot clk" id="hb-a"><span class="key">LMB</span>⚔️<div class="cd"></div></div>
   ${c.skills.map((s,i)=>`<div class="hbslot clk" id="hb-${i}"><span class="key">${i+1}</span>${s.icon}<div class="cd"></div><div class="cdt"></div></div>`).join('')}
   <div class="hbslot clk" id="hb-p"><span class="key">Q</span>🧪<div class="cd"></div><span class="cnt" id="potcnt">3</span></div>
   <div class="hbslot clk" id="hb-d"><span class="key">SPC</span>💨<div class="cd"></div></div>`;
  $('#hb-a').onpointerdown=()=>basicAttack();
  c.skills.forEach((s,i)=>{$('#hb-'+i).onpointerdown=()=>castSkill(i)});
  $('#hb-p').onpointerdown=()=>usePotion();
  $('#hb-d').onpointerdown=()=>dodge();
  // mobile
  $('#mb-s1').textContent='';$('#mb-s1').append(c.skills[0].icon);
  $('#mb-s2').textContent='';$('#mb-s2').append(c.skills[1].icon);
  $('#mb-s3').textContent='';$('#mb-s3').append(c.skills[2].icon);
  ['s1','s2','s3'].forEach((k,i)=>{const b=$('#mb-'+k);b.innerHTML=c.skills[i].icon+'<div class="cd"></div>'});
}
function updHotbar(){
  if(!P)return;
  const c=CLASSES[P.cls];
  for(let i=0;i<3;i++){const el=$('#hb-'+i);if(!el)continue;
    const pct=P.cds[i]/c.skills[i].cd*100;
    el.querySelector('.cd').style.height=pct+'%';
    el.querySelector('.cdt').textContent=P.cds[i]>0?Math.ceil(P.cds[i]):'';
    const mb=$('#mb-s'+(i+1));if(mb)mb.querySelector('.cd').style.transform=`scale(${clamp(pct/100,0,1)})`}
  const pc=$('#potcnt');if(pc)pc.textContent=P.potions;
  const hd=$('#hb-d');if(hd)hd.querySelector('.cd').style.height=clamp(P.dodgeCd/3*100,0,100)+'%';
  const mp=$('#mb-pot');if(mp)mp.querySelector('.cd').style.transform=`scale(${clamp(P.potCd,0,1)})`;
  const md=$('#mb-dodge');if(md)md.querySelector('.cd').style.transform=`scale(${clamp(P.dodgeCd/3,0,1)})`;
}

/* ================= [TELAS — TÍTULO / SELEÇÃO / CRÉDITOS] ================= */
let SEL_CLS='guardiao',SEL_ANIM=null;
function buildSelect(){
  $('#sel-classes').innerHTML=Object.keys(CLASSES).map(k=>{const c=CLASSES[k];
    return `<div class="classcard ${k===SEL_CLS?'sel':''}" data-c="${k}">
      <div class="ci">${c.icon}</div><div><b>${c.nome}</b><br><span class="tiny muted">${'★'.repeat(c.dif)}${'☆'.repeat(3-c.dif)} dificuldade</span></div></div>`}).join('');
  document.querySelectorAll('.classcard').forEach(el=>el.onclick=()=>{SEL_CLS=el.dataset.c;sfx('ui');buildSelect()});
  const c=CLASSES[SEL_CLS];
  $('#sel-info').innerHTML=`<h2 style="font-size:24px">${c.icon} ${c.nome}</h2>
    <div class="diffstars" style="margin:3px 0">${'★'.repeat(c.dif)}${'☆'.repeat(3-c.dif)} <span class="tiny muted">dificuldade</span></div>
    <p class="small muted" style="line-height:1.5;margin-top:6px">${c.desc}</p>
    <div class="statgrid">
      <span>Vida <b>${c.base.hp}</b></span><span>${c.res} <b>${c.base.mp}</b></span>
      <span>Dano <b>${c.base.dmg}</b></span><span>Armadura <b>${c.base.armor}</b></span>
      <span>Crítico <b>${c.base.crit}%</b></span><span>Velocidade <b>${c.base.spd}</b></span></div>`;
  $('#sel-skills').innerHTML=c.skills.map(s=>`<div class="skrow"><div class="ski">${s.icon}</div>
    <div><b style="color:var(--gold2)">${s.nome}</b> <span class="tiny muted">CD ${s.cd}s</span><br><span class="tiny">${s.desc}</span></div></div>`).join('');
}
function selPreviewLoop(){
  if(STATE!=='select')return;
  const c=$('#sel-canvas'),g=c.getContext('2d');
  g.clearRect(0,0,190,230);
  const cl=CLASSES[SEL_CLS];
  // piso
  g.fillStyle='#141220';g.beginPath();g.ellipse(95,196,62,20,0,0,7);g.fill();
  const fake={x:0,y:0,isPlayer:true,cls:SEL_CLS,
    col:{armor:cl.cor.armor,trim:cl.cor.trim,accent:cl.cor.accent,cape:cl.cor.cape,skin:cl.cor.skin,glowCore:cl.cor.glow,slash:'rgba(255,240,200,',
      hood:SEL_CLS==='cacadora'?'#33201c':SEL_CLS==='arcanista'?'#242e5a':SEL_CLS==='herege'?'#1a1424':null},
    head:SEL_CLS==='herege'?'mask':SEL_CLS==='cacadora'?'hood':SEL_CLS==='arcanista'?'hood':'helm',
    weapon:cl.weapon,scale:2.5,seed:1,draw:'hum',moving:false,animT:TIME,hurtT:0,dead:false,
    atkT:(TIME%2.4)<0.35?0.35-(TIME%2.4):0,atkDur:0.35,face:0,buffs:[],hp:1,maxhp:1,friend:true};
  // desenha manualmente (sem câmera)
  const saveW2C=worldToCam;
  window.worldToCam=()=>[95,196];
  try{drawEntityOn(g,fake)}finally{window.worldToCam=saveW2C}
  requestAnimationFrame(selPreviewLoop);
}
function drawEntityOn(g,e){const old=ctx;ctx=g;try{drawEntity(e)}finally{ctx=old}}
function showSelect(){
  STATE='select';
  $('#scr-title').classList.add('hidden');
  $('#scr-select').classList.remove('hidden');
  buildSelect();
  $('#nameinput').value='';
  requestAnimationFrame(selPreviewLoop);
}
function startNewGame(){
  const name=($('#nameinput').value.trim()||'Errante');
  startGame({new:true,name,cls:SEL_CLS});
}
function startGame(o){
  Snd.init();
  WORLD=genWorld();bakeMinimap();
  ENEMIES=[];PROJS=[];PARTS=[];DROPS=[];FLOATS=[];RINGS=[];HAZARDS=[];BOSS=null;
  if(o.new){P=makePlayer(o.cls,o.name);QUEST.stage=0;QUEST.frags=0}
  else{ // load
    const s=o.save;
    P=makePlayer(s.cls,s.name);
    P.level=s.level;P.xp=s.xp;P.gold=s.gold;P.potions=s.potions;P.mats=s.mats||0;
    P.inv=s.inv||[];P.equip=Object.assign(P.equip,s.equip);P.stash=s.stash||[];
    P.skillLv=s.skillLv||[1,1,1];
    QUEST.stage=s.quest.stage;QUEST.frags=s.quest.frags;
    Object.assign(WORLD,{bossDead:s.world.bossDead,chestsOpen:s.world.chests||[],
      altarsUsed:s.world.altars||[],upgraded:s.world.upgraded,fragsTaken:s.world.fragsTaken||[]});
    const st=P.stats();P.hpMax=st.hpMax;P.mpMax=st.mpMax;P.hp=P.hpMax;P.mp=P.mpMax;
  }
  STATE='play';
  $('#scr-title').classList.add('hidden');$('#scr-select').classList.add('hidden');
  $('#hud').classList.remove('hidden');$('#bosswrap').classList.add('hidden');
  buildHotbar();updHUD();updQuest();updHotbar();
  CAM.x=toSX(P.x,P.y);CAM.y=toSY(P.x,P.y)-30;
  centerMsg('REFÚGIO DA ÚLTIMA BRASA',3);
  if(o.new)setTimeout(()=>toast('⚜ Fale com o Velho Cartógrafo (marcado com ❢).'),1200);
}
function loadGame(){
  try{const s=JSON.parse(localStorage.getItem(SAVE_KEY));
    if(!s){toast('Nenhum jogo salvo encontrado.');return}
    startGame({new:false,save:s})}
  catch(e){toast('Save corrompido.');console.error(e)}
}
function showCredits(){
  openModal(`<h3 style="text-align:center">✒ Créditos</h3>
   <p class="small muted" style="text-align:center;line-height:1.7;margin-top:10px">
   <b style="color:var(--gold2)">COROA DO ABISMO</b><br>Protótipo — Ato I<br><br>
   Mundo, arte procedural, código e trilha:<br>criados para este protótipo.<br><br>
   Universo, personagens e nomes 100% originais.<br><br>
   <span class="tiny">Feito com Canvas 2D puro — sem bibliotecas externas.</span></p>
   <div style="text-align:center;margin-top:12px"><button class="btn" onclick="closeModal()">Fechar</button></div>`);
}

/* ================= [INPUT — PC] ================= */
const INPUT={mx:0,my:0,atk:false};
const KEYS={};
const MOUSE={x:0,y:0};
window.addEventListener('keydown',e=>{
  if(e.repeat)return;const k=e.key.toLowerCase();KEYS[k]=true;Snd.init();
  if(STATE==='select'&&k==='enter'){startNewGame();return}
  if(STATE!=='play'&&STATE!=='dead')return;
  if(MODAL_OPEN&&k!=='escape'&&k!=='i'&&k!=='m'&&k!=='c')return;
  switch(k){
    case '1':castSkill(0);break;case '2':castSkill(1);break;case '3':castSkill(2);break;
    case 'q':usePotion();break;case ' ':dodge();e.preventDefault();break;
    case 'e':doInteract();break;
    case 'i':MODAL_OPEN?closeModal():openInv();break;
    case 'c':MODAL_OPEN?closeModal():openChar();break;
    case 'm':MODAL_OPEN?closeModal():openMap();break;
    case 'escape':MODAL_OPEN?closeModal():openMenu();break;
  }});
window.addEventListener('keyup',e=>{KEYS[e.key.toLowerCase()]=false});
function pollKeys(){
  let x=0,y=0; // WASD em espaço de TELA → converter pra mundo iso
  if(KEYS['w']||KEYS['arrowup'])y-=1;
  if(KEYS['s']||KEYS['arrowdown'])y+=1;
  if(KEYS['a']||KEYS['arrowleft'])x-=1;
  if(KEYS['d']||KEYS['arrowright'])x+=1;
  // rotação de 45°: tela → mundo
  INPUT.mx=(x+y*2)/2.23;INPUT.my=(y*2-x)/2.23;
}
function canvas0Events(){
  canvas.addEventListener('pointermove',e=>{MOUSE.x=e.clientX;MOUSE.y=e.clientY});
  canvas.addEventListener('pointerdown',e=>{Snd.init();
    if(STATE!=='play'||MODAL_OPEN)return;
    if(e.pointerType==='touch')return; // touch usa controles próprios
    MOUSE.x=e.clientX;MOUSE.y=e.clientY;
    if(e.button===0){INPUT.atk=true;basicAttack()}});
  canvas.addEventListener('pointerup',e=>{if(e.button===0)INPUT.atk=false});
  canvas.addEventListener('contextmenu',e=>e.preventDefault());
};

/* ================= [INPUT — MOBILE] ================= */
const MOB={on:false,jx:0,jy:0,joyId:null};
function setupMobile(){
  MOB.on=('ontouchstart' in window)&&matchMedia('(pointer:coarse)').matches;
  if(!MOB.on)return;
  document.body.classList.add('mobile');
  const joy=$('#vjoy'),nub=$('#vnub');
  const jrect=()=>joy.getBoundingClientRect();
  const setJoy=(cx,cy)=>{const r=jrect();
    let dx=cx-(r.left+r.width/2),dy=cy-(r.top+r.height/2);
    const d=Math.hypot(dx,dy),max=r.width/2-18;
    if(d>max){dx*=max/d;dy*=max/d}
    nub.style.left=`calc(50% + ${dx}px)`;nub.style.top=`calc(50% + ${dy}px)`;
    // tela → mundo iso
    const sx=dx/max,sy=dy/max;
    MOB.jx=(sx+sy*2)/2.23;MOB.jy=(sy*2-sx)/2.23};
  // zona esquerda da tela vira joystick
  window.addEventListener('touchstart',e=>{Snd.init();
    for(const t of e.changedTouches){
      if(MOB.joyId===null&&t.clientX<window.innerWidth*0.45&&t.clientY>window.innerHeight*0.3){
        MOB.joyId=t.identifier;
        joy.style.left=(t.clientX-64)+'px';joy.style.top=(t.clientY-64)+'px';joy.style.bottom='auto';
        setJoy(t.clientX,t.clientY)}}},{passive:true});
  window.addEventListener('touchmove',e=>{
    for(const t of e.changedTouches)if(t.identifier===MOB.joyId)setJoy(t.clientX,t.clientY)},{passive:true});
  window.addEventListener('touchend',e=>{
    for(const t of e.changedTouches)if(t.identifier===MOB.joyId){MOB.joyId=null;MOB.jx=0;MOB.jy=0;
      const nub2=$('#vnub');nub2.style.left='50%';nub2.style.top='50%';
      $('#vjoy').style.left='22px';$('#vjoy').style.top='auto';$('#vjoy').style.bottom='96px'}},{passive:true});
  // botões
  const hold=(id,fn,rep)=>{const b=$(id);let iv=null;
    b.addEventListener('touchstart',e=>{e.preventDefault();Snd.init();fn();if(rep)iv=setInterval(fn,180)},{passive:false});
    b.addEventListener('touchend',()=>{if(iv)clearInterval(iv);iv=null})};
  hold('#mb-atk',()=>basicAttack(),true);
  hold('#mb-s1',()=>castSkill(0));hold('#mb-s2',()=>castSkill(1));hold('#mb-s3',()=>castSkill(2));
  hold('#mb-pot',()=>usePotion());hold('#mb-dodge',()=>dodge());
  hold('#mb-int',()=>doInteract());
}

/* ================= [LOOP PRINCIPAL] ================= */
let lastT=0,acc=0;
function frame(t){
  requestAnimationFrame(frame);
  const dt=Math.min(0.1,(t-lastT)/1000||0.016);lastT=t;DT=dt;
  pollKeys();
  acc+=dt;
  const step=1/60;let n=0;
  while(acc>=step&&n<4){update(step);acc-=step;n++}
  render();
}
function resize(){
  VW=window.innerWidth;VH=window.innerHeight;
  const dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=VW*dpr;canvas.height=VH*dpr;
  canvas.style.width=VW+'px';canvas.style.height=VH+'px';
  ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);
}
/* ================= [INIT] ================= */
function init(){
  canvas=$('#game');resize();window.addEventListener('resize',resize);
  loadOpts();bakeAll();bakeLights();
  canvas0Events();
  setupMobile();
  // botões do título
  $('#bt-new').onclick=()=>{Snd.init();sfx('ui');showSelect()};
  $('#bt-load').onclick=()=>{Snd.init();if(!hasSave()){toast('Nenhum jogo salvo ainda.');return}loadGame()};
  $('#bt-opts').onclick=()=>{Snd.init();openOpts(false)};
  $('#bt-credits').onclick=()=>{Snd.init();showCredits()};
  $('#bt-start').onclick=()=>startNewGame();
  $('#bt-selback').onclick=()=>{STATE='title';$('#scr-select').classList.add('hidden');$('#scr-title').classList.remove('hidden')};
  $('#tb-inv').onclick=()=>MODAL_OPEN?closeModal():openInv();
  $('#tb-char').onclick=()=>MODAL_OPEN?closeModal():openChar();
  $('#tb-map').onclick=()=>MODAL_OPEN?closeModal():openMap();
  $('#tb-menu').onclick=()=>MODAL_OPEN?closeModal():openMenu();
  $('#bt-load').disabled=!hasSave();
  requestAnimationFrame(frame);
}
// referências de debug/teste
window.CDA={get P(){return P},get WORLD(){return WORLD},get ENEMIES(){return ENEMIES},get BOSS(){return BOSS},
  get QUEST(){return QUEST},get STATE(){return STATE},startGame,showSelect,startNewGame,spawnEnemy,genItem,
  startBoss,bossDie,hitEnemy,saveGame,loadGame,castSkill,basicAttack,usePotion,doInteract,openInv,openChar,calcStats};
init();
</script>
