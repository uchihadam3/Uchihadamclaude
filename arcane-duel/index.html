    <style>
      /*
       * A tela de carregamento.
       *
       * Ela vive no HTML, e não no React, porque o ponto dela é justamente
       * aparecer **antes** de qualquer JavaScript rodar. Uma tela de
       * carregamento que só aparece depois do bundle baixar não carrega nada:
       * ela pisca no fim. Esta pinta no primeiro frame e sai quando o jogo
       * está pronto de verdade.
       */
      #carregando {
        position: fixed;
        inset: 0;
        z-index: 90;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: radial-gradient(120% 90% at 50% 35%, #1a1526 0%, #0d0a12 62%, #070509 100%);
        font-family: 'Courier New', monospace;
        transition: opacity 420ms ease;
      }
      #carregando.saindo {
        opacity: 0;
        pointer-events: none;
      }
      #carregando .marca {
        color: #e8c76a;
        font-size: clamp(22px, 6vw, 44px);
        letter-spacing: 0.34em;
        text-indent: 0.34em;
        font-weight: 700;
        text-shadow: 0 3px 0 #6b4a12, 0 0 22px rgba(232, 199, 106, 0.28);
      }
      #carregando .sub {
        color: #8a7fa8;
        font-size: clamp(10px, 2.6vw, 13px);
        letter-spacing: 0.3em;
        text-indent: 0.3em;
      }
      #carregando .barra {
        width: min(340px, 62vw);
        height: 14px;
        border: 2px solid #3a3350;
        background: #14101d;
        box-shadow: inset 0 2px 0 #0a0810;
        padding: 2px;
      }
      #carregando .barra i {
        display: block;
        height: 100%;
        width: 18%;
        background: repeating-linear-gradient(
          90deg,
          #e8c76a 0 6px,
          #b8933f 6px 12px
        );
        animation: enchendo 2.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes enchendo {
        0% { width: 6%; }
        70% { width: 88%; }
        100% { width: 98%; }
      }
      #carregando .dica {
        color: #6f6890;
        font-size: clamp(11px, 2.8vw, 14px);
        max-width: min(520px, 84vw);
        text-align: center;
        line-height: 1.5;
      }
      @media (prefers-reduced-motion: reduce) {
        #carregando .barra i { animation: none; width: 70%; }
      }
    </style>
    <script type="module" crossorigin src="./assets/index-BqRQqvP-.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/phaser-DXXWZowi.js">
    <link rel="stylesheet" crossorigin href="./assets/index-DPuYSJJQ.css">
  </head>
  <body>
    <div id="raiz"></div>
    <div id="carregando">
      <div class="marca">ARCANE DUEL</div>
      <div class="sub">UMA DUNGEON &middot; CINQUENTA SALAS</div>
      <div class="barra"><i></i></div>
      <p class="dica" id="dica">Carregando…</p>
    </div>
    <script>
      /* Uma dica por carregamento. São regras reais do jogo, não frases soltas. */
      (function () {
        var dicas = [
          'A luta acontece sozinha. Sua decisão é o draft.',
          'Sinergia vale mais que poder bruto: três peças que conversam batem quatro que não.',
          'Você tem duas rerrolagens por categoria. Guardar uma para o fim quase nunca compensa.',
          'As poções curam sozinhas abaixo de 30% de vida, e voltam a encher depois de cada boss.',
          'Ruptura quebra armadura. Contra inimigos blindados, ela vale mais que dano puro.',
          'Momentum acumula com o que você acerta e é gasto pelas habilidades mais caras.',
          'Os bosses estão nas salas 10, 20, 30, 40 e 50.',
          'Cada semente reproduz a run inteira. Uma boa semente pode ser repetida.'
        ];
        var alvo = document.getElementById('dica');
        if (alvo) alvo.textContent = dicas[Math.floor(Math.random() * dicas.length)];
      })();
    </script>
  </body>
</html>
