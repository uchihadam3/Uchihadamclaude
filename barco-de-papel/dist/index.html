<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#e9c893" />
    <title>Oásis do Barco de Papel — Demo Visual</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M3 15h18l-3 4H6z' fill='%23f5efe0'/%3E%3Cpath d='M12 5l6 9H6z' fill='%23f5efe0'/%3E%3C/svg%3E" />
    <script type="module" crossorigin src="./assets/index-DIF0thTc.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CItKDmV-.css">
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>

      <!-- Placa de título, estilo pergaminho/madeira -->
      <div class="title-plaque">
        <div class="tp-kicker">Demo Visual · Aprovação de Direção de Arte</div>
        <div class="tp-name">Oásis do Barco de Papel</div>
      </div>

      <!-- Doca de controles (nunca se sobrepõe: layout em flex) -->
      <div class="dock">
        <div class="phase-panel">
          <div class="phase-switch" id="phaseSwitch">
            <button class="ph-opt active" data-mode="plan">Planejamento</button>
            <button class="ph-opt" data-mode="run">Execução</button>
          </div>
          <button class="run-plaque" id="runBtn"><span class="rp-carve">Executar Simulação</span></button>
        </div>
        <div class="tool-shelf">
          <div class="shelf-wood"></div>
          <div class="tools" id="tools"></div>
        </div>
      </div>

      <!-- Legenda inferior -->
      <div class="hint" id="hint">Selecione uma ferramenta natural e observe o oásis. Esta é uma amostra visual do jogo final.</div>
    </div>
  </body>
</html>
