<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>A Casa das 99 Portas</title>
<style>
:root{
  --paper:#e9dfc4; --paper2:#ddd0a8; --paper-dark:#c9b98a;
  --ink:#2b2620; --ink-soft:#4a4030; --ink-faint:#6b5f48;
  --wood:#5a3e26; --wood-dark:#3a2717; --wood-light:#7a5636;
  --gold:#a8842f; --gold-light:#d4af5a;
  --danger:#7a2320; --danger-light:#a83b34;
  --myst:#4a3a6a;
  --shadow: rgba(20,15,5,.55);
  --font-title:'Georgia','Times New Roman',serif;
  --font-body:'Georgia','Times New Roman',serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;min-height:100%;}
body{
  font-family:var(--font-body); color:var(--ink);
  background:
    radial-gradient(ellipse at 50% -10%, rgba(0,0,0,.25), transparent 60%),
    linear-gradient(180deg,#1c1712,#0e0b08 60%);
  min-height:100vh;
}
::-webkit-scrollbar{width:10px;}
::-webkit-scrollbar-thumb{background:var(--wood);border-radius:6px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- textura de papel / tinta cruzada (SVG filter) ---------- */
.paper-texture{
  background-color:var(--paper);
  background-image:
    repeating-linear-gradient(115deg, rgba(60,45,20,.035) 0px, rgba(60,45,20,.035) 1px, transparent 1px, transparent 3px),
    repeating-linear-gradient(25deg, rgba(60,45,20,.03) 0px, rgba(60,45,20,.03) 1px, transparent 1px, transparent 4px),
    radial-gradient(ellipse at 30% 20%, rgba(255,250,230,.4), transparent 55%),
    radial-gradient(ellipse at 80% 90%, rgba(0,0,0,.08), transparent 60%);
}
.ink-border{border:2px solid var(--ink-soft); box-shadow:0 0 0 1px rgba(43,38,32,.15) inset, 0 10px 26px var(--shadow);}

#app{max-width:1180px;margin:0 auto;padding:14px 14px 60px;}
#fx-layer{position:fixed;inset:0;pointer-events:none;z-index:999;}

button{font-family:inherit;cursor:pointer;}
.btn{
  background:linear-gradient(180deg,var(--wood-light),var(--wood));
  color:#f0e6cf; border:1px solid var(--wood-dark); padding:10px 16px;border-radius:4px;
  font-weight:700;font-size:13.5px;letter-spacing:.3px;
  box-shadow:0 3px 0 var(--wood-dark), 0 6px 14px rgba(0,0,0,.35);
  transition:transform .1s ease;
}
.btn:hover{transform:translateY(-1px);}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--wood-dark);}
.btn.gold{background:linear-gradient(180deg,var(--gold-light),var(--gold));color:#2a1e05;border-color:#7a5f1f;box-shadow:0 3px 0 #7a5f1f,0 6px 14px rgba(0,0,0,.35);}
.btn.danger{background:linear-gradient(180deg,var(--danger-light),var(--danger));color:#fdeceb;border-color:#4a1512;box-shadow:0 3px 0 #4a1512,0 6px 14px rgba(0,0,0,.35);}
.btn.sm{padding:6px 11px;font-size:12px;}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}
.btn.ghost{background:rgba(43,38,32,.08);color:var(--ink-soft);border:1px solid rgba(43,38,32,.3);box-shadow:none;}

.row{display:flex;align-items:center;}
.between{justify-content:space-between;}
.wrap{flex-wrap:wrap;}
.gap6{gap:6px;} .gap8{gap:8px;} .gap10{gap:10px;} .gap14{gap:14px;}
.center{display:flex;align-items:center;justify-content:center;}
.hidden{display:none !important;}
h1,h2,h3,h4{margin:0;font-weight:700;font-family:var(--font-title);}
p{margin:0;}
.tiny{font-size:11.5px;} .small{font-size:13px;}
.muted{color:var(--ink-faint);}
.card{background:var(--paper);border-radius:6px;padding:14px;position:relative;}
.card.dark{background:#241d17;color:#e8dfc4;}

/* ---------- topbar ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 6px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:10px;}
.brand .mark{width:38px;height:38px;border-radius:3px;background:linear-gradient(160deg,var(--wood-light),var(--wood-dark));
  display:flex;align-items:center;justify-content:center;font-size:19px;color:var(--gold-light);border:1px solid var(--wood-dark);}
.brand .name{font-size:17px;font-weight:700;color:#e8dfc4;font-family:var(--font-title);}
.brand .sub{font-size:10.5px;color:#a89568;margin-top:-2px;letter-spacing:.4px;}
.nav-pills{display:flex;gap:6px;flex-wrap:wrap;}
.pill{padding:7px 12px;border-radius:3px;background:rgba(233,223,196,.08);border:1px solid rgba(233,223,196,.25);color:#cfc39f;font-size:12px;font-weight:700;}
.pill.active{background:var(--gold);color:#2a1e05;border-color:#7a5f1f;}
.pill:disabled{opacity:.35;}

/* ---------- start screen ---------- */
.start-wrap{max-width:640px;margin:40px auto;text-align:center;}
.start-wrap h1{font-size:clamp(28px,5vw,44px);color:#f0e6cf;text-shadow:0 2px 8px rgba(0,0,0,.6);}
.start-wrap .subtitle{color:var(--gold-light);font-style:italic;margin-top:6px;font-size:15px;}
.start-wrap .lore{color:#cfc39f;margin-top:22px;font-size:14px;line-height:1.7;text-align:left;}
.name-prompt{margin-top:26px;}
.name-prompt input{
  width:100%;max-width:340px;padding:11px 14px;border-radius:4px;border:1px solid var(--wood-dark);
  background:var(--paper);color:var(--ink);font-size:15px;text-align:center;font-family:var(--font-body);
}

/* ---------- room stage ---------- */
.room-wrap{display:grid;grid-template-columns:1fr 300px;gap:14px;align-items:start;}
@media (max-width:900px){.room-wrap{grid-template-columns:1fr;}}
.room-stage{border-radius:6px;overflow:hidden;position:relative;}
.room-head{padding:12px 16px;display:flex;justify-content:space-between;align-items:baseline;background:rgba(0,0,0,.18);}
.room-head h2{color:#f0e6cf;font-size:19px;}
.room-head .rid{color:var(--gold-light);font-size:12px;font-weight:700;}
.room-illustration{
  position:relative; background:#0e0b08;
}
.room-narration{padding:10px 16px;font-size:13.5px;line-height:1.6;font-style:italic;color:var(--ink-soft);border-top:1px dashed rgba(43,38,32,.35);}
.symbol-row{position:absolute;top:10px;right:12px;display:flex;gap:5px;z-index:2;}
.symbol-badge{width:26px;height:26px;border-radius:50%;background:rgba(43,38,32,.85);border:1px solid rgba(233,223,196,.4);
  display:flex;align-items:center;justify-content:center;color:#e8dfc4;font-size:13px;}

/* cenario em perspectiva (svg) */
.room-scene{display:block;width:100%;height:auto;aspect-ratio:640/400;}
.scene-door{cursor:pointer;}
.scene-door .doorpoly{transition:filter .15s;}
.scene-door:hover .doorpoly{filter:brightness(1.22);}
.scene-hotspot{cursor:pointer;}
.scene-hotspot text{transition:filter .15s;}
.scene-hotspot:hover text{filter:drop-shadow(0 0 5px rgba(212,175,90,.9));}
.scene-hotspot.examined{opacity:.55;}
.hotspot.has-item{border-color:var(--gold);background:rgba(168,132,47,.14);}

/* painel lateral */
.side-panel{display:flex;flex-direction:column;gap:12px;}
.side-panel .card h4{font-size:13px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;}
.inv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;}
.inv-item{
  background:var(--paper2);border:1px solid var(--ink-faint);border-radius:4px;padding:8px 4px;text-align:center;cursor:pointer;
  font-size:10.5px;color:var(--ink-soft);transition:background .15s;
}
.inv-item .ic{font-size:19px;display:block;margin-bottom:2px;}
.inv-item:hover{background:#eadfc0;}
.inv-item.selected{border-color:var(--gold);box-shadow:0 0 0 2px rgba(168,132,47,.4);background:#f0e4c4;}
.inv-empty{font-size:11.5px;color:var(--ink-faint);grid-column:span 3;text-align:center;padding:10px 0;}
.selected-hint{font-size:11px;color:var(--ink-faint);margin-top:8px;text-align:center;}

.journal-list{max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;}
.journal-entry{font-size:11.5px;line-height:1.5;color:var(--ink-soft);border-left:2px solid var(--gold);padding:3px 0 3px 8px;}
.journal-empty{font-size:11.5px;color:var(--ink-faint);}

.narrator-line{
  margin-top:10px;padding:10px 13px;background:rgba(43,38,32,.9);color:#e8dfc4;border-radius:4px;
  font-size:12.5px;font-style:italic;line-height:1.5;border-left:3px solid var(--gold);
  animation:narratorFade .4s ease;
}
@keyframes narratorFade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

/* pop-up de exame/interação */
.modal-overlay{
  position:fixed;inset:0;z-index:1000;background:rgba(10,7,4,.72);
  display:flex;align-items:center;justify-content:center;padding:20px;
  animation:modalFadeIn .18s ease;
}
@keyframes modalFadeIn{from{opacity:0;}to{opacity:1;}}
.modal-card{
  position:relative;max-width:440px;width:100%;padding:26px 24px 22px;text-align:center;
  animation:modalPop .22s cubic-bezier(.2,1.4,.4,1);
  box-shadow:0 20px 50px rgba(0,0,0,.55), 0 0 0 1px rgba(233,223,196,.08);
}
@keyframes modalPop{from{opacity:0;transform:scale(.88) translateY(10px);}to{opacity:1;transform:scale(1) translateY(0);}}
.modal-x{
  position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;
  background:rgba(43,38,32,.12);border:1px solid rgba(43,38,32,.3);color:var(--ink-soft);
  font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;
}
.modal-x:hover{background:rgba(43,38,32,.22);}
.modal-icon{font-size:38px;margin-bottom:6px;}
.modal-title{font-size:17px;color:var(--ink);margin-bottom:10px;}
.modal-body{font-size:13.5px;line-height:1.65;color:var(--ink-soft);white-space:pre-line;}
.modal-card.modal-good .modal-title{color:#3d6b2e;}
.modal-card.modal-bad .modal-title{color:var(--danger);}
.gained-item-banner{
  margin-top:14px;padding:9px 14px;border-radius:5px;background:rgba(168,132,47,.16);
  border:1px solid var(--gold);font-size:13px;color:var(--ink);
}
.gained-item-banner .ic{font-size:17px;margin-right:4px;}
.modal-input{
  width:100%;padding:10px 12px;border-radius:4px;border:1px solid var(--ink-faint);
  background:var(--paper2);color:var(--ink);font-size:14px;font-family:var(--font-body);
  margin-top:14px;text-align:center;
}
.seq-input{width:56px;display:inline-block;margin:14px 5px 0;}
.modal-actions{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap;}

/* mapa */
.map-wrap{max-width:820px;margin:0 auto;}
.map-svg-wrap{width:100%;overflow:auto;background:rgba(0,0,0,.15);border-radius:6px;}
.map-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:#cfc39f;margin-top:10px;}
.map-legend .lg{display:flex;align-items:center;gap:5px;}
.map-legend .sw{width:14px;height:3px;display:inline-block;}

/* finais */
.ending-wrap{max-width:640px;margin:30px auto;text-align:center;}
.ending-badge{display:inline-block;padding:6px 16px;border-radius:999px;background:rgba(168,132,47,.2);border:1px solid var(--gold);color:var(--gold-light);font-size:12px;font-weight:700;margin-bottom:14px;}
.ending-badge.true-ending{background:rgba(212,175,90,.3);}
.ending-text{color:#e8dfc4;font-size:15px;line-height:1.9;font-style:italic;white-space:pre-line;}

/* item-use overlay */
.use-banner{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:998;background:rgba(43,38,32,.95);
  color:#e8dfc4;padding:8px 18px;border-radius:4px;font-size:12.5px;border:1px solid var(--gold);animation:narratorFade .3s ease;}

footer.credit{text-align:center;color:#6b5f48;font-size:10.5px;margin-top:26px;}

@media (max-width:640px){
  .door .frame{width:64px;height:98px;}
  .door{width:64px;}
  .room-illustration{padding:18px 10px 14px;}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="fx-layer"></div>
<script>
'use strict';
/* =========================================================================
   A CASA DAS 99 PORTAS — arquivo único (sem bundler): dados, motor de jogo
   e interface, tudo em JS puro. Organizado em seções que espelham os
   módulos pedidos (types/gameLogic/storage/data/components).
   ========================================================================= */

/* ===================== data/symbols.ts ===================== */
const SYMBOLS = {
  olho:      {id:'olho',      name:'Olho',      ic:'👁',  meaning:'Observação. Coisa vista, verdade parcial. Onde o Olho aparece, há uma pista real na sala — não uma armadilha.'},
  mascara:   {id:'mascara',   name:'Máscara',    ic:'🎭', meaning:'Mentira, teatro, número falso. Onde a Máscara aparece, alguma coisa na sala provavelmente mente.'},
  espelho:   {id:'espelho',   name:'Espelho',    ic:'🪞', meaning:'Inversão, reflexo, duplicação. Onde o Espelho aparece, um número pode valer ao contrário.'},
  vela:      {id:'vela',      name:'Vela',       ic:'🕯',  meaning:'Luz e revelação — mas também exposição. Algumas coisas só existem com a vela acesa. Outras só no escuro.'},
  relogio:   {id:'relogio',   name:'Relógio',    ic:'🕰',  meaning:'Ordem, tempo, sequência, repetição. Horas marcadas podem indicar a ordem certa de algo.'},
  chave:     {id:'chave',     name:'Chave',      ic:'🔑',  meaning:'Permissão, acesso — e falsa segurança. Nem toda chave abre. Algumas servem para recusar.'},
  peixe:     {id:'peixe',     name:'Peixe',      ic:'🐟',  meaning:'Silêncio, segredo. Onde o Peixe aparece, a solução pode exigir não falar, não responder, não entregar nome.'},
  coroa:     {id:'coroa',     name:'Coroa',      ic:'👑',  meaning:'Autoridade falsa, ganância, obediência perigosa. A Coroa ajuda em alguns caminhos — e bloqueia outros, os mais importantes.'},
  escada:    {id:'escada',    name:'Escada',     ic:'🪜',  meaning:'Mudança de nível, atalho vertical, retorno incompleto. Uma escada pode levar a um lugar que os números não explicam.'},
};
const SYMBOL_IDS = Object.keys(SYMBOLS);

/* ===================== data/items.ts ===================== */
const ITEMS = {
  rustyKey:    {id:'rustyKey',    name:'Chave Enferrujada', ic:'🔑', desc:'Velha, pesada, cheia de ferrugem nas hastes. Abre fechaduras antigas — e algumas gavetas.'},
  unlitCandle: {id:'unlitCandle', name:'Vela Apagada',      ic:'🕯', desc:'Um toco de cera fria. Precisa de fogo pra revelar o que esconde.'},
  litCandle:   {id:'litCandle',   name:'Vela Acesa',        ic:'🔥', desc:'A chama treme, mesmo sem vento. Ilumina inscrições que o escuro engolia.'},
  candleAsh:   {id:'candleAsh',   name:'Cinza da Vela',     ic:'🩶', desc:'O que sobra depois que a luz é apagada no lugar certo. Pesa mais do que deveria.'},
  glassEye:    {id:'glassEye',    name:'Olho de Vidro',     ic:'👁', desc:'Um olho de vidro, frio ao toque. Encaixa em retratos, estátuas e fechaduras que não deveriam ter pupila.'},
  crackedMask: {id:'crackedMask', name:'Máscara Rachada',   ic:'🎭', desc:'Uma rachadura corta o sorriso ao meio. Usada sobre um aviso, muda o que ele realmente diz.'},
  brokenMirror:{id:'brokenMirror',name:'Espelho Partido',   ic:'🪞', desc:'Um caco de espelho antigo. Mostra reflexos que o espelho inteiro escondia.'},
  glassCrown:  {id:'glassCrown',  name:'Coroa de Vidro',    ic:'👑', desc:'Fina, transparente, perigosamente leve. Abre portas de autoridade — e fecha a única que importa.'},
  silverFish:  {id:'silverFish',  name:'Peixe de Prata',    ic:'🐟', desc:'Frio, imóvel, sem boca. Serve onde o silêncio é a resposta certa.'},
  looseHand:   {id:'looseHand',   name:'Ponteiro Solto',    ic:'📍', desc:'Um ponteiro de relógio, solto do mecanismo. Encaixa em relógios quebrados.'},
  smallBell:   {id:'smallBell',   name:'Sino Pequeno',      ic:'🔔', desc:'Não faz som nenhum — ainda. Talvez chame algo que não devia existir.'},
  amaliaLetter:{id:'amaliaLetter',name:'Carta de Amália',   ic:'✉',  desc:'Papel amarelado, letra de criança. Fala de um pai que fez paredes e de uma voz que fez portas.'},
  toothlessKey:{id:'toothlessKey',name:'Chave Sem Dentes',  ic:'🗝',  desc:'Uma chave lisa, sem dentes nenhum. Não abre. Recusa.'},
  redThread:   {id:'redThread',   name:'Fio Vermelho',      ic:'🧵', desc:'Um fio fino e vermelho. Marca o que já foi cruzado — e o que se repete.'},
  mapFragment: {id:'mapFragment',name:'Fragmento de Planta',ic:'🗺',  desc:'Um pedaço rasgado de uma planta baixa antiga. Alguns números nela não batem com os das portas.'},
};

/* ===================== data/endings.ts ===================== */
const ENDINGS = {
  saidaFalsa:{id:'saidaFalsa',title:'Final 1 — Saída Falsa',
    text:'A porta cedeu fácil demais.\n\nDo outro lado não havia rua, nem céu, nem manhã.\n\nHavia o tapete vermelho. O quadro torto. A placa: "Obedeça à primeira porta".\n\nVocê nunca saiu. Você só voltou para o começo, achando que era o fim.'},
  visitanteObediente:{id:'visitanteObediente',title:'Final 2 — Visitante Obediente',
    text:'Você fez tudo certo. Nunca abriu a porta errada, nunca duvidou da placa, nunca ficou onde não devia.\n\nA Casa gostou de você.\n\nÉ a pior coisa que ela poderia sentir.'},
  coroaDeVidro:{id:'coroaDeVidro',title:'Final 3 — Coroa de Vidro',
    text:'O trono era pequeno demais para uma pessoa sentar confortavelmente. Você sentou assim mesmo.\n\nA coroa não pesava nada. Isso deveria ter sido um alívio.\n\nAgora você governa corredores que não levam a lugar nenhum.'},
  nomeEntregue:{id:'nomeEntregue',title:'Final 4 — Nome Entregue',
    text:'A porta perguntou seu nome, e você respondeu.\n\nPor um instante, a casa parou de ranger.\n\nDepois, ela aprendeu a dizer seu nome sozinha — em lugares onde você não estava.'},
  mapaPerfeito:{id:'mapaPerfeito',title:'Final 5 — Mapa Perfeito',
    text:'Você desenhou cada sala, cada porta, cada número.\n\nO mapa está impecável. Completo. Correto.\n\nVocê conheceu a planta. Não conheceu a casa.'},
  colecionador:{id:'colecionador',title:'Final 6 — Colecionador',
    text:'Chave, vela, olho, máscara, espelho, coroa, peixe, ponteiro, sino, carta, chave sem dentes, fio, fragmento — tudo isso pesa no bolso e nada pesa na mão.\n\nVocê chegou ao centro carregando um museu inteiro de coisas que nunca usou.\n\nO centro não se importa com o que você guarda. Só com o que você faz.'},
  reflexoTomado:{id:'reflexoTomado',title:'Final 7 — Reflexo Tomado',
    text:'O espelho partido mostrou a água sem reflexo nenhum — nem o seu.\n\nSem a carta de Amália pra lembrar quem você era antes de entrar, o lago aceitou seu rosto como pagamento.\n\nAlguém vai sair usando sua cara. Não será você.'},
  filhaDeElias:{id:'filhaDeElias',title:'Final 8 — A Filha de Elias',
    text:'Você encontrou os desenhos, a carta, o quarto atrás do quarto.\n\nAmália não desapareceu. Ela foi guardada.\n\nVocê a encontra, finalmente — mas o Porteiro Sem Rosto ainda está de pé atrás de você, sorrindo sem boca.\n\nUm final bom. Não o verdadeiro.'},
  arquitetoPreso:{id:'arquitetoPreso',title:'Final 9 — Arquiteto Preso',
    text:'Você descobriu Elias — as ferramentas, o compasso, a oficina, a letra torta nas paredes.\n\nMas quando o contrato pediu um nome, você disse o nome errado.\n\n"Elias" não é suficiente. Nunca foi só ele.\n\nA Casa aceita a resposta incompleta e fecha, satisfeita, como quem engole algo pela metade.'},
  casaCorrigida:{id:'casaCorrigida',title:'Final 10 — A Casa Corrigida',
    text:'A engrenagem de 99 dentes girou, e uma porta mentirosa parou de mentir.\n\nVocê encontrou um atalho, saiu por ele, e a saída até funcionou.\n\nMas a casa continua em pé, esperando o próximo visitante, com as outras dezenove portas mentirosas ainda intactas.\n\nVocê consertou uma frase. Não quebrou a voz.'},
  silencio:{id:'silencio',title:'Final 11 — Silêncio',
    text:'Você nunca disse seu nome. Nem uma vez.\n\nIsso, por si só, já é mais do que a Casa esperava de qualquer visitante.\n\nMas faltou o resto: o espelho, a cinza, a carta, a chave que recusa.\n\nVocê sai calado. A Casa, ainda de pé, aprende a temer o silêncio — só um pouco.'},
  portaZero:{id:'portaZero',title:'Final 12 — Porta Zero (final verdadeiro)',trueEnding:true,
    text:'A porta não abriu. Ela parou de fingir que era porta.\n\nA voz tentou dizer seu nome, mas encontrou cinza, vidro e silêncio.\n\nA chave sem dentes não girou. Ela recusou.\n\nO espelho não refletiu o Porteiro. Revelou a ausência dele.\n\nPela primeira vez, a Casa teve uma parede comum.\n\nPela primeira vez, sair não pareceu obedecer.'},
};

/* ===================== data/rooms.ts — fábricas ===================== */
function D(label,target,opts){ return Object.assign({label,target,locked:false,requiredItem:null,requiredFlag:null,forbiddenFlag:null,isLie:false,special:null},opts||{}); }
function H(id,label,desc,opts){ return Object.assign({id,label,desc},opts||{}); }
function R(id,title,area,doors,hotspots,opts){

/* ===================== gameLogic.ts — motor de jogo ===================== */

const ITEM_TO_FLAG = {};
Object.keys(ITEMS).forEach(id=>{ ITEM_TO_FLAG[id] = 'has'+id[0].toUpperCase()+id.slice(1); });
const FLAG_TO_ITEM = {};
Object.entries(ITEM_TO_FLAG).forEach(([item,flag])=>{ FLAG_TO_ITEM[flag]=item; });

const BAD_ENDINGS = ['saidaFalsa','visitanteObediente','coroaDeVidro','nomeEntregue','mapaPerfeito','colecionador','reflexoTomado','arquitetoPreso'];

function getRoom(id){
  if (typeof id === 'string' && id[0]==='s') return SECRET_ROOMS[id];
  return ROOMS[id];
}

function hasFlag(state, name){
  if (!name) return false;
  if (FLAG_TO_ITEM[name]) return state.inventory.indexOf(FLAG_TO_ITEM[name]) !== -1;
  return !!state.flags[name];
}
function setFlag(state, nameOrArr){
  if (Array.isArray(nameOrArr)) { nameOrArr.forEach(n=>{ state.flags[n]=true; }); }
  else if (nameOrArr) { state.flags[nameOrArr]=true; }
}
function addItem(state, itemId){
  if (!itemId) return;
  if (state.inventory.indexOf(itemId)===-1) state.inventory.push(itemId);
}
function removeItem(state, itemId){
  if (!itemId) return;
  const i = state.inventory.indexOf(itemId);
  if (i!==-1) state.inventory.splice(i,1);
  if (state.selectedItem===itemId) state.selectedItem=null;
}
function addJournal(state, text){
  if (!text) return;
  if (state.journalEntries.indexOf(text)===-1) state.journalEntries.push(text);
}
function discoverSymbol(state, symId){
  if (!symId) return;
  if (state.discoveredSymbols.indexOf(symId)===-1){
    state.discoveredSymbols.push(symId);
    addJournal(state, 'Símbolo de '+SYMBOLS[symId].name+' descoberto — '+SYMBOLS[symId].meaning);
  }
}

function resolveDoorTarget(door, state){
  if (door.special){
    switch(door.special){
      case 'sala1Mask': return hasFlag(state,'correctedLieDoor') ? 24 : door.target;
      case 'sala6From29': return state.previousRoomId===29 ? 6 : door.target;
      case 'sala28Mirror': return hasFlag(state,'hasBrokenMirror') ? 71 : door.target;
      case 'sala44Candle': return hasFlag(state,'sawInscription44') ? 13 : door.target;
      case 'sala63Mask': return hasFlag(state,'hasCrackedMask') ? 36 : door.target;
      default: return door.target;
    }
  }
  return door.target;
}

function canUnlockDoorZero(state){
  return hasFlag(state,'hasAmaliaLetter') &&
    hasFlag(state,'hasToothlessKey') &&
    hasFlag(state,'hasBrokenMirror') &&
    hasFlag(state,'hasCandleAsh') &&
    (!hasFlag(state,'hasGlassCrown') || state.flags.abandonedCrown===true) &&
    state.flags.discoveredEliasNotVoice===true &&
    state.flags.discoveredSemRosto===true &&
    state.refusedName===true &&
    state.flags.solvedClock445===true &&
    state.flags.foundDoorZeroClue===true &&
    state.discoveredSymbols.length>=6;
}

const S14_SEQUENCE = [1,42,6,55,41];

function newRunState(name, refused){
  return {
    playerName: refused ? null : (name||null),
    refusedName: !!refused,
    gaveNameToHouse: false,
    currentRoomId: 1,
    previousRoomId: null,
    visitedRooms: [1],
    roomVisitLog: [1],
    inventory: [],
    selectedItem: null,
    flags: {},
    journalEntries: [],
    discoveredSymbols: [],
    discoveredSecrets: [],
    unlockedDoors: [],
    usedHotspots: [],
    mapConnections: [],
    gameOver: false,
    currentEndingId: null,
    pendingPuzzle: null,
    lastFeedback: null,
    narratorLine: 'Bem-vindo. As primeiras portas costumam assustar. As últimas, nem tanto.',
    trueEndingReady: false,
  };
}

function loadMeta(){
  try{
    const raw = localStorage.getItem('casa99_meta');
    if (!raw) return { discoveredEndings:[], badEndingsSeen:0 };
    const m = JSON.parse(raw);
    return { discoveredEndings: m.discoveredEndings||[], badEndingsSeen: m.badEndingsSeen||0 };
  }catch(e){ return { discoveredEndings:[], badEndingsSeen:0 }; }
}
function saveMeta(){ try{ localStorage.setItem('casa99_meta', JSON.stringify(APP.meta)); }catch(e){} }
function saveRun(){ try{ if(APP.state) localStorage.setItem('casa99_run', JSON.stringify(APP.state)); }catch(e){} }
function loadRun(){
  try{
    const raw = localStorage.getItem('casa99_run');
    if (!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}
function clearRun(){ try{ localStorage.removeItem('casa99_run'); }catch(e){} }
function clearAll(){ try{ localStorage.removeItem('casa99_run'); localStorage.removeItem('casa99_meta'); }catch(e){} }

const APP = { screen:'start', state:null, meta:loadMeta() };

function triggerEnding(state, endingId){
  state.gameOver = true;
  state.currentEndingId = endingId;
  if (APP.meta.discoveredEndings.indexOf(endingId)===-1) APP.meta.discoveredEndings.push(endingId);
  if (BAD_ENDINGS.indexOf(endingId)!==-1) APP.meta.badEndingsSeen++;
  saveMeta();
  clearRun();
}

function checkS14Sequence(state){
  const log = state.roomVisitLog;
  if (log.length < 5) return false;
  const last5 = log.slice(-5);
  return JSON.stringify(last5)===JSON.stringify(S14_SEQUENCE);
}

function enterSecretRoom(state, secretId){
  if (state.discoveredSecrets.indexOf(secretId)===-1) state.discoveredSecrets.push(secretId);
  state.previousRoomId = state.currentRoomId;
  goToRoom(state, secretId, false);
}

function goToRoom(state, roomId, viaDoor){
  state.previousRoomId = viaDoor ? state.currentRoomId : state.previousRoomId;
  state.currentRoomId = roomId;
  if (state.visitedRooms.indexOf(roomId)===-1) state.visitedRooms.push(roomId);
  state.roomVisitLog.push(roomId);
  state.selectedItem = null;
  state.pendingPuzzle = null;
  const room = getRoom(roomId);
  if (!room) return;

  const firstVisit = state.visitedRooms.filter(r=>r===roomId).length<=1;
  if (typeof roomId === 'number' && firstVisit){
    addJournal(state, 'Sala '+roomId+' — '+room.title+'.');
  } else if (typeof roomId === 'string' && firstVisit){
    addJournal(state, 'Sala secreta — '+room.title+'.');
  }
  (room.symbols||[]).forEach(s=>discoverSymbol(state,s));

  state.narratorLine = null;
  if (room.narrator && firstVisit) state.narratorLine = room.narrator;

  if (room.onEnterFromNote && state.previousRoomId!=null && room.onEnterFromNote[state.previousRoomId]){
    addJournal(state, room.onEnterFromNote[state.previousRoomId]);
  }

  if (room.requiresBadEndings!=null && room.opensSecretIfBadEndings){
    if (APP.meta.badEndingsSeen >= room.requiresBadEndings && state.discoveredSecrets.indexOf(room.opensSecretIfBadEndings)===-1){
      addJournal(state, 'Sala '+roomId+': depois de tantos finais ruins, algo aqui finalmente cede.');
      enterSecretRoom(state, room.opensSecretIfBadEndings);
      return;
    }
  }

  if (typeof roomId === 'number' && checkS14Sequence(state) && state.discoveredSecrets.indexOf('s14')===-1){
    setFlag(state,'openedS14');
    addJournal(state, 'Você percebe que andou em círculo por um caminho estranhamente específico — e uma sala que não deveria existir se abre.');
    enterSecretRoom(state,'s14');
    return;
  }

  if (!state.trueEndingReady && canUnlockDoorZero(state)){
    state.trueEndingReady = true;
    setFlag(state,'trueEndingReady');
    addJournal(state, 'Você sente que a Casa já não tem mais nada para esconder de você.');
  }

  saveRun();
}

function useDoor(state, room, door){
  if (state.gameOver) return;
  state.lastFeedback = null;
  const doorLabel = 'Porta '+door.label;
  if (door.forbiddenFlag && hasFlag(state, door.forbiddenFlag)){
    state.lastFeedback = {type:'bad', label:doorLabel, text: door.lockMsg||'Essa porta não cede.'};
    saveRun();
    return;
  }
  const doorKey = room.id+'_'+door.label;
  if (door.locked && state.unlockedDoors.indexOf(doorKey)===-1){
    const itemOk = door.requiredItem && state.selectedItem===door.requiredItem;
    const flagOk = door.requiredFlag && hasFlag(state, door.requiredFlag);
    if (itemOk || flagOk){
      state.unlockedDoors.push(doorKey);
      state.lastFeedback = {type:'good', label:doorLabel, text: door.okMsg||'A porta cede.'};
      if (itemOk) state.selectedItem=null;
    } else {
      state.lastFeedback = {type:'bad', label:doorLabel, text: door.lockMsg||'A porta está trancada.'};
      saveRun();
      return;
    }
  }
  const target = resolveDoorTarget(door, state);
  const suspicious = door.isLie || !!door.special;
  const already = state.mapConnections.find(c=>c.from===room.id && c.doorLabel===door.label);
  if (!already){
    state.mapConnections.push({from:room.id, doorLabel:door.label, to:target, suspicious});
    if (suspicious && room.doorLieNote && room.doorLieNote[door.label]){
      addJournal(state, 'Sala '+room.id+', porta '+door.label+': '+room.doorLieNote[door.label]);
    }
  }
  goToRoom(state, target, true);
}

function useHotspot(state, room, hotspot){
  if (state.gameOver) return;
  state.lastFeedback = null;
  if (hotspot.answerPuzzle){ state.pendingPuzzle = {type:'answer', hid:hotspot.id}; saveRun(); return; }
  if (hotspot.sequencePuzzle){ state.pendingPuzzle = {type:'sequence', hid:hotspot.id}; saveRun(); return; }
  if (hotspot.namePrompt || hotspot.namePromptDanger){ state.pendingPuzzle = {type:'nameprompt', hid:hotspot.id}; saveRun(); return; }

  const already = hotspot.oneTime && state.usedHotspots.indexOf(hotspot.id)!==-1;
  const needsItem = !!hotspot.requiredItem;
  const itemMatches = needsItem && state.selectedItem===hotspot.requiredItem;
  const flagOk = !hotspot.requiredFlag || hasFlag(state, hotspot.requiredFlag);

  if (needsItem && !itemMatches){
    state.lastFeedback = {type:'neutral', label:hotspot.label, text: hotspot.responseWithout || hotspot.desc};
    saveRun();
    return;
  }
  if (already){
    state.lastFeedback = {type:'neutral', label:hotspot.label, text: 'Você já mexeu nisso. Não há mais nada de novo aqui.'};
    saveRun();
    return;
  }

  if (needsItem && itemMatches && hotspot.missingItemCheck && hotspot.endingIdIfMissing){
    if (!hasFlag(state, ITEM_TO_FLAG[hotspot.missingItemCheck])){
      if (hotspot.journal) addJournal(state, hotspot.journal);
      triggerEnding(state, hotspot.endingIdIfMissing);
      state.lastFeedback = {type:'bad', label:hotspot.label, text: hotspot.responseDanger||''};
      saveRun();
      return;
    }
  }

  if (needsItem && itemMatches && !flagOk){
    state.lastFeedback = {type:'neutral', label:hotspot.label, text: hotspot.responseWithout || hotspot.desc};
    saveRun();
    return;
  }

  if (hotspot.oneTime) state.usedHotspots.push(hotspot.id);
  if (hotspot.giveItem) addItem(state, hotspot.giveItem);
  if (hotspot.removeItem) removeItem(state, hotspot.removeItem);
  if (hotspot.setFlag) setFlag(state, hotspot.setFlag);
  if (hotspot.journal) addJournal(state, hotspot.journal);
  if (needsItem && itemMatches) state.selectedItem = null;
  const gainedItem = hotspot.giveItem || null;

  if (hotspot.opensSecret){
    state.lastFeedback = {type:'good', label:hotspot.label, text: hotspot.response||'', gainedItem};
    saveRun();
    enterSecretRoom(state, hotspot.opensSecret);
    return;
  }
  if (hotspot.endingId){
    state.lastFeedback = {type:'good', label:hotspot.label, text: hotspot.response||'', gainedItem};
    triggerEnding(state, hotspot.endingId);
    saveRun();
    return;
  }
  state.lastFeedback = {type: needsItem?'good':'neutral', label:hotspot.label, text: hotspot.response || hotspot.desc, gainedItem};
  saveRun();
}

function submitAnswerPuzzle(state, hotspot, text){
  const norm = (text||'').trim().toLowerCase();
  const resp = hotspot.responses[norm] || hotspot.responses['default'];
  state.lastFeedback = {type: hotspot.responses[norm] ? 'good':'neutral', label:hotspot.label, text: resp};
  state.pendingPuzzle = null;
  if (hotspot.journal && hotspot.responses[norm]) addJournal(state, hotspot.journal);
  saveRun();
}
function submitSequencePuzzle(state, hotspot, seqStr){
  state.pendingPuzzle = null;
  if (seqStr === hotspot.sequenceKey){
    if (hotspot.setFlag) setFlag(state, hotspot.setFlag);
    if (hotspot.journal) addJournal(state, hotspot.journal);
    state.lastFeedback = {type:'good', label:hotspot.label, text: hotspot.response};
    if (hotspot.opensSecret) { saveRun(); enterSecretRoom(state, hotspot.opensSecret); return; }
  } else {
    state.lastFeedback = {type:'bad', label:hotspot.label, text: hotspot.responseWrong};
  }
  saveRun();
}
function submitNamePrompt(state, hotspot, refused, typedName){
  state.pendingPuzzle = null;
  if (hotspot.namePromptDanger){
    if (refused){
      state.refusedName = true;
      if (hotspot.journalIfRefused) addJournal(state, hotspot.journalIfRefused);
      state.lastFeedback = {type:'good', label:hotspot.label, text: hotspot.responseIfRefused};
    } else {
      state.gaveNameToHouse = true;
      triggerEnding(state, hotspot.endingIdIfAnswered);
      state.lastFeedback = {type:'bad', label:hotspot.label, text:'A porta se abre — devagar demais, satisfeita demais.'};
    }
  } else {
    if (refused) state.refusedName = true;
    else if (typedName) state.playerName = typedName;
    if (hotspot.journal) addJournal(state, hotspot.journal);
    state.lastFeedback = {type:'neutral', label:hotspot.label, text: refused ? 'Você não responde. A porta espera em silêncio, depois desiste.' : 'A porta absorve o nome com um rangido leve.'};
  }
  saveRun();
}


/* ===================== components — interface ===================== */

function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function $(sel){ return document.querySelector(sel); }
function $$(sel){ return Array.prototype.slice.call(document.querySelectorAll(sel)); }

function render(){
  const app = $('#app');
  if (APP.screen==='start') app.innerHTML = renderStart();
  else if (APP.screen==='room') app.innerHTML = renderTopbar()+renderRoomScreen();
  else if (APP.screen==='map') app.innerHTML = renderTopbar()+renderMapScreen();
  else if (APP.screen==='ending') app.innerHTML = renderEndingScreen();
  app.innerHTML += renderModal();
  attachHandlers();
}

function renderModal(){
  const state = APP.state;
  if (!state) return '';
  const room = getRoom(state.currentRoomId);

  if (state.pendingPuzzle){
    const p = state.pendingPuzzle;
    const h = (room.hotspots||[]).find(x=>x.id===p.hid);
    if (!h) return '';
    let body = '';
    if (p.type==='answer'){
      body = '<input type="text" id="puzzle-answer-input" class="modal-input" placeholder="Sua resposta...">'+
        '<div class="modal-actions"><button class="btn gold" data-action="submitAnswer" data-arg="'+h.id+'">Responder</button></div>';
    } else if (p.type==='sequence'){
      body = '<div class="row gap6 center">'+
        '<input type="number" min="1" max="6" id="seq-1" class="modal-input seq-input">'+
        '<input type="number" min="1" max="6" id="seq-2" class="modal-input seq-input">'+
        '<input type="number" min="1" max="6" id="seq-3" class="modal-input seq-input"></div>'+
        '<div class="modal-actions"><button class="btn gold" data-action="submitSequence" data-arg="'+h.id+'">Girar manivelas</button></div>';
    } else if (p.type==='nameprompt'){
      body = '<input type="text" id="nameprompt-input" class="modal-input" placeholder="Seu nome...">'+
        '<div class="modal-actions"><button class="btn gold" data-action="submitNamePrompt" data-arg="'+h.id+'">Responder</button>'+
        '<button class="btn ghost" data-action="refuseNamePrompt" data-arg="'+h.id+'">Não responder</button></div>';
    }
    return '<div class="modal-overlay" data-action="closeModal">'+
      '<div class="modal-card card paper-texture ink-border" data-action="none">'+
        '<div class="modal-icon">🔍</div>'+
        '<h3 class="modal-title">'+esc(h.label)+'</h3>'+
        '<div class="modal-body">'+esc(h.desc)+'</div>'+
        body+
      '</div>'+
    '</div>';
  }

  if (state.lastFeedback){
    const fb = state.lastFeedback;
    const gainedHtml = fb.gainedItem ? '<div class="gained-item-banner"><span class="ic">'+ITEMS[fb.gainedItem].ic+'</span> Você conseguiu: <b>'+esc(ITEMS[fb.gainedItem].name)+'</b></div>' : '';
    return '<div class="modal-overlay" data-action="closeModal">'+
      '<div class="modal-card card paper-texture ink-border modal-'+(fb.type||'neutral')+'" data-action="none">'+
        '<button class="modal-x" data-action="closeModal">✕</button>'+
        '<div class="modal-icon">'+(fb.gainedItem?ITEMS[fb.gainedItem].ic:(fb.type==='bad'?'⚠':'🔍'))+'</div>'+
        (fb.label ? '<h3 class="modal-title">'+esc(fb.label)+'</h3>' : '')+
        '<div class="modal-body">'+esc(fb.text)+'</div>'+
        gainedHtml+
        '<div class="modal-actions"><button class="btn gold" data-action="closeModal">Fechar</button></div>'+
      '</div>'+
    '</div>';
  }

  return '';
}

function renderTopbar(){
  const s = APP.state;
  let pills = '<button class="pill '+(APP.screen==='room'?'active':'')+'" data-action="goScreen" data-arg="room">Sala</button>';
  pills += '<button class="pill '+(APP.screen==='map'?'active':'')+'" data-action="goScreen" data-arg="map">Mapa</button>';
  if (s && s.trueEndingReady){
    pills += '<button class="pill" style="background:var(--myst);color:#f0e6cf;border-color:#2e2350;" data-action="goPortaZero">A Porta Zero</button>';
  }

function doorIsKnownLie(state, roomId, label){
  return state.mapConnections.some(c=>c.from===roomId && c.doorLabel===label && c.suspicious);
}


/* ===================== components/RoomView — cenário em perspectiva ===================== */

const AREA_TINTS = { entrada:'#5a4326', agua:'#1f5a56', relogio:'#8a6a1f', espelho:'#4a4a72', nomes:'#4a3a6a' };

function lerpPt(a,b,t){ return {x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t}; }
function wallPoint(w,t,v){
  const top = lerpPt(w.a, w.b, t);
  const bot = lerpPt(w.d, w.c, t);
  return lerpPt(top, bot, v);
}
function ptsStr(pts){ return pts.map(p=>p.x.toFixed(1)+','+p.y.toFixed(1)).join(' '); }
function doorQuad(wall, t1,t2,v1,v2){
  return [wallPoint(wall,t1,v1), wallPoint(wall,t2,v1), wallPoint(wall,t2,v2), wallPoint(wall,t1,v2)];
}
function quadCentroid(q){
  return { x:(q[0].x+q[1].x+q[2].x+q[3].x)/4, y:(q[0].y+q[1].y+q[2].y+q[3].y)/4 };
}

function hashSeed(id){
  let s = 7;
  const str = String(id);
  for (let i=0;i<str.length;i++){ s = (Math.imul(s,31) + str.charCodeAt(i))|0; }
  return s>>>0;
}
function mulberry32(seed){
  let a = seed>>>0;
  return function(){
    a = (a + 0x6D2B79F5)|0;
    let t = Math.imul(a ^ a>>>15, 1 | a);
    t = (t + Math.imul(t ^ t>>>7, 61 | t)) ^ t;
    return ((t ^ t>>>14) >>> 0) / 4294967296;
  };
}
function pick(rng, arr){ return arr[Math.floor(rng()*arr.length)%arr.length]; }

const DOOR_SLOT_RANGE = {
  back: {t1:0.30,t2:0.70,v1:0.05,v2:0.95},
  left: {t1:0.13,t2:0.55,v1:0.09,v2:0.90},
  right:{t1:0.13,t2:0.55,v1:0.09,v2:0.90},
};
const DOOR_SLOTS_BY_COUNT = { 0:[], 1:['back'], 2:['back','right'], 3:['left','back','right'] };

const HOTSPOT_LAYOUTS = {
  1: [{u:0.50,t:0.58}],
  2: [{u:0.28,t:0.54},{u:0.72,t:0.54}],
  3: [{u:0.20,t:0.40},{u:0.5,t:0.64},{u:0.80,t:0.40}],
};
const CLUTTER_LAYOUTS = [
  [], [{u:0.10,t:0.86}], [{u:0.10,t:0.86},{u:0.90,t:0.86}], [{u:0.10,t:0.86},{u:0.90,t:0.86},{u:0.5,t:0.90}],
];

const WALL_MATERIALS = {
  plaster:{ wall:'#c9b98a', back:'#ddd0a8', ceil:'#e9dfc4', floor:'#8a7452', pattern:'plain' },
  stone:  { wall:'#a39a83', back:'#b3aa90', ceil:'#d6cdb2', floor:'#6e6552', pattern:'blocks' },
  wood:   { wall:'#83643e', back:'#8e6d45', ceil:'#c2b184', floor:'#4a3420', pattern:'grain' },
  brick:  { wall:'#84543d', back:'#8f5e45', ceil:'#d2c19a', floor:'#5f4835', pattern:'brick' },
  cave:   { wall:'#5c584e', back:'#68645a', ceil:'#8c8676', floor:'#3a352c', pattern:'rough' },
};
const DECOR_ICONS = ['🗝','🕯','📜','🦴','🍶','🔔','⚱','🗿','🕸','⏳','✂','🪓','🧿','🔮'];

function surfaceLines(wall, matPattern, rng){
  let out = '';
  if (matPattern==='blocks' || matPattern==='brick'){
    const rows = matPattern==='brick' ? 7 : 4;
    for (let i=1;i<rows;i++){
      const v = i/rows;
      const p1 = wallPoint(wall,0,v), p2 = wallPoint(wall,1,v);
      out += '<line x1="'+p1.x.toFixed(1)+'" y1="'+p1.y.toFixed(1)+'" x2="'+p2.x.toFixed(1)+'" y2="'+p2.y.toFixed(1)+'" stroke="#241d12" stroke-width="0.9" opacity="0.32"/>';
      if (matPattern==='brick'){
        const cols = 5; const offset = (i%2)*(1/(cols*2));
        for (let c=0;c<cols;c++){
          const t = offset + c/cols;
          if (t>=1) continue;
          const q1 = wallPoint(wall,t,v), q2 = wallPoint(wall,t,Math.min(1,v+1/rows));
          out += '<line x1="'+q1.x.toFixed(1)+'" y1="'+q1.y.toFixed(1)+'" x2="'+q2.x.toFixed(1)+'" y2="'+q2.y.toFixed(1)+'" stroke="#241d12" stroke-width="0.7" opacity="0.26"/>';
        }
      }
    }
  } else if (matPattern==='grain'){
    const cols = 5;
    for (let i=1;i<cols;i++){
      const t = i/cols;
      const p1 = wallPoint(wall,t,0), p2 = wallPoint(wall,t,1);
      out += '<line x1="'+p1.x.toFixed(1)+'" y1="'+p1.y.toFixed(1)+'" x2="'+p2.x.toFixed(1)+'" y2="'+p2.y.toFixed(1)+'" stroke="#241d12" stroke-width="1" opacity="0.28"/>';
    }
  } else if (matPattern==='rough'){
    for (let i=0;i<10;i++){
      const t = rng(), v = rng();
      const p = wallPoint(wall,t,v);
      const r = 3+rng()*7;
      out += '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="'+r.toFixed(1)+'" fill="#000" opacity="'+(0.05+rng()*0.08).toFixed(2)+'"/>';
    }
  }
  return out;
}

function drawClutterProp(kind, pt, scale, rng){
  const s = scale;
  if (kind==='jars'){
    let out = '';
    const n = 2+Math.floor(rng()*2);
    for (let i=0;i<n;i++){
      const ox = (i-(n-1)/2)*16*s, jh = (16+rng()*10)*s, jw = (11+rng()*5)*s;
      const bx = pt.x+ox, by = pt.y+4*s;
      out += '<ellipse cx="'+bx.toFixed(1)+'" cy="'+(by+2*s).toFixed(1)+'" rx="'+(jw*0.7).toFixed(1)+'" ry="'+(3*s).toFixed(1)+'" fill="#140d05" opacity="0.3"/>';
      out += '<path d="M '+(bx-jw/2).toFixed(1)+' '+by.toFixed(1)+' Q '+(bx-jw/2-3*s).toFixed(1)+' '+(by-jh/2).toFixed(1)+' '+(bx-jw/3).toFixed(1)+' '+(by-jh).toFixed(1)+
        ' L '+(bx+jw/3).toFixed(1)+' '+(by-jh).toFixed(1)+' Q '+(bx+jw/2+3*s).toFixed(1)+' '+(by-jh/2).toFixed(1)+' '+(bx+jw/2).toFixed(1)+' '+by.toFixed(1)+' Z" '+
        'fill="#6e5638" stroke="#2b2115" stroke-width="1"/>';
      out += '<ellipse cx="'+bx.toFixed(1)+'" cy="'+(by-jh).toFixed(1)+'" rx="'+(jw/3).toFixed(1)+'" ry="'+(2.4*s).toFixed(1)+'" fill="#3a2c1a" stroke="#2b2115" stroke-width="0.8"/>';
    }
    return out;
  }
  if (kind==='crate'){
    const w=26*s,h=20*s;
    const x=pt.x-w/2, y=pt.y-h;
    return '<ellipse cx="'+pt.x.toFixed(1)+'" cy="'+(pt.y+3*s).toFixed(1)+'" rx="'+(w*0.6).toFixed(1)+'" ry="'+(4*s).toFixed(1)+'" fill="#140d05" opacity="0.3"/>'+
      '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+h.toFixed(1)+'" fill="#6e5030" stroke="#2b2115" stroke-width="1.2"/>'+
      '<line x1="'+x.toFixed(1)+'" y1="'+y.toFixed(1)+'" x2="'+(x+w).toFixed(1)+'" y2="'+(y+h).toFixed(1)+'" stroke="#2b2115" stroke-width="1" opacity="0.5"/>'+
      '<line x1="'+(x+w).toFixed(1)+'" y1="'+y.toFixed(1)+'" x2="'+x.toFixed(1)+'" y2="'+(y+h).toFixed(1)+'" stroke="#2b2115" stroke-width="1" opacity="0.5"/>';
  }
  if (kind==='stool'){
    const w=22*s,h=17*s;
    const x=pt.x-w/2,y=pt.y-h;
    return '<ellipse cx="'+pt.x.toFixed(1)+'" cy="'+(pt.y+3*s).toFixed(1)+'" rx="'+(w*0.55).toFixed(1)+'" ry="'+(3.5*s).toFixed(1)+'" fill="#140d05" opacity="0.28"/>'+
      '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+(5*s).toFixed(1)+'" rx="1.5" fill="#5a3e26" stroke="#2b2115" stroke-width="1"/>'+
      '<line x1="'+(x+3*s).toFixed(1)+'" y1="'+(y+5*s).toFixed(1)+'" x2="'+(x+3*s).toFixed(1)+'" y2="'+pt.y.toFixed(1)+'" stroke="#2b2115" stroke-width="'+(2*s).toFixed(1)+'"/>'+
      '<line x1="'+(x+w-3*s).toFixed(1)+'" y1="'+(y+5*s).toFixed(1)+'" x2="'+(x+w-3*s).toFixed(1)+'" y2="'+pt.y.toFixed(1)+'" stroke="#2b2115" stroke-width="'+(2*s).toFixed(1)+'"/>';
  }
  if (kind==='books'){
    let out = '';
    const n = 3;
    for (let i=0;i<n;i++){
      const w=(24+rng()*6)*s, h=4.5*s;
      const y = pt.y - i*h;
      const x = pt.x - w/2 + (rng()*4-2)*s;
      out += '<rect x="'+x.toFixed(1)+'" y="'+(y-h).toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+h.toFixed(1)+'" fill="'+(i%2?'#5a3e26':'#6e5638')+'" stroke="#2b2115" stroke-width="0.8"/>';
    }
    return out;
  }
  if (kind==='rug'){
    const rx=(30+rng()*8)*s, ry=rx*0.38;
    return '<ellipse cx="'+pt.x.toFixed(1)+'" cy="'+pt.y.toFixed(1)+'" rx="'+rx.toFixed(1)+'" ry="'+ry.toFixed(1)+'" fill="#5a2320" opacity="0.55" stroke="#2b1310" stroke-width="1"/>'+
      '<ellipse cx="'+pt.x.toFixed(1)+'" cy="'+pt.y.toFixed(1)+'" rx="'+(rx*0.66).toFixed(1)+'" ry="'+(ry*0.66).toFixed(1)+'" fill="none" stroke="#caa15a" stroke-width="1" opacity="0.5"/>';
  }
  return '';
}

function renderRoomScene(room, state){
  const rng = mulberry32(hashSeed(room.id));
  const tint = AREA_TINTS[room.area] || AREA_TINTS.entrada;
  const matKey = pick(rng, Object.keys(WALL_MATERIALS));
  const mat = WALL_MATERIALS[matKey];
  const doorStyle = pick(rng, ['arch','plain','plain','round']);

  const jitter = (base,range) => base + (rng()*2-1)*range;
  const backHalfW = jitter(122, 26);
  const backCenterX = jitter(320, 22);
  const backTopY = jitter(98, 12);
  const backBotY = jitter(258, 12);
  const ceilY = jitter(34, 9);
  const floorY = jitter(372, 9);
  const pts = {
    FTL:{x:26,y:ceilY}, FTR:{x:614,y:ceilY}, FBL:{x:26,y:floorY}, FBR:{x:614,y:floorY},
    BTL:{x:backCenterX-backHalfW,y:backTopY}, BTR:{x:backCenterX+backHalfW,y:backTopY},
    BBL:{x:backCenterX-backHalfW,y:backBotY}, BBR:{x:backCenterX+backHalfW,y:backBotY},
  };
  const walls = {
    left:  {a:pts.FTL, b:pts.BTL, d:pts.FBL, c:pts.BBL},
    right: {a:pts.FTR, b:pts.BTR, d:pts.FBR, c:pts.BBR},
    back:  {a:pts.BTL, b:pts.BTR, d:pts.BBL, c:pts.BBR},
    floor: {a:pts.FBL, b:pts.FBR, d:pts.BBL, c:pts.BBR},
  };

  const doors = (room.doors||[]).filter(door=>!(door.hideIfForbidden && door.forbiddenFlag && hasFlag(state, door.forbiddenFlag)));
  const slots = DOOR_SLOTS_BY_COUNT[Math.min(doors.length,3)] || ['back'];

  let svg = '<svg class="room-scene" viewBox="0 0 640 400" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">';
  svg += '<defs>'+
    '<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">'+
      '<line x1="0" y1="0" x2="0" y2="7" stroke="#2b2115" stroke-width="0.7"/>'+
    '</pattern>'+
    '<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">'+
      '<line x1="0" y1="0" x2="0" y2="7" stroke="#2b2115" stroke-width="0.5"/>'+
    '</pattern>'+
    '<linearGradient id="woodgrain" x1="0" y1="0" x2="1" y2="0">'+
      '<stop offset="0" stop-color="#7a5636"/><stop offset="0.5" stop-color="#5a3e26"/><stop offset="1" stop-color="#7a5636"/>'+
    '</linearGradient>'+
  '</defs>';

  // ---- ceiling / floor / walls ----
  const surfaces = [
    {pts:[pts.FTL,pts.FTR,pts.BTR,pts.BTL], fill:mat.ceil, hatchOp:0.10, wall:null},
    {pts:[pts.FBL,pts.FBR,pts.BBR,pts.BBL], fill:mat.floor, hatchOp:0.28, wall:walls.floor},
    {pts:[pts.FTL,pts.BTL,pts.BBL,pts.FBL], fill:mat.wall, hatchOp:0.22, wall:walls.left},
    {pts:[pts.FTR,pts.BTR,pts.BBR,pts.FBR], fill:mat.wall, hatchOp:0.22, wall:walls.right},
    {pts:[pts.BTL,pts.BTR,pts.BBR,pts.BBL], fill:mat.back, hatchOp:0.16, wall:walls.back},
  ];
  surfaces.forEach(s=>{
    svg += '<polygon points="'+ptsStr(s.pts)+'" fill="'+s.fill+'" stroke="#2b2115" stroke-width="1.4" stroke-opacity="0.5"/>';
    svg += '<polygon points="'+ptsStr(s.pts)+'" fill="url(#hatch)" opacity="'+s.hatchOp+'"/>';
    svg += '<polygon points="'+ptsStr(s.pts)+'" fill="url(#hatch2)" opacity="'+(s.hatchOp*0.6)+'"/>';
    if (s.wall) svg += surfaceLines(s.wall, mat.pattern, rng);
  });

  if (mat.pattern!=='plain'){
    ['left','right','back'].forEach(k=>{
      const w = walls[k];
      const p1 = wallPoint(w,0,0.62), p2 = wallPoint(w,1,0.62);
      svg += '<line x1="'+p1.x.toFixed(1)+'" y1="'+p1.y.toFixed(1)+'" x2="'+p2.x.toFixed(1)+'" y2="'+p2.y.toFixed(1)+'" stroke="#2b2115" stroke-width="1" opacity="0.28"/>';
    });
  }

  // decorative plaques along the top of the back wall (atmosphere only)
  const decorCount = 2+Math.floor(rng()*3);
  for (let i=0;i<decorCount;i++){
    const t = (i+0.5)/decorCount;
    const p = wallPoint(walls.back, t, 0.06);
    const icon = pick(rng, DECOR_ICONS);
    svg += '<g style="pointer-events:none" opacity="0.75">'+
      '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="11" fill="#241d12" stroke="#5a4a30" stroke-width="1"/>'+
      '<text x="'+p.x.toFixed(1)+'" y="'+(p.y+4).toFixed(1)+'" text-anchor="middle" font-size="12">'+icon+'</text>'+
    '</g>';
  }

  // area tint wash over everything so far
  svg += '<rect x="0" y="0" width="640" height="400" fill="'+tint+'" opacity="0.14" style="mix-blend-mode:multiply"/>';

  // ---- clutter props (atmosphere, not clickable) ----
  const clutterKinds = ['jars','crate','stool','books','rug'];
  const clutterPositions = CLUTTER_LAYOUTS[Math.min(2,Math.floor(rng()*3))];
  clutterPositions.forEach(pos=>{
    const pt = wallPoint(walls.floor, pos.u, pos.t);
    const scale = 1.5 - pos.t*0.5;
    svg += '<g style="pointer-events:none">'+drawClutterProp(pick(rng,clutterKinds), pt, scale, rng)+'</g>';
  });

  // ---- doors ----
  doors.forEach((door,i)=>{
    const slot = slots[i] || 'back';
    const range = DOOR_SLOT_RANGE[slot];
    const wall = walls[slot];
    const quad = doorQuad(wall, range.t1, range.t2, range.v1, range.v2);
    const centroid = quadCentroid(quad);
    const topMid = lerpPt(quad[0], quad[1], 0.5);
    const unlockedAlready = state.unlockedDoors.indexOf(room.id+'_'+door.label)!==-1;
    const showLocked = door.locked && !unlockedAlready;
    const knownLie = doorIsKnownLie(state, room.id, door.label);
    const plaqueW = 30, plaqueH = 18;
    const frameSpan = Math.max(6, Math.abs(quad[1].x-quad[0].x)*0.5 + Math.abs(quad[1].y-quad[0].y)*0.5);

    svg += '<g class="scene-door" data-action="clickDoor" data-arg="'+door.label+'">';
    if (doorStyle==='arch'){
      const archH = frameSpan*0.55;
      svg += '<path d="M '+quad[0].x.toFixed(1)+' '+quad[0].y.toFixed(1)+' Q '+topMid.x.toFixed(1)+' '+(topMid.y-archH).toFixed(1)+' '+quad[1].x.toFixed(1)+' '+quad[1].y.toFixed(1)+
        ' L '+quad[2].x.toFixed(1)+' '+quad[2].y.toFixed(1)+' L '+quad[3].x.toFixed(1)+' '+quad[3].y.toFixed(1)+' Z" '+
        'fill="'+mat.wall+'" stroke="#241d12" stroke-width="2" opacity="0.9"/>';
    } else if (doorStyle==='round'){
      const capH = frameSpan*0.35;
      svg += '<path d="M '+quad[0].x.toFixed(1)+' '+quad[0].y.toFixed(1)+' Q '+topMid.x.toFixed(1)+' '+(topMid.y-capH).toFixed(1)+' '+quad[1].x.toFixed(1)+' '+quad[1].y.toFixed(1)+' Z" '+
        'fill="'+mat.wall+'" stroke="#241d12" stroke-width="1.6" opacity="0.9"/>';
    }
    svg += '<polygon class="doorpoly" points="'+ptsStr(quad)+'" fill="'+(showLocked?'#3a2020':'url(#woodgrain)')+'" stroke="#2b1710" stroke-width="2"/>';
    svg += '<polygon points="'+ptsStr(quad)+'" fill="url(#hatch)" opacity="0.18"/>';
    // knob
    const knobPt = lerpPt(quad[1],quad[2],0.5);
    svg += '<circle cx="'+knobPt.x.toFixed(1)+'" cy="'+knobPt.y.toFixed(1)+'" r="3" fill="#1a1006"/>';
    if (knownLie){
      svg += '<polygon points="'+ptsStr(quad)+'" fill="none" stroke="#a83b34" stroke-width="1.6" stroke-dasharray="5,4" opacity="0.85" style="pointer-events:none"/>';
    }
    // plaque
    svg += '<g style="pointer-events:none">'+
      '<rect x="'+(topMid.x-plaqueW/2).toFixed(1)+'" y="'+(topMid.y-plaqueH-6).toFixed(1)+'" width="'+plaqueW+'" height="'+plaqueH+'" rx="2" '+
        'fill="#ddd0a8" stroke="#4a4030" stroke-width="1" transform="rotate('+((i%2===0)?-3:3)+' '+topMid.x.toFixed(1)+' '+(topMid.y-plaqueH/2-6).toFixed(1)+')"/>'+
      '<text x="'+topMid.x.toFixed(1)+'" y="'+(topMid.y-plaqueH/2-1).toFixed(1)+'" text-anchor="middle" font-size="12" font-weight="800" '+
        'font-family="Georgia,serif" fill="#2b2620" transform="rotate('+((i%2===0)?-3:3)+' '+topMid.x.toFixed(1)+' '+(topMid.y-plaqueH/2-6).toFixed(1)+')">'+door.label+'</text>'+
    '</g>';
    if (showLocked){
      svg += '<text x="'+centroid.x.toFixed(1)+'" y="'+(centroid.y+5).toFixed(1)+'" text-anchor="middle" font-size="18" style="pointer-events:none">🔒</text>';
    }
    svg += '<title>Porta '+door.label+(knownLie?' (algo aqui parece suspeito)':'')+'</title>';
    svg += '</g>';
  });

  // ---- hotspots (objetos clicáveis) ----
  const hotspots = room.hotspots||[];
  const layout = HOTSPOT_LAYOUTS[Math.min(hotspots.length,3)] || HOTSPOT_LAYOUTS[3];
  hotspots.forEach((h,i)=>{
    const pos = layout[i] || {u:0.5,t:0.5};
    const pt = wallPoint(walls.floor, pos.u, pos.t);
    const used = h.oneTime && state.usedHotspots.indexOf(h.id)!==-1;
    const scale = 1.25 - pos.t*0.5;
    const fontSize = (24*scale).toFixed(1);
    const tagLabel = h.label.length>24 ? h.label.slice(0,22)+'…' : h.label;
    const tagFontSize = (10*scale).toFixed(1);
    const tagY = pt.y + 15*scale;
    svg += '<g class="scene-hotspot'+(used?' examined':'')+'" data-action="clickHotspot" data-arg="'+h.id+'">'+
      '<ellipse cx="'+pt.x.toFixed(1)+'" cy="'+(pt.y+6).toFixed(1)+'" rx="'+(22*scale).toFixed(1)+'" ry="'+(6*scale).toFixed(1)+'" fill="#140d05" opacity="0.35"/>'+
      '<circle class="lupa-ring" cx="'+pt.x.toFixed(1)+'" cy="'+pt.y.toFixed(1)+'" r="'+(15*scale).toFixed(1)+'" fill="rgba(212,175,90,0.16)" stroke="'+(used?'#8a7452':'var(--gold, #a8842f)')+'" stroke-width="1.5"/>'+
      '<text x="'+pt.x.toFixed(1)+'" y="'+(pt.y+1).toFixed(1)+'" text-anchor="middle" dominant-baseline="middle" font-size="'+fontSize+'">🔍</text>'+
      '<rect x="'+(pt.x-38*scale).toFixed(1)+'" y="'+(tagY-8*scale).toFixed(1)+'" width="'+(76*scale).toFixed(1)+'" height="'+(15*scale).toFixed(1)+'" rx="3" fill="#ddd0a8" stroke="#4a4030" stroke-width="0.8" opacity="0.95"/>'+
      '<text x="'+pt.x.toFixed(1)+'" y="'+(tagY+3*scale).toFixed(1)+'" text-anchor="middle" font-size="'+tagFontSize+'" font-family="Georgia,serif" fill="#2b2620">'+esc(tagLabel)+'</text>'+
      '<title>'+esc(h.label)+'</title>'+
    '</g>';
  });

  svg += '</svg>';
  return svg;
}
function renderRoomScreen(){
  const state = APP.state;
  const room = getRoom(state.currentRoomId);
  const isSecret = typeof state.currentRoomId === 'string';

  let symbolsHtml = (room.symbols||[]).map(s=>'<div class="symbol-badge" title="'+esc(SYMBOLS[s].name)+'">'+SYMBOLS[s].ic+'</div>').join('');

  const sceneHtml = renderRoomScene(room, state);

  let desc = room.desc;
  if (room.changesIfFlag){
    Object.keys(room.changesIfFlag).forEach(flagName=>{
      if (hasFlag(state, flagName)) desc = room.changesIfFlag[flagName];
    });
  }

  const narrator = state.narratorLine ? '<div class="narrator-line">"'+esc(state.narratorLine)+'"</div>' : '';

  return '<div class="room-wrap">'+
    '<div class="room-stage card paper-texture ink-border">'+
      '<div class="room-head"><h2>'+esc(room.title)+'</h2><div class="rid">'+(isSecret?'SALA SECRETA':'SALA '+room.id)+'</div></div>'+
      '<div class="room-illustration">'+
        '<div class="symbol-row">'+symbolsHtml+'</div>'+
        sceneHtml+
      '</div>'+
      '<div class="room-narration">'+esc(desc)+'</div>'+
      narrator+
    '</div>'+
    '<div class="side-panel">'+
      renderInventoryCard()+
      renderSymbolsCard()+
      renderJournalCard()+
    '</div>'+
  '</div>';
}

function renderInventoryCard(){
  const state = APP.state;
  let itemsHtml = state.inventory.map(id=>{
    const it = ITEMS[id];
    return '<div class="inv-item'+(state.selectedItem===id?' selected':'')+'" data-action="selectItem" data-arg="'+id+'" title="'+esc(it.desc)+'">'+
      '<span class="ic">'+it.ic+'</span>'+esc(it.name)+
    '</div>';
  }).join('');
  if (!itemsHtml) itemsHtml = '<div class="inv-empty">Nenhum item ainda.</div>';
  return '<div class="card"><h4>Inventário</h4><div class="inv-grid">'+itemsHtml+'</div>'+
    (state.selectedItem ? '<div class="selected-hint">Selecionado: '+esc(ITEMS[state.selectedItem].name)+' — clique numa porta ou objeto para usar. <button class="btn ghost sm" style="margin-top:6px;" data-action="deselectItem">Soltar item</button></div>' : '<div class="selected-hint">Selecione um item e clique numa porta ou objeto pra usá-lo.</div>')+
  '</div>';
}

function renderSymbolsCard(){
  const state = APP.state;
  let html = state.discoveredSymbols.map(id=>{
    const s = SYMBOLS[id];
    return '<div class="tiny" style="margin-bottom:6px;"><b>'+s.ic+' '+esc(s.name)+'</b> — '+esc(s.meaning)+'</div>';
  }).join('');
  if (!html) html = '<div class="tiny muted">Nenhum símbolo compreendido ainda.</div>';
  return '<div class="card"><h4>Símbolos ('+state.discoveredSymbols.length+'/9)</h4>'+html+'</div>';
}

function renderJournalCard(){
  const state = APP.state;
  let entries = state.journalEntries.slice().reverse().map(e=>'<div class="journal-entry">'+esc(e)+'</div>').join('');
  if (!entries) entries = '<div class="journal-empty">O diário está vazio.</div>';
  return '<div class="card"><h4>Diário</h4><div class="journal-list">'+entries+'</div></div>';
}

function renderMapScreen(){
  const state = APP.state;
  const rooms = {};
  state.mapConnections.forEach(c=>{
    if (!rooms[c.from]) rooms[c.from] = [];
    rooms[c.from].push(c);
  });
  let rows = Object.keys(rooms).map(fromId=>{
    const fromRoom = getRoom(isNaN(fromId)?fromId:parseInt(fromId,10));
    const conns = rooms[fromId].map(c=>{
      const toRoom = getRoom(c.to);
      return '<div class="tiny" style="padding:4px 0;">Sala '+fromId+' → Porta '+c.doorLabel+' → '+(toRoom?esc(toRoom.title)+' (Sala '+c.to+')':'???')+
        (c.suspicious?' <span style="color:var(--danger);font-weight:700;">[conexão suspeita]</span>':'')+
      '</div>';
    }).join('');
    return '<div style="margin-bottom:10px;"><b>'+(fromRoom?esc(fromRoom.title):'Sala '+fromId)+'</b>'+conns+'</div>';
  }).join('');
  if (!rows) rows = '<div class="tiny muted">Nenhuma porta explorada ainda. O mapa começa vazio.</div>';
  return '<div class="map-wrap card paper-texture ink-border" style="padding:18px;">'+
    '<h3 style="margin-bottom:10px;">Mapa Parcial</h3>'+
    '<div class="tiny muted" style="margin-bottom:14px;">O mapa mostra só o que você já descobriu andando. Conexões suspeitas podem não levar aonde dizem.</div>'+
    '<div class="map-svg-wrap" style="padding:12px;">'+rows+'</div>'+
    '<div class="map-legend"><div class="lg"><span class="sw" style="background:var(--danger);"></span>conexão suspeita</div>'+
    '<div class="lg">Salas visitadas: '+state.visitedRooms.length+' / 72</div>'+
    '<div class="lg">Salas secretas encontradas: '+state.discoveredSecrets.length+' / 15</div></div>'+
  '</div>';
}

function renderEndingScreen(){
  const state = APP.state;
  const ending = ENDINGS[state.currentEndingId];
  return '<div class="ending-wrap">'+
    '<div class="ending-badge'+(ending.trueEnding?' true-ending':'')+'">'+esc(ending.title)+'</div>'+
    '<div class="card dark ink-border" style="padding:22px;"><div class="ending-text">'+esc(ending.text)+'</div></div>'+
    '<div class="tiny muted" style="margin-top:14px;">Finais descobertos: '+APP.meta.discoveredEndings.length+' de 12.</div>'+
    '<div class="row center gap10" style="margin-top:20px;">'+
      '<button class="btn gold" data-action="playAgain">Jogar novamente</button>'+
      '<button class="btn ghost" data-action="resetGame">Recomeçar do zero</button>'+
    '</div>'+
  '</div>';
}

function attachHandlers(){
  const app = $('#app');
  app.onclick = function(e){
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const action = el.getAttribute('data-action');
    const arg = el.getAttribute('data-arg');
    handleAction(action, arg);
  };
}

function handleAction(action, arg){
  const state = APP.state;
  switch(action){
    case 'startWithName': {
      const val = ($('#start-name-input')||{}).value || '';
      APP.state = newRunState(val.trim()||null, false);
      APP.screen = 'room';
      goToRoom(APP.state, 1, false);
      render();
      break;
    }
    case 'startRefuse': {
      APP.state = newRunState(null, true);
      APP.screen = 'room';
      goToRoom(APP.state, 1, false);
      render();
      break;
    }
    case 'continueRun': {
      const saved = loadRun();
      if (saved) { APP.state = saved; APP.screen = 'room'; render(); }
      break;
    }
    case 'goScreen': APP.screen = arg; render(); break;
    case 'goPortaZero': {
      enterSecretRoom(state, 's15');
      APP.screen = 'room';
      render();
      break;
    }
    case 'clickDoor': {
      const room = getRoom(state.currentRoomId);
      const door = (room.doors||[]).find(d=>String(d.label)===String(arg));
      if (door) useDoor(state, room, door);
      render();
      break;
    }
    case 'clickHotspot': {
      const room = getRoom(state.currentRoomId);
      const h = (room.hotspots||[]).find(x=>x.id===arg);
      if (h) useHotspot(state, room, h);
      render();
      break;
    }
    case 'selectItem': state.selectedItem = (state.selectedItem===arg?null:arg); render(); break;
    case 'deselectItem': state.selectedItem = null; render(); break;
    case 'submitAnswer': {
      const room = getRoom(state.currentRoomId);
      const h = (room.hotspots||[]).find(x=>x.id===arg);
      const val = ($('#puzzle-answer-input')||{}).value || '';
      if (h) submitAnswerPuzzle(state, h, val);
      render();
      break;
    }
    case 'submitSequence': {
      const room = getRoom(state.currentRoomId);
      const h = (room.hotspots||[]).find(x=>x.id===arg);
      const s1=($('#seq-1')||{}).value||'', s2=($('#seq-2')||{}).value||'', s3=($('#seq-3')||{}).value||'';
      if (h) submitSequencePuzzle(state, h, ''+s1+s2+s3);
      render();
      break;
    }
    case 'submitNamePrompt': {
      const room = getRoom(state.currentRoomId);
      const h = (room.hotspots||[]).find(x=>x.id===arg);
      const val = ($('#nameprompt-input')||{}).value || '';
      if (h) submitNamePrompt(state, h, false, val.trim());
      render();
      break;
    }
    case 'refuseNamePrompt': {
      const room = getRoom(state.currentRoomId);
      const h = (room.hotspots||[]).find(x=>x.id===arg);
      if (h) submitNamePrompt(state, h, true, null);
      render();
      break;
    }
    case 'closeModal': {
      state.pendingPuzzle = null;
      state.lastFeedback = null;
      checkGameOver();
      render();
      break;
    }
    case 'none': break;
    case 'playAgain': {
      const keepName = APP.state ? APP.state.playerName : null;
      const keepRefused = APP.state ? APP.state.refusedName : false;
      APP.state = newRunState(keepName, keepRefused);
      APP.screen = 'room';
      goToRoom(APP.state, 1, false);
      render();
      break;
    }
    case 'resetGame': {
      if (confirm('Isso vai apagar todo o progresso, incluindo finais descobertos. Continuar?')){
        clearAll();
        APP.meta = { discoveredEndings:[], badEndingsSeen:0 };
        APP.state = null;
        APP.screen = 'start';
        render();
      }
      break;
    }
  }
}

function checkGameOver(){
  if (APP.state && APP.state.gameOver) APP.screen = 'ending';
}

render();

</script>
</body>
</html>
