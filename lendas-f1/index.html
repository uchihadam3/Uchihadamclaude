<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Lendas da F1 — Demo</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#0b0d10;font-family:-apple-system,Segoe UI,Roboto,sans-serif}
  #c{display:block;width:100%;height:100%}
  #hud{position:fixed;left:16px;bottom:16px;color:#fff;text-shadow:0 2px 6px #000;pointer-events:none}
  #hud .big{font-size:52px;font-weight:800;line-height:0.9;letter-spacing:-1px}
  #hud .unit{font-size:16px;font-weight:600;opacity:.85;margin-left:4px}
  #hud .row{display:flex;align-items:baseline;gap:6px}
  #hud .g{font-size:15px;font-weight:600;opacity:.9;margin-top:6px}
  #title{position:fixed;top:14px;left:16px;color:#fff;text-shadow:0 2px 6px #000}
  #title b{font-size:20px;font-weight:800;letter-spacing:.5px}
  #title span{display:block;font-size:12px;opacity:.8;margin-top:2px}
  .flag{display:inline-block;width:11px;height:11px;border-radius:2px;background:
    linear-gradient(135deg,#009c3b 0 40%,#ffdf00 40% 60%,#002776 60% 100%);vertical-align:middle;margin-right:6px}
  #tag{position:fixed;top:14px;right:16px;color:#fff;font-size:11px;opacity:.65;text-shadow:0 1px 4px #000}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title"><b><span class="flag"></span>LENDAS DA F1</b><span>demo — pista em escala real · 1 carro</span></div>
<div id="tag">v0.1 · protótipo</div>
<div id="hud">
  <div class="row"><span class="big" id="spd">0</span><span class="unit">km/h</span></div>
  <div class="g">força lateral <b id="gforce">0.0</b> G</div>
</div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
