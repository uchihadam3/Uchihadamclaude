<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Lendas da F1 — Demo</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#0b0d10;font-family:-apple-system,Segoe UI,Roboto,sans-serif}
  #c{display:block;width:100%;height:100%}
  /* linhas de velocidade (túnel) */
  #speedfx{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .12s linear;
    background:
      radial-gradient(ellipse 60% 60% at 50% 50%, transparent 40%, rgba(0,0,0,0.0) 55%, rgba(0,0,0,0.35) 100%),
      repeating-conic-gradient(from 0deg at 50% 50%,
        rgba(255,255,255,0.0) 0deg 3deg, rgba(255,255,255,0.10) 3.4deg 3.8deg, rgba(255,255,255,0.0) 4.2deg 7deg);
    mix-blend-mode:screen;}
  /* chuva (camada animada) */
  #rain{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .8s;z-index:6;
    background-image:repeating-linear-gradient(103deg, rgba(200,220,255,0) 0 4px, rgba(205,222,255,.20) 4px 5px, rgba(200,220,255,0) 5px 9px);
    background-size:auto 24px;animation:raindrop .55s linear infinite}
  #rain.on{opacity:.7}
  #rain.heavy{opacity:1;animation-duration:.38s;
    background-image:repeating-linear-gradient(103deg, rgba(210,225,255,0) 0 3px, rgba(215,230,255,.30) 3px 4px, rgba(210,225,255,0) 4px 7px)}
  @keyframes raindrop{from{background-position:0 0}to{background-position:-42px 240px}}
  /* vinheta sutil */
  #vig{position:fixed;inset:0;pointer-events:none;
    box-shadow:inset 0 0 220px 60px rgba(0,0,0,0.45);}
  /* ===== HUD clean estilo transmissão de F1 ===== */
  #hud{position:fixed;left:16px;bottom:14px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.55);pointer-events:none}
  #hud .big{font-size:52px;font-weight:800;line-height:.84;letter-spacing:-2px;font-variant-numeric:tabular-nums}
  #hud .unit{font-size:14px;font-weight:700;opacity:.65;margin-left:3px}
  #hud .row{display:flex;align-items:baseline;gap:5px}
  #hud .g{font-size:12px;font-weight:600;opacity:.72;margin-top:5px;letter-spacing:.2px}
  #telem{position:fixed;left:14px;bottom:100px;width:156px;color:#fff;pointer-events:none;
    background:rgba(12,14,18,.42);border:1px solid rgba(255,255,255,.09);border-radius:11px;
    padding:7px 10px 8px;backdrop-filter:blur(7px)}
  #telem h4{font-size:8px;font-weight:700;letter-spacing:1.8px;opacity:.45;margin-bottom:5px}
  #telem .tl{display:flex;align-items:center;gap:6px;margin:4.5px 0}
  #telem .lab{font-size:8px;font-weight:700;opacity:.6;width:26px;letter-spacing:.3px}
  #telem .bar{flex:1;height:5px;background:rgba(255,255,255,.11);border-radius:3px;overflow:hidden}
  #telem .bar>i{display:block;height:100%;width:100%;border-radius:3px;transition:width .3s,background .3s}
  #telem .val{font-size:9px;font-weight:700;width:26px;text-align:right;opacity:.9;font-variant-numeric:tabular-nums}
  #telem .comp{width:14px;height:14px;border-radius:50%;font-size:8px;font-weight:900;flex:none;
    display:flex;align-items:center;justify-content:center;color:#0a0a0a}
  #telem .st{font-size:8px;font-weight:700;opacity:.85;width:56px;text-align:right}
  #gearbox{position:fixed;right:16px;bottom:14px;color:#fff;text-align:center;text-shadow:0 2px 10px rgba(0,0,0,.55);pointer-events:none}
  #gearbox .num{font-size:50px;font-weight:800;line-height:1}
  #gearbox .lbl{font-size:9px;font-weight:700;opacity:.5;letter-spacing:2px}
  #title{position:fixed;top:13px;left:16px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.5)}
  #title b{font-size:17px;font-weight:800;letter-spacing:.4px}
  #title span{display:block;font-size:10.5px;opacity:.62;margin-top:1px;font-weight:600}
  .flag{display:inline-block;width:10px;height:10px;border-radius:2px;background:
    linear-gradient(135deg,#009c3b 0 40%,#ffdf00 40% 60%,#002776 60% 100%);vertical-align:middle;margin-right:5px}
  #tag{position:fixed;top:14px;right:16px;color:#fff;font-size:10px;opacity:.5;text-shadow:0 1px 4px #000}
  #mini{position:fixed;top:36px;right:12px;width:92px;height:96px;pointer-events:none;
    background:rgba(12,14,18,.38);border:1px solid rgba(255,255,255,.10);border-radius:10px;
    backdrop-filter:blur(6px)}
  /* torre de posições — compacta, só POS · cor · CÓDIGO · pneu · gap (como no timing da F1) */
  #tower{position:fixed;top:140px;right:12px;width:98px;pointer-events:none;
    background:rgba(12,14,18,.44);border:1px solid rgba(255,255,255,.08);border-radius:9px;
    padding:3px;backdrop-filter:blur(7px);font-size:8.5px;color:#fff;line-height:1}
  .trow{display:flex;align-items:center;gap:4px;padding:1.5px 4px;border-radius:5px;transition:background .3s}
  .trow.me{background:rgba(242,197,0,.20)}
  .trow.me .tc{color:#ffd21e}
  .trow.out{opacity:.32}
  .trow.fl.up{background:rgba(34,197,94,.5)}
  .trow.fl.down{background:rgba(239,68,68,.42)}
  .trow .tp{width:11px;text-align:center;opacity:.5;font-weight:700;font-variant-numeric:tabular-nums}
  .trow .tp.out{color:#ff6060;font-size:7px}
  .trow b{width:3px;height:12px;border-radius:2px;display:inline-block;flex:none}
  .trow .tc{font-weight:800;width:23px;letter-spacing:.3px}
  .trow .tn{display:none}
  .trow .dmg{color:#ffb020}
  .trow .tdot{width:5px;height:5px;border-radius:50%;display:inline-block;flex:none;margin-left:1px}
  .trow .gapt{opacity:.5;font-size:7.5px;margin-left:auto;font-variant-numeric:tabular-nums}
  .trow .pit{color:#f5c518;font-weight:800;font-size:7px;margin-left:auto;letter-spacing:.5px}
  #lap{position:fixed;top:12px;left:50%;transform:translateX(-50%);color:#fff;
    background:rgba(12,14,18,.5);border:1px solid rgba(255,255,255,.12);border-radius:20px;
    padding:5px 14px;font-size:11px;font-weight:800;letter-spacing:1px;text-shadow:0 1px 3px #000;backdrop-filter:blur(6px)}
  /* semáforo da largada */
  #lights{position:fixed;top:56px;left:50%;transform:translateX(-50%);display:flex;gap:8px;
    padding:10px 14px;background:rgba(8,10,14,.72);border-radius:12px;z-index:15;transition:opacity .5s}
  #lights.hide{opacity:0;pointer-events:none}
  #lights .lamp{width:26px;height:26px;border-radius:50%;background:#3a0d0d;border:2px solid #000;
    box-shadow:inset 0 -2px 4px rgba(0,0,0,.6)}
  #lights .lamp.on{background:radial-gradient(circle at 40% 35%,#ff6a6a,#e00000);box-shadow:0 0 14px #ff2a2a}
  #lights.go .lamp{background:radial-gradient(circle at 40% 35%,#7dff9e,#12b93f);box-shadow:0 0 14px #22e04f}
  #overtake{position:fixed;top:22%;left:50%;transform:translateX(-50%) translateY(-8px) scale(.96);
    background:linear-gradient(90deg,#0b7a3b,#1f9e57);color:#fff;padding:12px 22px;border-radius:12px;
    font-size:17px;box-shadow:0 8px 30px rgba(0,0,0,.5);opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap}
  #overtake.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
  #overtake.hide{opacity:0}
  #overtake b{color:#ffe27a}
  #sound{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    background:rgba(12,14,18,.82);color:#fff;border:1px solid rgba(255,255,255,.25);
    padding:16px 26px;border-radius:40px;font-size:17px;font-weight:700;cursor:pointer;
    backdrop-filter:blur(6px);box-shadow:0 8px 30px rgba(0,0,0,.5);transition:opacity .3s}
  #sound .s{display:block;font-size:12px;font-weight:500;opacity:.75;margin-top:3px}
  #sound.hide{opacity:0;pointer-events:none}
  #cam{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:rgba(12,14,18,.74);color:#fff;border:1px solid rgba(255,255,255,.22);
    border-radius:30px;padding:11px 20px;font-size:15px;font-weight:700;cursor:pointer;
    backdrop-filter:blur(5px);box-shadow:0 6px 22px rgba(0,0,0,.45)}
  #cam:active{transform:translateX(-50%) scale(.96)}
  #ficha{position:fixed;top:112px;left:16px;background:rgba(12,14,18,.5);color:#fff;
    border:1px solid rgba(255,255,255,.14);border-radius:9px;padding:6px 11px;font-size:12px;font-weight:700;cursor:pointer;backdrop-filter:blur(6px)}
  /* ===== responsivo (celular) ===== */
  @media (max-width:640px){
    #title b{font-size:15px} #title > span{font-size:9px}
    #circuit,#team{font-size:11px;padding:5px 9px;max-width:158px;top:auto}
    #circuit{top:42px} #team{top:74px} #ficha{top:106px;font-size:11px}
    #mini{width:80px;height:84px;top:34px}
    #tower{top:126px;width:90px;font-size:8px}
    #telem{width:130px;bottom:92px;padding:6px 9px}
    #telem .lab{width:22px} #telem .val{width:24px} #telem .st{width:50px}
    #hud .big{font-size:40px} #hud .unit{font-size:12px} #hud .g{font-size:11px}
    #gearbox .num{font-size:40px}
    #cam{bottom:76px;padding:9px 16px;font-size:13px}
    #lap{font-size:10px;padding:4px 11px}
  }
  #fichaPanel{position:fixed;inset:0;z-index:30;background:rgba(6,8,12,.85);backdrop-filter:blur(5px);
    display:flex;align-items:center;justify-content:center;padding:14px}
  #fichaPanel.hide{display:none}
  .fcard{background:#12161d;border:1px solid rgba(255,255,255,.12);border-radius:16px;max-width:440px;width:100%;
    max-height:90vh;overflow:auto;padding:18px 18px 22px;color:#fff;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .fcard h2{font-size:22px;font-weight:800;margin-bottom:2px}
  .fcard .eng{font-size:12px;opacity:.7;margin-bottom:12px}
  .fcard .ov{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .fcard .ovn{font-size:46px;font-weight:800;line-height:1}
  .fcard .ovt{font-size:12px;font-weight:800;padding:4px 8px;border-radius:6px;color:#0a0a0a}
  .srow{display:flex;align-items:center;gap:8px;margin:7px 0}
  .srow .lb{width:104px;font-size:12px;font-weight:600;opacity:.9}
  .srow .bar{flex:1;height:11px;background:#242a33;border-radius:6px;overflow:hidden}
  .srow .bar>i{display:block;height:100%;border-radius:6px}
  .srow .vl{width:26px;text-align:right;font-size:12px;font-weight:800}
  .fcard h3{font-size:13px;font-weight:800;opacity:.85;margin:16px 0 6px}
  .rk{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 8px;border-radius:6px}
  .rk.me{background:rgba(255,255,255,.10);font-weight:800}
  .rk .p{opacity:.6;width:22px}
  .rk .g{font-weight:800}
  .drv{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:10px 12px;margin:8px 0}
  .drvh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .drvh b{font-size:15px}
  .fbtn{margin-top:12px;width:100%;padding:12px;border:0;border-radius:10px;background:#1f7a45;color:#fff;font-weight:800;font-size:15px;cursor:pointer}
  .fbtn:active{transform:scale(.98)}
  .fclose{margin-top:10px;width:100%;padding:11px;border:0;border-radius:10px;background:#2a3240;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
  #circuitlbl,#teamlbl{display:none}                       /* clean: dropdowns já se explicam */
  #circuit{position:fixed;top:44px;left:16px;background:rgba(12,14,18,.5);color:#fff;
    border:1px solid rgba(255,255,255,.13);border-radius:9px;padding:6px 10px;font-size:12px;font-weight:600;
    max-width:180px;backdrop-filter:blur(6px);-webkit-appearance:none;appearance:none}
  #team{position:fixed;top:78px;left:16px;background:rgba(12,14,18,.5);color:#fff;
    border:1px solid rgba(255,255,255,.13);border-radius:9px;padding:6px 10px;font-size:12px;font-weight:600;
    max-width:180px;backdrop-filter:blur(6px);-webkit-appearance:none;appearance:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="speedfx"></div>
<div id="rain"></div>
<div id="vig"></div>
<div id="title"><b><span class="flag"></span>LENDAS DA F1</b><span>Interlagos — 20 carros · grid completo</span></div>
<div id="tag">v0.4 · protótipo</div>
<canvas id="mini" width="140" height="150"></canvas>
<div id="tower"></div>
<div id="lap">VOLTA 1/12</div>
<div id="overtake" class="hide"></div>
<div id="lights" class="hide"><span class="lamp"></span><span class="lamp"></span><span class="lamp"></span><span class="lamp"></span><span class="lamp"></span></div>
<div id="circuitlbl">CIRCUITO</div>
<select id="circuit" aria-label="Circuito"></select>
<div id="teamlbl">EQUIPE (cores)</div>
<select id="team" aria-label="Equipe"></select>
<div id="telem">
  <h4 id="telemH">TELEMETRIA</h4>
  <div class="tl"><span class="lab">COMB.</span><span class="bar"><i id="tFuel"></i></span><span class="val" id="tFuelV">100%</span></div>
  <div class="tl"><span class="lab">PNEU</span><span class="comp" id="tComp">M</span><span class="bar"><i id="tWear"></i></span><span class="val" id="tWearV">0%</span></div>
  <div class="tl"><span class="lab">DANO</span><span class="bar"><i id="tDmg"></i></span><span class="st" id="tDmgV">Íntegro</span></div>
</div>
<div id="hud">
  <div class="row"><span class="big" id="spd">0</span><span class="unit">km/h</span></div>
  <div class="g" id="drvline">—</div>
</div>
<div id="gearbox"><div class="num" id="gear">1</div><div class="lbl">MARCHA</div></div>
<button id="sound">🔊 Ligar som do motor<span class="s">toque pra ouvir o F1</span></button>
<button id="cam">📹 Perseguição</button>
<button id="ficha">📊 Ficha técnica</button>
<div id="fichaPanel" class="hide"><div class="fcard" id="fcard"></div></div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
