<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Lendas da F1</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --red:#e10600; --red2:#ff2d20; --gold:#f2c400; --purple:#c07cff;
    --bg:#0a0c10; --card:#12161d; --card2:#161b23; --line:rgba(255,255,255,.08);
    --tx:#f2f4f7; --tx2:#9aa3ad; --green:#22c55e;
    --ff:-apple-system,'Segoe UI',Roboto,system-ui,sans-serif;
  }
  html,body{height:100%}
  body{background:
      radial-gradient(1200px 700px at 50% -10%, #1a2230 0%, transparent 55%),
      radial-gradient(900px 600px at 100% 110%, #24101a 0%, transparent 55%),
      var(--bg);
    color:var(--tx);font-family:var(--ff);overflow-x:hidden;
    -webkit-tap-highlight-color:transparent;min-height:100%}
  #app{min-height:100vh;display:flex;justify-content:center}
  .scr{width:100%;max-width:520px;padding:26px 18px 40px;display:flex;flex-direction:column;gap:16px;animation:in .35s ease}
  .scr.center{justify-content:center;align-items:center;text-align:center;min-height:100vh;padding-top:8vh}
  @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* ---------- MENU PRINCIPAL ---------- */
  .logo{font-size:clamp(38px,11vw,60px);font-weight:900;letter-spacing:-1.5px;line-height:.95;
    display:flex;align-items:center;gap:14px;justify-content:center;
    background:linear-gradient(90deg,#fff 20%,#ffd9d6 55%,var(--red2) 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 4px 24px rgba(225,6,0,.35))}
  .logo .fl{width:12px;height:52px;border-radius:3px;flex:none;-webkit-text-fill-color:initial;
    background:linear-gradient(180deg,var(--red2),var(--red));box-shadow:0 0 20px rgba(225,6,0,.6)}
  .tagline{color:var(--tx2);font-size:14px;font-weight:600;margin:-2px 0 20px;letter-spacing:.3px}
  .mbtns{display:flex;flex-direction:column;gap:11px;width:100%;max-width:340px}
  .mbtn{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;padding:16px 18px;border:1px solid var(--line);border-radius:14px;
    background:linear-gradient(180deg,var(--card2),#0e1218);color:var(--tx);
    font-family:var(--ff);font-size:16px;font-weight:800;letter-spacing:.3px;cursor:pointer;
    transition:transform .12s,border-color .2s,box-shadow .2s;text-align:center}
  .mbtn:active{transform:scale(.975)}
  .mbtn:hover{border-color:rgba(255,255,255,.22)}
  .mbtn.big{background:linear-gradient(180deg,var(--red2),var(--red));border-color:transparent;
    box-shadow:0 8px 26px rgba(225,6,0,.38);font-size:18px}
  .mbtn.go{background:linear-gradient(180deg,#25d366,#12a150);box-shadow:0 8px 26px rgba(18,161,80,.4);border-color:transparent}
  .mbtn.ghost{background:transparent;color:var(--tx2);font-weight:700;font-size:14px;padding:12px}
  .mbtn.off{opacity:.4;pointer-events:none}
  .pill{background:var(--gold);color:#151515;font-size:12px;font-weight:900;
    padding:2px 9px;border-radius:20px;margin-left:4px}
  .foot{color:var(--tx2);opacity:.5;font-size:11px;margin-top:22px}

  /* ---------- CABEÇALHO ---------- */
  .hd{display:flex;align-items:center;gap:12px;margin-bottom:2px}
  .hd h1{font-size:22px;font-weight:900;letter-spacing:-.5px;flex:1}
  .back{width:40px;height:40px;border-radius:11px;border:1px solid var(--line);
    background:var(--card2);color:var(--tx);font-size:22px;font-weight:800;cursor:pointer;flex:none;line-height:1}
  .back:active{transform:scale(.94)}
  .cashsm,.cash{font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums}
  .cashsm{font-size:15px}
  .sub{color:var(--tx2);font-size:13px;line-height:1.5;margin:-6px 0 4px}
  .sub b{color:var(--tx)}

  /* ---------- SLOTS ---------- */
  .slots{display:flex;flex-direction:column;gap:12px}
  .slot{text-align:left;border:1px solid var(--line);border-radius:15px;padding:16px 17px;cursor:pointer;
    background:linear-gradient(120deg,var(--card),#0e1319);color:var(--tx);font-family:var(--ff);
    transition:transform .12s,border-color .2s;position:relative;overflow:hidden}
  .slot::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--red)}
  .slot.empty::before{background:#39414d}
  .slot:active{transform:scale(.99)}
  .slot:hover{border-color:rgba(255,255,255,.2)}
  .sn{font-size:11px;font-weight:800;letter-spacing:2px;color:var(--tx2)}
  .se{font-size:18px;font-weight:800;opacity:.4;margin-top:6px}
  .sd{font-size:22px;font-weight:900;margin-top:3px;letter-spacing:-.4px}
  .sstats{font-size:13px;color:var(--tx2);margin-top:5px;font-weight:600}
  .sstats b{color:var(--tx);font-weight:900}
  .sr{font-size:12px;color:var(--tx2);margin-top:3px;opacity:.8}
  .sa{position:absolute;right:14px;bottom:14px;font-size:12px;font-weight:800;color:var(--green)}
  .sa.warn{color:var(--gold)} .sa.off{color:var(--tx2);opacity:.5}

  /* ---------- ESCOLHA DE PILOTO ---------- */
  .drvlist{display:flex;flex-direction:column;gap:10px}
  .drvpick{text-align:left;border:1px solid var(--line);border-radius:13px;padding:13px 15px;cursor:pointer;
    background:var(--card);color:var(--tx);font-family:var(--ff);transition:transform .12s,border-color .2s}
  .drvpick:active{transform:scale(.99)} .drvpick:hover{border-color:var(--red)}
  .dph{display:flex;align-items:center;justify-content:space-between}
  .dph b{font-size:17px;font-weight:800}
  .ov{background:#1c2230;border:1px solid var(--line);border-radius:8px;padding:3px 10px;font-size:15px;font-weight:900;color:var(--gold)}
  .dpr{font-size:12px;color:var(--tx2);margin-top:5px;font-weight:600}

  /* ---------- HUB (garagem) ---------- */
  .hubtop{display:flex;align-items:center;justify-content:space-between;
    background:linear-gradient(120deg,#1a1f2a,#121620);border:1px solid var(--line);
    border-radius:16px;padding:16px 18px}
  .hubname{font-size:24px;font-weight:900;letter-spacing:-.5px}
  .hubteam{font-size:13px;color:var(--tx2);font-weight:700;margin-top:2px}
  .cash{font-size:19px}
  .cards{display:flex;flex-direction:column;gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px}
  .ct{font-size:12px;font-weight:900;letter-spacing:1.5px;color:var(--tx2);margin-bottom:12px}
  .strow{display:flex;align-items:center;gap:10px;margin:9px 0}
  .sic{font-size:17px;width:22px;text-align:center;flex:none}
  .snm{font-size:13px;font-weight:700;width:96px;flex:none}
  .slv{font-size:14px;font-weight:900;width:26px;text-align:right;color:var(--gold);font-variant-numeric:tabular-nums}
  .seasonrow{font-size:15px;font-weight:700} .seasonrow b{color:var(--gold);font-size:18px}
  .nextgp{margin:10px 0;font-size:15px;font-weight:700;background:#0f141c;border:1px solid var(--line);border-radius:10px;padding:11px 13px}
  .nextgp b{font-weight:900}
  .champbtn{margin:10px 0;color:var(--tx2);font-weight:700}
  .mini{margin-top:8px;background:none;border:0;color:var(--purple);font-size:13px;font-weight:800;cursor:pointer;font-family:var(--ff);padding:0}
  .hubbtns{display:flex;flex-direction:column;gap:11px;margin-top:2px}

  /* ---------- BARRAS ---------- */
  .pbar{flex:1;height:8px;background:#0c1016;border-radius:5px;overflow:hidden;border:1px solid rgba(0,0,0,.4)}
  .pbar>i{display:block;height:100%;border-radius:5px;transition:width .4s}

  /* ---------- LOJA ---------- */
  .shopgrp{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:6px 14px 12px}
  .sgt{font-size:13px;font-weight:900;letter-spacing:.5px;padding:12px 2px 8px;border-bottom:1px solid var(--line);margin-bottom:6px}
  .shopitem{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 2px}
  .shopitem+.shopitem{border-top:1px solid rgba(255,255,255,.05)}
  .siL{display:flex;align-items:center;gap:11px}
  .siL b{font-size:15px;font-weight:800}
  .sidesc{font-size:11.5px;color:var(--tx2);margin-top:1px;font-weight:600}
  .buy{border:0;border-radius:10px;padding:9px 13px;font-family:var(--ff);cursor:pointer;flex:none;
    background:linear-gradient(180deg,#2ad06b,#12a150);color:#062012;font-weight:900;font-size:13px;
    display:flex;flex-direction:column;align-items:center;line-height:1.1;min-width:74px}
  .buy span{font-size:11px;font-weight:800;opacity:.85;margin-top:2px}
  .buy:active{transform:scale(.95)}
  .buy.off{background:#1b212b;color:var(--tx2);opacity:.55;pointer-events:none;box-shadow:none}

  /* ---------- CAMPEONATO ---------- */
  .standtbl{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;overflow:hidden}
  .strow2{display:flex;align-items:center;padding:9px 12px;border-radius:9px;font-size:14px}
  .strow2.hdr{font-size:11px;font-weight:900;letter-spacing:1px;color:var(--tx2);padding:8px 12px}
  .strow2.me{background:rgba(242,197,0,.14)} .strow2.me .nm{color:var(--gold);font-weight:900}
  .strow2 .p{width:30px;font-weight:900;color:var(--tx2);font-variant-numeric:tabular-nums}
  .strow2 .nm{flex:1;font-weight:700}
  .strow2 .pt{font-weight:900;font-variant-numeric:tabular-nums}

  /* ---------- ÁRVORE DE LENDAS ---------- */
  .legrid{display:flex;flex-direction:column;gap:11px}
  .legnode{background:linear-gradient(120deg,#1a1626,#141019);border:1px solid rgba(192,124,255,.22);
    border-radius:14px;padding:14px 15px}
  .lnh{display:flex;align-items:center;gap:10px}
  .lic{font-size:20px} .lnh b{font-size:16px;font-weight:800;flex:1}
  .lvl{font-size:12px;font-weight:900;color:var(--purple);font-variant-numeric:tabular-nums}
  .ldesc{font-size:12.5px;color:var(--tx2);margin:7px 0 11px;font-weight:600}
  .legnode .buy{width:100%;background:linear-gradient(180deg,#b47cff,#8a45d6);color:#150826}
  .legnode .buy.off{background:#1b212b;color:var(--tx2)}

  /* ---------- RESULTADO ---------- */
  .reshd{font-size:20px;font-weight:800;color:var(--tx2);letter-spacing:.3px}
  .respos{font-size:74px;font-weight:900;letter-spacing:-3px;line-height:1;margin:6px 0;
    display:flex;align-items:center;gap:12px;justify-content:center}
  .respos span{background:linear-gradient(180deg,#fff,var(--gold));-webkit-background-clip:text;
    background-clip:text;-webkit-text-fill-color:transparent}
  .resline{font-size:16px;font-weight:700;color:var(--tx2)} .resline b{color:var(--tx)}
  .resmoney{font-size:18px;font-weight:900;color:var(--green);margin:4px 0 20px}
  .scr.center .mbtns{margin-top:6px}

  @media (max-width:420px){
    .scr{padding:20px 14px 34px}
    .snm{width:78px} .respos{font-size:60px}
  }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="./js/menu.js"></script>
</body>
</html>
